<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Page Moved — The Invisible Pen Library</title>
<style>
:root {
  --coral: #E8735A;
  --navy: #1B2A4A;
  --cream: #FFF8F0;
  --gold: #D4A853;
  --text: #2D2D2D;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: 'Georgia', serif;
  background: var(--cream);
  color: var(--text);
  line-height: 1.6;
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 2rem;
}
.card {
  background: white;
  max-width: 560px;
  border-radius: 10px;
  border-top: 6px solid var(--coral);
  padding: 2.5rem;
  text-align: center;
  box-shadow: 0 4px 20px rgba(0,0,0,0.08);
}
h1 { color: var(--navy); font-size: 1.6rem; margin-bottom: 1rem; }
p { margin-bottom: 1.25rem; font-size: 1.05rem; }
.btn {
  display: inline-block;
  background: var(--coral);
  color: white;
  text-decoration: none;
  padding: 0.85rem 1.75rem;
  border-radius: 6px;
  font-weight: bold;
  letter-spacing: 0.3px;
}
.btn:hover { background: var(--navy); }
.brand {
  color: var(--gold);
  font-size: 0.8rem;
  letter-spacing: 1px;
  text-transform: uppercase;
  margin-top: 2rem;
}
</style>
</head>
<body>
<div class="card">
  <h1>This page has a new home 📚</h1>
  <p>The link you followed may be out of date, but nothing is lost — every worksheet and lesson is one click away on the main library page.</p>
  <p><a class="btn" href="https://cph-jessica.github.io/tip-marketing-worksheets/">Go to the Library →</a></p>
  <div class="brand">The Invisible Pen · Clark Publishing House</div>
</div>
</body>
</html>
