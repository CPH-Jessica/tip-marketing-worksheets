<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Da Bot — The Story Interrogator</title>
<style>
/* ============================================================
   DA BOT — THE STORY INTERROGATOR
   Single file. Offline. localStorage. No dependencies.
   Built from the Debi Brady method: she will not let you
   describe events. She wants the STORY.
   ============================================================ */
:root{
  --bg:#0b0a12; --bg2:#141221; --panel:#191627; --panel2:#211d34;
  --ink:#f2edff; --ink-dim:#a49bc4; --line:#332c4e;
  --accent:#ffb43d;          /* interrogation lamp */
  --accent2:#c05cff;         /* violet */
  --accent3:#ff7a9c;
  --good:#54d6a0; --warn:#ffc861; --bad:#ff6f85;
  --chip:#2a2440; --radius:14px; --shadow:0 12px 38px rgba(0,0,0,.5);
  --maxw:1180px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  font-family:"Segoe UI",system-ui,-apple-system,Roboto,Helvetica,Arial,sans-serif;
  background:
    radial-gradient(1000px 560px at 82% -14%, rgba(192,92,255,.20), transparent 62%),
    radial-gradient(860px 500px at 6% 2%, rgba(255,180,61,.10), transparent 60%),
    linear-gradient(170deg,var(--bg),#08070d 66%);
  background-attachment:fixed;
  color:var(--ink); line-height:1.5; min-height:100vh;
}
a{color:var(--accent)}
button{font-family:inherit}
.wrap{max-width:var(--maxw);margin:0 auto;padding:0 18px 120px}
::-webkit-scrollbar{width:11px;height:11px}
::-webkit-scrollbar-thumb{background:#2e2846;border-radius:8px}
::-webkit-scrollbar-track{background:transparent}

/* header */
header.top{position:sticky;top:0;z-index:60;background:rgba(11,10,18,.94);backdrop-filter:blur(9px);border-bottom:1px solid var(--line)}
.top-inner{max-width:var(--maxw);margin:0 auto;padding:11px 18px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:11px;min-width:0}
.brand .glyph{font-size:26px;filter:drop-shadow(0 2px 10px rgba(255,180,61,.6))}
.brand h1{font-size:18px;margin:0;letter-spacing:.3px;white-space:nowrap}
.brand .sub{font-size:11.5px;color:var(--ink-dim);margin-top:-2px}
.top-actions{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.who{display:flex;align-items:center;gap:8px;background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:4px 6px 4px 11px}
.who .lbl{font-size:11px;color:var(--ink-dim);text-transform:uppercase;letter-spacing:.6px}
.who select{background:transparent;border:none;color:var(--ink);font-size:13px;font-weight:700;max-width:200px;padding:4px 2px}
.who select:focus{outline:none}
.btn{border:1px solid var(--line);background:var(--panel2);color:var(--ink);padding:8px 13px;border-radius:10px;cursor:pointer;font-size:13px;font-weight:600;transition:.15s;display:inline-flex;align-items:center;gap:6px}
.btn:hover{border-color:var(--accent);background:var(--panel)}
.btn.primary{background:linear-gradient(120deg,var(--accent2),var(--accent));border:none;color:#17121f}
.btn.primary:hover{filter:brightness(1.09)}
.btn.ghost{background:transparent}
.btn.sm{padding:5px 10px;font-size:12px;border-radius:9px}
.btn.danger:hover{border-color:var(--bad);color:var(--bad)}
.btn[disabled]{opacity:.4;cursor:not-allowed}

/* tabs */
nav.tabs{max-width:var(--maxw);margin:0 auto;padding:6px 12px 0;display:flex;gap:3px;flex-wrap:wrap}
.tab{border:1px solid transparent;background:transparent;color:var(--ink-dim);padding:9px 11px;border-radius:10px 10px 0 0;cursor:pointer;font-size:12.5px;font-weight:600;white-space:nowrap}
.tab:hover{color:var(--ink);background:var(--panel)}
.tab.active{color:#fff;background:var(--panel);border-color:var(--line);border-bottom-color:var(--panel)}
.tab .num{display:inline-block;min-width:15px;text-align:center;opacity:.5;margin-right:3px;font-size:11px}
.tab .dot{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--line);margin-left:6px;vertical-align:middle}
.tab .dot.on{background:var(--good);box-shadow:0 0 8px rgba(84,214,160,.7)}
.tab .dot.part{background:var(--warn)}

/* progress spine */
.spine{max-width:var(--maxw);margin:0 auto;padding:12px 18px 2px}
.spine-inner{display:flex;background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.snode{flex:1;min-width:0;padding:8px 10px;border-right:1px solid var(--line);cursor:pointer;transition:.15s}
.snode:last-child{border-right:none}
.snode:hover{background:var(--panel2)}
.snode .sk{font-size:9.5px;letter-spacing:.9px;text-transform:uppercase;color:var(--ink-dim);display:flex;align-items:center;gap:5px}
.snode .sk i{width:7px;height:7px;border-radius:50%;background:var(--line);display:inline-block;font-style:normal;flex:none}
.snode.on .sk i{background:var(--good);box-shadow:0 0 8px rgba(84,214,160,.75)}
.snode .sv{font-size:11.5px;margin-top:2px;color:var(--ink-dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.snode.on .sv{color:var(--ink)}
@media(max-width:860px){.spine-inner{flex-wrap:wrap}.snode{flex:1 1 33%;border-bottom:1px solid var(--line)}}

/* panels */
.view{display:none;animation:fade .22s}
.view.active{display:block}
@keyframes fade{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:20px 22px;margin:16px 0;box-shadow:var(--shadow)}
.card h2{margin:0 0 4px;font-size:21px;letter-spacing:.2px}
.card h3{margin:24px 0 6px;font-size:13px;color:var(--accent);letter-spacing:.5px;text-transform:uppercase}
.card h3:first-of-type{margin-top:12px}
.lead{color:var(--ink-dim);font-size:13.5px;margin:0 0 10px}
.quote{font-size:14.5px;font-style:italic;color:var(--ink);background:linear-gradient(90deg,rgba(255,180,61,.13),transparent);border-left:3px solid var(--accent);padding:11px 15px;border-radius:0 10px 10px 0;margin:10px 0 14px}
.quote .by{display:block;font-style:normal;font-size:11px;letter-spacing:.7px;text-transform:uppercase;color:var(--ink-dim);margin-top:5px}
.note{font-size:12.5px;color:var(--ink-dim);background:var(--bg2);border-left:3px solid var(--accent2);padding:11px 14px;border-radius:0 10px 10px 0;margin:10px 0 14px}
.note b{color:var(--ink)}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:1fr 1fr}
.g3{grid-template-columns:1fr 1fr 1fr}
@media(max-width:820px){.g2,.g3{grid-template-columns:1fr}}

/* fields */
label.f{display:block;margin:14px 0}
label.f .lab{display:flex;align-items:center;gap:7px;font-size:13px;font-weight:700;margin-bottom:4px;color:var(--ink);flex-wrap:wrap}
label.f .req{color:var(--accent3);font-size:11px}
label.f .hint{display:block;font-weight:400;color:var(--ink-dim);font-size:11.5px;margin-bottom:6px;line-height:1.45}
input[type=text],select,textarea{width:100%;background:var(--bg2);border:1px solid var(--line);color:var(--ink);border-radius:10px;padding:9px 11px;font-size:13.5px;font-family:inherit}
textarea{resize:vertical;min-height:64px;line-height:1.55}
textarea.big{min-height:190px}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px rgba(255,180,61,.12)}
select{cursor:pointer}
.tools{display:inline-flex;gap:5px;margin-left:auto}
.mini{border:1px solid var(--line);background:var(--bg2);color:var(--ink-dim);border-radius:7px;padding:2px 8px;font-size:11px;cursor:pointer;font-weight:600}
.mini:hover{color:var(--ink);border-color:var(--accent)}
.count{font-size:11px;color:var(--ink-dim);margin-top:4px;text-align:right}

/* pushback */
.push{border-radius:10px;padding:10px 12px;margin-top:7px;font-size:12.5px;display:none;line-height:1.5}
.push.show{display:block;animation:fade .18s}
.push.bad{background:rgba(255,111,133,.11);border:1px solid rgba(255,111,133,.45);color:#ffd3da}
.push.warn{background:rgba(255,200,97,.10);border:1px solid rgba(255,200,97,.42);color:#ffeec4}
.push.ok{background:rgba(84,214,160,.10);border:1px solid rgba(84,214,160,.38);color:#c9f6e2}
.push b{color:#fff}

/* probes */
.probe{background:rgba(192,92,255,.10);border:1px solid rgba(192,92,255,.40);border-radius:10px;padding:11px 13px;margin:12px 0 0;font-size:13px}
.probe .pq{margin:0 0 7px;color:var(--ink)}
.probe .pq:before{content:"↳ ";color:var(--accent2);font-weight:700}
.probe .pnav{display:flex;gap:6px;align-items:center}
.probe .pnum{font-size:11px;color:var(--ink-dim);margin-left:auto}

/* chips */
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:7px}
.chip{border:1px solid var(--line);background:var(--chip);color:var(--ink-dim);border-radius:999px;padding:4px 11px;font-size:12px;cursor:pointer;transition:.14s}
.chip:hover{color:var(--ink);border-color:var(--accent)}
.chip.on{background:linear-gradient(120deg,var(--accent2),var(--accent));color:#17121f;border-color:transparent;font-weight:700}

/* spine sentence */
.sentence{background:var(--bg2);border:1px dashed var(--line);border-radius:12px;padding:16px 18px;font-size:16px;line-height:1.7;margin-top:14px}
.sentence .fillin{color:var(--accent);font-weight:700}
.sentence .blank{color:var(--ink-dim);font-style:italic}

/* gauges */
.gauge{display:flex;align-items:center;gap:10px;margin-top:10px;flex-wrap:wrap}
.bar{flex:1;min-width:160px;height:9px;background:var(--bg2);border:1px solid var(--line);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--good),var(--warn),var(--bad));width:0;transition:width .25s}
.gtag{font-size:12px;font-weight:700;padding:2px 10px;border-radius:99px;border:1px solid var(--line);background:var(--bg2)}
.gtag.good{color:var(--good);border-color:rgba(84,214,160,.5)}
.gtag.warn{color:var(--warn);border-color:rgba(255,200,97,.5)}
.gtag.bad{color:var(--bad);border-color:rgba(255,111,133,.5)}

/* genre promise */
.promise{background:var(--bg2);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-top:12px;font-size:13px}
.promise h4{margin:0 0 8px;font-size:14px;color:var(--accent)}
.promise .prow{display:flex;gap:9px;padding:5px 0;border-top:1px solid var(--line)}
.promise .prow:first-of-type{border-top:none}
.promise .pk{flex:none;width:132px;font-size:11px;text-transform:uppercase;letter-spacing:.6px;color:var(--ink-dim);padding-top:2px}
.promise .pv{flex:1;color:var(--ink)}

/* lock curtain */
.curtain{background:var(--panel);border:1px dashed var(--line);border-radius:var(--radius);padding:34px 26px;margin:16px 0;text-align:center}
.curtain .lk{font-size:34px;margin-bottom:8px}
.curtain h3{margin:0 0 6px;font-size:17px;color:var(--ink);text-transform:none;letter-spacing:0}
.curtain p{color:var(--ink-dim);font-size:13.5px;max-width:560px;margin:0 auto 14px}
.curtain ul{text-align:left;max-width:520px;margin:0 auto 16px;color:var(--ink-dim);font-size:13px}
.curtain li{margin:4px 0}

/* nav footer */
.stepnav{display:flex;gap:10px;align-items:center;margin-top:20px;padding-top:16px;border-top:1px solid var(--line);flex-wrap:wrap}
.stepnav .verdictline{font-size:12.5px;color:var(--ink-dim);margin-left:auto;text-align:right}

/* verdict card */
.sheet{background:#fffdf8;color:#1a1626;border-radius:14px;padding:26px 30px;margin-top:14px;box-shadow:var(--shadow);font-size:13.5px;line-height:1.6}
.sheet h3{color:#7a3fbf;font-size:12px;letter-spacing:1px;text-transform:uppercase;margin:20px 0 5px;border-bottom:1px solid #e6ddf5;padding-bottom:4px}
.sheet h3:first-child{margin-top:0}
.sheet h2{margin:0 0 2px;font-size:23px;color:#231b36}
.sheet .sub{color:#6b6382;font-size:12.5px;margin-bottom:6px}
.sheet .big{font-size:16px;line-height:1.65;background:#f6f0ff;border-left:3px solid #a970ff;padding:11px 14px;border-radius:0 8px 8px 0;margin:6px 0}
.sheet .kv{display:flex;gap:10px;padding:4px 0;border-top:1px dotted #e2dbef}
.sheet .kv:first-of-type{border-top:none}
.sheet .kv .k{flex:none;width:150px;color:#6b6382;font-size:11.5px;text-transform:uppercase;letter-spacing:.5px;padding-top:2px}
.sheet .kv .v{flex:1}
.sheet .missing{color:#b6adc7;font-style:italic}

/* score */
.scorewrap{display:flex;align-items:center;gap:16px;flex-wrap:wrap;margin-top:8px}
.ring{width:96px;height:96px;border-radius:50%;display:grid;place-items:center;font-size:26px;font-weight:800;flex:none;
  background:conic-gradient(var(--good) calc(var(--p)*1%), var(--bg2) 0);position:relative}
.ring:after{content:"";position:absolute;inset:8px;border-radius:50%;background:var(--panel)}
.ring span{position:relative;z-index:2}

/* table (page test) */
table.rub{width:100%;border-collapse:collapse;font-size:12.5px;margin-top:10px}
table.rub th,table.rub td{border:1px solid var(--line);padding:6px 8px;text-align:left;vertical-align:top}
table.rub th{background:var(--bg2);font-size:11px;text-transform:uppercase;letter-spacing:.5px;color:var(--ink-dim)}
table.rub td.n{width:74px;text-align:center}
table.rub input{width:100%;text-align:center;padding:4px;font-size:13px}
table.rub tr.tot td{background:var(--bg2);font-weight:800}
.metrics{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px;margin-top:10px}
.met{background:var(--bg2);border:1px solid var(--line);border-radius:10px;padding:8px 10px}
.met .mk{font-size:10.5px;text-transform:uppercase;letter-spacing:.6px;color:var(--ink-dim)}
.met .mv{font-size:16px;font-weight:800;margin-top:1px}

/* toast */
#toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(20px);background:var(--panel2);border:1px solid var(--accent);color:var(--ink);
  padding:10px 18px;border-radius:99px;font-size:13px;font-weight:600;opacity:0;pointer-events:none;transition:.25s;z-index:200;box-shadow:var(--shadow)}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

@media print{
  header.top,nav.tabs,.spine,.stepnav,.no-print{display:none!important}
  body{background:#fff}
  .view{display:none!important}.view.active{display:block!important}
  .card{box-shadow:none;border:none;background:#fff;color:#000;padding:0}
  .sheet{box-shadow:none;padding:0}
}
</style>
</head>
<body>

<header class="top">
  <div class="top-inner">
    <div class="brand">
      <div class="glyph">🎙️</div>
      <div>
        <h1>Da Bot <span style="color:var(--ink-dim);font-weight:400;font-size:14px">— The Story Interrogator</span></h1>
        <div class="sub">Pieces of a story are not a story.</div>
      </div>
    </div>
    <div class="top-actions">
      <div class="who">
        <span class="lbl">Story</span>
        <select id="projSel"></select>
      </div>
      <button class="btn sm" id="btnNew">+ New</button>
      <button class="btn sm" id="btnRename">Rename</button>
      <button class="btn sm" id="btnExport">Backup</button>
      <button class="btn sm" id="btnImport">Restore</button>
      <button class="btn sm danger" id="btnDelete">Delete</button>
    </div>
  </div>
  <nav class="tabs" id="tabs"></nav>
</header>

<div class="spine"><div class="spine-inner" id="spine"></div></div>

<div class="wrap" id="views"></div>

<div id="toast"></div>
<input type="file" id="fileIn" accept=".json" style="display:none">

<script>
"use strict";

/* ============================================================
   1. THE INTERROGATION — station + field definitions
   ============================================================ */

const FEELINGS = ["Seen","Hopeful","Wrecked (the good kind)","Safe","Fired up","Homesick","Vindicated","Comforted","Unsettled","Believing again","Less alone","Grateful","Breathless","Warm","Ready to fight for something"];

const GENRES = {
  "Contemporary Romance":{promise:"Two people I can root for, falling in love against a real obstacle.",must:"Meet-cute or forced proximity early, escalating intimacy, a black moment that costs something.",ending:"HEA or HFN. Non-negotiable.",warn:"If they don't end up together you're writing women's fiction, not romance. Different shelf, different reader."},
  "Small-Town Romance":{promise:"A town I want to move to and a love story that repairs something.",must:"The town as a character, community pressure, a returning-home or outsider wound.",ending:"HEA plus the town healed a little.",warn:"If the town is just scenery, this is a contemporary romance wearing a flannel shirt."},
  "Romantasy / Fantasy Romance":{promise:"A world with rules and a love that breaks or bends them.",must:"Magic system with a cost, fated/forbidden pull, escalating stakes in both plot and bond.",ending:"HEA (or clear HFN if it's a series) AND the magic plot resolved.",warn:"If the romance could be deleted without changing the plot, it's fantasy with a subplot. Say so in the blurb."},
  "Dark Romance":{promise:"Danger braided into desire, with a hero I shouldn't want.",must:"Power imbalance, explicit consent architecture, real menace, obsession.",ending:"HEA, earned through surrender not rescue.",warn:"Content notes are part of the promise here. Skipping them breaks trust, not taboo."},
  "Cozy Fantasy":{promise:"Low stakes, high warmth, magic that makes life better not scarier.",must:"A place readers want to live, small human problems, gentle magic, found community.",ending:"Comfort restored, someone belongs now.",warn:"A world-ending threat kills cozy on contact. Keep the stakes personal."},
  "Cozy Mystery":{promise:"A puzzle I can solve, in a town I like, with nothing too ugly on the page.",must:"Body by chapter 3, amateur sleuth with a reason to care, fair-play clues, comic relief.",ending:"Killer caught, order restored, sleuth changed slightly.",warn:"On-page violence or a bleak ending breaks the cozy contract."},
  "Romantic Suspense":{promise:"Love under threat, and the threat is real.",must:"Ticking clock, competent leads, danger that forces proximity.",ending:"Threat neutralized AND HEA. Both.",warn:"If the suspense resolves 40 pages before the romance, you've written two books in a trench coat."},
  "Women's Fiction":{promise:"A woman's interior life changing, honestly.",must:"Internal arc drives plot, relationships beyond the romantic, hard-won self-knowledge.",ending:"Transformation. Not necessarily love.",warn:"Marketing this as romance gets you one-star reviews from readers who wanted a HEA."},
  "Space Opera":{promise:"Big feelings, big ships, a galaxy worth saving.",must:"Scale, a crew or found family, moral clarity under pressure, a villain with a worldview.",ending:"Victory with a cost. Setup for the next front.",warn:"Space opera is fantasy in space. If you want rigorous physics, you're writing hard SF and a different reader is buying."},
  "Hard Science Fiction":{promise:"The science is real and the problem is solved with brains.",must:"Consistent rules, competence porn, consequences that follow from physics not fate.",ending:"The problem is solved (or provably not) by reasoning.",warn:"A mystical power system contradicts the promise. Pick one."},
  "Christian / Inspirational Speculative":{promise:"A story that takes faith seriously and leaves me strengthened.",must:"A spiritual question at the center, a character wrestling honestly, no cheap conversions.",ending:"Faith tested and held, or found — and the cost shown.",warn:"If the faith thread could be cut without changing the ending, it's decoration and the target reader will feel it."},
  "Epic Fantasy":{promise:"A world to live in and a war worth the page count.",must:"Deep world, multiple POVs, rising scale, a prophecy or throne or apocalypse.",ending:"The world order changes.",warn:"Epic means long and slow-building. Readers of fast fantasy adventure will bounce."},
  "Urban Fantasy":{promise:"Magic hidden in our world and a protagonist who polices the seams.",must:"First-person voice, a case, factions, escalating supernatural politics.",ending:"Case closed, larger arc opened.",warn:"If the romance is the point, market it as paranormal romance instead."},
  "Thriller":{promise:"I will not be able to put this down.",must:"Threat on page one, short chapters, reversals, a hunter and a hunted.",ending:"Threat defeated, protagonist changed by what it took.",warn:"Interiority slows the promise. Save the meditation for the denouement."},
  "Mystery / Detective":{promise:"A fair puzzle and a satisfying reveal.",must:"Crime early, clues planted, red herrings, a detective with a method.",ending:"Solution earned, all clues accounted for.",warn:"A reveal that relies on withheld information breaks the contract."},
  "Horror":{promise:"Make me afraid, and make the fear mean something.",must:"Dread curve, rules for the threat, isolation, escalating violations.",ending:"Survival at a price, or defeat that lands.",warn:"A comforting ending deflates horror. So does explaining the monster too early."},
  "Young Adult":{promise:"First-time intensity, a voice that sounds like now.",must:"Teen agency, adults sidelined, identity at stake, immediacy.",ending:"Growth, not resolution of adult life.",warn:"An adult-feeling narrator with a teen age tag fools nobody."},
  "Historical Fiction":{promise:"A time and place I can smell, with people who belong in it.",must:"Period logic, research worn lightly, stakes native to the era.",ending:"History and character resolve together.",warn:"Modern values in a period mouth breaks immersion for this reader."},
  "Literary Fiction":{promise:"Sentences worth rereading and a truth I can't shake.",must:"Voice, interiority, ambiguity, thematic pressure.",ending:"Illumination, not necessarily resolution.",warn:"Plot-driven marketing sets the wrong expectation and gets punished."}
};

const FLAVORS = ["Second chance","Enemies to lovers","Found family","Fated mates","Grumpy/sunshine","Slow burn","Forced proximity","Redemption arc","Heist","Survival","Quest","Revenge","Coming of age","Time loop","Body swap","Locked room","Chosen one","Small-town charm","Courtroom","Military","Sports","Holiday","Retelling","Age gap","Single parent","Marriage of convenience","Amnesia","Rivals","Undercover","Haunting"];

const DRIVE_AXES = [
  {a:["sacrifice","die","give his life","give her life","martyr","go down with","stay behind","lay down my life"],
   b:["survive","get home","get back","make it out","live","return to","see them again","reunite"],
   msg:"He can't be willing to die for the mission AND be doing everything to get home. Those are two different books. Pick the one that wins in the last act — the other becomes the temptation he refuses."},
  {a:["revenge","make them pay","kill him","kill her","destroy them","vengeance","get even"],
   b:["forgive","let go","heal","move on","make peace","forgiveness"],
   msg:"Revenge and forgiveness are opposite endings. One is the want, one is the need — decide which is which, or the ending will feel like a shrug."},
  {a:["hide","stay hidden","keep the secret","anonymous","nobody can know","disappear"],
   b:["be seen","be known","prove","recognition","famous","claim","take credit","come forward"],
   msg:"Hiding and being seen can't both be the goal. This is usually the real engine of the book — make one the want and one the terror."},
  {a:["leave","escape","run","get out of this town","start over somewhere"],
   b:["stay","belong","roots","build a life here","home","keep the farm","save the shop"],
   msg:"Leaving and belonging are competing drives. Great tension — but only one can win, and the reader needs to feel you know which."},

const PLOT_WORDS = ["and then","after that","meanwhile","next,","chapter","scene ","he goes","she goes","they go to","later,","first,","subsequently","by the end of","in the beginning of the book","then he ","then she ","then they "];
const MISSION_WORDS = ["his duty","her duty","the mission","protect earth","save the world","save earth","defend the planet","complete the mission","following orders","serve his country","serve her country","protect the base","defeat the"];
const EVERYBODY = ["everybody","everyone","anyone who","all readers","any reader","the general public","wide audience","people who like books","most people"];

function words(v){return (v||"").trim().split(/\s+/).filter(Boolean);}
function wc(v){return words(v).length;}
function low(v){return (v||"").toLowerCase();}
function hits(v,list){const t=low(v);return list.filter(function(h){return t.indexOf(h)>-1;});}
function bad(m){return {level:"bad",msg:m};}
function warn(m){return {level:"warn",msg:m};}
function ok(m){return {level:"ok",msg:m};}

function jaccard(a,b){
  const A=new Set(low(a).replace(/[^a-z0-9\s]/g," ").split(/\s+/).filter(function(w){return w.length>3;}));
  const B=new Set(low(b).replace(/[^a-z0-9\s]/g," ").split(/\s+/).filter(function(w){return w.length>3;}));
  if(!A.size||!B.size) return 0;
  let inter=0; A.forEach(function(w){if(B.has(w))inter++;});
  return inter/(A.size+B.size-inter);
}

function std(ids){
  return function(d){
    const miss=[];
    ids.forEach(function(id){
      if(!(d[id]||"").trim()){
        const f=findField(id);
        miss.push(f?f.lab:id);
      }
    });
    // hard checks
    ids.forEach(function(id){
      const f=findField(id);
      if(f&&f.check&&(d[id]||"").trim()){
        const r=f.check(d[id],d);
        if(r&&r.level==="bad") miss.push("Da Bot isn't buying your answer to “"+f.lab+"”");
      }
    });
    return {pass:miss.length===0,missing:miss};
  };
}
function findField(id){
  for(let i=0;i<STATIONS.length;i++){
    const f=STATIONS[i].fields.filter(function(x){return x.id===id;})[0];
    if(f) return f;
  }
  return null;
}

const KEY="dabot.v1";
let DB={projects:{},current:null};

function uid(){return "s"+Math.random().toString(36).slice(2,9);}
function load(){
  try{
    const raw=localStorage.getItem(KEY);
    if(raw){DB=JSON.parse(raw);}
  }catch(e){}
  if(!DB.projects||!Object.keys(DB.projects).length){
    const id=uid();
    DB={projects:{},current:id};
    DB.projects[id]={name:"Untitled story",created:new Date().toISOString(),data:{},unlocked:{}};
  }
  if(!DB.projects[DB.current]) DB.current=Object.keys(DB.projects)[0];
}
function save(){try{localStorage.setItem(KEY,JSON.stringify(DB));}catch(e){toast("Storage full — export a backup.");}}
function P(){return DB.projects[DB.current];}
function D(){return P().data;}

function toast(m){
  const t=document.getElementById("toast");
  t.textContent=m;t.classList.add("show");
  clearTimeout(t._h);t._h=setTimeout(function(){t.classList.remove("show");},2100);
}
function esc(s){return (s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}
function copy(text,label){
  navigator.clipboard.writeText(text).then(function(){toast((label||"Copied")+" ✓");},
    function(){
      const ta=document.createElement("textarea");ta.value=text;document.body.appendChild(ta);ta.select();
      try{document.execCommand("copy");toast((label||"Copied")+" ✓");}catch(e){toast("Copy failed");}
      document.body.removeChild(ta);
    });
}

/* ---------- verdict ---------- */
function score(){
  let done=0;
  STATIONS.slice(1).forEach(function(s){if(s.gate(D()).pass)done++;});
  return {done:done,total:STATIONS.length-1,pct:Math.round(done/(STATIONS.length-1)*100)};
}

  else if(sc.pct>=70) ruling="Close. What's missing below is exactly the part that will make chapter twelve feel like it's wandering. Finish it before you draft.";
  else if(sc.pct>=40) ruling="You have ideas and a character. You do not yet have a story. Keep going — the questions get easier once the transformation is nailed down.";

  m+="## The spine sentence\n\nReaders will follow a character who **"+(d.s_who||"…")+"**, while trying to **"+(d.s_trying||"…")+"**, and the story's main pleasure comes from **"+(d.s_pleasure||"…")+"**.\n\n";

const DEBI_VOICE = "You are Da Bot — a blunt, warm, relentless story coach in the tradition of a marketer who has read ten thousand blurbs. "+
"Your one rule: an author describing EVENTS is not describing a STORY. When they hand you plot, you stop them and ask again. "+
"You ask ONE question at a time. You do not accept the first answer if it's a mission statement, a genre label, an abstraction, or a list of things that happen. "+
"You are never cruel and never precious. You use plain words. You may say things like \"that's a mission, not a person\" or \"you're never writing for everybody\" or \"tell it to me like I'm five.\" "+
"When the author finally gets there, you say so plainly and move on.";

function grillPrompt(s){
  const d=D();
  let body=DEBI_VOICE+"\n\nWe are working on this station:\n\n### "+s.title+"\n";
  body+="Guiding question: \""+s.quote+"\"\n\n";
  body+="Here is what the author has written so far for this station:\n\n";
  s.fields.forEach(function(f){
    body+="- **"+f.lab+"**: "+((d[f.id]||"").trim()||"(blank)")+"\n";
  });
  if(d.p_name||d.g_primary){
    body+="\nContext from earlier stations:\n";
    if(d.p_name) body+="- Protagonist: "+d.p_name+"\n";
    if(d.g_primary) body+="- Genre they've locked: "+d.g_primary+"\n";
    if(d.s_who) body+="- Spine so far: a character who "+d.s_who+", while trying to "+(d.s_trying||"…")+"\n";
  }
  body+="\nNow interrogate me on this station. Start by telling me in one line whether what I wrote is a STORY answer or an EVENTS answer. Then ask me your first question. One question. Wait for my reply before the next one. When I've genuinely answered the station, give me a tightened version of my own words that I can paste back into the tool.";
  return body;
}

function masterPrompt(){
  return DEBI_VOICE+"\n\nHere is my completed Story Spine Card. Do three things, in this order:\n\n"+
  "1. **The gut check.** Tell me, in five sentences, whether this is a story or a premise with scenery. Be specific about which answer is doing the least work.\n"+
  "2. **The three weakest links.** Name the three answers most likely to make the middle of this book wander, and ask me one hard question about each.\n"+
  "3. **The one-paragraph blurb.** Write the back-cover paragraph this spine earns — using the bait, not the message.\n\n"+

/* ---------- page test module ---------- */
const RUBRIC=[
 ["Hook","Does the first paragraph create a question I need answered?"],
 ["Orientation","Do I know who, where, and when within half a page?"],
 ["POV discipline","One head, consistently, with a distinct filter on the world."],
 ["Voice","Could I tell this writer from another writer in the same genre?"],
 ["Character sympathy","Is there a reason to care about this person, this early?"],
 ["Stakes on the page","Do I feel something can be lost?"],
 ["Forward momentum","Does every paragraph move, or do some just explain?"],
 ["Exposition control","Is backstory withheld until it's earned?"],
 ["Concrete detail","Specific, sensory, non-generic — or wallpaper?"],
 ["Dialogue","Does it do two jobs at once (information + character)?"],
 ["Prose economy","Any sentence that could be cut without loss?"],
 ["Genre signal","Would the target reader know their shelf by page two?"],
 ["Page-turn pull","Does the last line make me continue?"]
];
const FILTERS=["felt","saw","heard","noticed","realized","seemed","watched","wondered","knew","thought","looked","began to","started to","could see","could hear"];

function textMetrics(t){
  const w=words(t);
  const sents=(t.match(/[^.!?]+[.!?]+/g)||[t]).filter(function(s){return s.trim();});
  const dq=(t.match(/["“][^"”]{2,}["”]/g)||[]);
  const dialogueWords=dq.reduce(function(a,s){return a+wc(s);},0);
  const adv=w.filter(function(x){return /ly[.,!?"']?$/.test(x.toLowerCase())&&x.length>5;}).length;
  const filt=FILTERS.reduce(function(a,f){return a+(low(t).split(f).length-1);},0);
  return {
    words:w.length,
    sentences:sents.length,
    avgSent:sents.length?Math.round(w.length/sents.length*10)/10:0,
    dialoguePct:w.length?Math.round(dialogueWords/w.length*100):0,
    adverbs:adv,
    filters:filt,
    para:(t.split(/\n\s*\n/).filter(function(p){return p.trim();})).length
  };
}

function wire(){
  const views=document.getElementById("views");

  // text inputs
  Array.prototype.forEach.call(views.querySelectorAll("[data-f]"),function(el){
    el.addEventListener("input",function(){
      D()[el.dataset.f]=el.value;
      save();
      runChecks();
      updateSpineSentence();
      updateGenre();
      updateDuel();
      updatePrologue();
      renderSpine();
      renderTabs();
      updateVerdictLine();
    });
    if(el.tagName==="SELECT") el.addEventListener("change",function(){updateGenre();});
  });

  // chips (multi)
  Array.prototype.forEach.call(views.querySelectorAll("[data-chips]"),function(box){
    const id=box.dataset.chips, max=parseInt(box.dataset.max,10)||99;
    Array.prototype.forEach.call(box.querySelectorAll(".chip"),function(c){
      c.onclick=function(){
        let sel=(D()[id]||"").split("|").filter(Boolean);
        const v=c.dataset.v;
        if(sel.indexOf(v)>-1) sel=sel.filter(function(x){return x!==v;});
        else{ if(sel.length>=max){toast("Max "+max+". Take one off first."); return;} sel.push(v); }
        D()[id]=sel.join("|"); save();
        c.classList.toggle("on");
        renderSpine();renderTabs();runChecks();updateGenre();updateVerdictLine();
      };
    });
  });
  // chips (fill a text field)
  Array.prototype.forEach.call(views.querySelectorAll("[data-fill]"),function(box){
    const id=box.dataset.fill;
    Array.prototype.forEach.call(box.querySelectorAll(".chip"),function(c){
      c.onclick=function(){
        const inp=views.querySelector('[data-f="'+id+'"]');
        inp.value=c.dataset.v; D()[id]=c.dataset.v; save();
        runChecks();renderSpine();renderTabs();updateVerdictLine();
      };
    });
  });

  // navigation buttons
  Array.prototype.forEach.call(views.querySelectorAll("[data-goto]"),function(b){b.onclick=function(){go(b.dataset.goto);};});
  Array.prototype.forEach.call(views.querySelectorAll("[data-unlock]"),function(b){
    b.onclick=function(){ P().unlocked=P().unlocked||{}; P().unlocked[b.dataset.unlock]=true; save(); render(); };
  });

  // probes
  Array.prototype.forEach.call(views.querySelectorAll("[data-probe]"),function(box){
    const s=STATIONS.filter(function(x){return x.id===box.dataset.probe;})[0];
    let i=0;
    function show(){
      box.querySelector("[data-pqtext]").textContent=s.probes[i];
      box.querySelector("[data-pnum]").textContent=(i+1)+" / "+s.probes.length;
    }
    box.querySelector("[data-pnext]").onclick=function(){i=(i+1)%s.probes.length;show();};
    box.querySelector("[data-pprev]").onclick=function(){i=(i-1+s.probes.length)%s.probes.length;show();};
    show();
  });

  // grill
  Array.prototype.forEach.call(views.querySelectorAll("[data-grill]"),function(b){
    b.onclick=function(){
      const s=STATIONS.filter(function(x){return x.id===b.dataset.grill;})[0];
      copy(grillPrompt(s),"Interrogation prompt copied — paste it into Claude");
    };
  });

  // verdict buttons
  const cc=document.getElementById("btnCopyCard");
  if(cc) cc.onclick=function(){copy(cardMarkdown(),"Story Spine Card copied");};
  const dm=document.getElementById("btnDownMd");
  if(dm) dm.onclick=function(){
    const blob=new Blob([cardMarkdown()],{type:"text/markdown;charset=utf-8"});
    const a=document.createElement("a");
    a.href=URL.createObjectURL(blob);
    a.download=(D().dump_title||"story").replace(/[^\w\- ]/g,"").trim().replace(/\s+/g,"-").toLowerCase()+"-spine-card.md";
    a.click();
  };
  const pr=document.getElementById("btnPrint"); if(pr) pr.onclick=function(){window.print();};
  const mp=document.getElementById("btnMaster"); if(mp) mp.onclick=function(){copy(masterPrompt(),"Master prompt copied — paste into Claude");};
  const dp=document.getElementById("btnDuelPrompt"); if(dp) dp.onclick=function(){copy(duelPrompt(),"Duel prompt copied");};

  // restore page-test values
  ["pt_a","pt_b","pl_words","pl_chap","pl_q1","pl_q2","pl_q3","pl_q4","pl_q5"].forEach(function(id){
    const el=views.querySelector('[data-f="'+id+'"]'); if(el) el.value=D()[id]||"";
  });
  RUBRIC.forEach(function(r,i){
    ["a","b"].forEach(function(s){
      const el=views.querySelector('[data-f="rb_'+s+i+'"]'); if(el) el.value=D()["rb_"+s+i]||"";
    });
  });
}

function updateVerdictLine(){
  const s=STATIONS.filter(function(x){return x.id===activeTab;})[0];
  if(!s) return;
  const el=document.querySelector('[data-view="'+activeTab+'"] .verdictline');
  if(!el) return;
  const g=s.gate(D());
  el.innerHTML=g.pass?'<span style="color:var(--good)">✓ station clear</span>':esc(g.missing[0]||"unfinished");
}

function runChecks(){
  const d=D();
  STATIONS.forEach(function(s){
    s.fields.forEach(function(f){
      const box=document.querySelector('[data-push="'+f.id+'"]');
      if(!box) return;
      const v=d[f.id]||"";
      let res=f.check?f.check(v,d):null;
      if(!res||!res.msg){ box.className="push"; box.innerHTML=""; }
      else { box.className="push show "+res.level; box.innerHTML=(res.level==="bad"?"🛑 ":res.level==="warn"?"⚠️ ":"✓ ")+res.msg; }
      const c=document.querySelector('[data-count="'+f.id+'"]');
      if(c&&f.counter){ const n=wc(v); c.textContent=n+" / "+f.counter+" words"; c.style.color=n>f.counter?"var(--bad)":"var(--ink-dim)"; }
    });
  });
}

function updateSpineSentence(){
  const box=document.getElementById("spineSentence");
  if(!box) return;
  const d=D();
  function part(v,ph){return v&&v.trim()?'<span class="fillin">'+esc(v.trim())+'</span>':'<span class="blank">'+ph+'</span>';}
  box.innerHTML='<div class="sentence">Readers will primarily follow a character who '+part(d.s_who,"________")+
    ', while trying to '+part(d.s_trying,"________")+
    ', and the story’s main pleasure comes from '+part(d.s_pleasure,"________")+'.</div>'+
    '<div class="stepnav no-print" style="border:none;padding-top:10px;margin-top:6px"><button class="btn sm" id="btnCopySpine">Copy the sentence</button></div>';
  const b=document.getElementById("btnCopySpine");
  if(b) b.onclick=function(){
    copy("Readers will primarily follow a character who "+(d.s_who||"…")+", while trying to "+(d.s_trying||"…")+", and the story's main pleasure comes from "+(d.s_pleasure||"…")+".","Spine sentence copied");
  };
}

function updateGenre(){
  const box=document.getElementById("genreOut");
  if(!box) return;
  const d=D();
  const g=GENRES[d.g_primary];
  const flav=(d.g_flavors||"").split("|").filter(Boolean);
  const soup=(d.g_primary?1:0)+flav.length;
  let tag="good",note="Clean. A reader knows exactly what they're buying.";
  if(soup>=4){tag="bad";note="Genre soup. This is the thing that makes a book unmarketable — not because it's bad, because nobody knows which reader it's for.";}
  else if(soup===3){tag="warn";note="Getting busy. Two layers is the ceiling before the blurb starts hedging.";}
  let html='<div class="gauge"><span class="gtag '+tag+'">'+soup+' label'+(soup===1?"":"s")+'</span><div class="bar"><i style="width:'+Math.min(100,soup*25)+'%"></i></div></div>'+
    '<div class="note" style="margin-top:8px">'+note+'</div>';
  if(g){
    html+='<div class="promise"><h4>'+esc(d.g_primary)+' — the contract you just signed</h4>'+
      '<div class="prow"><div class="pk">Reader promise</div><div class="pv">'+g.promise+'</div></div>'+
      '<div class="prow"><div class="pk">Must deliver</div><div class="pv">'+g.must+'</div></div>'+
      '<div class="prow"><div class="pk">Ending owed</div><div class="pv">'+g.ending+'</div></div>'+
      '<div class="prow"><div class="pk">Watch out</div><div class="pv" style="color:var(--warn)">'+g.warn+'</div></div></div>';
  }
  box.innerHTML=html;
}

function updateDuel(){
  const mA=document.getElementById("metA");
  if(!mA) return;
  const d=D();
  function metBox(t,label){
    if(!(t||"").trim()) return '<div class="met" style="grid-column:1/-1;color:var(--ink-dim)">Paste version '+label+' to see stats.</div>';
    const m=textMetrics(t);
    return '<div class="met"><div class="mk">Words</div><div class="mv">'+m.words+'</div></div>'+
      '<div class="met"><div class="mk">Avg sentence</div><div class="mv">'+m.avgSent+'</div></div>'+
      '<div class="met"><div class="mk">Dialogue</div><div class="mv">'+m.dialoguePct+'%</div></div>'+
      '<div class="met"><div class="mk">Paragraphs</div><div class="mv">'+m.para+'</div></div>'+
      '<div class="met"><div class="mk">-ly adverbs</div><div class="mv" style="color:'+(m.adverbs>m.words/100?"var(--warn)":"var(--ink)")+'">'+m.adverbs+'</div></div>'+
      '<div class="met"><div class="mk">Filter words</div><div class="mv" style="color:'+(m.filters>m.words/120?"var(--warn)":"var(--ink)")+'">'+m.filters+'</div></div>';
  }
  mA.innerHTML='<div style="font-size:11px;letter-spacing:.7px;text-transform:uppercase;color:var(--ink-dim);margin-bottom:5px">Version A</div><div class="metrics">'+metBox(d.pt_a,"A")+'</div>';
  document.getElementById("metB").innerHTML='<div style="font-size:11px;letter-spacing:.7px;text-transform:uppercase;color:var(--ink-dim);margin-bottom:5px">Version B</div><div class="metrics">'+metBox(d.pt_b,"B")+'</div>';

  let ta=0,tb=0,na=0,nb=0;
  RUBRIC.forEach(function(r,i){
    const a=parseFloat(d["rb_a"+i]),b=parseFloat(d["rb_b"+i]);
    if(!isNaN(a)){ta+=a;na++;} if(!isNaN(b)){tb+=b;nb++;}
  });
  const eA=document.getElementById("totA"),eB=document.getElementById("totB");
  if(eA) eA.textContent=na?ta:"—";
  if(eB) eB.textContent=nb?tb:"—";
  const dv=document.getElementById("duelVerdict");
  if(dv){
    if(na<RUBRIC.length||nb<RUBRIC.length){ dv.innerHTML='<div class="note">Score all 13 on both to get the merge verdict. ('+na+'/13 and '+nb+'/13 done.)</div>'; }
    else{
      const wins=[];
      RUBRIC.forEach(function(r,i){
        const a=parseFloat(d["rb_a"+i]),b=parseFloat(d["rb_b"+i]);
        if(a>b) wins.push(r[0]+" → take from <b>A</b>"); else if(b>a) wins.push(r[0]+" → take from <b>B</b>");
      });
      dv.innerHTML='<div class="note"><b>A '+ta+' · B '+tb+'</b> — but the total is not the point. Build version C:<br>'+
        (wins.length?wins.join("<br>"):"Dead even on every line. Then pick the one that sounds more like you and cut 15%.")+'</div>';
    }
  }
}

function updatePrologue(){
  const box=document.getElementById("plOut");
  if(!box) return;
  const d=D();
  const p=parseInt(d.pl_words,10), c=parseInt(d.pl_chap,10);
  if(isNaN(p)||isNaN(c)||!p||!c){ box.innerHTML=""; return; }
  const ratio=p/c;
  let tag="good",msg="Good length — the prologue is doing a prologue's job.";
  if(ratio>1.3){tag="bad";msg="Your prologue is "+Math.round(ratio*100)+"% of a chapter. That's not a prologue, that's chapter one wearing a costume — or a standalone short story you should be giving away as a lead magnet. Write it long, then keep only what the reader must know.";}
  else if(ratio>0.9){tag="warn";msg="Same size as a chapter. Ask yourself what a reader genuinely can't start chapter one without, and cut to that.";}
  box.innerHTML='<div class="gauge"><span class="gtag '+tag+'">'+p+' vs '+c+' words</span><div class="bar"><i style="width:'+Math.min(100,ratio*70)+'%"></i></div></div><div class="note" style="margin-top:8px">'+msg+'</div>';
}

/* ============================================================
   4. PROJECTS
   ============================================================ */
function renderProjects(){
  const sel=document.getElementById("projSel");
  sel.innerHTML=Object.keys(DB.projects).map(function(id){
    return '<option value="'+id+'"'+(id===DB.current?" selected":"")+'>'+esc(DB.projects[id].name)+'</option>';
  }).join("");
}
document.getElementById("projSel").onchange=function(e){DB.current=e.target.value;save();activeTab=STATIONS[0].id;render();};
document.getElementById("btnNew").onclick=function(){
  const n=prompt("Name this story:","New story");
  if(n===null) return;
  const id=uid();
  DB.projects[id]={name:n||"Untitled story",created:new Date().toISOString(),data:{dump_title:n||""},unlocked:{}};
  DB.current=id;save();renderProjects();activeTab=STATIONS[0].id;render();toast("Story created");
};
document.getElementById("btnRename").onclick=function(){
  const n=prompt("Rename:",P().name);
  if(n===null||!n.trim())return;
  P().name=n.trim();save();renderProjects();toast("Renamed");
};
document.getElementById("btnDelete").onclick=function(){
  if(Object.keys(DB.projects).length===1){toast("That's your only story.");return;}
  if(!confirm("Delete “"+P().name+"”? This cannot be undone."))return;
  delete DB.projects[DB.current];
  DB.current=Object.keys(DB.projects)[0];
  save();renderProjects();render();toast("Deleted");
};
document.getElementById("btnExport").onclick=function(){
  const blob=new Blob([JSON.stringify(DB,null,2)],{type:"application/json"});
  const a=document.createElement("a");
  a.href=URL.createObjectURL(blob);
  a.download="da-bot-backup-"+new Date().toISOString().slice(0,10)+".json";
  a.click();toast("Backup downloaded");
};
document.getElementById("btnImport").onclick=function(){document.getElementById("fileIn").click();};
document.getElementById("fileIn").onchange=function(e){
  const f=e.target.files[0]; if(!f) return;
  const r=new FileReader();
  r.onload=function(){
    try{
      const j=JSON.parse(r.result);
      if(!j.projects) throw 0;
      Object.keys(j.projects).forEach(function(id){DB.projects[id]=j.projects[id];});
      DB.current=j.current&&DB.projects[j.current]?j.current:Object.keys(DB.projects)[0];
      save();renderProjects();render();toast("Restored");
    }catch(err){toast("That file didn't look like a Da Bot backup.");}
  };
  r.readAsText(f);
  e.target.value="";
};

/* ============================================================
   5. GO
   ============================================================ */
load();
renderProjects();
render();
</script>
</body>
</html>
