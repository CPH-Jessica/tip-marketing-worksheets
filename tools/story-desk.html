<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Story Desk — The Invisible Pen</title>
<style>
/* Story Desk — house style: cream paper, deep-teal ink, rose + brass accents, serif display */
:root {
  --paper: #f8f3ea; --paper-2: #f1e9db; --paper-3: #e9dfcc;
  --card: #fffdf8; --line: #e2d7c3; --line-2: #d2c4a8;
  --ink: #1f2f36; --ink-2: #4a5a62; --ink-3: #7a878d;
  --teal: #14545c; --teal-2: #0f3f45; --teal-soft: #dfeceb;
  --rose: #c2566b; --rose-soft: #f6e3e6;
  --brass: #b8893a; --brass-soft: #f4e8d0;
  --sage: #4f7d5a; --sage-soft: #e3eee4;
  --amber: #c98a1b; --amber-soft: #fbf0d6;
  --red: #b83b3b; --red-soft: #f7dede;
  --shadow: 0 1px 2px rgba(31,47,54,.06), 0 6px 18px rgba(31,47,54,.08);
  --serif: "Iowan Old Style", "Palatino Linotype", Palatino, "Book Antiqua", Georgia, serif;
  --sans: "Segoe UI", system-ui, -apple-system, Roboto, Arial, sans-serif;
  --mono: Consolas, "Cascadia Mono", Menlo, monospace;
  --ms: Georgia, "Times New Roman", "Iowan Old Style", serif;
  --left-w: 440px; --right-w: 400px; --top-h: 54px;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--paper); color: var(--ink); font: 14px/1.45 var(--sans); overflow: hidden; }
button, input, select, textarea { font: inherit; color: inherit; }
a { color: var(--teal); }
h1, h2, h3, h4 { font-family: var(--serif); font-weight: 600; margin: 0; letter-spacing: .1px; }
h2 { font-size: 20px; } h3 { font-size: 16px; } h4 { font-size: 14px; }
small, .muted { color: var(--ink-3); }
.hidden { display: none !important; }
code, .mono { font-family: var(--mono); font-size: 12.5px; }

/* ---------- layout ---------- */
#app { display: grid; grid-template-rows: var(--top-h) 1fr; height: 100vh; }
#desk { display: grid; grid-template-columns: var(--left-w) 1fr var(--right-w); min-height: 0; transition: grid-template-columns .2s; }
#desk.no-left { grid-template-columns: 0 1fr var(--right-w); }
#desk.no-right { grid-template-columns: var(--left-w) 1fr 0; }
#desk.no-left.no-right, #desk.focus { grid-template-columns: 0 1fr 0; }
.pane { min-width: 0; min-height: 0; overflow: hidden; display: flex; flex-direction: column; }
#left { background: var(--paper-2); border-right: 1px solid var(--line); }
#right { background: var(--paper-2); border-left: 1px solid var(--line); }
#center { background: var(--paper); }
.pane-scroll { overflow-y: auto; flex: 1; min-height: 0; padding: 14px 16px 40px; }
.pane-head { display: flex; align-items: center; gap: 8px; padding: 10px 14px; border-bottom: 1px solid var(--line); background: rgba(255,253,248,.6); min-height: 46px; }
.pane-head h3 { flex: 1; }

/* ---------- topbar ---------- */
#topbar { display: flex; align-items: center; gap: 10px; padding: 0 14px; background: var(--teal-2); color: #eef4f2; border-bottom: 1px solid #0a2f34; }
#topbar .brand { display: flex; align-items: baseline; gap: 8px; margin-right: 6px; white-space: nowrap; flex: none; }
#topbar .brand b { font-family: var(--serif); font-size: 19px; font-weight: 600; letter-spacing: .2px; }
#topbar .brand span { font-size: 11px; opacity: .7; }
#topbar .grow { flex: 1; }
#topbar select { background: rgba(255,255,255,.1); border: 1px solid rgba(255,255,255,.18); color: #fff; border-radius: 8px; padding: 5px 8px; max-width: 260px; }
#topbar select option { color: var(--ink); }
#topbar .tb { background: rgba(255,255,255,.1); border: 1px solid rgba(255,255,255,.18); color: #fff; border-radius: 8px; padding: 5px 10px; cursor: pointer; white-space: nowrap; }
#topbar .tb:hover { background: rgba(255,255,255,.18); }
#topbar .tb.on { background: var(--brass); border-color: var(--brass); color: #1f2f36; font-weight: 600; }
#topbar .chip { font-size: 12px; padding: 3px 9px; border-radius: 999px; background: rgba(255,255,255,.12); white-space: nowrap; }
#topbar .chip.ok { background: rgba(79,125,90,.45); } #topbar .chip.warn { background: rgba(201,138,27,.55); } #topbar .chip.bad { background: rgba(184,59,59,.6); }
#savestate { font-size: 11.5px; opacity: .8; min-width: 70px; text-align: right; }

/* ---------- stage stepper (left) ---------- */
.stepper { display: flex; flex-direction: column; gap: 4px; padding: 10px 10px 4px; }
.step { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: 10px; cursor: pointer; border: 1px solid transparent; }
.step:hover { background: rgba(255,255,255,.55); }
.step.on { background: var(--card); border-color: var(--line-2); box-shadow: var(--shadow); }
.step .n { width: 24px; height: 24px; border-radius: 50%; display: grid; place-items: center; font-size: 12px; font-weight: 700; background: var(--paper-3); color: var(--ink-2); flex: none; }
.step.done .n { background: var(--sage); color: #fff; }
.step.on .n { background: var(--teal); color: #fff; }
.step.locked { opacity: .55; }
.step .t { flex: 1; font-weight: 600; }
.step .s { font-size: 11px; color: var(--ink-3); }
.stepper-wrap { border-bottom: 1px solid var(--line); background: rgba(255,253,248,.35); }
.stepper.compact { flex-direction: row; flex-wrap: wrap; }
.stepper.compact .step { padding: 5px 8px; gap: 6px; } .stepper.compact .step .s { display: none; }

/* ---------- forms ---------- */
.field { margin: 0 0 12px; }
.field label, .lbl { display: block; font-size: 12px; font-weight: 600; color: var(--ink-2); margin-bottom: 4px; letter-spacing: .2px; }
.field .hint { font-size: 11.5px; color: var(--ink-3); margin-top: 3px; }
input[type=text], input[type=number], select, textarea { width: 100%; background: var(--card); border: 1px solid var(--line-2); border-radius: 8px; padding: 7px 9px; outline: none; }
input[type=text]:focus, input[type=number]:focus, select:focus, textarea:focus { border-color: var(--teal); box-shadow: 0 0 0 3px rgba(20,84,92,.12); }
textarea { resize: vertical; min-height: 70px; line-height: 1.5; }
textarea.doc { min-height: 220px; font-family: var(--mono); font-size: 12.5px; line-height: 1.5; }
textarea.streaming { background: #fffbef; border-color: var(--brass); }
.row { display: flex; gap: 10px; } .row > * { flex: 1; min-width: 0; }
.row.tight { gap: 6px; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; margin-bottom: 12px; box-shadow: var(--shadow); }
.card.soft { box-shadow: none; background: rgba(255,253,248,.7); }
.card h3, .card h4 { margin-bottom: 8px; }
.callout { border-left: 3px solid var(--brass); background: var(--brass-soft); padding: 8px 12px; border-radius: 0 8px 8px 0; margin: 8px 0 12px; font-size: 13px; }
.callout.teal { border-color: var(--teal); background: var(--teal-soft); }
.callout.rose { border-color: var(--rose); background: var(--rose-soft); }
.callout.red { border-color: var(--red); background: var(--red-soft); }
.callout.sage { border-color: var(--sage); background: var(--sage-soft); }
details.ref { border: 1px solid var(--line); border-radius: 10px; background: rgba(255,253,248,.7); margin: 8px 0; }
details.ref > summary { cursor: pointer; padding: 8px 12px; font-weight: 600; color: var(--teal); list-style: none; }
details.ref > summary::before { content: "▸ "; } details.ref[open] > summary::before { content: "▾ "; }
details.ref .body { padding: 4px 12px 12px; font-size: 13px; }
details.ref pre { white-space: pre-wrap; font-family: var(--mono); font-size: 12px; background: var(--paper-2); padding: 10px; border-radius: 8px; max-height: 320px; overflow: auto; }

/* buttons */
.btn { display: inline-flex; align-items: center; gap: 6px; background: var(--card); border: 1px solid var(--line-2); border-radius: 9px; padding: 7px 12px; cursor: pointer; font-weight: 600; font-size: 13px; color: var(--ink); white-space: nowrap; }
.btn:hover { border-color: var(--teal); color: var(--teal); }
.btn.primary { background: var(--teal); border-color: var(--teal); color: #fff; } .btn.primary:hover { background: var(--teal-2); color: #fff; }
.btn.rose { background: var(--rose); border-color: var(--rose); color: #fff; }
.btn.brass { background: var(--brass); border-color: var(--brass); color: #1f2f36; }
.btn.ghost { background: transparent; border-color: transparent; } .btn.ghost:hover { background: rgba(255,255,255,.6); }
.btn.sm { padding: 4px 9px; font-size: 12px; border-radius: 7px; }
.btn.xs { padding: 2px 7px; font-size: 11.5px; border-radius: 6px; font-weight: 500; }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.btn.danger { color: var(--red); } .btn.danger:hover { border-color: var(--red); }
.btnrow { display: flex; flex-wrap: wrap; gap: 6px; margin: 8px 0; align-items: center; }
.gen { position: relative; }
.gen .spin { display: none; } .gen.busy .spin { display: inline-block; }
@keyframes spin { to { transform: rotate(360deg); } }
.spin { width: 12px; height: 12px; border: 2px solid rgba(255,255,255,.4); border-top-color: #fff; border-radius: 50%; animation: spin .8s linear infinite; }
.btn:not(.primary) .spin { border-color: rgba(31,47,54,.25); border-top-color: var(--teal); }

/* chips / pills */
.chips { display: flex; flex-wrap: wrap; gap: 6px; margin: 6px 0; }
.chip { display: inline-flex; align-items: center; gap: 5px; padding: 3px 10px; border-radius: 999px; background: var(--paper-3); font-size: 12px; cursor: pointer; border: 1px solid transparent; }
.chip:hover { border-color: var(--teal); }
.chip.on { background: var(--teal); color: #fff; }
.chip.rose { background: var(--rose-soft); color: var(--rose); }
.chip.brass { background: var(--brass-soft); color: #7a5a1e; }
.chip.sage { background: var(--sage-soft); color: var(--sage); }
.chip.static { cursor: default; } .chip.static:hover { border-color: transparent; }
.tag { display: inline-block; font-size: 10.5px; font-weight: 700; letter-spacing: .4px; text-transform: uppercase; padding: 2px 6px; border-radius: 5px; background: var(--paper-3); color: var(--ink-2); }
.tag.rose { background: var(--rose-soft); color: var(--rose); } .tag.sage { background: var(--sage-soft); color: var(--sage); } .tag.amber { background: var(--amber-soft); color: #7a5a1e; } .tag.red { background: var(--red-soft); color: var(--red); } .tag.teal { background: var(--teal-soft); color: var(--teal); }

/* tabs */
.tabs { display: flex; gap: 2px; padding: 8px 10px 0; border-bottom: 1px solid var(--line); background: rgba(255,253,248,.4); }
.tab { padding: 7px 11px; border-radius: 9px 9px 0 0; cursor: pointer; font-weight: 600; font-size: 12.5px; color: var(--ink-2); border: 1px solid transparent; border-bottom: none; }
.tab.on { background: var(--paper-2); border-color: var(--line); color: var(--teal); position: relative; top: 1px; }
.tab:hover { color: var(--teal); }

/* trope picker */
.tier { margin-bottom: 14px; }
.tier h4 { display: flex; align-items: center; gap: 8px; margin-bottom: 4px; }
.tier .intro { font-size: 12px; color: var(--ink-3); margin-bottom: 6px; }
.tcards { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
.tcard { border: 1px solid var(--line); border-radius: 9px; padding: 7px 9px; background: var(--card); cursor: pointer; font-size: 12.5px; }
.tcard:hover { border-color: var(--teal); }
.tcard.on { border-color: var(--teal); background: var(--teal-soft); }
.tcard.note { background: var(--amber-soft); cursor: default; border-color: transparent; }
.tcard b { display: block; margin-bottom: 2px; }
.tcard .bul { font-size: 11.5px; color: var(--ink-2); cursor: pointer; padding: 1px 0; }
.tcard .bul:hover { color: var(--teal); text-decoration: underline; }
.tcard details summary { font-size: 11px; color: var(--ink-3); cursor: pointer; }
.picked { display: flex; flex-wrap: wrap; gap: 6px; margin: 6px 0; min-height: 26px; }
.picked .chip .x { opacity: .6; margin-left: 2px; } .picked .chip .x:hover { opacity: 1; }

/* promise builder */
.promise { font-family: var(--serif); font-size: 15px; line-height: 1.9; background: var(--card); border: 1px dashed var(--line-2); border-radius: 10px; padding: 10px 12px; }
.promise input { display: inline-block; width: auto; min-width: 120px; max-width: 100%; padding: 2px 6px; border-radius: 6px; border-bottom: 2px solid var(--brass); border-top: none; border-left: none; border-right: none; background: var(--brass-soft); font: inherit; font-size: 14px; }

/* checklist */
.checks { list-style: none; padding: 0; margin: 6px 0; }
.checks li { display: flex; gap: 8px; align-items: flex-start; padding: 4px 0; font-size: 13px; }
.checks input { margin-top: 3px; }

/* ---------- manuscript (center) ---------- */
#ms-head { padding: 10px 18px 8px; border-bottom: 1px solid var(--line); background: rgba(255,253,248,.5); }
#ms-head .title-row { display: flex; align-items: center; gap: 10px; }
#ms-head .title-row h2 { flex: 1; font-size: 22px; }
#ms-head .title-row h2 input { font: inherit; background: transparent; border: none; border-bottom: 1px dashed transparent; padding: 0; width: 100%; }
#ms-head .title-row h2 input:hover, #ms-head .title-row h2 input:focus { border-bottom-color: var(--line-2); }
#ms-head .meta { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin-top: 4px; font-size: 12px; color: var(--ink-2); }
.progress { height: 6px; background: var(--paper-3); border-radius: 999px; overflow: hidden; margin-top: 8px; }
.progress i { display: block; height: 100%; background: linear-gradient(90deg, var(--rose), var(--brass)); border-radius: 999px; transition: width .3s; }
#ms-body { display: grid; grid-template-columns: 210px 1fr; min-height: 0; flex: 1; }
#ms-body.no-strip { grid-template-columns: 0 1fr; }
#ch-strip { border-right: 1px solid var(--line); overflow-y: auto; background: rgba(255,253,248,.35); }
#ch-strip .strip-head { display: flex; align-items: center; justify-content: space-between; padding: 8px 10px 4px; font-size: 11.5px; color: var(--ink-3); font-weight: 600; letter-spacing: .3px; text-transform: uppercase; }
.chrow { display: flex; align-items: center; gap: 7px; padding: 6px 10px; cursor: pointer; border-left: 3px solid transparent; }
.chrow:hover { background: rgba(255,255,255,.6); }
.chrow.on { background: var(--card); border-left-color: var(--rose); }
.chrow .pip { width: 9px; height: 9px; border-radius: 50%; background: var(--line-2); flex: none; }
.chrow .pip.planned { background: var(--brass); } .chrow .pip.drafted { background: var(--teal); } .chrow .pip.edited { background: var(--rose); } .chrow .pip.approved { background: var(--sage); }
.chrow .cn { font-weight: 700; font-size: 12px; color: var(--ink-2); min-width: 20px; }
.chrow .ct { flex: 1; font-size: 12.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.chrow .cw { font-size: 11px; color: var(--ink-3); }
#editor { display: flex; flex-direction: column; min-height: 0; }
#editor .ed-head { display: flex; align-items: center; gap: 8px; padding: 8px 18px; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
#editor .ed-head input.ct { flex: 1; min-width: 160px; font-family: var(--serif); font-size: 17px; background: transparent; border: none; border-bottom: 1px dashed transparent; padding: 2px 0; }
#editor .ed-head input.ct:hover, #editor .ed-head input.ct:focus { border-bottom-color: var(--line-2); }
#editor .ed-head input.sm { width: 120px; }
#editor .ed-head select { width: auto; }
.brief { margin: 8px 18px 0; }
.brief pre { white-space: pre-wrap; font-family: var(--mono); font-size: 12px; background: var(--brass-soft); border-radius: 8px; padding: 10px; max-height: 260px; overflow: auto; margin: 0; }
.brief textarea { font-family: var(--mono); font-size: 12px; }
#ed-text { flex: 1; min-height: 0; margin: 8px 18px 0; border: 1px solid var(--line); border-radius: 10px; background: #fffdf9; padding: 26px 34px; font: 17px/1.75 var(--ms); resize: none; box-shadow: inset 0 1px 0 rgba(255,255,255,.7); }
#ed-text.streaming { background: #fffbef; }
#editor .ed-foot { display: flex; align-items: center; gap: 10px; padding: 8px 18px 12px; font-size: 12px; color: var(--ink-3); flex-wrap: wrap; }
#editor .ed-foot .grow { flex: 1; }
.empty { padding: 40px 30px; text-align: center; color: var(--ink-3); }
.empty h3 { color: var(--ink-2); margin-bottom: 6px; }
.empty .big { font-size: 40px; margin-bottom: 8px; }

/* ---------- writer (right) ---------- */
.mode { display: flex; gap: 4px; background: var(--paper-3); padding: 3px; border-radius: 10px; }
.mode button { flex: 1; border: none; background: transparent; padding: 6px 4px; border-radius: 8px; cursor: pointer; font-weight: 600; font-size: 12px; color: var(--ink-2); }
.mode button.on { background: var(--card); color: var(--teal); box-shadow: var(--shadow); }
.ctx { display: flex; flex-wrap: wrap; gap: 4px; margin: 6px 0; }
.ctx .chip { font-size: 11px; padding: 2px 8px; }
.out { background: #fffdf9; border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; font: 14.5px/1.65 var(--ms); max-height: 46vh; overflow: auto; white-space: pre-wrap; }
.out.streaming { border-color: var(--brass); background: #fffbef; }
.report { font-size: 12.5px; }
.report .hit { padding: 4px 8px; border-radius: 6px; margin: 3px 0; background: var(--card); border: 1px solid var(--line); }
.report .hit b { font-family: var(--mono); font-size: 12px; }
.report .hit.hard { border-color: #e8b9b9; background: var(--red-soft); }
.report .hit.warn { border-color: #eed9a8; background: var(--amber-soft); }
.verdict { display: inline-block; font-weight: 800; letter-spacing: .5px; padding: 3px 10px; border-radius: 7px; }
.verdict.PASS { background: var(--sage-soft); color: var(--sage); } .verdict.WARN { background: var(--amber-soft); color: #7a5a1e; } .verdict.FAIL { background: var(--red-soft); color: var(--red); }
table.track { width: 100%; border-collapse: collapse; font-size: 12px; }
table.track th, table.track td { text-align: left; padding: 4px 6px; border-bottom: 1px solid var(--line); vertical-align: top; }
table.track th { color: var(--ink-3); font-weight: 600; font-size: 11px; text-transform: uppercase; letter-spacing: .3px; }
.kv { display: grid; grid-template-columns: auto 1fr; gap: 3px 10px; font-size: 12.5px; }
.kv b { color: var(--ink-2); font-weight: 600; }

/* provider pills */
.prov { display: flex; gap: 6px; flex-wrap: wrap; }
.prov .pp { border: 1px solid var(--line-2); background: var(--card); border-radius: 999px; padding: 5px 11px; cursor: pointer; font-weight: 600; font-size: 12px; }
.prov .pp.on { background: var(--brass); border-color: var(--brass); color: #1f2f36; }
.prov .pp .ok { color: var(--sage); }
.keyrow { display: flex; gap: 6px; }
.keyrow input { flex: 1; font-family: var(--mono); font-size: 12px; }

/* ---------- global bits ---------- */
#toasts { position: fixed; right: 16px; bottom: 16px; display: flex; flex-direction: column; gap: 8px; z-index: 60; }
.toast { background: var(--ink); color: #fff; padding: 9px 14px; border-radius: 10px; font-size: 13px; box-shadow: var(--shadow); max-width: 380px; animation: pop .15s ease-out; }
.toast.ok { background: var(--sage); } .toast.warn { background: var(--amber); color: #1f2f36; } .toast.bad { background: var(--red); }
@keyframes pop { from { transform: translateY(6px); opacity: 0; } }
#busybar { position: fixed; left: 50%; bottom: 18px; transform: translateX(-50%); background: var(--teal-2); color: #fff; padding: 8px 14px; border-radius: 999px; display: none; align-items: center; gap: 10px; z-index: 55; box-shadow: var(--shadow); font-size: 13px; }
#busybar.on { display: flex; }
#busybar .spin { border-color: rgba(255,255,255,.35); border-top-color: #fff; }
#busybar button { background: rgba(255,255,255,.15); border: none; color: #fff; border-radius: 999px; padding: 3px 10px; cursor: pointer; }
.modal-bg { position: fixed; inset: 0; background: rgba(31,47,54,.45); display: none; align-items: center; justify-content: center; z-index: 70; padding: 20px; }
.modal-bg.on { display: flex; }
.modal { background: var(--paper); border-radius: 14px; width: min(760px, 100%); max-height: 90vh; overflow: auto; padding: 18px 20px; box-shadow: 0 20px 60px rgba(0,0,0,.3); }
.modal h3 { margin-bottom: 10px; }
.modal pre { white-space: pre-wrap; font-family: var(--mono); font-size: 12px; background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: 10px; max-height: 32vh; overflow: auto; }
.divider { height: 1px; background: var(--line); margin: 12px 0; }
.stat { display: inline-flex; flex-direction: column; padding: 6px 10px; border-radius: 10px; background: var(--card); border: 1px solid var(--line); min-width: 90px; }
.stat b { font-size: 18px; font-family: var(--serif); } .stat span { font-size: 11px; color: var(--ink-3); }
.stats { display: flex; gap: 8px; flex-wrap: wrap; margin: 8px 0; }
.lockbox { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: 10px; background: var(--sage-soft); border: 1px solid #cfe0d1; margin-top: 10px; }
.lockbox.open { background: var(--brass-soft); border-color: #ead9b3; }
.lockbox .t { flex: 1; font-size: 12.5px; }
.penpick { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
.pen { border: 1px solid var(--line); background: var(--card); border-radius: 10px; padding: 8px 10px; cursor: pointer; }
.pen:hover { border-color: var(--teal); } .pen.on { border-color: var(--teal); background: var(--teal-soft); }
.pen b { display: block; font-family: var(--serif); font-size: 14px; } .pen small { display: block; font-size: 11px; }
.pen.deferred { opacity: .6; }
.lanepick { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
.lane { border: 1px solid var(--line); background: var(--card); border-radius: 10px; padding: 8px 10px; cursor: pointer; }
.lane:hover { border-color: var(--teal); } .lane.on { border-color: var(--teal); background: var(--teal-soft); }
.lane b { display: block; font-size: 13px; } .lane small { display: block; font-size: 11px; line-height: 1.35; }
.versions { font-size: 12px; }
.versions .v { display: flex; gap: 8px; align-items: center; padding: 3px 0; }
kbd { font-family: var(--mono); font-size: 11px; background: var(--paper-3); padding: 1px 5px; border-radius: 4px; border: 1px solid var(--line-2); }

/* narrow screens: side panes become overlays */
@media (max-width: 1180px) {
  :root { --left-w: 400px; --right-w: 380px; }
  #desk { grid-template-columns: 1fr !important; }
  #left, #right { position: fixed; top: var(--top-h); bottom: 0; width: min(92vw, 460px); z-index: 40; box-shadow: 0 0 40px rgba(0,0,0,.25); transform: translateX(-105%); transition: transform .2s; }
  #right { right: 0; left: auto; transform: translateX(105%); }
  #desk:not(.no-left) #left { transform: none; }
  #desk:not(.no-right) #right { transform: none; }
  #desk.focus #left, #desk.focus #right { transform: translateX(-105%); }
  #desk.focus #right { transform: translateX(105%); }
}
@media (max-width: 760px) {
  #ms-body { grid-template-columns: 1fr; } #ch-strip { display: none; }
  #ed-text { padding: 16px; font-size: 16px; }
  #topbar .brand span, #topbar .chip.opt { display: none; }
}
@media print { #topbar, #left, #right, #ch-strip, .ed-foot, .ed-head { display: none !important; } #desk { grid-template-columns: 1fr !important; } #ed-text { border: none; font-size: 12pt; } }

<script>window.CONFIG = {"edition":"tip","version":"0.1.0","appName":"Story Desk","studio":"The Invisible Pen","storageKey":"storyDesk.tip.v1","keyPrefix":"storyDesk.tip.key.","tagline":"Plan it. Write it. Keep the manuscript in the middle.","builtAt":"2026-09-14","beta":true,"feedbackUrl":"story-desk-feedback.html"};
window.SD_DATA = {"lanes":{"contemporary-romance":{"id":"contemporary-romance","label":"Contemporary Romance","short":"Contemporary","desc":"Small-town, billionaire, and grounded community romance. Warm to bittersweet, emotionally honest.","variants":["SMALL-TOWN","BILLIONAIRE","SAFE HARBOR"],"romance":true,"primaryPens":"Constance Ruth Clark (small-town + billionaire), Sloane Avery (Safe Harbor / Portland ME / plus-size, LGBTQ+, found family)","targetLine":"70,000–90,000 words | 24–32 chapters | Dual POV preferred (single FMC POV acceptable for tighter books)","words":[70000,90000],"chapters":[24,32],"pov":"Dual POV preferred (single FMC POV acceptable for tighter books)","heatLine":"🌶️🌶️🌶️🌶️–🌶️🌶️🌶️🌶️🌶️ (4–5/5) — open door, explicit, but only when the story earns it","outlinePrompt":"You are a professional contemporary romance outliner specializing in emotionally grounded, community-driven romance.\n\nTASK: Create a complete chapter outline for a novel using the Premise and Codex provided in the Project files. Output as [Book Title]_Outline.md.\n\nLANE: [SMALL-TOWN / BILLIONAIRE / SAFE HARBOR]\nTARGET: 70,000–90,000 words | 24–32 chapters | Dual POV preferred\n\n---\n\nSTRUCTURE\n\nACT 1 — ARRIVAL & RESISTANCE (0–25%): SHE LANDS IN HIS WORLD (OR HE LANDS IN HERS)\n- **CHAPTER 1 OPENS ON A HOOK — THE LEAH GATE.** The hook is the inciting moment already in motion: she walks back into the town she swore off, the will is being read, the renovation is already going wrong, the storm is already breaking the windows. Warm tone, but something is HAPPENING. Open mid-motion or mid-problem. NEVER open on telling (narrator explaining who she is or what the town is like), NEVER on reminiscing or backstory, NEVER on a calm \"ordinary day\" described as nice or normal, NEVER on weather, scenery, or local history. ACTION and SHOWING in the first lines — reveal her competence and voice through what she DOES under pressure. THE BAR: would a hostile critic (Leah) read past the first two paragraphs? If the open is slow, backward-looking, or calm, build a stronger hook. Write to clear the bar; do not pad the open to ease in.\n- Establish FMC competence and voice — she is in charge of her own life, even when it's a mess\n- Inciting incident is concrete: she returns home, he buys the building, the will is read, the renovation starts, the coastal inn opens, the storm hits\n- First contact between leads — friction, recognition, or both — but their worlds are not yet entangled\n- Stakes established: what she stands to lose if she stays / leaves / gets attached\n- Community is shown — neighbors, family, business partners, found family — through their reactions, not exposition\n- End of Act 1: their lives are tangled enough that walking away is no longer simple\n\nACT 2A — DOMESTIC PROXIMITY → FALLING (25–50%): THEY BUILD SOMETHING (TOGETHER OR ALONGSIDE)\n- Forced proximity becomes ROUTINE — shared coffee, shared porch, shared project, shared kid\n- Their banter becomes their language — not as engine, but as evidence\n- Each one starts seeing the OTHER — past the assumptions they walked in with\n- Side characters reinforce the pairing (meddling, witnessing, commenting — but with weight, not slapstick)\n- First kiss lands here (target Ch 8–12, 30–45%) — earned through tension and emotional groundwork\n- First intimacy scene possible here IF the story has earned it; otherwise hold to Act 2B\n- Midpoint (~50%): a domestic moment that functions as a \"this matters\" reveal — the porch conversation, the late-night kitchen scene, the moment he holds her kid, the first time she lets him see her tired\n\nACT 2B — FEELINGS CAUGHT → EXTERNAL PRESSURE (50–75%): THE WORLD STARTS PUSHING BACK\n- Both POVs know they're falling — neither has named it\n- External complication tightens — the secret unravels, the city offer arrives, the ex returns, the renovation fails, the diagnosis lands, the family pressures, the past arrives\n- First (or next) intimacy scene anchors here — emotionally weighty, voice-forward, character-specific\n- Vulnerability deepens — he tells her the thing he doesn't tell anyone, she lets him see what she actually wants\n- The community awareness reaches them — they are seen, they are talked about, they cannot pretend in public anymore\n- Setup for the breaking point — a misunderstanding seeded, an external choice forced, a deadline approaching\n\nACT 3A — BREAKING POINT (75–88%): THE FEAR LANDS\n- The blow lands — but in CRC / Sloane lane it comes from FEAR, MISUNDERSTANDING, or EXTERNAL PRESSURE — never from cruelty between the leads\n- One or both retreats — he leaves for the city, she returns to her old life, she takes the job, he sells the place\n- Dark moment is brief — 1–2 chapters max — and the tone stays warm even in the rupture\n- Both POVs feel the loss; both POVs have a chance to choose differently\n- Community / found family rallies — someone tells one of them the truth they've been missing\n- The misunderstanding clarifies — through evidence, conversation, or a third party's nudge\n\nACT 3B — GRAND GESTURE → DECLARATION (88–98%): SHE CHOOSES, HE CHOOSES\n- One or both makes a public, vulnerable, or costly gesture\n- Conflict resolves through honest CONVERSATION, not third-party rescue\n- The choice is concrete — she stays, he buys the building, they merge their lives, she keeps the inn, he turns down the city offer\n- Community witnesses and welcomes — found family arc lands here\n- HEA is warm, emotionally satisfying, grounded\n\nRESOLUTION — EARNED HEA (98–100%): WARM AND ROOTED\n- Aftermath — a domestic moment that lets the reader live in the HEA\n- Optional epilogue — months or a year later, low stakes, high charm\n- The community is intact, the leads are settled, the future is concrete\n\n---\n\nCHAPTER FORMAT\n\nFor each chapter provide:\n\n### Chapter [#] — [POV]\n- **Goal:** [what this POV is trying to accomplish]\n- **Conflict:** [what stands in the way — internal, external, or community]\n- **Outcome:** [how the chapter changes the situation]\n\n**Beats (5 bullets max):**\n- [Bullet 1 — opening beat, in action]\n- [Bullet 2]\n- [Bullet 3 — midpoint shift]\n- [Bullet 4]\n- [Bullet 5 — ending HOOK]\n\n**Required per chapter:**\n- At least one emotional beat (vulnerability, memory, longing, recognition)\n- At least one community beat (someone seen, witnessed, or affected)\n- Forward momentum — relationship, plot, or character\n- Ending HOOK (no soft landings; end mid-motion or on an unfinished beat)\n\n---\n\nINCLUDE WITH THE OUTLINE\n\n## Emotional Escalation Map\nTrack the emotional trajectory:\n- Ch 1–6: Resistance disguised as practicality\n- Ch 7–14: Emotional honesty emerging in private\n- Ch 15–22: Vulnerability witnessed and chosen\n- Ch 23–end: Love named and claimed\n\n## Community Map\nList the supporting cast and their function:\n- The meddler (who pushes them together)\n- The witness (who sees first)\n- The voice of reason (who tells the truth at the right moment)\n- The complication (the ex, the family member, the rival)\n- The found family (the community that welcomes)\n\n## Romance Escalation Map\n- First touch (Ch ?)\n- First conversation that matters (Ch ?)\n- First kiss (target Ch 8–12, 30–45%)\n- First emotional reveal (Ch ?)\n- First intimacy (target Ch 13–18, 45–60% — only if story has earned it)\n- Second intimacy or deeper intimacy (Ch ?–?)\n- Dark moment (target ~75–80%)\n- Declaration / grand gesture (target ~90%)\n- HEA (final 2–3 chapters)\n\n## Heat Map\n- Heat level: 4–5/5 default — open door when scenes appear\n- Heat scenes appear ONLY when the story earns them — no quota\n- Apply the test: \"If I cut this scene, does the book lose something?\"\n- Flag any scene that could be cut without loss\n\n---\n\nREQUIREMENTS (NON-NEGOTIABLE)\n\n- Chapter 1 clears the Leah Gate — open on an action/showing hook (see Act 1); never telling, reminiscing, a calm \"ordinary day,\" or weather/scenery/history to open\n- FMC has agency throughout — never rescued from her own life\n- Hero EARNS her — through showing up, consistently, in concrete ways\n- Community is integral to the romance, not decoration\n- Third-act conflict comes from FEAR, MISUNDERSTANDING, or EXTERNAL PRESSURE — NEVER cruelty between leads\n- HEA is mandatory — no tragic endings, no ambiguous \"maybes\"\n- Single POV per chapter; alternating dual POV preferred\n- No tangled sheets, no slick folds, no purple prose (CPH universal)\n- Heat scenes ONLY when the story earns them — pacing matters more than scene count\n- Dark moment 1–2 chapters max — tone stays warm even in rupture\n- No banned names (cross-check `banned-list.md` and pen name skill character rules)\n\n---\n\nPEN NAME SPECIFIC CHECKS\n\n### Constance Ruth Clark — Small-Town Lane\n- [ ] Setting (town, street, business) is named, specific, and appears in scenes\n- [ ] Community is present — neighbors, the diner, the coffee shop, the festival\n- [ ] At least one cross-character connection to the Wild Romance series world (if applicable)\n- [ ] Hero is competent + warm; not flashy, not arrogant, not \"billionaire as personality\"\n- [ ] First kiss has WEIGHT — community-aware tension contributes\n- [ ] Heat scenes (if present) feel earned through emotional groundwork\n\n### Constance Ruth Clark — Billionaire Lane\n- [ ] Wealth COMPLICATES — never controls or rescues\n- [ ] Hero's wealth is grounded; he is not \"wealth as personality\"\n- [ ] FMC does not need rescuing — emotional or financial\n- [ ] Power dynamic is tension, not dominance\n- [ ] Setting (penthouse, jet, boardroom) is texture, not character\n- [ ] Heat scenes show his control SLIPPING — that's the emotional payoff\n\n### Sloane Avery — Safe Harbor Lane\n- [ ] Setting is Cape Elizabeth or Portland ME, specific and present\n- [ ] Plus-size, LGBTQ+, or found-family rep is BUILT IN, not stapled on\n- [ ] Characters are 30s–40s — past the \"first time\" milestones, dealing with grown-adult lives\n- [ ] Found family is a theme — chosen people matter\n- [ ] Tone is warm, emotionally honest, slightly more bittersweet than Connie\n\n### Universal\n- [ ] No scenes drift into Sage tone (banter-forward rom-com) or Moxie tone (dark mafia)\n- [ ] No banned names\n\nOUTPUT: Save as [Book Title]_Outline.md in Project files.","outlineRefinements":[{"label":"Pacing rushed","text":"The relationship is locking in by Ch [X]. Stretch the resistance and the slow build through Ch [Y]. Add 2–3 chapters of domestic proximity before the first kiss."},{"label":"Heat scenes feel like quota","text":"Ch [X] heat scene doesn't earn its place. Either cut it OR add the emotional beat that makes it necessary."},{"label":"Hero feels flashy / arrogant","text":"Hero in Ch [X-Y] reads as 'wealth as personality' or 'alpha posturing.' Recalibrate to grounded competence — what he DOES, not what he announces."},{"label":"FMC reads passive","text":"She's reacting to him, the move, the renovation. Re-outline so she makes at least one active life choice per act that's about HER, not them."},{"label":"Community absent","text":"Neighbors / family / friends are mentioned but not present. Add named scenes with specific community members in Ch [X-Y]."},{"label":"Dark moment too heavy","text":"The dark moment is melodramatic. Shorten to 1–2 chapters. The fear / misunderstanding must be real but the tone stays warm."},{"label":"HEA rushed","text":"The HEA lands in the last 2 pages. Spread the declaration, choice, and aftermath across 3–4 chapters so the warmth lands."},{"label":"Setting is invisible","text":"The town / coast / city is named but not present. Add 2–3 specific location beats in Ch [X-Y] — the diner, the ferry, the porch, the harbor — so setting is texture, not backdrop."}],"postChecks":["Chapter count sanity check — 24–32 is the target. Under 24 = the emotional connection feels rushed. Over 32 = should likely be pruned or expanded into duology.","POV balance — Roughly 50/50 or deliberate. Both leads carry emotional weight.","Emotional density — Every chapter has an emotional beat. Spot-check: if a chapter is pure plot mechanics with no relationship growth, question why.","First kiss placement — 30–45% is the target. Earlier = rushed; later = the slow burn drifts.","Heat scene earn-rate — Each heat scene must be cuttable-test-positive. If the book loses NOTHING by cutting it, cut it.","Dark moment length — 1–2 chapters. Longer = the tone has drifted into melodrama.","Community visibility — Side characters appear in named scenes, not just mentioned. Spot-check that the community is built, not invoked."],"tropes":{"tiers":[{"name":"TIER 1 — CORE ROMANCE ENGINE","intro":"Pick ONE. This defines the central relationship dynamic.","cards":[{"name":"Second Chance Romance","bullets":["History between them — exes, almost-was, the one who got away","Old wounds, unresolved feelings, fear of repeating mistakes","Understanding what went wrong, growth from both","Payoff: this time, they're ready"]},{"name":"Returning Home","bullets":["She left; now she's back (circumstances, not choice usually)","Facing what she ran from, proving she's changed / grown","Finding home isn't the place she left — it's what she builds","Payoff: home is a choice, not a trap"]},{"name":"Single Parent","bullets":["Raising a kid alone, cautious about letting anyone in","Protecting the child, fear of disruption, divided attention","He shows up for the kid, not just her","Payoff: ready-made family that feels earned"]},{"name":"Billionaire Next Door / Hidden Wealth","bullets":["He has money she doesn't know about (or downplays)","She doesn't want his money; he's afraid that's all anyone wants","She fell for HIM, not his bank account","Payoff: love that has nothing to do with wealth"]},{"name":"Opposites Attract (City vs. Country)","bullets":["He's from away, she's local (or vice versa)","Different values, lifestyle clash, \"you don't belong here\"","He finds what he was missing; she expands her world","Payoff: choosing what matters"]},{"name":"Found Family / Chosen People (Sloane lane core)","bullets":["Adult characters in 30s-40s building family from chosen people","Past relationship grief, single by circumstance, queer family-building","The community isn't backdrop — it's the romance's foundation","Payoff: the chosen family widens to include him / her / them"]},{"name":"Small-Town Secrets","bullets":["Something in the past (hers, his, the town's) that affects the present","Discovery threatens everything","Truth comes out; it doesn't destroy them","Payoff: honesty allows real connection"]}]},{"name":"TIER 2 — FORCED PROXIMITY","intro":"Pick ONE. This is what creates scenes the reader bought the book for.","cards":[{"name":"Universal Contemporary Proximity","bullets":["Neighbors (next door, across the hall, shared duplex)","Shared Workspace (renovating together, co-running an inn / bakery / business)","Inheritance with Strings (one or both inherited the building / land / company)","Stuck Together by Circumstance (snowstorm, broken-down car, family event)","Co-Parenting by Crisis (helping with the kid in a pinch)","Roommates by Necessity (rent crisis, family obligation, post-disaster)","Festival / Event Co-Hosting (the town festival, the wedding, the charity gala)","Renovation / Restoration (the historic home, the family business, the lighthouse)"]},{"name":"Small-Town-Specific","bullets":["Diner / Coffee Shop Regulars (their seats are next to each other)","Town Council / Committee (forced collaboration on town matters)","Adjacent Businesses (her bakery next to his hardware store)","Neighbors on the Same Block (community awareness baked in)"]},{"name":"Billionaire-Specific","bullets":["Penthouse Neighbors (or shared building with one elevator)","Private Jet / Yacht (rich-people trapped proximity)","Estate Renovation (she's the contractor / interior designer / curator)","Boardroom Crisis (she's the lawyer / consultant who saves his deal)"]},{"name":"Sloane / Safe Harbor-Specific","bullets":["Coastal Inn (running it together, inheriting it, restoring it)","Ferry Commute (Cape Elizabeth to Portland regulars)","Beachside Cottage (rental mix-up, family share house)","Local Business Crisis (the harbor, the lighthouse, the bookshop)"]}]},{"name":"TIER 3 — PERSONALITY DYNAMIC","intro":"Pick ONE. This fuels emotional connection and tension.","cards":[{"name":"Classic Contemporary Romance","bullets":["Grumpy x Sunshine","Guarded x Hopeful","Workaholic x Life-Enjoyer","Practical x Dreamer","Cynic x Believer","Returned Home x Never Left","Big-City Polish x Small-Town Grounded","Single Parent x Career-Focused","Loner x Community-Anchored","Wounded x Healing"]},{"name":"Emotionally Honest Pairings","bullets":["Both Burned, Cautiously Trying Again","Best Friend's Sibling (years of unspoken)","Adult Lives Already Built (no fixing the other; just adding)","Found Family Already in Place (he joins it / she joins it)"]},{"name":"Avoid for CRC / Sloane","bullets":["Pure rom-com banter as the engine (that's Sage's lane)","Dark alpha posturing (that's Moxie's lane)","Power-imbalance-as-fantasy (wealth complicates, never controls)","Insta-attraction without emotional foundation","Heroines who need rescuing from their own lives"]}]},{"name":"TIER 4 — SECRET / COMPLICATION","intro":"Pick ONE. This drives Act 3 breaking point.","cards":[{"name":"External Forces","bullets":["Career Move Forced Choice (the city offer, the relocation, the promotion)","Family Pressure (parents, siblings, ex-in-laws — complicated, not evil)","The Ex Returns (with intent — but not as villain without cause)","Inheritance Twist (the will reading complicates everything)","Town Decision Pending (sale of the inn, closing of the business, vote on development)","Sale / Buyout / Merger (his company, her family business, the building)"]},{"name":"Identity & Status","bullets":["Hidden Wealth Reveal (the gradual unspooling)","Past Relationship Surfaces (his ex, her ex, the unresolved chapter)","Estranged Family Member Returns (parent, sibling, child)","Public Visibility Crisis (he's famous, she's a private person — or vice versa)","Career Crisis (he loses everything, she's offered everything)"]},{"name":"Emotional Stakes","bullets":["Fear of Being Used (for money, status, family connection)","\"Too Much\" or \"Not Enough\" Belief (genre staple — must resolve)","Career vs. Love Forced Choice (false binary that becomes real)","Past Heartbreak Haunting Current Choices","Belief That She Can't Stay (she always leaves)","Belief That He Can't Be Loved (he's been alone too long)"]},{"name":"CRC / Sloane-Specific Complications","bullets":["Family Business in Crisis (Connie's small-town lane)","Custody / Parenting Complication (single parent lane)","Coastal Storm / Disaster (Sloane / Safe Harbor)","Found Family Member in Crisis (illness, loss, transition)","Renovation / Restoration Setback (the project that brings them together also threatens it)"]}]}],"extras":{"THE TROPE PICKER SYSTEM":"\nPick ONE option from each tier. Contemporary romance lives in emotional truth — the trope stack supports the emotional arc, not the other way around.\n\n**Max trope count per book: 5 total.**\n\n---\n\n","FMC TROPE CLUSTERS":"\nCRC and Sloane FMCs are competent, emotionally honest, and in charge of their own lives. Love expands their world; it does not rescue them.\n\n### Core Archetypes\n- Returning Daughter\n- Reluctant Inheritor\n- Single Parent Doing the Damn Thing\n- Small Business Owner (bakery, bookshop, inn, design studio)\n- Burned-Out Corporate Refugee\n- Quiet Competent (people underestimate her, she lets them)\n- Steady Hand of the Community\n- Plus-Size FMC Without Apology (Sloane lane)\n- Queer Adult Building Family (Sloane lane)\n\n### Emotionally Honest Traits\n- Says What She Means (eventually, after she's processed it)\n- Loyal — Once Earned, Total\n- Notices What Everyone Else Misses\n- Cries in Private; Shows Up Anyway in Public\n- Forgives but Doesn't Forget\n- Grew Up; Doesn't Romanticize Her Past\n- Has a Best Friend Who Will Tell Her the Truth\n\n### Career / Lifestyle\n- Small Business Owner\n- Creative Professional (writer, artist, designer, photographer)\n- Healthcare / Education / Service (grounded, real)\n- Family Business Caretaker\n- Recently Returned After Years Away\n- Career Pivot in Progress\n- Caretaker / Caregiver Carrying Weight\n\n### Emotional Arcs\n- Guarded but Hopeful\n- Afraid of Needing Someone (or Being Needed)\n- Rebuilding After Loss / Divorce / Breakup\n- Learning to Stay\n- Doesn't Think She's \"Enough\" (resolves)\n- Believes Love Is Inconvenient (resolves)\n- Carrying Grief She Hasn't Named\n\n---\n\n","MMC TROPE CLUSTERS":"\nCRC and Sloane MMCs are grounded, devoted, and steady. They EARN her — they don't claim her.\n\n### Core Archetypes\n- The Hometown Hero (firefighter, contractor, doctor, teacher, vet)\n- The Returning Son (came back after years away)\n- The Quiet Billionaire (wealth that doesn't perform itself)\n- The Single Dad Doing His Best\n- The Widower Slowly Rebuilding\n- The Estranged Brother / Cousin / Heir\n- The City Outsider Falling for the Town\n- The Found-Family Patriarch / Matriarch (Sloane lane)\n\n### Earning-Through-Action Traits\n- Shows Up Consistently (the genre's love language)\n- Fixes the Thing Without Being Asked\n- Remembers What She Said Three Weeks Ago\n- Listens (actually listens — not waiting to talk)\n- Holds the Line on What Matters Even When It Costs Him\n- Quietly Generous (not flashy)\n- Has His Own Best Friend Who Calls Him On His Stuff\n- Devoted to His People (kid, parent, sibling, dog)\n\n### Hard Edges (Earn-Side, Not Dark)\n- He's not a \"fixer\" of HER — he's a partner\n- He has his own stuff he hasn't dealt with\n- His wealth (if billionaire lane) complicates rather than rescues\n- His past relationship taught him something — or it didn't, and that's the arc\n\n### Emotional Arcs\n- From Closed Off to Vulnerable (with HER specifically)\n- From \"I Don't Need Anyone\" to \"I Need Her\"\n- From Guarding Old Pain to Naming It\n- From Flashy to Grounded (billionaire lane resolves toward this)\n- From Bachelor / Widower to Partner\n\n---\n\n","TROPE COMBINATIONS THAT WORK":"\n| Primary Trope (Tier 1) | Pairs Especially Well With |\n|---|---|\n| Second Chance | Returning Home, Small-Town Secrets |\n| Returning Home | Second Chance, Family Business Crisis |\n| Single Parent | Grumpy-Sunshine, Hidden Wealth |\n| Billionaire Next Door | Opposites Attract, Forced Proximity |\n| Found Family (Sloane) | Coastal Setting, Adult-Life-Already-Built |\n| Small-Town Secrets | Returning Home, The Ex Returns |\n\n---\n\n","TROPES TO HANDLE CAREFULLY":"\n### The Ex\n- Not a villain without cause\n- Shows growth, not just contrast\n- Don't demonize to make hero look better — can be decent but wrong\n\n### Class / Wealth Differences\n- Don't condescend to either world\n- Both have value; money doesn't solve real problems\n- Neither world is inherently better\n\n### Family Pressure\n- Families can be complicated without being evil\n- Work toward understanding, not just overcoming\n- Found family AND biological family can coexist\n\n### Secret Baby\n- Handle with care — can feel manipulative\n- Must address why she kept the secret with real reasons\n- His reaction must be earned through emotional truth\n- The child is never just a plot device\n\n---\n\n","HARD NO TROPES (NEVER USE)":"\n| Trope | Why Not |\n|---|---|\n| Hero saves her from poverty | She's not helpless |\n| Makeover makes her worthy | She was worthy before |\n| Big city is evil / soulless | Both worlds have value |\n| Small town is backwards | Respecting her world |\n| Love triangle with real competition | He's it |\n| Cheating | Nope |\n| Heroine as damsel | She fixes her own life |\n| Billionaire arrogance played as hot | Arrogance must be humbled, not rewarded |\n| Found family as decoration (Sloane lane) | The community has names, scenes, and weight |\n| Plus-size body as obstacle (Sloane lane) | She's already at home in her body |\n| Tangled sheets / slick folds / purple prose | CPH universal |\n| Banned names from `banned-list.md` | Always |\n\n---\n\n","THE CRC / SLOANE WISH FULFILLMENT":"\nEvery trope choice should feed at least one of these core fantasies:\n\n- A love that grows from **real connection** — not just attraction\n- A hero who **EARNS her** through showing up, consistently\n- A **community that welcomes them** — found family, belonging\n- A place that feels like **home** — cozy, safe, worth staying for\n- A heroine **in control of her life** — love enhances, doesn't rescue\n- **Warmth and humor** — feel-good without being saccharine\n- The promise that **good people find each other** — and it works out\n- **Adult-life-already-built** romance — past first-time milestones, into chosen-life territory (Sloane lane)\n\nIf a trope doesn't feed at least one of these, question why it's in the book.\n\n---\n\n","TROPE EXECUTION RULES":"\n### The Three-Beat Rule\nEvery trope should have at least three beats:\n1. **Introduction** — the trope is established\n2. **Complication** — the trope creates conflict\n3. **Resolution** — the trope pays off\n\n### Earn the Payoff\n- Setup must match payoff weight\n- Don't abandon tropes mid-book\n- Every trope promise must be kept\n- Reader satisfaction comes from proper resolution\n\n### Fresh Angles Required\n- Unexpected character reactions\n- Trope subversions (grumpy heroine, sunshine hero)\n- Complications specific to THESE characters\n- Emotional truth that feels new\n- Jessica's voice making it different\n\n---\n\n","TROPE CHECKLIST":"\nBefore locking the trope stack, verify:\n\n- [ ] Tier 1 / 2 / 3 / 4 picks chosen — one each\n- [ ] Total tropes in stack ≤ 5\n- [ ] Stack feeds at least one Wish Fulfillment fantasy\n- [ ] No Hard No tropes present\n- [ ] FMC has agency built into chosen tropes\n- [ ] MMC EARNS her — through action, not declaration\n- [ ] Community is integral to the chosen tropes\n- [ ] Stack works with the Story Promise without contradicting it\n- [ ] Any combination flagged in \"Pairs Especially Well With\" — bonus\n- [ ] No banned character names in any trope examples used\n- [ ] If billionaire lane: wealth complicates, never rescues\n- [ ] If Sloane / Safe Harbor lane: found family / rep is built in, not stapled on\n\n"},"primary":"Constance Ruth Clark (heat 4-5), Sloane Avery (heat 3–3.5)","max":5},"tropesDoc":"# Contemporary Romance Tropes Master List\n\n**Primary pen names:** Constance Ruth Clark (heat 4-5), Sloane Avery (heat 3–3.5)\n**Secondary use:** Romcom-adjacent tropes overlap but pure rom-com lives under Sage Kennedy. Dark contemporary lives under Moxie. This file owns small-town, billionaire, and grounded community contemporary.\n\n---\n\n## THE TROPE PICKER SYSTEM\n\nPick ONE option from each tier. Contemporary romance lives in emotional truth — the trope stack supports the emotional arc, not the other way around.\n\n**Max trope count per book: 5 total.**\n\n---\n\n## 🏡 TIER 1 — CORE ROMANCE ENGINE\n\n*Pick ONE. This defines the central relationship dynamic.*\n\n### Second Chance Romance\n- History between them — exes, almost-was, the one who got away\n- Old wounds, unresolved feelings, fear of repeating mistakes\n- Understanding what went wrong, growth from both\n- Payoff: this time, they're ready\n\n### Returning Home\n- She left; now she's back (circumstances, not choice usually)\n- Facing what she ran from, proving she's changed / grown\n- Finding home isn't the place she left — it's what she builds\n- Payoff: home is a choice, not a trap\n\n### Single Parent\n- Raising a kid alone, cautious about letting anyone in\n- Protecting the child, fear of disruption, divided attention\n- He shows up for the kid, not just her\n- Payoff: ready-made family that feels earned\n\n### Billionaire Next Door / Hidden Wealth\n- He has money she doesn't know about (or downplays)\n- She doesn't want his money; he's afraid that's all anyone wants\n- She fell for HIM, not his bank account\n- Payoff: love that has nothing to do with wealth\n\n### Opposites Attract (City vs. Country)\n- He's from away, she's local (or vice versa)\n- Different values, lifestyle clash, \"you don't belong here\"\n- He finds what he was missing; she expands her world\n- Payoff: choosing what matters\n\n### Found Family / Chosen People (Sloane lane core)\n- Adult characters in 30s-40s building family from chosen people\n- Past relationship grief, single by circumstance, queer family-building\n- The community isn't backdrop — it's the romance's foundation\n- Payoff: the chosen family widens to include him / her / them\n\n### Small-Town Secrets\n- Something in the past (hers, his, the town's) that affects the present\n- Discovery threatens everything\n- Truth comes out; it doesn't destroy them\n- Payoff: honesty allows real connection\n\n---\n\n## 🏡 TIER 2 — FORCED PROXIMITY\n\n*Pick ONE. This is what creates scenes the reader bought the book for.*\n\n### Universal Contemporary Proximity\n- Neighbors (next door, across the hall, shared duplex)\n- Shared Workspace (renovating together, co-running an inn / bakery / business)\n- Inheritance with Strings (one or both inherited the building / land / company)\n- Stuck Together by Circumstance (snowstorm, broken-down car, family event)\n- Co-Parenting by Crisis (helping with the kid in a pinch)\n- Roommates by Necessity (rent crisis, family obligation, post-disaster)\n- Festival / Event Co-Hosting (the town festival, the wedding, the charity gala)\n- Renovation / Restoration (the historic home, the family business, the lighthouse)\n\n### Small-Town-Specific\n- Diner / Coffee Shop Regulars (their seats are next to each other)\n- Town Council / Committee (forced collaboration on town matters)\n- Adjacent Businesses (her bakery next to his hardware store)\n- Neighbors on the Same Block (community awareness baked in)\n\n### Billionaire-Specific\n- Penthouse Neighbors (or shared building with one elevator)\n- Private Jet / Yacht (rich-people trapped proximity)\n- Estate Renovation (she's the contractor / interior designer / curator)\n- Boardroom Crisis (she's the lawyer / consultant who saves his deal)\n\n### Sloane / Safe Harbor-Specific\n- Coastal Inn (running it together, inheriting it, restoring it)\n- Ferry Commute (Cape Elizabeth to Portland regulars)\n- Beachside Cottage (rental mix-up, family share house)\n- Local Business Crisis (the harbor, the lighthouse, the bookshop)\n\n---\n\n## 🏡 TIER 3 — PERSONALITY DYNAMIC\n\n*Pick ONE. This fuels emotional connection and tension.*\n\n### Classic Contemporary Romance\n- Grumpy x Sunshine\n- Guarded x Hopeful\n- Workaholic x Life-Enjoyer\n- Practical x Dreamer\n- Cynic x Believer\n- Returned Home x Never Left\n- Big-City Polish x Small-Town Grounded\n- Single Parent x Career-Focused\n- Loner x Community-Anchored\n- Wounded x Healing\n\n### Emotionally Honest Pairings\n- Both Burned, Cautiously Trying Again\n- Best Friend's Sibling (years of unspoken)\n- Adult Lives Already Built (no fixing the other; just adding)\n- Found Family Already in Place (he joins it / she joins it)\n\n### Avoid for CRC / Sloane\n- Pure rom-com banter as the engine (that's Sage's lane)\n- Dark alpha posturing (that's Moxie's lane)\n- Power-imbalance-as-fantasy (wealth complicates, never controls)\n- Insta-attraction without emotional foundation\n- Heroines who need rescuing from their own lives\n\n---\n\n## 🏡 TIER 4 — SECRET / COMPLICATION\n\n*Pick ONE. This drives Act 3 breaking point.*\n\n### External Forces\n- Career Move Forced Choice (the city offer, the relocation, the promotion)\n- Family Pressure (parents, siblings, ex-in-laws — complicated, not evil)\n- The Ex Returns (with intent — but not as villain without cause)\n- Inheritance Twist (the will reading complicates everything)\n- Town Decision Pending (sale of the inn, closing of the business, vote on development)\n- Sale / Buyout / Merger (his company, her family business, the building)\n\n### Identity & Status\n- Hidden Wealth Reveal (the gradual unspooling)\n- Past Relationship Surfaces (his ex, her ex, the unresolved chapter)\n- Estranged Family Member Returns (parent, sibling, child)\n- Public Visibility Crisis (he's famous, she's a private person — or vice versa)\n- Career Crisis (he loses everything, she's offered everything)\n\n### Emotional Stakes\n- Fear of Being Used (for money, status, family connection)\n- \"Too Much\" or \"Not Enough\" Belief (genre staple — must resolve)\n- Career vs. Love Forced Choice (false binary that becomes real)\n- Past Heartbreak Haunting Current Choices\n- Belief That She Can't Stay (she always leaves)\n- Belief That He Can't Be Loved (he's been alone too long)\n\n### CRC / Sloane-Specific Complications\n- Family Business in Crisis (Connie's small-town lane)\n- Custody / Parenting Complication (single parent lane)\n- Coastal Storm / Disaster (Sloane / Safe Harbor)\n- Found Family Member in Crisis (illness, loss, transition)\n- Renovation / Restoration Setback (the project that brings them together also threatens it)\n\n---\n\n## FMC TROPE CLUSTERS\n\nCRC and Sloane FMCs are competent, emotionally honest, and in charge of their own lives. Love expands their world; it does not rescue them.\n\n### Core Archetypes\n- Returning Daughter\n- Reluctant Inheritor\n- Single Parent Doing the Damn Thing\n- Small Business Owner (bakery, bookshop, inn, design studio)\n- Burned-Out Corporate Refugee\n- Quiet Competent (people underestimate her, she lets them)\n- Steady Hand of the Community\n- Plus-Size FMC Without Apology (Sloane lane)\n- Queer Adult Building Family (Sloane lane)\n\n### Emotionally Honest Traits\n- Says What She Means (eventually, after she's processed it)\n- Loyal — Once Earned, Total\n- Notices What Everyone Else Misses\n- Cries in Private; Shows Up Anyway in Public\n- Forgives but Doesn't Forget\n- Grew Up; Doesn't Romanticize Her Past\n- Has a Best Friend Who Will Tell Her the Truth\n\n### Career / Lifestyle\n- Small Business Owner\n- Creative Professional (writer, artist, designer, photographer)\n- Healthcare / Education / Service (grounded, real)\n- Family Business Caretaker\n- Recently Returned After Years Away\n- Career Pivot in Progress\n- Caretaker / Caregiver Carrying Weight\n\n### Emotional Arcs\n- Guarded but Hopeful\n- Afraid of Needing Someone (or Being Needed)\n- Rebuilding After Loss / Divorce / Breakup\n- Learning to Stay\n- Doesn't Think She's \"Enough\" (resolves)\n- Believes Love Is Inconvenient (resolves)\n- Carrying Grief She Hasn't Named\n\n---\n\n## MMC TROPE CLUSTERS\n\nCRC and Sloane MMCs are grounded, devoted, and steady. They EARN her — they don't claim her.\n\n### Core Archetypes\n- The Hometown Hero (firefighter, contractor, doctor, teacher, vet)\n- The Returning Son (came back after years away)\n- The Quiet Billionaire (wealth that doesn't perform itself)\n- The Single Dad Doing His Best\n- The Widower Slowly Rebuilding\n- The Estranged Brother / Cousin / Heir\n- The City Outsider Falling for the Town\n- The Found-Family Patriarch / Matriarch (Sloane lane)\n\n### Earning-Through-Action Traits\n- Shows Up Consistently (the genre's love language)\n- Fixes the Thing Without Being Asked\n- Remembers What She Said Three Weeks Ago\n- Listens (actually listens — not waiting to talk)\n- Holds the Line on What Matters Even When It Costs Him\n- Quietly Generous (not flashy)\n- Has His Own Best Friend Who Calls Him On His Stuff\n- Devoted to His People (kid, parent, sibling, dog)\n\n### Hard Edges (Earn-Side, Not Dark)\n- He's not a \"fixer\" of HER — he's a partner\n- He has his own stuff he hasn't dealt with\n- His wealth (if billionaire lane) complicates rather than rescues\n- His past relationship taught him something — or it didn't, and that's the arc\n\n### Emotional Arcs\n- From Closed Off to Vulnerable (with HER specifically)\n- From \"I Don't Need Anyone\" to \"I Need Her\"\n- From Guarding Old Pain to Naming It\n- From Flashy to Grounded (billionaire lane resolves toward this)\n- From Bachelor / Widower to Partner\n\n---\n\n## TROPE COMBINATIONS THAT WORK\n\n| Primary Trope (Tier 1) | Pairs Especially Well With |\n|---|---|\n| Second Chance | Returning Home, Small-Town Secrets |\n| Returning Home | Second Chance, Family Business Crisis |\n| Single Parent | Grumpy-Sunshine, Hidden Wealth |\n| Billionaire Next Door | Opposites Attract, Forced Proximity |\n| Found Family (Sloane) | Coastal Setting, Adult-Life-Already-Built |\n| Small-Town Secrets | Returning Home, The Ex Returns |\n\n---\n\n## TROPES TO HANDLE CAREFULLY\n\n### The Ex\n- Not a villain without cause\n- Shows growth, not just contrast\n- Don't demonize to make hero look better — can be decent but wrong\n\n### Class / Wealth Differences\n- Don't condescend to either world\n- Both have value; money doesn't solve real problems\n- Neither world is inherently better\n\n### Family Pressure\n- Families can be complicated without being evil\n- Work toward understanding, not just overcoming\n- Found family AND biological family can coexist\n\n### Secret Baby\n- Handle with care — can feel manipulative\n- Must address why she kept the secret with real reasons\n- His reaction must be earned through emotional truth\n- The child is never just a plot device\n\n---\n\n## HARD NO TROPES (NEVER USE)\n\n| Trope | Why Not |\n|---|---|\n| Hero saves her from poverty | She's not helpless |\n| Makeover makes her worthy | She was worthy before |\n| Big city is evil / soulless | Both worlds have value |\n| Small town is backwards | Respecting her world |\n| Love triangle with real competition | He's it |\n| Cheating | Nope |\n| Heroine as damsel | She fixes her own life |\n| Billionaire arrogance played as hot | Arrogance must be humbled, not rewarded |\n| Found family as decoration (Sloane lane) | The community has names, scenes, and weight |\n| Plus-size body as obstacle (Sloane lane) | She's already at home in her body |\n| Tangled sheets / slick folds / purple prose | CPH universal |\n| Banned names from `banned-list.md` | Always |\n\n---\n\n## THE CRC / SLOANE WISH FULFILLMENT\n\nEvery trope choice should feed at least one of these core fantasies:\n\n- A love that grows from **real connection** — not just attraction\n- A hero who **EARNS her** through showing up, consistently\n- A **community that welcomes them** — found family, belonging\n- A place that feels like **home** — cozy, safe, worth staying for\n- A heroine **in control of her life** — love enhances, doesn't rescue\n- **Warmth and humor** — feel-good without being saccharine\n- The promise that **good people find each other** — and it works out\n- **Adult-life-already-built** romance — past first-time milestones, into chosen-life territory (Sloane lane)\n\nIf a trope doesn't feed at least one of these, question why it's in the book.\n\n---\n\n## TROPE EXECUTION RULES\n\n### The Three-Beat Rule\nEvery trope should have at least three beats:\n1. **Introduction** — the trope is established\n2. **Complication** — the trope creates conflict\n3. **Resolution** — the trope pays off\n\n### Earn the Payoff\n- Setup must match payoff weight\n- Don't abandon tropes mid-book\n- Every trope promise must be kept\n- Reader satisfaction comes from proper resolution\n\n### Fresh Angles Required\n- Unexpected character reactions\n- Trope subversions (grumpy heroine, sunshine hero)\n- Complications specific to THESE characters\n- Emotional truth that feels new\n- Jessica's voice making it different\n\n---\n\n## TROPE CHECKLIST\n\nBefore locking the trope stack, verify:\n\n- [ ] Tier 1 / 2 / 3 / 4 picks chosen — one each\n- [ ] Total tropes in stack ≤ 5\n- [ ] Stack feeds at least one Wish Fulfillment fantasy\n- [ ] No Hard No tropes present\n- [ ] FMC has agency built into chosen tropes\n- [ ] MMC EARNS her — through action, not declaration\n- [ ] Community is integral to the chosen tropes\n- [ ] Stack works with the Story Promise without contradicting it\n- [ ] Any combination flagged in \"Pairs Especially Well With\" — bonus\n- [ ] No banned character names in any trope examples used\n- [ ] If billionaire lane: wealth complicates, never rescues\n- [ ] If Sloane / Safe Harbor lane: found family / rep is built in, not stapled on\n"},"romantic-suspense":{"id":"romantic-suspense","label":"Romantic Suspense","short":"Rom. Suspense","desc":"A real threat and a real romance, braided. Danger drives proximity.","romance":true,"primaryPens":"Constance Ruth Clark (RS lane — *Wild Country Hearts*, *Model Behavior*, etc.)","targetLine":"70,000–85,000 words | 24–30 chapters | Dual POV preferred (both leads + occasional threat POV)","words":[70000,85000],"chapters":[24,30],"pov":"Dual POV preferred (both leads + occasional threat POV)","heatLine":"🌶️🌶️🌶️🌶️–🌶️🌶️🌶️🌶️🌶️ (4–5/5) — open door, explicit, but only when story earns it (Connie heat rules apply)","outlinePrompt":"You are a professional romantic suspense outliner specializing in dual-arc structure (romance + threat), escalating danger, and grounded character work.\n\nTASK: Create a complete chapter outline for a novel using the Premise and Codex provided in the Project files. Output as [Book Title]_Outline.md.\n\nTARGET: 70,000–85,000 words | 24–30 chapters | Dual POV preferred (FMC + MMC alternating; occasional brief threat POV permissible)\n\n---\n\nSTRUCTURE\n\nRomantic suspense runs on TWO SIMULTANEOUS ARCS that must climax together:\n- **Romance arc** — leads circle, bond, fall, rupture, claim\n- **Threat arc** — danger introduced, escalates, false leads, true threat revealed, confrontation\n\nEach chapter must serve at least one arc (often both).\n\nACT 1 — INCIDENT & INTRODUCTION (0–25%): SHE'S IN DANGER (OR IT'S COMING); HE ENTERS HER WORLD\n- **CHAPTER 1 OPENS ON A HOOK — THE LEAH GATE.** The hook is the threat already in motion: the body, the break-in, the stalker letter, the missing person, the witness running, the sabotage at the ranch or shoot or business — danger on the page before anything else. Open mid-incident. NEVER open on telling (narrator explaining who she is or her work or her past), NEVER on reminiscing or backstory, NEVER on a calm \"ordinary day\" before the danger hits, NEVER on weather, scenery, or history. ACTION and SHOWING in the first lines — her competence revealed through how she meets the threat. THE BAR: would a hostile critic (Leah) read past the first two paragraphs? If the open is slow, backward-looking, or calm, build a harder hook. Write to clear the bar; do not ease in.\n- Inciting incident establishes the THREAT (the body, the break-in, the stalker letter, the missing person, the witness, the runaway, the sabotage at the ranch / shoot / business)\n- FMC's voice: competent, observant, not in denial about the danger\n- First contact with MMC — friction, recognition, professional necessity (he's the sheriff, the bodyguard, the investigator, the agent assigned, the brother of the victim, the rancher next door who sees something)\n- Establish the threat: real, named OR mysterious-but-real, with a body / evidence / witness\n- Establish stakes: her safety, someone she loves, her livelihood, her freedom\n- Community is present — small town, ranch country, modeling industry, family business — and she is connected to it\n- End of Act 1: her life is unsafe; he is in it; she cannot solve this alone\n\nACT 2A — INVESTIGATION + ATTRACTION (25–50%): TWO ARCS BUILD TOGETHER\n- The investigation / threat arc develops — they follow leads, interview, discover, uncover, narrow the field\n- Forced proximity through the threat — safe house, his presence at her property, joint travel, undercover operation\n- Romance arc builds in PARALLEL — banter under tension, awareness sharpening when adrenaline drops\n- First near-kiss or charged moment (target Ch 8–12) — interrupted by danger, often\n- False lead introduced — they pursue, it dead-ends or pivots\n- Each one starts seeing the OTHER — past initial assumptions\n- Side characters carry information AND danger — anyone could be involved\n- Midpoint (~50%): a major event that escalates BOTH arcs simultaneously — a near-miss attack, a critical lead, a revealed secret about her past or his\n\nACT 2B — DEEPENING DANGER + DEEPENING BOND (50–75%): STAKES UP, INTIMACY EARNED\n- Both POVs know they're falling — they cannot afford the distraction, they fall anyway\n- Threat tightens — escalation directly targets her, or someone close\n- First intimacy scene anchors here (target Ch 14–18, 50–65%) — voice-forward, character-specific, heat earned through emotional and physical groundwork; Connie heat rules apply (\"If I cut this scene, does the book lose something?\")\n- Investigation pivots — a major reveal that recasts the threat (the suspect they trusted, the past they didn't see, the connection they missed)\n- Vulnerability deepens — he tells her something he doesn't tell anyone, she lets him see what she actually wants\n- Setup for the breaking point — the threat closes in, a betrayal seeded, a decision forced\n\nACT 3A — RUPTURE + IDENTIFICATION (75–88%): WHO DID IT, WHO STOPS IT\n- The blow lands — but in CRC RS lane, the romantic rupture comes from THE THREAT, not cruelty between leads\n- Sources of rupture: he sends her away for safety; she sees him do something dark and misreads it; the threat takes someone close; a betrayal turns out to be self-protection; a forced choice between his job and her safety\n- Threat arc reveals the TRUE antagonist — through evidence, confrontation, near-miss, or the antagonist's own escalation\n- One or both retreats — physically (he leaves, she goes underground) or emotionally (the withdrawal that looks like rejection)\n- Dark moment is brief — 1–2 chapters — and tone stays warm-with-edge even in rupture\n- The misunderstanding clarifies through evidence, action, or third-party intervention\n\nACT 3B — CONFRONTATION + DECLARATION (88–98%): THE CHASE, THE TAKE-DOWN, THE CHOOSING\n- Final confrontation with the antagonist — physical, dangerous, costly\n- One or both makes a vulnerable, costly gesture during or after\n- Both arcs climax SIMULTANEOUSLY — the threat is neutralized AND the love is named\n- Conflict resolves through action AND honest conversation\n- The choice is concrete — she stays, he transfers / takes the job / sells the agency / quits the firm; they merge their lives\n- Community / professional witnesses — the case closed, the relationship public\n\nRESOLUTION — EARNED HEA (98–100%): WARM, ROOTED, SETTLED\n- Aftermath of the case — the wrap-up, the recovery, the witness statements\n- Domestic scene — the porch, the kitchen, the quiet morning after\n- Optional epilogue — months or a year later, low stakes, high charm\n- HEA is grounded — her safety is real; their bond is solid; the world is okay again\n\n---\n\nCHAPTER FORMAT\n\nFor each chapter provide:\n\n### Chapter [#] — [POV]\n- **Goal:** [what this POV is trying to accomplish]\n- **Conflict:** [internal, external, or threat-driven]\n- **Outcome:** [how the chapter changes the situation on EITHER OR BOTH arcs]\n- **Arc(s):** [Romance / Threat / Both] — explicit per chapter\n\n**Beats (5 bullets max):**\n- [Bullet 1 — opening beat, in action]\n- [Bullet 2]\n- [Bullet 3 — midpoint shift]\n- [Bullet 4]\n- [Bullet 5 — ending HOOK]\n\n**Required per chapter:**\n- At least one beat that serves Romance OR Threat arc (most chapters serve BOTH)\n- Stakes visible (emotional, physical, professional)\n- Forward momentum on at least one arc\n- Ending HOOK — never resolution, never reflection, never soft landing\n\n---\n\nINCLUDE WITH THE OUTLINE\n\n## Threat Arc Map\nTrack the suspense spine across the book:\n- Inciting incident (Ch 1) — what kicks it off\n- First false lead (Ch ?–?)\n- Midpoint escalation (Ch ?, ~50%) — the near-miss / critical lead / pivot\n- Pivot reveal (Ch ?–?, ~65%) — what they got wrong about the threat\n- Antagonist identified (Ch ?–?, ~80%)\n- Final confrontation (Ch ?, Act 3B)\n- Resolution / wrap (final 2 chapters)\n\n## Romance Arc Map\n- First touch / charged moment (Ch ?)\n- First conversation that matters (Ch ?)\n- First near-kiss (Ch 8–12)\n- First kiss (target Ch 12–16)\n- First intimacy (target Ch 14–18, 50–65% — only if story earns it)\n- Vulnerability reveal / \"I see you\" moment (Ch ?)\n- Dark moment (target ~78–82%)\n- Declaration (target ~92%)\n- HEA (final 2–3 chapters)\n\n## Heat Map\n- Heat level: 4–5/5 default — open door when scenes appear\n- Heat scenes appear ONLY when the story earns them — Connie heat rules apply\n- Apply the test: \"If I cut this scene, does the book lose something?\"\n- Heat scenes often anchor in Act 2B when the danger has heightened the bond\n\n## Suspect / Lead Map\nList the people and the leads:\n- Suspect 1 (introduction, evidence for / against, reveal)\n- Suspect 2 (introduction, evidence for / against, reveal)\n- Suspect 3 / Real antagonist (introduction, evidence hidden until reveal, reveal moment)\n- The dead end leads (where they go nowhere)\n- The breadcrumb the reader gets but the protagonists don't see yet\n\n---\n\nREQUIREMENTS (NON-NEGOTIABLE)\n\n- BOTH arcs must climax together — the threat resolves and the romance is named in the same act\n- Chapter 1 clears the Leah Gate — open on a threat-in-motion hook (see Act 1); never telling, reminiscing, a calm \"ordinary day,\" or weather/history to open\n- FMC is competent — never rescued from her own life as the central engine\n- Hero EARNS her — through showing up, consistently, in concrete ways (and through saving her when she actually needs it, and accepting when she saves herself)\n- Threat is real, named, and escalating — not vague menace\n- Romance rupture comes from THE THREAT, not cruelty between leads\n- HEA mandatory — both arcs resolved\n- Single POV per chapter; alternating dual POV preferred; occasional brief threat POV permissible (use sparingly)\n- Heat scenes ONLY when the story earns them (Connie heat rules)\n- Dark moment 1–2 chapters max\n- Period / setting consistent — small town, ranch country, modeling industry, etc.\n- No banned names (Chen, Lucian, Marcus, Emma, etc. per `banned-list.md`)\n- No tangled sheets, no slick folds, no purple prose (CPH universal)\n\n---\n\nCONSTANCE RUTH CLARK / RS SPECIFIC CHECKS\n\nBefore outputting the outline, verify:\n\n- [ ] BOTH arcs are tracked — every chapter serves at least one\n- [ ] Threat arc is concrete — named antagonist (mysterious or revealed) with specific actions / motives\n- [ ] At least one false lead and one true lead before the reveal\n- [ ] Midpoint escalates BOTH arcs simultaneously\n- [ ] Pivot reveal recasts the threat in Act 2B\n- [ ] FMC is competent at her own life — she may need help, she is not helpless\n- [ ] Hero is grounded; not flashy alpha posturing (Connie's universal rule)\n- [ ] Setting (small town, ranch country, modeling industry, etc.) is named, specific, and present\n- [ ] Community is present — neighbors, family, professionals — and integrated into the threat AND the romance\n- [ ] Heat scenes (if present) feel earned through emotional groundwork AND through danger heightening the bond\n- [ ] Romantic rupture comes from the threat, not cruelty between leads\n- [ ] No scenes drift into rom-com tone (Sage's lane) or dark mafia tone (Moxie's lane) — recalibrate if drift detected\n- [ ] No banned names\n\nOUTPUT: Save as [Book Title]_Outline.md in Project files.","outlineRefinements":[{"label":"Threat arc invisible","text":"The danger is named in Ch 1 but stops driving the plot by Ch [X]. Re-outline so the threat continues to escalate, false lead, pivot, and confront across the book."},{"label":"Romance arc invisible","text":"By Ch [X-Y] the danger is the only engine — the romance has stopped progressing. Add at least one romance beat per chapter that builds the bond."},{"label":"Arcs don't climax together","text":"The threat resolves in Ch [X], but the romance doesn't land until Ch [Y]. Re-outline so both climax in the same act, ideally same 2–3 chapter span."},{"label":"No false lead","text":"The investigation goes straight to the right answer. Add at least one credible false lead in Act 2 that costs them time and recasts the danger."},{"label":"FMC reads passive","text":"She's being rescued repeatedly. Re-outline so she contributes to the investigation OR the rescue OR the confrontation in concrete ways."},{"label":"Hero too flashy","text":"By Ch [X] he's reading as 'alpha hero personality.' Recalibrate to grounded competence — what he DOES, not what he announces."},{"label":"Dark moment is the threat AND the romance","text":"Both arcs broke in the same chapter and both are stuck. Separate the beats — the romance rupture and the threat escalation can land in adjacent chapters but should not muddle each other."},{"label":"Heat scenes don't serve the arcs","text":"Ch [X] heat scene reads as decoration. Either cut it OR ground it in the danger heightening the bond OR cut and replace with an emotional beat that serves Act 2B."}],"postChecks":["Chapter count sanity — 24–30. Under 24 = the dual arcs cramp. Over 30 = bloat or duology.","Both-arc presence — Spot-check: does every chapter serve at least one arc? If a chapter is pure transition with no arc movement, recalibrate.","Threat arc structure — Inciting incident, at least one false lead, midpoint escalation, pivot reveal, identification, confrontation. If any of these is missing, the suspense spine is incomplete.","Romance arc heat curve — First near-kiss 30–45%, first kiss 40–55%, first intimacy 50–65%. Earlier rushes; later drifts.","Both-climax check — The threat confrontation and romantic declaration should land in the same act (Act 3B). If the threat resolves long before or after the romance, the dual-arc structure has failed.","Heat scene earn-rate — Cuttable test on each heat scene. If the book loses NOTHING by cutting it, cut it.","Dark moment length — 1–2 chapters. Tone stays warm-with-edge.","Hero check — Grounded competence; not flashy alpha. Connie's universal rule."],"tropes":{"tiers":[{"name":"TIER 1 — CORE THREAT + ROMANCE PAIRING","intro":"Pick ONE. This defines the central engine — both who she is and what threatens her.","cards":[{"name":"Cop / Sheriff / Investigator x Civilian Victim or Witness","bullets":["He's the badge; she's the victim, witness, or person the case has pulled in","Professional ethics complicate the attraction","His investigation IS her safety; her story IS his case","Payoff: case closes, he chooses her, the boundary becomes a bridge"]},{"name":"Bodyguard / Protector x Reluctant Protectee","bullets":["He's been hired (or has assigned himself) to keep her alive","She doesn't think she needs protection (until she does)","Forced proximity through threat is the engine","Payoff: he's not her bodyguard anymore; he's hers"]},{"name":"Reformed Bad Boy x Endangered Woman","bullets":["He has a past — military, intelligence, ex-criminal, ex-anything-rough","She is in danger from a world he understands and she does not","His skills are exactly what she needs","Payoff: his past becomes her safety; he chooses the new life"]},{"name":"Investigator (Private) x Client Becomes More","bullets":["She hires him (or he's been brought in by family / employer / authorities)","Professional engagement deepens as the case does","Lines between client and lover blur dangerously","Payoff: he closes her case AND opens his life"]},{"name":"Witness Protection / On the Run","bullets":["She has seen something; he is responsible for keeping her alive","A new identity, a new town, a new pretense","Forced proximity, fake relationship as cover, deepening reality","Payoff: when the threat resolves, she chooses him AND her real life"]},{"name":"Returning Local x The Threat From the Past","bullets":["She comes home (small town, ranch country, family business) and the past surfaces","Local hero / sheriff / rancher / EMT is in the path of th
