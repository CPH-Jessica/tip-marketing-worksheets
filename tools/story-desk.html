h real competition | He's it |\n| Cheating | Nope |\n| Banned names from `banned-list.md` | Always |\n\n---\n\n","THE MARJORIE ADAMS WISH FULFILLMENT":"\nEvery trope choice should feed at least one of these core fantasies:\n\n- **Wit recognized as compatibility** — being SEEN by someone equally sharp\n- **Restraint as eroticism** — the longing, the unsaid, the held gaze\n- **Society as obstacle and mirror** — the world watches, and the love survives\n- **Honor demonstrated through action** — the hero who EARNS her\n- **A heroine who chooses within her constraints** — agency in a corseted world\n- **The Austen happy ending** — inevitable yet surprising\n- **Found family woven through period custom** — the eccentric aunt, the loyal friend, the reformed sibling\n- **The slow burn that resolves into a perfect declaration**\n\nIf a trope doesn't feed at least one of these, question why it's in the book.\n\n---\n\n","TROPE EXECUTION RULES":"\n### Tropes work when:\n1. **Period correctness** — the trope makes sense within Regency rules\n2. **Character justifies the trope** — the obstacle emerges from who they are\n3. **Wit is the engine** — verbal sparring carries the romance\n4. **Restraint INTENSIFIES the heat** — the unsaid weighs more than the said\n5. **Honor demonstrated** — the hero earns through behavior, not declaration\n6. **Voice carries** — Austen-style irony in narration, period dialogue, em-dash asides\n\n### Common mistakes:\n- Modern vocabulary in dialogue or narration\n- Heat above kiss-level (genre killer)\n- Heroines who are passive prizes\n- Heroes who are cruel rather than reserved\n- Society treated as villain rather than mirror\n- Slow burn collapsing too fast\n- Declaration without earned action\n\n---\n\n","TROPE CHECKLIST":"\nBefore locking the trope stack, verify:\n\n- [ ] Tier 1 / 2 / 3 / 4 picks chosen — one each\n- [ ] Total tropes in stack ≤ 5\n- [ ] Stack feeds at least one Wish Fulfillment fantasy\n- [ ] No Hard No tropes present\n- [ ] FMC has agency within period constraints\n- [ ] MMC's honor will be demonstrated through action\n- [ ] All chosen obstacles are HISTORICALLY PLAUSIBLE\n- [ ] Heat will not exceed kiss-level\n- [ ] Stack works with the Story Promise without contradicting it\n- [ ] Any combination flagged in \"Pairs Especially Well With\" — bonus\n- [ ] No banned character names in any trope examples used\n\n"},"primary":"Marjorie Adams (heat 1-2)","max":5},"tropesDoc":"# Regency Rom-Com Tropes Master List\n\n**Primary pen name:** Marjorie Adams (heat 1-2)\n**Secondary use:** None. Marjorie owns this lane. Other pen names should not borrow Regency tropes — period-correct execution is the genre.\n\n---\n\n## THE TROPE PICKER SYSTEM\n\nPick ONE option from each tier. Regency runs on tightly observed historical convention. Trope discipline keeps the period intact.\n\n**Max trope count per book: 5 total.**\n\n---\n\n## 🪞 TIER 1 — CORE COURTSHIP ENGINE\n\n*Pick ONE. This defines the romance spine.*\n\n### Marriage of Convenience\n- An arrangement of fortune, title, or family obligation\n- Neither party desired this; both must comply\n- Obligation becomes affection, then choice\n- Payoff: they choose each other beyond the contract\n\n### Rake Reformation\n- He has a reputation (deserved or otherwise)\n- She is the woman who will not be charmed\n- His genuine character is revealed through honor, not declaration\n- Payoff: the rake reforms FOR her, but not BY her — his choice\n\n### Wallflower Transformation\n- She is overlooked by society but not by him\n- His attention reveals what she has been\n- The transformation is recognition, not makeover\n- Payoff: she was always worthy; now society sees it\n\n### Second Chance Romance\n- They knew each other before — engagement broken, separation forced, misunderstanding lasted years\n- Maturity returns them to one another\n- Old wounds named and addressed\n- Payoff: this time, they are ready\n\n### Scandal Forces Marriage\n- Compromised in society's view (real or perceived)\n- Marriage becomes social necessity\n- The forced match becomes desired\n- Payoff: scandal becomes love\n\n### Mistaken Identity / Mistaken Engagement\n- She believes he is engaged; he believes she has refused him\n- Letters miscarried, gossip misread, intentions misjudged\n- The truth emerges through honest conversation\n- Payoff: the misunderstanding clarifies; the love was always there\n\n### Friends-to-Lovers (Across Seasons)\n- Childhood friends, neighboring estates, brother's best friend\n- Affection long present, romantic awareness new\n- The shift is recognition of what was always there\n- Payoff: love discovered in the familiar\n\n---\n\n## 🪞 TIER 2 — FORCED PROXIMITY\n\n*Pick ONE. Period-correct settings only.*\n\n### Universal Regency Proximity\n- House Party at the Country Estate\n- Shared Carriage Journey\n- Mutual Mourning Period in the Same Household\n- London Season at the Same Townhouse / Address\n- Stranded by Storm at the Inn / Vicarage / Country House\n- Garden Party / Picnic Where Convention Forces Pairing\n- Charity Bazaar / Local Festival Co-Hosting\n- Inheritance That Binds Them to the Same Property\n- Guardianship That Places Her in His Care\n- Ball Where Dance Card Reveals Itself\n\n### Specifically Comedic\n- The Eccentric Aunt's Matchmaking\n- The Disastrous Picnic\n- The Misdelivered Letter\n- The Wrong Carriage\n- The Cake Bazaar Disaster\n- The Country Dance That Goes Wrong\n- The Dowager's Strategic Seating\n\n---\n\n## 🪞 TIER 3 — PERSONALITY DYNAMIC\n\n*Pick ONE. Drives banter and longing.*\n\n### Classic Regency Pairings\n- Witty Heroine x Reformed Rake\n- Quiet Bookish Heroine x Honorable Hero\n- Bluestocking x Aristocrat\n- Practical Heroine x Romantic Hero\n- Fierce Spinster x Patient Suitor\n- Outspoken American x Reserved Englishman (or vice versa)\n- Country Miss x London Gentleman\n- Reluctant Debutante x Determined Suitor\n- Sharp-Tongued Lady x Equally Sharp-Tongued Gentleman\n\n### Voice-Forward Heroine Traits\n- Wit Sharper Than Her Embroidery\n- Reads More Than Society Approves\n- Observes Everything, Says Half of What She Notices\n- Refuses to Accept the First Offer\n- Defends the Wallflowers\n- Has an Unsuitable Friend (the truth-teller)\n- Em-Dash Internal Asides (Jessica's signature applies in narration)\n\n### Hero Voice-Markers (Marjorie-Specific)\n- Formal Phrasing When Flustered (the formality is the tell)\n- Declarations Rather Than Questions When It Matters\n- His Silence Carries More Than Most Speeches\n- Honor Demonstrated, Never Declared\n- Pet Names Used Sparingly and With Earned Weight (a name reduction — \"my dear\" — is a moment)\n\n### Avoid for Marjorie\n- Modern emotional vocabulary (\"I'm processing this\")\n- Contemporary feminism dialogue (acknowledge limited choices, don't preach)\n- Heat above kiss-level\n- Heroes who are cruel rather than reserved\n- Heroines who are passive prizes\n- Sustained gothic dread (wrong subgenre)\n\n---\n\n## 🪞 TIER 4 — OBSTACLE / SECRET\n\n*Pick ONE. Drives Act 3 breaking point.*\n\n### Historically Plausible Obstacles\n- Entail (property must pass to a male heir)\n- Marriage Settlements Not Yet Agreed\n- Family Opposition (rank, fortune, history)\n- Prior Betrothal Contract\n- Guardianship Issue\n- Fortune Hunter (his rival or her false suitor)\n- Mourning Period Preventing Marriage\n- Scandal Threatening Reputation\n\n### Identity & Status\n- Hidden Inheritance / Disguised Rank\n- Estranged Family Member Returns\n- Misjudged Reputation (rake who is not, virtuous lady who is misread)\n- Secret Past (illegitimate birth, ruinous mother, unsuitable connection)\n- The Letter That Reveals Everything\n\n### Emotional Stakes\n- \"I Am Not Suitable\" Belief (resolves)\n- \"I Cannot Trust Him\" Belief (resolves through evidence)\n- Family Obligation vs. Personal Happiness\n- Duty to Sister / Younger Daughters / Aging Parent\n- Pride That Refuses to Acknowledge Love (until it cannot any longer)\n\n---\n\n## FMC TROPE CLUSTERS\n\nMarjorie FMCs are intelligent, observant, and constrained by period — but they CHOOSE within those constraints with full agency.\n\n### Core Archetypes\n- The Bluestocking\n- The Reluctant Debutante\n- The Spinster Past Her First Bloom\n- The Country Cousin Brought to Town\n- The American Heiress\n- The Vicar's Daughter\n- The Eldest Sister Carrying the Family\n- The Widowed Lady (young, childless, returning to society)\n- The Wallflower With Sharp Eyes\n- The Country Squire's Daughter\n\n### Wit-Forward Traits\n- Reads Books She Should Not (in society's view)\n- Refuses the First Offer\n- Has Opinions and Voices Them (in private at minimum)\n- Notices What Others Miss\n- Defends Friends Society Has Discarded\n- Cannot Suffer a Fool Politely (and yet must try)\n\n### Lifestyle / Position\n- Limited Fortune (genteel poverty)\n- Comfortable Fortune Without Title\n- Significant Fortune Attracting Fortune Hunters\n- Country-Raised, London-Adjusted\n- London-Raised, Country-Curious\n- Reduced Circumstances After Family Loss\n\n### Emotional Arcs\n- \"I Cannot Marry For Less Than Love\" (resolves)\n- \"I Have Been Misjudged\" (resolves through honor demonstrated)\n- \"I Will Not Be A Burden\" (resolves)\n- \"He Cannot Be What He Seems\" (resolves through evidence)\n- Choosing love over advantageous match\n\n---\n\n## MMC TROPE CLUSTERS\n\nMarjorie MMCs are honorable underneath, even when their reputation suggests otherwise. Reformed by recognition, not by rescue.\n\n### Core Archetypes\n- The Duke (with a reputation he didn't entirely earn)\n- The Earl (responsible for siblings / estate / aging mother)\n- The Viscount (younger son who unexpectedly inherited)\n- The Reformed Rake\n- The Scholar Aristocrat\n- The Soldier Returned\n- The Reserved Younger Brother\n- The Clergyman's Honorable Friend\n- The American Gentleman in London\n\n### Honor-Through-Action Traits\n- Pays His Debts (financial AND social)\n- Defends Her Reputation Even When She Has Refused Him\n- Acknowledges When He Has Been Wrong\n- Treats Servants and Tradesmen With Respect\n- His Word Is His Bond\n- Generous Without Ostentation\n- Carries Family Obligation Without Complaint\n\n### Hard Edges (Period-Appropriate)\n- Pride That Costs Him at the Worst Moment\n- Reputation He Has Not Fully Earned (or has, and is reforming)\n- Family Pressure He Will Not Yield To\n- Old Wound from a Prior Engagement / Betrayal\n\n### Emotional Arcs\n- From Reputation to Honor Demonstrated\n- From Pride to Vulnerability\n- From Family Obligation to Personal Choice\n- From \"I Cannot Marry For Less Than Fortune\" to \"I Cannot Marry For Less Than Her\"\n- From Reserved to Spoken Aloud\n\n---\n\n## TROPE COMBINATIONS THAT WORK\n\n| Primary Trope (Tier 1) | Pairs Especially Well With |\n|---|---|\n| Marriage of Convenience | Family Obligation, Entail |\n| Rake Reformation | Mistaken Identity, Wallflower |\n| Wallflower Transformation | Country House Party, Misjudged Reputation |\n| Second Chance | Returned from War, Family Reconciliation |\n| Scandal Forces Marriage | Compromised at the Country House, Misread Gossip |\n| Mistaken Engagement | Letters Miscarried, Family Interference |\n\n---\n\n## HARD NO TROPES (NEVER USE)\n\n| Trope | Why Not |\n|---|---|\n| Modern emotional vocabulary | Period rupture |\n| Contemporary feminism dialogue (preachy) | Tone rupture |\n| Heat above kiss-level | Wrong heat tier — Marjorie is 1-2/5 closed door |\n| Hero who is cruel rather than reserved | Genre killer |\n| Heroines who are passive prizes | She must choose within period constraints |\n| Anachronistic phrasing or vocabulary | Genre killer |\n| Sustained gothic dread | Wrong subgenre |\n| Love triangle with real competition | He's it |\n| Cheating | Nope |\n| Banned names from `banned-list.md` | Always |\n\n---\n\n## THE MARJORIE ADAMS WISH FULFILLMENT\n\nEvery trope choice should feed at least one of these core fantasies:\n\n- **Wit recognized as compatibility** — being SEEN by someone equally sharp\n- **Restraint as eroticism** — the longing, the unsaid, the held gaze\n- **Society as obstacle and mirror** — the world watches, and the love survives\n- **Honor demonstrated through action** — the hero who EARNS her\n- **A heroine who chooses within her constraints** — agency in a corseted world\n- **The Austen happy ending** — inevitable yet surprising\n- **Found family woven through period custom** — the eccentric aunt, the loyal friend, the reformed sibling\n- **The slow burn that resolves into a perfect declaration**\n\nIf a trope doesn't feed at least one of these, question why it's in the book.\n\n---\n\n## TROPE EXECUTION RULES\n\n### Tropes work when:\n1. **Period correctness** — the trope makes sense within Regency rules\n2. **Character justifies the trope** — the obstacle emerges from who they are\n3. **Wit is the engine** — verbal sparring carries the romance\n4. **Restraint INTENSIFIES the heat** — the unsaid weighs more than the said\n5. **Honor demonstrated** — the hero earns through behavior, not declaration\n6. **Voice carries** — Austen-style irony in narration, period dialogue, em-dash asides\n\n### Common mistakes:\n- Modern vocabulary in dialogue or narration\n- Heat above kiss-level (genre killer)\n- Heroines who are passive prizes\n- Heroes who are cruel rather than reserved\n- Society treated as villain rather than mirror\n- Slow burn collapsing too fast\n- Declaration without earned action\n\n---\n\n## TROPE CHECKLIST\n\nBefore locking the trope stack, verify:\n\n- [ ] Tier 1 / 2 / 3 / 4 picks chosen — one each\n- [ ] Total tropes in stack ≤ 5\n- [ ] Stack feeds at least one Wish Fulfillment fantasy\n- [ ] No Hard No tropes present\n- [ ] FMC has agency within period constraints\n- [ ] MMC's honor will be demonstrated through action\n- [ ] All chosen obstacles are HISTORICALLY PLAUSIBLE\n- [ ] Heat will not exceed kiss-level\n- [ ] Stack works with the Story Promise without contradicting it\n- [ ] Any combination flagged in \"Pairs Especially Well With\" — bonus\n- [ ] No banned character names in any trope examples used\n"},"romcom":{"id":"romcom","label":"Steamy Rom-Com","short":"Rom-Com","desc":"Laugh-out-loud contemporary romance with real stakes and open-door heat.","romance":true,"primaryPens":"Sage Kennedy","targetLine":"55,000–65,000 words | 20–26 chapters | Dual POV","words":[55000,65000],"chapters":[20,26],"pov":"Dual POV","heatLine":"🌶️🌶️🌶️🌶️ (4/5)","outlinePrompt":"You are a professional romantic comedy outliner.\n\nTASK: Create a complete chapter outline for a novel using the Premise and Codex provided in the Project files. Output as [Book Title]_Outline.md.\n\nTARGET: 55,000–65,000 words | 20–26 chapters | Dual POV\n\n---\n\nSTRUCTURE\n\nACT I (0–25%): MEET-CUTE → TROPE LOCK-IN → BANTER ESTABLISHED\n- **CHAPTER 1 OPENS ON A HOOK — THE LEAH GATE.** The hook is comedic collision already in motion and her voice popping from word one: the disaster is unfolding as we land, the meet-cute is already going sideways, she's already in the wrong place at the worst possible moment. Open mid-chaos. NEVER open on telling (narrator explaining who she is or her job or her dating history), NEVER on reminiscing or backstory, NEVER on a calm \"ordinary day\" described as fine before the fun starts, NEVER on weather or scene-setting. ACTION and SHOWING in the first lines — the comedy and the voice carry the open. THE BAR: would a hostile critic (Leah) read past the first two paragraphs? If the open is slow, backward-looking, or a calm warm-up, build a stronger hook. Write to clear the bar; do not ease in.\n- Immediate chemistry; forced proximity or arrangement begins by Chapter 3 at the latest\n- Establish FMC competence and voice, MMC's \"safe alpha\" energy\n- Humor from page one; tone is LIGHT\n- First real banter exchange by Chapter 2\n- First kiss or near-kiss by Chapter 6–8\n- End of Act I: they are STUCK with each other, no easy escape\n\nACT II-A (25–50%): COMEDIC COMPLICATIONS → FALLING → MIDPOINT\n- Trope delivers scene after scene (if fake dating, the fake dating creates scenes; if snowed in, the snow creates scenes)\n- Banter + growing emotional intimacy\n- Side characters reinforce the pairing (meddling, witnessing, commenting)\n- First explicit heat scene around 40–50% if heat 4\n- Midpoint (exactly ~50%): \"this isn't pretend anymore\" — an irreversible emotional or physical shift\n\nACT II-B (50–75%): FEELINGS CAUGHT → EXTERNAL PRESSURE → BRIEF DARK MOMENT\n- Both POVs now know they're falling; neither admits it yet\n- External complication tightens (secret starts unraveling, scandal looms, family arrives)\n- Secondary heat scene(s) with emotional weight — the intimacy changes them\n- Dark moment from FEAR or MISUNDERSTANDING, never from cruelty or betrayal between the leads\n- Dark moment ideally resolves within 1-2 chapters — this is rom-com, not melodrama\n\nACT III (75–100%): GRAND GESTURE → DECLARATION → JOYFUL HEA\n- One or both makes a public/vulnerable move\n- Conflict resolved through communication, not through a third-party rescue\n- HEA is warm, funny, emotionally satisfying\n- Optional epilogue showing the \"life after\" — low stakes, high charm\n\n---\n\nCHAPTER FORMAT\n\nFor each chapter provide:\n\n### Chapter [#] — [POV]\n- **Goal:** [what this POV is trying to accomplish]\n- **Conflict:** [what stands in their way — internal or external]\n- **Outcome:** [how the chapter changes the situation]\n\n**Beats (5 bullets max):**\n- [Bullet 1 — opening beat, in action]\n- [Bullet 2]\n- [Bullet 3 — midpoint shift]\n- [Bullet 4]\n- [Bullet 5 — ending hook]\n\n**Required per chapter:**\n- At least one comedic beat (banter, awkward, absurd)\n- At least one romantic beat (tension, tenderness, awareness)\n- Ending hook (unfinished conversation, immediate problem, forward motion)\n\n---\n\nINCLUDE WITH THE OUTLINE\n\n## Banter Escalation Map\nChart the banter across the book:\n- Ch 1–5: Flirtation disguised as conflict\n- Ch 6–12: Flirtation acknowledged\n- Ch 13–18: Vulnerability under the banter\n- Ch 19–end: Banter as love language\n\n## Romantic Escalation Map\nMap the physical and emotional beats:\n- First touch (Ch ?)\n- First real conversation about something that matters (Ch ?)\n- First kiss (target Ch 6–8)\n- First intimate emotional reveal (Ch ?)\n- First heat scene (target 40–50%)\n- Midpoint shift (exactly ~50%)\n- Second heat scene (target 60–75%)\n- Dark moment (target ~75%)\n- Declaration (target 85–90%)\n- HEA (final 2 chapters)\n\n## Heat Map\n- Heat level: 🌶️🌶️🌶️🌶️ (4/5) default\n- Flag any scene that would land above or below this — calibration matters\n\n---\n\nREQUIREMENTS (NON-NEGOTIABLE)\n\n- Banter in EVERY chapter\n- FMC retains agency throughout (no passivity after intimacy)\n- MMC is emotionally safe, devoted, never cruel\n- Tone stays light even when stakes rise\n- Wealth complicates, never controls\n- Third-act misunderstanding must come from fear or genuine obstacle, NEVER betrayal or cruelty between leads\n- HEA is mandatory — no tragic endings, no ambiguous \"maybes\"\n- POVs alternate cleanly — one POV per chapter, rotating or pattern-based\n- Single chapter = single POV (no head-hopping)\n\n---\n\nSAGE KENNEDY SPECIFIC CHECKS\n\nBefore outputting the outline, verify:\n\n- [ ] The MMC is safe alpha — confident, not controlling\n- [ ] The FMC is competent (even when messy) — never passive\n- [ ] Banter appears in nearly every chapter\n- [ ] The wealth/status dynamic is complication, not power-over-her\n- [ ] No banned names in the outline (cross-check with banned-list.md and sage-kennedy skill)\n- [ ] Holiday or seasonal anchor present if applicable\n- [ ] No scenes would fit better under Moxie or Ruthie (if yes, recalibrate)\n\nOUTPUT: Save as [Book Title]_Outline.md in Project files.","outlineRefinements":[{"label":"Banter needs boost","text":"Several chapters are feeling plot-forward without banter. Re-outline Ch [X-Y] with more comedic beats and banter-carrying scenes."},{"label":"Dark moment too heavy","text":"The dark moment is pulling the tone into melodrama. Shorten to [N] chapters and lean into the FEAR, not the DRAMA."},{"label":"Midpoint soft","text":"The midpoint isn't landing as an irreversible shift. Make Ch [X] the 'this isn't pretend anymore' moment more concrete."},{"label":"Ending rushed","text":"The HEA is landing in the last 2 pages. Spread the declaration and aftermath across 2-3 chapters for full emotional payoff."},{"label":"Tropes not delivering","text":"The [trope name] is named but not showing up in scenes. Weave it through more chapters — where are the fake-dating set pieces?"}],"postChecks":["Chapter count sanity check — 20–26 is the target. Under 20 = rushed. Over 26 = likely bloated or should be a 2-book arc.","POV balance — Rough 50/50 split, or a deliberate lean. Flag if one POV gets drastically more chapters without reason.","Banter density — Spot-check: does every chapter bullet hint at at least one banter or comedy beat?","Heat escalation — First kiss ~Ch 6–8, first heat ~40–50%, second heat 60–75%. If the heat map skews earlier or later, question why.","Dark moment length — 1–2 chapters max. If the dark moment stretches longer, tone has drifted."],"tropes":{"tiers":[{"name":"TIER 1 — CORE ROMANCE ENGINE","intro":"Pick ONE. This defines the story spine.","cards":[{"name":"Billionaire Rom-Com","bullets":["Fake Dating","Secret Billionaire","Boss / Employee (rom-com safe)","Workplace Rivals","Marriage of Convenience","Inheritance with Strings","Billionaire in Disguise","Power Imbalance → Emotional Equalization"]},{"name":"Hockey / Sports","bullets":["Hockey Player x Normal Woman","Team Captain x Journalist","Injured Player x Physical Therapist","Retiring Star x Fresh Start","Rival Team Romance","Fake Girlfriend for the PR Team","Single Dad Player x Nanny","Grumpy Defenseman x Sunshine Trainer"]},{"name":"Royal / Celebrity","bullets":["Royal in Disguise","Prince x Commoner","Celebrity x Normal Person","Scandal-Forced Engagement","Arranged Royal Marriage","Royal Bodyguard x Princess","Celebrity x Handler","Reality Show Romance"]},{"name":"Holiday (seasonal anchor)","bullets":["Christmas Fake Dating","New Year's Kiss Aftermath","Valentine's Wedding Pressure","Summer Resort Romance","Fourth of July Hometown Reunion","Halloween Costume Mix-Up","Thanksgiving \"Bring Home Someone\" Crisis"]}]},{"name":"TIER 2 — FORCED PROXIMITY","intro":"Pick ONE. This creates scenes.","cards":[{"name":"Universal RomCom Proximity","bullets":["Snowed In at the Estate / Cabin / Hotel","Only One Bed","Shared Penthouse / Shared Apartment","Destination Wedding (can't leave the island)","Corporate Retreat / Team-Building Nightmare","Stuck in an Elevator (briefly — longer = thriller)","Road Trip (business or crisis)","Small Town Cover Story","Private Jet / Yacht (rich-people trapped proximity)","Family Event You Can't Escape"]},{"name":"Hockey-Specific","bullets":["Shared Team Flight","Training Camp Cabin","Playoff Road Trip","Recovery Rehab Partnership","Charity Event Co-Hosting"]},{"name":"Holiday-Specific","bullets":["Snowed In for Christmas","Family Lake House for Thanksgiving","New Year's Eve Party Gone Wrong","Summer Share House","Holiday Market Stall Next Door"]}]},{"name":"TIER 3 — PERSONALITY DYNAMIC","intro":"Pick ONE. This fuels banter and tension.","cards":[{"name":"Classic RomCom Gold","bullets":["Grumpy x Sunshine","Sunshine x Sunshine (Chaos Edition)","Ice Queen x Golden Retriever","Alpha Softie x Competent FMC","Sarcastic x Earnest","Uptight x Free Spirit","Workaholic x Life-Enjoyer","Introvert x Extrovert","Control Freak x Chaos Gremlin","Emotionally Avoidant x Emotionally Honest","Type-A x Laid-Back","Overthinker x Calm in Crisis"]},{"name":"Avoid for Sage","bullets":["Dark alpha posturing (wrong pen name)","Dom/sub dynamics (wrong heat tone)","Pure angst pairings (tone must stay light)"]}]},{"name":"TIER 4 — SECRET / COMPLICATION","intro":"Pick ONE. This drives Act III.","cards":[{"name":"Identity & Status","bullets":["Hidden Identity (Secret Billionaire / Celebrity / Royal)","Media Scandal","Family Power Play","Corporate Takeover","Prenup / Contract Clause","Ex with an Agenda","Accidental Viral Moment","Mistaken Identity Spiral"]},{"name":"Emotional Stakes","bullets":["Fear of Being Used (for money / fame)","Believes They're \"Too Much\" or \"Not Enough\"","Career vs. Love Forced Choice","Family Disapproval (grounded, not melodramatic)","Past Heartbreak Haunting Current Choices"]},{"name":"RomCom-Specific Chaos","bullets":["Accidental Lying Spiral","Misheard Conversation","Third-Act Misunderstanding (fear-based, never betrayal)","Well-Meaning Meddler Ruins Everything","Viral Humiliation","Ex Shows Up at the Worst Time"]}]}],"extras":{"THE TROPE PICKER SYSTEM":"\nPick ONE option from each tier. This prevents \"everything-but-the-kitchen-sink\" syndrome and keeps the Story Promise clean.\n\n**Max trope count per book: 5 total.**\n\n---\n\n","FMC TROPE CLUSTERS":"\nSage FMCs are sharp, witty, emotionally honest even when it's awkward.\n\n### Core Archetypes\n- Sunshine Heroine\n- Competent Chaos\n- Reluctant Romantic\n- Overachieving Hot Mess\n- Type-A Softie\n- Sarcastic Sweetheart\n- Former Dreamer, Current Realist\n- Independent to a Fault\n- \"I'm Fine\" (She Is Not Fine)\n\n### Comedy-Forward Traits\n- Says the Wrong Thing at the Worst Time\n- Overthinks Everything\n- Nervous Rambler\n- Accidental Liar\n- Falls First (Internally, Denies It Externally)\n- Socially Awkward but Confident Elsewhere\n- Cannot Lie Convincingly\n- Drunk Truth Teller\n- Prone to Public Embarrassment\n\n### Career / Lifestyle\n- Small Business Owner (bakery, bookstore, etc.)\n- Creative Professional (writer, artist, designer)\n- Overworked Professional\n- Career Woman Learning Balance\n- Burned-Out Corporate Girl\n- Small Town Girl with Big Ideas\n- City Girl in Over Her Head\n- Family Business Caretaker\n\n### Emotional Arcs\n- Guarded but Hopeful\n- Afraid of Needing Someone\n- Rebuilding After a Breakup\n- Learning to Ask for Help\n- Doesn't Think She's \"Enough\"\n- Fiercely Loyal\n- Believes Love Is Inconvenient\n\n---\n\n","MMC TROPE CLUSTERS":"\nSage MMCs are **safe alphas** — confident, devoted, emotionally grounded. NOT dark dominant.\n\n### Core Archetypes\n- Golden Retriever Hero\n- Grumpy with a Soft Center\n- Competent, Not Condescending\n- Emotionally Repressed but Trying\n- Calm in Crisis, Chaos in Love\n- Secretly Romantic\n- Earnest, Not Smooth\n- Protective (Respectfully)\n- Quietly Devoted\n\n### Comedy-Forward Traits\n- Deadpan Humor\n- Dry Sarcasm\n- Accidentally Flirts\n- Doesn't Realize He's Hot\n- Soft Tease, Not Mean\n- Flustered by FMC\n- Terrible Liar\n- Publicly Calm, Privately Panicking\n\n### Career / Status\n- Billionaire Who Hates Being a Billionaire\n- CEO Who Escaped Small Town Roots\n- Inherited Business He Didn't Want\n- Celebrity in Disguise\n- Royal / Prince Playing Normal\n- Workaholic Learning Balance\n- Man With a Reputation He Doesn't Deserve\n- Pro Athlete Hiding a Softer Self\n\n### Emotional Arcs\n- Falls Hard, Falls Quiet\n- Already All In Before He Admits It\n- Protects FMC's Dreams\n- Chooses Her Over Ego\n- Believes He's \"Too Much\" or \"Not Enough\"\n- Shows Love Through Actions\n- Has Never Been Chosen\n- Soft Dom Energy (rom-com safe)\n\n---\n\n","POWER COUPLE PAIRINGS":"\nMix-and-match clusters for instant reader catnip.\n\n### Classic Rom-Com Gold\n- Competent Chaos FMC × Grumpy Softie MMC\n- Sunshine FMC × Deadpan MMC\n- Overthinker FMC × Calm MMC\n- Sarcastic FMC × Earnest MMC\n- Type-A FMC × Laid-Back MMC\n\n### Billionaire Sweet Spot\n- Independent FMC × Secret Soft Billionaire\n- Small Town FMC × City Billionaire in Crisis\n- Career FMC × Man Learning to Slow Down\n\n### Hockey Sweet Spot\n- Nervous Rambler × Deadpan Defenseman\n- Career Woman × Retiring Star\n- Journalist × Team Captain\n\n### Royal / Celebrity Sweet Spot\n- Small Town FMC × Prince Playing Normal\n- Journalist × Celebrity He's Trying to Dodge\n- Event Planner × Scandal-Hit Royal\n\n---\n\n","HEAT LEVEL CALIBRATION":"\n### Default for Sage Kennedy: 🌶️🌶️🌶️ → 🌶️🌶️🌶️🌶️ (3–4/5)\n\n**What works at this level:**\n- Banter during intimacy — the comedy doesn't stop when clothes come off\n- Mutual desire, enthusiastic consent, playful dominance (never fear-based)\n- First kiss around 30–40%\n- First heat scene 50–60%\n- Explicit but playful — laughs welcome mid-scene\n\n**What breaks Sage voice:**\n- Dark alpha posturing\n- Possessive-to-toxic energy\n- Fear-based dominance\n- Purple prose (\"her feminine core throbbed with ancient need\")\n- Power exchange dynamics that cost the FMC her agency\n\n### Heat 1–2 (Sweet Sage — rare, only if Jessica specifies)\n- Longing, near-misses, tension through restraint\n- Closed-door or fade\n- Banter carries the tension\n\n### Heat 3 (Steamy Default)\n- Open door, playful, mutual teasing\n- First kiss is a scene\n- Consummation has emotional weight AND laughs\n- Heroine is an active participant\n\n### Heat 4 (Sage's brand)\n- Explicit with humor intact\n- \"That was extremely hot and also you're ridiculous\"\n- Multiple heat scenes, each advancing the relationship\n- Afterglow banter as character development\n\n### Heat 4+ (Bordering on dark territory — avoid for Sage)\n- If the scene would fit Moxie better, it's wrong for Sage\n- Flag and recalibrate\n\n---\n\n","READER EXPECTATION TAGS":"\nThese aren't tropes but they sell books. Use them in blurbs, keywords, and metadata.\n\n- Low Angst\n- High Banter\n- Feel-Good Romance\n- Laugh-Out-Loud\n- Sweet & Spicy\n- Steamy Rom-Com\n- Cozy Holiday Vibes\n- Comfort Read\n- Strong Female Lead\n- Safe Alpha Hero\n- Guaranteed HEA\n- No Cheating\n- No OW / OM Drama\n\n---\n\n","TROPE AUDIT CHECKLIST":"\nBefore locking the trope stack:\n\n- [ ] Max 5 tropes total\n- [ ] One clear Tier 1 engine\n- [ ] Forced proximity creates natural scenes (not forced conflict)\n- [ ] Personality dynamic drives banter, not just conflict\n- [ ] Complication is resolvable through communication (not a contrived secret)\n- [ ] Tone stays light even when stakes rise\n- [ ] FMC retains agency throughout\n- [ ] MMC is emotionally safe, devoted, never cruel\n- [ ] Wealth complicates, never controls\n- [ ] HEA delivers the promised emotional payoff\n\nIf any answer is no, swap the trope.\n\n---\n\n","HARD NO FOR SAGE KENNEDY":"\n- Mafia / organized crime settings\n- Captive / dubious consent romance\n- Cruelty played as romantic\n- FMC passivity after intimacy begins\n- Tragic endings or ambiguous HEAs\n- Dark morally-gray heroes\n- Trauma-as-aesthetic\n\nIf the pitch starts drifting into this territory, it probably belongs under Moxie, Ruthie, or Vesper — not Sage.\n\n---\n\n","EXAMPLE TROPE BUILDS":"\n### Billionaire Christmas Rom-Com (Sage default)\n- **Core:** Fake Dating\n- **Proximity:** Snowed In at the Estate\n- **Dynamic:** Grumpy × Sunshine\n- **Complication:** Media Scandal (he's hiding from paparazzi)\n- **Holiday Anchor:** Christmas\n- **Result:** Laughy, swoony, seasonally marketable, heat 4\n\n### Hockey Rom-Com (Sage's current WIP space)\n- **Core:** Team Captain × Journalist\n- **Proximity:** Playoff Road Trip\n- **Dynamic:** Deadpan × Nervous Rambler\n- **Complication:** She's supposed to be writing an exposé on him\n- **Result:** Banter-heavy, sports-grounded, heat 4\n\n### Royal Disguise (Sage expansion lane)\n- **Core:** Royal in Disguise\n- **Proximity:** Small Town Cover Story\n- **Dynamic:** Earnest × Competent Chaos\n- **Complication:** His wedding is in 30 days to someone else\n- **Result:** High-concept, emotionally high-stakes, heat 3–4\n\n"},"primary":"Sage Kennedy (heat 4)","max":5},"tropesDoc":"# RomCom Tropes Master List\n\n**Primary pen name:** Sage Kennedy (heat 4)\n**Secondary use:** RomCom-adjacent content under other pen names — generally not. Sage owns this lane.\n\n---\n\n## THE TROPE PICKER SYSTEM\n\nPick ONE option from each tier. This prevents \"everything-but-the-kitchen-sink\" syndrome and keeps the Story Promise clean.\n\n**Max trope count per book: 5 total.**\n\n---\n\n## 🔹 TIER 1 — CORE ROMANCE ENGINE\n\n*Pick ONE. This defines the story spine.*\n\n### Billionaire Rom-Com\n- Fake Dating\n- Secret Billionaire\n- Boss / Employee (rom-com safe)\n- Workplace Rivals\n- Marriage of Convenience\n- Inheritance with Strings\n- Billionaire in Disguise\n- Power Imbalance → Emotional Equalization\n\n### Hockey / Sports\n- Hockey Player x Normal Woman\n- Team Captain x Journalist\n- Injured Player x Physical Therapist\n- Retiring Star x Fresh Start\n- Rival Team Romance\n- Fake Girlfriend for the PR Team\n- Single Dad Player x Nanny\n- Grumpy Defenseman x Sunshine Trainer\n\n### Royal / Celebrity\n- Royal in Disguise\n- Prince x Commoner\n- Celebrity x Normal Person\n- Scandal-Forced Engagement\n- Arranged Royal Marriage\n- Royal Bodyguard x Princess\n- Celebrity x Handler\n- Reality Show Romance\n\n### Holiday (seasonal anchor)\n- Christmas Fake Dating\n- New Year's Kiss Aftermath\n- Valentine's Wedding Pressure\n- Summer Resort Romance\n- Fourth of July Hometown Reunion\n- Halloween Costume Mix-Up\n- Thanksgiving \"Bring Home Someone\" Crisis\n\n---\n\n## 🔹 TIER 2 — FORCED PROXIMITY\n\n*Pick ONE. This creates scenes.*\n\n### Universal RomCom Proximity\n- Snowed In at the Estate / Cabin / Hotel\n- Only One Bed\n- Shared Penthouse / Shared Apartment\n- Destination Wedding (can't leave the island)\n- Corporate Retreat / Team-Building Nightmare\n- Stuck in an Elevator (briefly — longer = thriller)\n- Road Trip (business or crisis)\n- Small Town Cover Story\n- Private Jet / Yacht (rich-people trapped proximity)\n- Family Event You Can't Escape\n\n### Hockey-Specific\n- Shared Team Flight\n- Training Camp Cabin\n- Playoff Road Trip\n- Recovery Rehab Partnership\n- Charity Event Co-Hosting\n\n### Holiday-Specific\n- Snowed In for Christmas\n- Family Lake House for Thanksgiving\n- New Year's Eve Party Gone Wrong\n- Summer Share House\n- Holiday Market Stall Next Door\n\n---\n\n## 🔹 TIER 3 — PERSONALITY DYNAMIC\n\n*Pick ONE. This fuels banter and tension.*\n\n### Classic RomCom Gold\n- Grumpy x Sunshine\n- Sunshine x Sunshine (Chaos Edition)\n- Ice Queen x Golden Retriever\n- Alpha Softie x Competent FMC\n- Sarcastic x Earnest\n- Uptight x Free Spirit\n- Workaholic x Life-Enjoyer\n- Introvert x Extrovert\n- Control Freak x Chaos Gremlin\n- Emotionally Avoidant x Emotionally Honest\n- Type-A x Laid-Back\n- Overthinker x Calm in Crisis\n\n### Avoid for Sage\n- Dark alpha posturing (wrong pen name)\n- Dom/sub dynamics (wrong heat tone)\n- Pure angst pairings (tone must stay light)\n\n---\n\n## 🔹 TIER 4 — SECRET / COMPLICATION\n\n*Pick ONE. This drives Act III.*\n\n### Identity & Status\n- Hidden Identity (Secret Billionaire / Celebrity / Royal)\n- Media Scandal\n- Family Power Play\n- Corporate Takeover\n- Prenup / Contract Clause\n- Ex with an Agenda\n- Accidental Viral Moment\n- Mistaken Identity Spiral\n\n### Emotional Stakes\n- Fear of Being Used (for money / fame)\n- Believes They're \"Too Much\" or \"Not Enough\"\n- Career vs. Love Forced Choice\n- Family Disapproval (grounded, not melodramatic)\n- Past Heartbreak Haunting Current Choices\n\n### RomCom-Specific Chaos\n- Accidental Lying Spiral\n- Misheard Conversation\n- Third-Act Misunderstanding (fear-based, never betrayal)\n- Well-Meaning Meddler Ruins Everything\n- Viral Humiliation\n- Ex Shows Up at the Worst Time\n\n---\n\n## FMC TROPE CLUSTERS\n\nSage FMCs are sharp, witty, emotionally honest even when it's awkward.\n\n### Core Archetypes\n- Sunshine Heroine\n- Competent Chaos\n- Reluctant Romantic\n- Overachieving Hot Mess\n- Type-A Softie\n- Sarcastic Sweetheart\n- Former Dreamer, Current Realist\n- Independent to a Fault\n- \"I'm Fine\" (She Is Not Fine)\n\n### Comedy-Forward Traits\n- Says the Wrong Thing at the Worst Time\n- Overthinks Everything\n- Nervous Rambler\n- Accidental Liar\n- Falls First (Internally, Denies It Externally)\n- Socially Awkward but Confident Elsewhere\n- Cannot Lie Convincingly\n- Drunk Truth Teller\n- Prone to Public Embarrassment\n\n### Career / Lifestyle\n- Small Business Owner (bakery, bookstore, etc.)\n- Creative Professional (writer, artist, designer)\n- Overworked Professional\n- Career Woman Learning Balance\n- Burned-Out Corporate Girl\n- Small Town Girl with Big Ideas\n- City Girl in Over Her Head\n- Family Business Caretaker\n\n### Emotional Arcs\n- Guarded but Hopeful\n- Afraid of Needing Someone\n- Rebuilding After a Breakup\n- Learning to Ask for Help\n- Doesn't Think She's \"Enough\"\n- Fiercely Loyal\n- Believes Love Is Inconvenient\n\n---\n\n## MMC TROPE CLUSTERS\n\nSage MMCs are **safe alphas** — confident, devoted, emotionally grounded. NOT dark dominant.\n\n### Core Archetypes\n- Golden Retriever Hero\n- Grumpy with a Soft Center\n- Competent, Not Condescending\n- Emotionally Repressed but Trying\n- Calm in Crisis, Chaos in Love\n- Secretly Romantic\n- Earnest, Not Smooth\n- Protective (Respectfully)\n- Quietly Devoted\n\n### Comedy-Forward Traits\n- Deadpan Humor\n- Dry Sarcasm\n- Accidentally Flirts\n- Doesn't Realize He's Hot\n- Soft Tease, Not Mean\n- Flustered by FMC\n- Terrible Liar\n- Publicly Calm, Privately Panicking\n\n### Career / Status\n- Billionaire Who Hates Being a Billionaire\n- CEO Who Escaped Small Town Roots\n- Inherited Business He Didn't Want\n- Celebrity in Disguise\n- Royal / Prince Playing Normal\n- Workaholic Learning Balance\n- Man With a Reputation He Doesn't Deserve\n- Pro Athlete Hiding a Softer Self\n\n### Emotional Arcs\n- Falls Hard, Falls Quiet\n- Already All In Before He Admits It\n- Protects FMC's Dreams\n- Chooses Her Over Ego\n- Believes He's \"Too Much\" or \"Not Enough\"\n- Shows Love Through Actions\n- Has Never Been Chosen\n- Soft Dom Energy (rom-com safe)\n\n---\n\n## 💥 POWER COUPLE PAIRINGS\n\nMix-and-match clusters for instant reader catnip.\n\n### Classic Rom-Com Gold\n- Competent Chaos FMC × Grumpy Softie MMC\n- Sunshine FMC × Deadpan MMC\n- Overthinker FMC × Calm MMC\n- Sarcastic FMC × Earnest MMC\n- Type-A FMC × Laid-Back MMC\n\n### Billionaire Sweet Spot\n- Independent FMC × Secret Soft Billionaire\n- Small Town FMC × City Billionaire in Crisis\n- Career FMC × Man Learning to Slow Down\n\n### Hockey Sweet Spot\n- Nervous Rambler × Deadpan Defenseman\n- Career Woman × Retiring Star\n- Journalist × Team Captain\n\n### Royal / Celebrity Sweet Spot\n- Small Town FMC × Prince Playing Normal\n- Journalist × Celebrity He's Trying to Dodge\n- Event Planner × Scandal-Hit Royal\n\n---\n\n## 🔥 HEAT LEVEL CALIBRATION\n\n### Default for Sage Kennedy: 🌶️🌶️🌶️ → 🌶️🌶️🌶️🌶️ (3–4/5)\n\n**What works at this level:**\n- Banter during intimacy — the comedy doesn't stop when clothes come off\n- Mutual desire, enthusiastic consent, playful dominance (never fear-based)\n- First kiss around 30–40%\n- First heat scene 50–60%\n- Explicit but playful — laughs welcome mid-scene\n\n**What breaks Sage voice:**\n- Dark alpha posturing\n- Possessive-to-toxic energy\n- Fear-based dominance\n- Purple prose (\"her feminine core throbbed with ancient need\")\n- Power exchange dynamics that cost the FMC her agency\n\n### Heat 1–2 (Sweet Sage — rare, only if Jessica specifies)\n- Longing, near-misses, tension through restraint\n- Closed-door or fade\n- Banter carries the tension\n\n### Heat 3 (Steamy Default)\n- Open door, playful, mutual teasing\n- First kiss is a scene\n- Consummation has emotional weight AND laughs\n- Heroine is an active participant\n\n### Heat 4 (Sage's brand)\n- Explicit with humor intact\n- \"That was extremely hot and also you're ridiculous\"\n- Multiple heat scenes, each advancing the relationship\n- Afterglow banter as character development\n\n### Heat 4+ (Bordering on dark territory — avoid for Sage)\n- If the scene would fit Moxie better, it's wrong for Sage\n- Flag and recalibrate\n\n---\n\n## 📌 READER EXPECTATION TAGS\n\nThese aren't tropes but they sell books. Use them in blurbs, keywords, and metadata.\n\n- Low Angst\n- High Banter\n- Feel-Good Romance\n- Laugh-Out-Loud\n- Sweet & Spicy\n- Steamy Rom-Com\n- Cozy Holiday Vibes\n- Comfort Read\n- Strong Female Lead\n- Safe Alpha Hero\n- Guaranteed HEA\n- No Cheating\n- No OW / OM Drama\n\n---\n\n## ✅ TROPE AUDIT CHECKLIST\n\nBefore locking the trope stack:\n\n- [ ] Max 5 tropes total\n- [ ] One clear Tier 1 engine\n- [ ] Forced proximity creates natural scenes (not forced conflict)\n- [ ] Personality dynamic drives banter, not just conflict\n- [ ] Complication is resolvable through communication (not a contrived secret)\n- [ ] Tone stays light even when stakes rise\n- [ ] FMC retains agency throughout\n- [ ] MMC is emotionally safe, devoted, never cruel\n- [ ] Wealth complicates, never controls\n- [ ] HEA delivers the promised emotional payoff\n\nIf any answer is no, swap the trope.\n\n---\n\n## 🚫 HARD NO FOR SAGE KENNEDY\n\n- Mafia / organized crime settings\n- Captive / dubious consent romance\n- Cruelty played as romantic\n- FMC passivity after intimacy begins\n- Tragic endings or ambiguous HEAs\n- Dark morally-gray heroes\n- Trauma-as-aesthetic\n\nIf the pitch starts drifting into this territory, it probably belongs under Moxie, Ruthie, or Vesper — not Sage.\n\n---\n\n## EXAMPLE TROPE BUILDS\n\n### Billionaire Christmas Rom-Com (Sage default)\n- **Core:** Fake Dating\n- **Proximity:** Snowed In at the Estate\n- **Dynamic:** Grumpy × Sunshine\n- **Complication:** Media Scandal (he's hiding from paparazzi)\n- **Holiday Anchor:** Christmas\n- **Result:** Laughy, swoony, seasonally marketable, heat 4\n\n### Hockey Rom-Com (Sage's current WIP space)\n- **Core:** Team Captain × Journalist\n- **Proximity:** Playoff Road Trip\n- **Dynamic:** Deadpan × Nervous Rambler\n- **Complication:** She's supposed to be writing an exposé on him\n- **Result:** Banter-heavy, sports-grounded, heat 4\n\n### Royal Disguise (Sage expansion lane)\n- **Core:** Royal in Disguise\n- **Proximity:** Small Town Cover Story\n- **Dynamic:** Earnest × Competent Chaos\n- **Complication:** His wedding is in 30 days to someone else\n- **Result:** High-concept, emotionally high-stakes, heat 3–4\n"},"paranormal-romcom":{"id":"paranormal-romcom","label":"Paranormal Rom-Com","short":"Paranormal","desc":"Vampires and the modern women who ruin their composure. Comedy AND heat, held to equal standards.","romance":true,"primaryPens":"Kelsey Croft","targetLine":"70,000–85,000 words | 24–30 chapters | Dual POV REQUIRED","words":[70000,85000],"chapters":[24,30],"pov":"Dual POV REQUIRED","heatLine":"🌶️🌶️🌶️🌶️ (4/5) for series books | 🌶️🌶️🌶️🌶️🌶️ (5/5) for standalones where heat is the selling point","outlinePrompt":"You are a professional paranormal rom-com outliner specializing in vampire romance, blood bonds, and the intersection of ancient supernatural politics with modern absurdity.\n\nTASK: Create a complete chapter outline for a novel using the Premise and Codex provided in the Project files. Output as [Book Title]_Outline.md.\n\nTARGET: 70,000–85,000 words | 24–30 chapters | Dual POV REQUIRED (alternating; her POV is comedy-forward, his POV is controlled formality cracking)\n\n---\n\nSTRUCTURE\n\nACT 1 — IMPOSSIBLE COLLISION (0–20%): SHE LANDS IN HIS WORLD AND CANNOT BELIEVE IT\n- **CHAPTER 1 OPENS ON A HOOK — THE LEAH GATE.** The hook is the impossible already happening and her voice narrating the disaster in real time: the vampire problem has already found her, and she's mid-\"you have got to be kidding me.\" Open in scene or mid-thought. NEVER open on telling (narrator explaining who she is or how the vampire world works), NEVER on reminiscing or backstory, NEVER on a calm \"ordinary day\" being described as normal before the weird lands, NEVER on weather, recap, or lore dump. ACTION and SHOWING in the first lines — the comedy and the chaos carry the open. THE BAR: would a hostile critic (Leah) read past the first two paragraphs? If the open is slow, backward-looking, or a calm warm-up, sharpen the hook. Write to clear the bar; do not ease in.\n- FMC's voice immediately: sharp, self-aware, narrating her own disasters in real time\n- Inciting incident: she discovers vampires exist (and that she's somehow involved), or she's been targeted, or she stumbles into supernatural politics by accident\n- First contact between FMC and MMC carries supernatural weight AND comedic friction — he is certain; she is \"you have got to be kidding me\"\n- Establish: he cannot read her mind (this is comedy AND intimacy gold)\n- Vampire world introduced through HER bewilderment — the politics sound like the worst HOA meeting she's ever attended, AND someone could actually die\n- Stakes established: real danger from antagonist faction, AND her ordinary life she's about to lose access to\n- End of Act 1: she is INSIDE his world, no clean exit\n\nACT 2A — DIGNITY DEMOLITION & PURSUIT (20–45%): HE IS CERTAIN, SHE IS DEFIANT, COMEDY ESCALATES\n- He has a plan (centuries of certainty) — she ruins it with her chaos\n- Forced proximity — safe house, ancestral estate, his penthouse, the political summit she has to attend\n- She RESISTS — backbone arrives before feelings do\n- His ancient dignity gets quietly demolished by her — and he's bewildered, then beloved\n- Comic timing: ancient/modern contrast (he can't work the coffee maker; she can't pronounce the vampire family name)\n- Vampire politics deepen — court factions, blood laws, ancestral rivalries — all played with HOA-meeting absurdity AND real consequence\n- First charged moment (the RuNyx 10%) — a kiss, a near-bite, a moment where his control cracks visibly\n- Touch-her-and-die moment — he protects her violently against an external threat; she is appropriately horrified AND turned on\n\nACT 2B — THE THRESHOLD (45–70%): COMEDY HOLDS WHILE THE BOND DEEPENS\n- Banter does NOT stop — but it gets lower, more charged, more truth-telling\n- First full intimacy scene anchors here (target ~Ch 13–18, 50–60%)\n- Heat scenes: explicit, supernatural, voice-forward — the banter doesn't fully stop even in heat; \"this is weird but also extremely hot\" is a valid internal beat\n- Blood bond approached, circled, retreated from — first real blood exchange treated with the weight of a first I love you\n- Ancient/modern contrast continues to mine humor — even as the relationship gets more serious\n- Found family within his world coalesces — the snarky side characters (vampire OR human) become hers too\n- External threat tightens: rival court moves, hidden faction surfaces, antagonist closes in\n- Setup for breaking point: a secret unspools, a political alliance demands payment, a mortality vs. immortality choice forced\n\nACT 3A — THE FRACTURE (70–85%): COMEDY HOLDS THROUGH RUPTURE\n- Breaking point lands — but it does NOT come from cruelty between leads\n- Sources: misunderstanding from secret-keeping, external betrayal, forced political alliance, the mortality question, an ancient enemy striking\n- Tone stays warm-with-edge — the humor finds the absurdity even in grief\n- One or both retreats — he goes to the council, she goes home to her sister, etc.\n- Found family rallies — someone tells one of them what they need to hear\n- The misunderstanding clarifies through action OR third party — but the LEADS resolve through real conversation\n\nACT 3B — DECLARATION + CONFRONTATION (85–95%): HER CHAOS, HIS CERTAINTY, BOTH AT FULL POWER\n- Confrontation with the external antagonist (vampire court, ancient enemy, political faction)\n- The blood bond completes (or is chosen) — treated with the weight it earned\n- One or both makes a public, vulnerable, costly declaration\n- Conflict resolves through CHOICE — she chooses his world knowing exactly what it costs, he chooses her over the council / vow / tradition\n- The public vampire world acknowledges her — she is HIS, on her terms\n\nRESOLUTION — EARNED HEA (95–100%): WARM, SUPERNATURAL, CONCRETE\n- Aftermath — a domestic scene where the vampire absurdity meets her ordinary life, lovingly\n- The blood bond / mate claim / political position is settled\n- Optional epilogue — months or a year later, low stakes, high charm, ancient/modern contrast still mining humor\n- HEA is permanent on the page; HFN if part of a series with continuing politics\n\n---\n\nCHAPTER FORMAT\n\nFor each chapter provide:\n\n### Chapter [#] — [POV]\n- **Goal:** [what this POV is trying to accomplish]\n- **Conflict:** [internal, external, or supernatural]\n- **Outcome:** [how the chapter changes the situation]\n\n**Beats (5 bullets max):**\n- [Bullet 1 — opening beat, in scene or mid-thought]\n- [Bullet 2]\n- [Bullet 3 — midpoint shift]\n- [Bullet 4]\n- [Bullet 5 — ending HOOK]\n\n**Required per chapter:**\n- At least one comedic beat (banter, ancient/modern contrast, dignity demolition)\n- At least one tension beat (supernatural, romantic, or stakes)\n- Forward momentum on relationship OR plot OR worldbuilding\n- Ending HOOK — never resolve a scene at chapter end, end mid-motion\n\n---\n\nINCLUDE WITH THE OUTLINE\n\n## Banter Escalation Map\n- Ch 1–6: Sharp resistance disguised as conflict — she is appalled and hilarious about it\n- Ch 7–14: Banter as flirtation — she's still resisting but he's getting under her skin\n- Ch 15–22: Banter as language — they understand each other, the absurdity binds them\n- Ch 23–end: Banter as love — even at peak heat, peak grief, peak political danger, the rhythm holds\n\n## Romantic Escalation Map\n- First touch (Ch ?) — supernatural-charged\n- First conversation that matters (Ch ?)\n- First charged moment / RuNyx 10% (target Ch 8–12, 30–45%)\n- First kiss (target Ch 10–14, 40–50%)\n- First emotional reveal (Ch ?)\n- First full intimacy (target Ch 13–18, 50–60%)\n- Blood bond approached / circled (Ch ?–?)\n- First real blood exchange (target Ch 18–22, ~75%) — threshold moment\n- Dark moment (target ~75–80%)\n- Declaration (target ~90%)\n- HEA (final 2–3 chapters)\n\n## Heat Map\n- Heat level: 4/5 series default | 5/5 standalone\n- First charged moment 30–45%\n- First full intimacy 50–60%\n- Blood bond exchange treated as first-I-love-you weight\n- Heat scenes: banter doesn't fully stop, supernatural elements present (fangs, his control cracking, blood awareness)\n- \"This is weird but extremely hot\" allowed and encouraged\n\n## Worldbuilding-Through-Bewilderment Map\n- The politics introduced through HER problem — she encounters it, breaks it, pays the cost, then understands\n- The hierarchy played as both deadly AND HOA-absurd\n- The mortality / immortality stakes named and complicated, never glossed\n- The supernatural rules consistent — when broken, consequences land\n\n---\n\nREQUIREMENTS (NON-NEGOTIABLE)\n\n- Chapter 1 clears the Leah Gate — open on an action/showing hook (see Act 1); never telling, reminiscing, a calm \"ordinary day,\" weather, recap, or opening info-dump\n- FMC has agency from page one — she is NOT prey, EVER\n- Banter present in every chapter — even dark ones\n- He cannot read her mind (rule of the world; comedic and intimate engine)\n- His ancient dignity gets DEMOLISHED by her chaos — that's the comedic core\n- His monstrous nature is present in heat scenes (fangs, controlled power, blood awareness)\n- Blood bond is a milestone, not a casual beat — treat it as I-love-you weight\n- Single POV per chapter, dual POV across the book required\n- Her POV: comedy-forward, sensory chaos, fast internal monologue\n- His POV: controlled surface, formal diction cracking, mounting evidence that control is failing\n- Ending HOOK every chapter (apply the Sleep Test)\n- Tone stays warm-with-edge even in danger — she finds the absurdity\n- Third-act conflict NEVER comes from cruelty between the leads\n- HEA is mandatory\n- No tangled sheets, no slick folds, no purple prose (CPH universal)\n- Heat 4/5 series default; 5/5 if specified; never below 4/5 for Kelsey\n\n---\n\nKELSEY CROFT SPECIFIC CHECKS\n\nBefore outputting the outline, verify:\n\n- [ ] FMC has backbone — pushes back, not impressed by centuries of vampire dignity until he earns it\n- [ ] Hero's dignity crumbles visibly — he is bewildered by her, then beloved\n- [ ] Ancient/modern contrast mined in at least 6+ chapters\n- [ ] Vampire politics are deadly AND absurd — both registers present\n- [ ] Heat scenes: banter doesn't completely stop, supernatural present\n- [ ] Blood bond / first blood exchange is a threshold beat (not casual)\n- [ ] No scenes drift into Ruthie Clark gothic dread (sustained darkness — wrong pen name)\n- [ ] No scenes drift into Sage Kennedy contemporary-only territory (no supernatural stakes — wrong pen name)\n- [ ] No banned names (cross-check `banned-list.md` and `kelsey-croft` skill character rules)\n- [ ] Found family / snarky side characters present and named (vampire OR human)\n- [ ] Mortality vs. immortality question raised (and complicated, even if not resolved)\n\nOUTPUT: Save as [Book Title]_Outline.md in Project files.","outlineRefinements":[{"label":"Banter is dropping out","text":"Several chapters in [X-Y] are reading plot-forward without banter. Re-outline so the comedic engine stays present — even one sharp internal observation per scene."},{"label":"Heat curve is flat","text":"First charged moment is landing at Ch [X], but full intimacy is rushing in by Ch [Y]. Stretch the threshold — add 2–3 chapters of circling before the first full scene."},{"label":"Vampire politics feel exposition-heavy","text":"Ch [X-Y] explains the court rules through narration. Re-outline so the rule arrives as her problem — she encounters it, breaks it, pays the cost."},{"label":"Ancient dignity stays intact too long","text":"By Ch [X] he should be visibly cracking. Re-outline so his formal diction is breaking, his control is slipping, his bewilderment is on the page."},{"label":"Tone drifts gothic","text":"Ch [X-Y] is reading like Ruthie Clark dread instead of Kelsey Croft. Recalibrate — the danger is real but the comedy survives. Even in dark moments, she finds the absurdity."},{"label":"Blood bond is too casual","text":"Ch [X] blood exchange is happening like a normal heat scene. Re-outline so it's a threshold — circled, approached, retreated from in the chapters before it lands."},{"label":"FMC reads passive","text":"She's reacting to him, the politics, the threat. Re-outline Ch [X-Y] so she makes at least one active decision per chapter that complicates HIS plan."},{"label":"Dark moment is melodrama","text":"The breaking point in Ch [X-Y] is dragging into pure angst. Shorten to 1–2 chapters and lean into the misunderstanding / fear / external pressure. Tone stays warm even in rupture."}],"postChecks":["Chapter count sanity check — 24–30 is the target. Under 24 = the slow burn / dignity demolition is rushed. Over 30 = should likely be pruned.","POV balance — Roughly 50/50, alternating. Her chapters carry the comedy; his carry the formal-diction-cracking.","Banter density — Spot-check: does every chapter have at least one comedic beat? If not, recalibrate.","Charged-moment placement — First charged moment 30–45%, first kiss 40–50%, first intimacy 50–60%, first blood exchange ~75%. If the heat curve is flat or front-loaded, recalibrate.","Blood bond weight — The first real blood exchange should READ as a major beat — surrounding chapters should circle it, approach it, retreat from it.","Tone consistency — Tone stays warm-with-edge even in danger. If chapters drift into sustained dread, recalibrate (that's Ruthie's lane).","Dignity-demolition arc — His formality should crack visibly across the book. Track it: where is his dignity intact? Where does it break? Where does it stop being formal?"],"tropes":{"tiers":[{"name":"TIER 1 — CORE SUPERNATURAL HOOK","intro":"Pick ONE. This defines the supernatural premise and the comedic engine.","cards":[{"name":"Ancient Vampire x Modern Woman","bullets":["He's centuries old; she's a regular human with a job and student loans","His certainty meets her chaos","He cannot read her mind (the rule that drives comedy AND intimacy)","Payoff: she chooses his world knowing exactly what it costs"]},{"name":"Fated Mate (He Knows, She Has Opinions)","bullets":["He recognizes her instantly (Sands-style life-mate certainty)","She is not impressed by centuries of vampire dignity until he earns it","The bond is real but acceptance is EARNED through her resistance","Payoff: the bond becomes choice, not destiny"]},{"name":"Reluctant Reveal (She Doesn't Know What He Is)","bullets":["She meets him as a regular (intriguing, weird) man","The vampire reveal is a beat, not the opening","Her reaction is comedic AND real: betrayal, fear, then recalibration","Payoff: she chooses him after she knows everything"]},{"name":"Bodyguard / Protector (Vampire Edition)","bullets":["He's been assigned (or has assigned himself) to keep her alive","She has no idea WHY she matters to vampire politics","His professional distance breaks under the strain of her chaos","Payoff: he's not her bodyguard anymore; he's hers"]},{"name":"Marriage of Convenience (Supernatural Politics)","bullets":["A vampire treaty, a council requirement, a magical bargain","She's roped in without consent and proceeds to refuse to play nice","The contract is real and binding (often magically)","Payoff: the contract becomes choice"]},{"name":"Witness (She Saw Something She Shouldn't Have)","bullets":["She saw a vampire feeding, a council murder, a supernatural event","Now she's a problem the vampire world has to solve","He's been deputized to handle her — and falls instead","Payoff: she joins the world that tried to silence her, on her terms"]}]},{"name":"TIER 2 — FORCED PROXIMITY","intro":"Pick ONE. This is what creates scenes the reader bought the book for.","cards":[{"name":"Universal Paranormal Proximity","bullets":["Hidden in His Penthouse / Estate / Compound","Ancestral Family Mansion (creaky, old-money, full of vampire relatives)","Safe House During Council Crisis","Political Summit She Has to Attend","On the Run from Rival Faction","Sleeping Outside Her Door (bodyguard escalates)","Trapped at the Family Gathering / Wedding / Council Event","Magical Binding (you can't be more than X distance apart)"]},{"name":"Specifically Comedic","bullets":["His House Has No Modern Amenities (he's been alive too long for technology)","Her Apartment, but He Won't Leave (she's safer with him; he won't admit he likes it)","Her Family Visits and He Has to Pose as Human","Her Kid / Sister / Nephew Adopts Him","Stuck in a Coffin / Crypt / Sealed Chamber Together (mining the absurdity)"]},{"name":"Council / Court Proximity","bullets":["Required Public Appearances (she has to perform as his)","Vampire Court Lockdown (the worst HOA meeting of her life)","Diplomatic Summit (she's accidentally a representative)","Trial / Ritual / Ceremony (she has to be there; he has to go through with it)"]}]},{"name":"TIER 3 — DYNAMIC","intro":"Pick ONE. This fuels banter, tension, and heat.","cards":[{"name":"Classic Kelsey Pairings","bullets":["His Certainty x Her Chaos (the comedic core)","Ancient Dignity x Sarcastic American","Possessive in Heat / Bewildered the Rest of the Time","Formal Diction x Run-On Digression","He Has a Plan / She Ruins It / He Adjusts","Brooding Vampire x Backbone Heroine","Centuries of Experience x This Specific Woman Who Confounds All of It"]},{"name":"Comedy-Forward Heroine Traits","bullets":["Says What She's Thinking (mostly)","Sarcasm Is Her Love Language","Notices the Absurdity and Refuses to Pretend Otherwise","Plus-Size, Tall, Klutzy, Divorced, Odd — Pick One or Combine","Aware She's in a Ridiculous Situation","\"You Have Got to Be Kidding Me\" Is Her Default Mode"]},{"name":"Hero Traits (Kelsey-Specific)","bullets":["Formal When Flustered (the formality is the tell)","Pet Names Used Sparingly and With Genuine Meaning","Patient with a Current Underneath (he will wait, but he KNOWS)","His Silence Is More Interesting Than Most People's Speeches","Possessive in Moments of Heat (the RuNyx 10%) but Not Controlling Outside Them","His Restraint IS the Foreplay"]},{"name":"Avoid for Kelsey","bullets":["Sustained gothic dread (wrong pen name — that's Ruthie)","Dom/sub dynamics played straight (wrong tone)","Brooding vampires with no sense of humor about themselves","Heroines who are impressed by vampire dignity before he's earned it","Body shame / \"despite her flaws\" framing — never","Heroes who are cruel rather than possessive-and-bewildered"]}]},{"name":"TIER 4 — STAKES & SECRET","intro":"Pick ONE. This drives Act 3 breaking point.","cards":[{"name":"Political Threats","bullets":["Rival Vampire Court Moves on Her","Council Decision Pending (forced choice — alliance, exile, mortality)","Hidden Faction Surfaces (someone has been planning this for a long time)","Vampire Tradition Demands Payment (an old vow comes due)","Diplomatic Crisis (she's accidentally a piece on the chessboard)"]},{"name":"Identity & Lineage","bullets":["Hidden Lineage (she's connected to the supernatural world without knowing)","Ancient Enemy Surfaces (his old enemy targets her)","Sired-Line Politics (his maker, his progeny, his bloodline complicates everything)","Mortal Best Friend / Family Member Caught in the Crossfire"]},{"name":"The Mortality Question","bullets":["Forced Mortality / Immortality Choice (timing matters)","Aging Question (she's aware; he's in denial)","Reproductive Question (vampire fertility myths and realities)","Long-Game Reality Check (she sees the future; he avoids it)"]},{"name":"Heart-of-the-Matter Stakes","bullets":["The Secret He's Been Keeping (about her, about himself, about the world)","The Secret She's Been Keeping (about her past, her family, what she actually wants)","The Misunderstanding That Looks Like Betrayal","The External Threat That Forces a Public Choice"]}]}],"extras":{"THE TROPE PICKER SYSTEM":"\nPick ONE option from each tier. Paranormal rom-com runs on contrast: ancient supernatural + modern absurdity. Trope discipline keeps that contrast sharp.\n\n**Max trope count per book: 5 total.**\n\n---\n\n","FMC TROPE CLUSTERS":"\nKelsey FMCs are a MacAlister heroine dropped into a Sands story. Warm, funny, sharp, and constitutionally unable to be impressed before they're ready.\n\n### Core Archetypes\n- The American in Vampire Politics\n- The Plus-Size Heroine With Zero Apology\n- The Recently Divorced Woman Done With Bullshit\n- The Klutz Who Survives Anyway\n- The Tall One Tired of Crouching\n- The Odd One (she has been the weird girl her whole life)\n- The Single Mom Whose Kid Adopts the Vampire\n- The Coffee-Powered Sarcastic Sweetheart\n- The Job-Hating Refugee in Over Her Head\n\n### Comedy-Forward Traits\n- Inner Monologue Narrating Her Own Disasters\n- Notices His Attractiveness, Resents It Immediately\n- Run-On Sentences When Nervous\n- Cannot Lie Convincingly to a Centuries-Old Vampire\n- Quick-Hit Observations, NOT Monologues\n- Em-Dash Asides Are Her Native Tongue\n- Drunk Truth Teller\n- Says the Wrong Thing at Vampire Council Meetings\n\n### Career / Background\n- Adjunct Professor / Librarian / Bookshop Owner\n- Single Mom Doing Her Best\n- Recently-Divorced Career Pivot\n- Hospital / Healthcare Worker (saw something at work)\n- Small Business Owner With Zero Patience for Politics\n- Tech Worker Who Just Wants Her PTO\n\n### Emotional Arcs\n- Believes She's \"Too Much\" / \"Not Enough\" (resolves)\n- Afraid of Needing Anyone (especially someone immortal)\n- Learning to Take Up Space in His Ancient World\n- Refusing to Shrink to Fit His Politics\n- Choosing Him Knowing the Cost (mortality, exile, full reveal)\n\n---\n\n","MMC TROPE CLUSTERS":"\nKelsey MMCs are Sands immortals with RuNyx intensity underneath. Ancient, powerful, dangerous — and hilariously bad at the modern world.\n\n### Core Archetypes\n- The Ancient One (1000+ years, knows things)\n- The Vampire Aristocrat (court politics in his blood)\n- The Reluctant Heir / Council Member\n- The Sired Son Who Outgrew His Maker\n- The Vampire Bodyguard / Enforcer\n- The Centuries-Long Bachelor (everyone gave up on him)\n- The Last of His Bloodline\n- The Vampire Who Hates Vampire Politics\n\n### Devotion-Through-Action Traits\n- Cannot Read Her Mind (she is genuinely OTHER to him)\n- Recognizes Her Instantly and Refuses to Act for Decades / Centuries\n- Sleeps Outside Her Door\n- Burns the Council for Her (or threatens to, eloquently)\n- Pet Names Used Sparingly and With Earned Weight\n- \"Touch Her and Die\" Is Stated Calmly, in Period Vocabulary\n- Watches Her Before They Meet (because of course)\n- Centuries of Experience Prepare Him for Exactly Nothing About Her\n\n### Hard Edges (Required)\n- Possessive in Heat (the RuNyx 10%) — visible, real\n- His Monstrous Nature Stays Present in Intimacy (fangs, control cracking, blood awareness)\n- He Is Dangerous to the World — the rom-com tone never erases the bite\n- He Stays Formal Underneath When the Comedy Lands\n\n### Emotional Arcs\n- From Centuries of Certainty to Bewildered by HER\n- From Plan-Maker to Plan-Adjuster\n- From Council Loyalty to Her First\n- From Immortal Alone to Bonded\n- From Dignity Intact to Dignity Demolished and Loving It\n\n---\n\n","TROPE COMBINATIONS THAT WORK":"\n| Primary Trope (Tier 1) | Pairs Especially Well With |\n|---|---|\n| Ancient Vampire x Modern Woman | Bodyguard, Reluctant Reveal |\n| Fated Mate (He Knows) | Marriage of Convenience, Forced Proximity |\n| Reluctant Reveal | Witness, Hidden Lineage |\n| Bodyguard (Vampire) | Touch-Her-and-Die, Council Crisis |\n| Marriage of Convenience | Political Summit, Hidden Lineage |\n| Witness | Bodyguard, Council Threat |\n\n---\n\n","HARD NO TROPES (NEVER USE)":"\n| Trope | Why Not |\n|---|---|\n| Horror-level gore during intimacy or blood exchange | Wrong tone for Kelsey |\n| Non-consensual biting played as romantic | Hard line |\n| Sustained gothic dread for more than a scene | She is not Ruthie Clark |\n| Brooding vampire with no humor about himself | Wrong pen name signature |\n| Heroine impressed before he's earned it | She has backbone — non-negotiable |\n| Body shame / \"despite her flaws\" framing | She's already at home in her body |\n| Cruel hero rather than possessive-and-bewildered | Genre killer |\n| Heroines who fold without a fight | Genre killer |\n| Comedy disappearing in dark moments | She finds the absurdity even in grief |\n| Love triangle with real competition | He's it |\n| Cheating | Nope |\n| Tangled sheets / slick folds / purple prose | CPH universal |\n| Banned names from `banned-list.md` | Always |\n\n---\n\n","THE KELSEY CROFT WISH FULFILLMENT":"\nEvery trope choice should feed at least one of these core fantasies:\n\n- The **dangerous man who is bewildered by you specifically**\n- Being the **exception to centuries of his composure**\n- **Ancient certainty + modern chaos** — and the chaos wins (in the right way)\n- **Backbone over rescue** — she chooses, she pushes back, she earns the bond\n- **Comedy as love language** — banter that becomes intimacy\n- **Body-positive, plus-size, divorced, klutzy, or otherwise \"imperfect\" heroine adored fully**\n- **The dignity-demolition arc** — watching his formality crack\n- **Vampire politics as the worst HOA meeting AND a genuine death threat**\n- **A blood bond earned, weighted, chosen**\n\nIf a trope doesn't feed at least one of these, question why it's in the book.\n\n---\n\n","TROPE EXECUTION RULES":"\n### Tropes work when:\n1. **Characters justify the trope** — comedy emerges from who they are\n2. **Stakes are real** — the danger underneath the absurdity is genuine\n3. **Both registers present** — danger AND humor, never just one\n4. **Fresh angles** — readers know vampire romance; surprise them with execution\n5. **Voice carries** — Jessica's patterns survive even in supernatural intensity\n6. **The comedy is in HOW the danger is processed**, not in minimizing it\n\n### Common mistakes:\n- Comedy used to deflate stakes (genre killer)\n- Sustained gothic dread (wrong pen name)\n- FMC who is impressed too early (genre killer)\n- Hero who is cruel instead of bewildered (genre killer)\n- Banter dropping out in heat scenes (it gets quieter, not absent)\n- Body shame, \"she's only beautiful when he sees her\" framing (genre killer)\n- Blood bond treated as casual (genre killer — it's I-love-you weight)\n\n---\n\n","TROPE CHECKLIST":"\nBefore locking the trope stack, verify:\n\n- [ ] Tier 1 / 2 / 3 / 4 picks chosen — one each\n- [ ] Total tropes in stack ≤ 5\n- [ ] Stack feeds at least one Wish Fulfillment fantasy\n- [ ] No Hard No tropes present\n- [ ] FMC has backbone — pushes back, not impressed too early\n- [ ] MMC's dignity will visibly crumble across the book\n- [ ] Both registers (danger + comedy) supported by chosen tropes\n- [ ] Stack works with the Story Promise without contradicting it\n- [ ] Any combination flagged in \"Pairs Especially Well With\" — bonus\n- [ ] No banned character names in any trope examples used\n- [ ] Blood bond / first blood exchange placement planned (not casual)\n- [ ] Mortality / immortality question is at least raised in the trope choices\n\n"},"primary":"Kelsey Croft (heat 4-5)","max":5},"tropesDoc":"# Paranormal Rom-Com Tropes Master List\n\n**Primary pen name:** Kelsey Croft (heat 4-5)\n**Secondary use:** Pure paranormal (non-comedic) lives elsewhere — Ruthie Clark for dark fantasy, Lilith Darkwing for dark paranormal romance, Vesper Crane for dark mythology. Kelsey owns the rom-com end of paranormal — comedy with real dark stakes underneath.\n\n---\n\n## THE TROPE PICKER SYSTEM\n\nPick ONE option from each tier. Paranormal rom-com runs on contrast: ancient supernatural + modern absurdity. Trope discipline keeps that contrast sharp.\n\n**Max trope count per book: 5 total.**\n\n---\n\n## 🩸 TIER 1 — CORE SUPERNATURAL HOOK\n\n*Pick ONE. This defines the supernatural premise and the comedic engine.*\n\n### Ancient Vampire x Modern Woman\n- He's centuries old; she's a regular human with a job and student loans\n- His certainty meets her chaos\n- He cannot read her mind (the rule that drives comedy AND intimacy)\n- Payoff: she chooses his world knowing exactly what it costs\n\n### Fated Mate (He Knows, She Has Opinions)\n- He recognizes her instantly (Sands-style life-mate certainty)\n- She is not impressed by centuries of vampire dignity until he earns it\n- The bond is real but acceptance is EARNED through her resistance\n- Payoff: the bond becomes choice, not destiny\n\n### Reluctant Reveal (She Doesn't Know What He Is)\n- She meets him as a regular (intriguing, weird) man\n- The vampire reveal is a beat, not the opening\n- Her reaction is comedic AND real: betrayal, fear, then recalibration\n- Payoff: she chooses him after she knows everything\n\n### Bodyguard / Protector (Vampire Edition)\n- He's been assigned (or has assigned himself) to keep her alive\n- She has no idea WHY she matters to vampire politics\n- His professional distance breaks under the strain of her chaos\n- Payoff: he's not her bodyguard anymore; he's hers\n\n### Marriage of Convenience (Supernatural Politics)\n- A vampire treaty, a council requirement, a magical bargain\n- She's roped in without consent and proceeds to refuse to play nice\n- The contract is real and binding (often magically)\n- Payoff: the contract becomes choice\n\n### Witness (She Saw Something She Shouldn't Have)\n- She saw a vampire feeding, a council murder, a supernatural event\n- Now she's a problem the vampire world has to solve\n- He's been deputized to handle her — and falls instead\n- Payoff: she joins the world that tried to silence her, on her terms\n\n---\n\n## 🩸 TIER 2 — FORCED PROXIMITY\n\n*Pick ONE. This is what creates scenes the reader bought the book for.*\n\n### Universal Paranormal Proximity\n- Hidden in His Penthouse / Estate / Compound\n- Ancestral Family Mansion (creaky, old-money, full of vampire relatives)\n- Safe House During Council Crisis\n- Political Summit She Has to Attend\n- On the Run from Rival Faction\n- Sleeping Outside Her Door (bodyguard escalates)\n- Trapped at the Family Gathering / Wedding / Council Event\n- Magical Binding (you can't be more than X distance apart)\n\n### Specifically Comedic\n- His House Has No Modern Amenities (he's been alive too long for technology)\n- Her Apartment, but He Won't Leave (she's safer with him; he won't admit he likes it)\n- Her Family Visits and He Has to Pose as Human\n- Her Kid / Sister / Nephew Adopts Him\n- Stuck in a Coffin / Crypt / Sealed Chamber Together (mining the absurdity)\n\n### Council / Court Proximity\n- Required Public Appearances (she has to perform as his)\n- Vampire Court Lockdown (the worst HOA meeting of her life)\n- Diplomatic Summit (she's accidentally a representative)\n- Trial / Ritual / Ceremony (she has to be there; he has to go through with it)\n\n---\n\n## 🩸 TIER 3 — DYNAMIC\n\n*Pick ONE. This fuels banter, tension, and heat.*\n\n### Classic Kelsey Pairings\n- His Certainty x Her Chaos (the comedic core)\n- Ancient Dignity x Sarcastic American\n- Possessive in Heat / Bewildered the Rest of the Time\n- Formal Diction x Run-On Digression\n- He Has a Plan / She Ruins It / He Adjusts\n- Brooding Vampire x Backbone Heroine\n- Centuries of Experience x This Specific Woman Who Confounds All of It\n\n### Comedy-Forward Heroine Traits\n- Says What She's Thinking (mostly)\n- Sarcasm Is Her Love Language\n- Notices the Absurdity and Refuses to Pretend Otherwise\n- Plus-Size, Tall, Klutzy, Divorced, Odd — Pick One or Combine\n- Aware She's in a Ridiculous Situation\n- \"You Have Got to Be Kidding Me\" Is Her Default Mode\n\n### Hero Traits (Kelsey-Specific)\n- Formal When Flustered (the formality is the tell)\n- Pet Names Used Sparingly and With Genuine Meaning\n- Patient with a Current Underneath (he will wait, but he KNOWS)\n- His Silence Is More Interesting Than Most People's Speeches\n- Possessive in Moments of Heat (the RuNyx 10%) but Not Controlling Outside Them\n- His Restraint IS the Foreplay\n\n### Avoid for Kelsey\n- Sustained gothic dread (wrong pen name — that's Ruthie)\n- Dom/sub dynamics played straight (wrong tone)\n- Brooding vampires with no sense of humor about themselves\n- Heroines who are impressed by vampire dignity before he's earned it\n- Body shame / \"despite her flaws\" framing — never\n- Heroes who are cruel rather than possessive-and-bewildered\n\n---\n\n## 🩸 TIER 4 — STAKES & SECRET\n\n*Pick ONE. This drives Act 3 breaking point.*\n\n### Political Threats\n- Rival Vampire Court Moves on Her\n- Council Decision Pending (forced choice — alliance, exile, mortality)\n- Hidden Faction Surfaces (someone has been planning this for a long time)\n- Vampire Tradition Demands Payment (an old vow comes due)\n- Diplomatic Crisis (she's accidentally a piece on the chessboard)\n\n### Identity & Lineage\n- Hidden Lineage (she's connected to the supernatural world without knowing)\n- Ancient Enemy Surfaces (his old enemy targets her)\n- Sired-Line Politics (his maker, his progeny, his bloodline complicates everything)\n- Mortal Best Friend / Family Member Caught in the Crossfire\n\n### The Mortality Question\n- Forced Mortality / Immortality Choice (timing matters)\n- Aging Question (she's aware; he's in denial)\n- Reproductive Question (vampire fertility myths and realities)\n- Long-Game Reality Check (she sees the future; he avoids it)\n\n### Heart-of-the-Matter Stakes\n- The Secret He's Been Keeping (about her, about himself, about the world)\n- The Secret She's Been Keeping (about her past, her family, what she actually wants)\n- The Misunderstanding That Looks Like Betrayal\n- The External Threat That Forces a Public Choice\n\n---\n\n## FMC TROPE CLUSTERS\n\nKelsey FMCs are a MacAlister heroine dropped into a Sands story. Warm, funny, sharp, and constitutionally unable to be impressed before they're ready.\n\n### Core Archetypes\n- The American in Vampire Politics\n- The Plus-Size Heroine With Zero Apology\n- The Recently Divorced Woman Done With Bullshit\n- The Klutz Who Survives Anyway\n- The Tall One Tired of Crouching\n- The Odd One (she has been the weird girl her whole life)\n- The Single Mom Whose Kid Adopts the Vampire\n- The Coffee-Powered Sarcastic Sweetheart\n- The Job-Hating Refugee in Over Her Head\n\n### Comedy-Forward Traits\n- Inner Monologue Narrating Her Own Disasters\n- Notices His Attractiveness, Resents It Immediately\n- Run-On Sentences When Nervous\n- Cannot Lie Convincingly to a Centuries-Old Vampire\n- Quick-Hit Observations, NOT Monologues\n- Em-Dash Asides Are Her Native Tongue\n- Drunk Truth Teller\n- Says the Wrong Thing at Vampire Council Meetings\n\n### Career / Background\n- Adjunct Professor / Librarian / Bookshop Owner\n- Single Mom Doing Her Best\n- Recently-Divorced Career Pivot\n- Hospital / Healthcare Worker (saw something at work)\n- Small Business Owner With Zero Patience for Politics\n- Tech Worker Who Just Wants Her PTO\n\n### Emotional Arcs\n- Believes She's \"Too Much\" / \"Not Enough\" (resolves)\n- Afraid of Needing Anyone (especially someone immortal)\n- Learning to Take Up Space in His Ancient World\n- Refusing to Shrink to Fit His Politics\n- Choosing Him Knowing the Cost (mortality, exile, full reveal)\n\n---\n\n## MMC TROPE CLUSTERS\n\nKelsey MMCs are Sands immortals with RuNyx intensity underneath. Ancient, powerful, dangerous — and hilariously bad at the modern world.\n\n### Core Archetypes\n- The Ancient One (1000+ years, knows things)\n- The Vampire Aristocrat (court politics in his blood)\n- The Reluctant Heir / Council Member\n- The Sired Son Who Outgrew His Maker\n- The Vampire Bodyguard / Enforcer\n- The Centuries-Long Bachelor (everyone gave up on him)\n- The Last of His Bloodline\n- The Vampire Who Hates Vampire Politics\n\n### Devotion-Through-Action Traits\n- Cannot Read Her Mind (she is genuinely OTHER to him)\n- Recognizes Her Instantly and Refuses to Act for Decades / Centuries\n- Sleeps Outside Her Door\n- Burns the Council for Her (or threatens to, eloquently)\n- Pet Names Used Sparingly and With Earned Weight\n- \"Touch Her and Die\" Is Stated Calmly, in Period Vocabulary\n- Watches Her Before They Meet (because of course)\n- Centuries of Experience Prepare Him for Exactly Nothing About Her\n\n### Hard Edges (Required)\n- Possessive in Heat (the RuNyx 10%) — visible, real\n- His Monstrous Nature Stays Present in Intimacy (fangs, control cracking, blood awareness)\n- He Is Dangerous to the World — the rom-com tone never erases the bite\n- He Stays Formal Underneath When the Comedy Lands\n\n### Emotional Arcs\n- From Centuries of Certainty to Bewildered by HER\n- From Plan-Maker to Plan-Adjuster\n- From Council Loyalty to Her First\n- From Immortal Alone to Bonded\n- From Dignity Intact to Dignity Demolished and Loving It\n\n---\n\n## TROPE COMBINATIONS THAT WORK\n\n| Primary Trope (Tier 1) | Pairs Especially Well With |\n|---|---|\n| Ancient Vampire x Modern Woman | Bodyguard, Reluctant Reveal |\n| Fated Mate (He Knows) | Marriage of Convenience, Forced Proximity |\n| Reluctant Reveal | Witness, Hidden Lineage |\n| Bodyguard (Vampire) | Touch-Her-and-Die, Council Crisis |\n| Marriage of Convenience | Political Summit, Hidden Lineage |\n| Witness | Bodyguard, Council Threat |\n\n---\n\n## HARD NO TROPES (NEVER USE)\n\n| Trope | Why Not |\n|---|---|\n| Horror-level gore during intimacy or blood exchange | Wrong tone for Kelsey |\n| Non-consensual biting played as romantic | Hard line |\n| Sustained gothic dread for more than a scene | She is not Ruthie Clark |\n| Brooding vampire with no humor about himself | Wrong pen name signature |\n| Heroine impressed before he's earned it | She has backbone — non-negotiable |\n| Body shame / \"despite her flaws\" framing | She's already at home in her body |\n| Cruel hero rather than possessive-and-bewildered | Genre killer |\n| Heroines who fold without
