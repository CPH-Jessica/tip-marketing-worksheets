a fight | Genre killer |\n| Comedy disappearing in dark moments | She finds the absurdity even in grief |\n| Love triangle with real competition | He's it |\n| Cheating | Nope |\n| Tangled sheets / slick folds / purple prose | CPH universal |\n| Banned names from `banned-list.md` | Always |\n\n---\n\n## THE KELSEY CROFT WISH FULFILLMENT\n\nEvery trope choice should feed at least one of these core fantasies:\n\n- The **dangerous man who is bewildered by you specifically**\n- Being the **exception to centuries of his composure**\n- **Ancient certainty + modern chaos** — and the chaos wins (in the right way)\n- **Backbone over rescue** — she chooses, she pushes back, she earns the bond\n- **Comedy as love language** — banter that becomes intimacy\n- **Body-positive, plus-size, divorced, klutzy, or otherwise \"imperfect\" heroine adored fully**\n- **The dignity-demolition arc** — watching his formality crack\n- **Vampire politics as the worst HOA meeting AND a genuine death threat**\n- **A blood bond earned, weighted, chosen**\n\nIf a trope doesn't feed at least one of these, question why it's in the book.\n\n---\n\n## TROPE EXECUTION RULES\n\n### Tropes work when:\n1. **Characters justify the trope** — comedy emerges from who they are\n2. **Stakes are real** — the danger underneath the absurdity is genuine\n3. **Both registers present** — danger AND humor, never just one\n4. **Fresh angles** — readers know vampire romance; surprise them with execution\n5. **Voice carries** — Jessica's patterns survive even in supernatural intensity\n6. **The comedy is in HOW the danger is processed**, not in minimizing it\n\n### Common mistakes:\n- Comedy used to deflate stakes (genre killer)\n- Sustained gothic dread (wrong pen name)\n- FMC who is impressed too early (genre killer)\n- Hero who is cruel instead of bewildered (genre killer)\n- Banter dropping out in heat scenes (it gets quieter, not absent)\n- Body shame, \"she's only beautiful when he sees her\" framing (genre killer)\n- Blood bond treated as casual (genre killer — it's I-love-you weight)\n\n---\n\n## TROPE CHECKLIST\n\nBefore locking the trope stack, verify:\n\n- [ ] Tier 1 / 2 / 3 / 4 picks chosen — one each\n- [ ] Total tropes in stack ≤ 5\n- [ ] Stack feeds at least one Wish Fulfillment fantasy\n- [ ] No Hard No tropes present\n- [ ] FMC has backbone — pushes back, not impressed too early\n- [ ] MMC's dignity will visibly crumble across the book\n- [ ] Both registers (danger + comedy) supported by chosen tropes\n- [ ] Stack works with the Story Promise without contradicting it\n- [ ] Any combination flagged in \"Pairs Especially Well With\" — bonus\n- [ ] No banned character names in any trope examples used\n- [ ] Blood bond / first blood exchange placement planned (not casual)\n- [ ] Mortality / immortality question is at least raised in the trope choices\n"},"dark-romance":{"id":"dark-romance","label":"Dark Romance (Mafia)","short":"Dark Mafia","desc":"Possession, danger-braided desire, morally gray heroes. Explicit, intense, unapologetic.","romance":true,"primaryPens":"Moxie Savage","targetLine":"65,000–80,000 words | 22–28 chapters | Dual POV preferred (single FMC POV acceptable)","words":[65000,80000],"chapters":[22,28],"pov":"Dual POV preferred (single FMC POV acceptable)","heatLine":"🌶️🌶️🌶️🌶️🌶️ (5/5) — explicit, intense, unapologetic. No softening.","outlinePrompt":"You are a professional dark romance outliner specializing in mafia and MC fiction.\n\nTASK: Create a complete chapter outline for a novel using the Premise and Codex provided in the Project files. Output as [Book Title]_Outline.md.\n\nTARGET: 65,000–80,000 words | 22–28 chapters | Dual POV (alternating, FMC-leaning if uneven) unless single FMC POV is specified\n\n---\n\nSTRUCTURE\n\nACT 1 — SETUP (0–20%): SHE ENTERS HIS WORLD (OR CAN'T ESCAPE IT)\n- **CHAPTER 1 OPENS ON A HOOK — THE LEAH GATE.** The hook is the power move on page one: the capture, the debt called in, the thing she witnessed that she should never have seen, the deal already struck over her head. The imbalance is FELT through what happens, not explained. Open mid-collision. NEVER open on telling (narrator explaining her life or his empire), NEVER on reminiscing or backstory, NEVER on a calm \"ordinary day\" before the danger lands, NEVER on weather or scene-setting. ACTION and SHOWING in the first lines — menace and stakes on the page immediately. THE BAR: would a hostile critic (Leah) read past the first two paragraphs? If the open is slow, backward-looking, or calm, build a harder hook. Write to clear the bar; do not ease in.\n- Power imbalance is established IMMEDIATELY — the reader feels it on page one\n- Inciting incident is concrete and visible: capture, arrangement, debt called in, witness to something she shouldn't have seen, on-the-run forced into his orbit, sold/traded, arranged marriage announced\n- His world is shown — dangerous, controlled, unforgiving — through what HE does, not exposition\n- Her resistance is real — she does not bend on first contact\n- His interest is reluctant, complicated, against his own rules\n- Stakes established: what she stands to lose (life, family, freedom, body, soul)\n- End of Act 1: she is INSIDE his world with no clean exit\n\nACT 2A — ESCALATION (20–45%): DANGER TIGHTENS, THEY'RE FORCED CLOSER\n- External threat escalates — rival family, enemy faction, cop investigation, betrayal from inside\n- Forced proximity intensifies — same house, same car, same bed, same target\n- She sees behind the mask in glimpses — the man underneath the monster\n- He starts to need her in ways he can't control or admit\n- First \"touch her and die\" moment — he protects her against an external threat, often violently\n- Trust builds through small, costly choices on both sides\n- First heat scene around 25–40% — could be a kiss with edge, could be more — but tension is the engine\n\nACT 2B — DEEPENING (45–70%): WALLS DOWN, STAKES UP\n- Emotional intimacy building underneath the physical\n- Multiple heat scenes, each one escalating in intensity AND emotional weight\n- His control is visibly cracking around her\n- Her choice to stay (or to fight to stay) is becoming real — not coerced, chosen\n- \"I see you\" moment — she sees the man, not just the monster, and names it\n- His devotion is demonstrated through ACTION (violence on her behalf, sacrifice of advantage, breaking his own rules)\n- Secondary characters notice the shift — comment, warn, threaten, conspire\n- External threats reaching critical mass — setup for the breaking point\n\nACT 3A — BREAKING POINT (70–85%): THE THING THAT COULD DESTROY THEM\n- The blow lands — betrayal (real or perceived), secret revealed, impossible choice forced, past catches up\n- Maximum external pressure\n- Trust shattered or threatened\n- Separation — physical, emotional, or both\n- Her reaction is ACTIVE (fight, flee, freeze and recover) — not passive\n- His reaction shows what he does when he might lose her\n- Dark night of the soul — apart, both realize what they've lost\n\nACT 3B — DARK NIGHT (85–95%): MAXIMUM STAKES, SACRIFICE, CHOICE\n- He chooses HER over empire, revenge, legacy, blood, the thing he's been chasing the whole book\n- She chooses HIM — knowing exactly what he is, no rose-colored framing\n- Confrontation with the external enemy\n- Violence, sacrifice, near-death, or all three\n- His grand gesture is usually destructive — burning the world to save her, taking down the threat permanently\n- The turn toward resolution\n\nRESOLUTION — EARNED HEA (95–100%): THEY RULE THE DARKNESS TOGETHER\n- They do not escape his world — they take their place in it together\n- External threat neutralized or paused\n- New equilibrium established\n- Aftermath of crisis: emotional resolution, physical reconnection, her place at his side made permanent\n- HEA or HFN — but the promise of the future must feel concrete, not vague\n- Optional epilogue: glimpse of their life now (often a claiming, wedding, or visible power shift)\n\n---\n\nCHAPTER FORMAT\n\nFor each chapter provide:\n\n### Chapter [#] — [POV]\n- **Goal:** [what this POV is trying to accomplish]\n- **Conflict:** [what stands in the way — internal, external, or both]\n- **Outcome:** [how the chapter changes the situation]\n- **Stakes:** [what is at risk in THIS chapter — her safety, his empire, their bond, someone they love]\n\n**Beats (5 bullets max):**\n- [Bullet 1 — opening beat, in action]\n- [Bullet 2]\n- [Bullet 3 — midpoint shift]\n- [Bullet 4]\n- [Bullet 5 — ending HOOK]\n\n**Required per chapter:**\n- Stakes visible — something at risk on this page\n- Tension throughout — sexual, emotional, or physical danger\n- Forward movement — something changes by the end\n- Ending HOOK (collision, revelation, threat, question, or demanded choice — never a soft landing)\n\n---\n\nINCLUDE WITH THE OUTLINE\n\n## Power Dynamic Map\nTrack the shifting power across the book:\n- Ch 1–6: His power, her resistance — imbalance maximum\n- Ch 7–14: His control cracking — she affects him visibly\n- Ch 15–20: She has agency she didn't have at start — mutual, not equal\n- Ch 21–end: Equal in power even when the world isn't — they choose each other on level ground\n\n## Threat Escalation Map\nMap the external pressure across the book:\n- First major threat (Ch ?) — concrete, named, visible\n- Threat tightens (Ch ?) — moves from world-level to personal\n- \"Touch her and die\" moment (Ch ?)\n- Threat reaches critical (Ch ?) — pre-breaking point\n- Final confrontation (Ch ?) — Act 3B violence\n- Threat resolution / aftermath (final chapters)\n\n## Heat Map\n- Heat level: 🌶️🌶️🌶️🌶️🌶️ (5/5) — default. Do not soften.\n- First heat scene (target 25–40%) — tension over choreography\n- Multiple escalating heat scenes through Act 2B (target 45–70%)\n- Heat as power exchange — note where SHE has power in heat scenes, not just him\n- Post-breaking-point heat (target ~95%) — reconnection, claiming, raw\n\n## Trust Map\n- Her trust in him: starts at zero, earns through ACTIONS, shatters at breaking point, rebuilds through his choice\n- His control over himself: starts absolute, fractures around her, lost at breaking point, surrendered by Act 3B\n- Note the chapter for each major shift on both axes\n\n---\n\nREQUIREMENTS (NON-NEGOTIABLE)\n\n- Power imbalance maintained through Act 1 and most of Act 2A\n- FMC must have AGENCY by Act 2B — passive heroines fail this genre\n- His possessiveness shows up as protection of HER, never as cruelty toward her\n- Cruelty toward enemies is allowed and often necessary; cruelty toward her is not\n- Every chapter ends on a HOOK (apply the Sleep Test — if a reader could comfortably bookmark and sleep, the ending failed)\n- Forward momentum in every chapter — slow burn is fine, stagnation is not\n- He CHOOSES her over empire/revenge/legacy at the climax — this is the genre's promise\n- She chooses him knowing exactly what he is — no last-act rose-coloring, no \"he's not really like that\"\n- Earned HEA — they do not escape the darkness, they rule it together\n- Single POV per chapter — alternating dual POV preferred, single FMC POV acceptable\n- No tangled sheets, no slick folds, no purple prose (CPH universal rule)\n- Heat 5/5 default — flag any scene that would land below this for review\n\n---\n\nMOXIE SAVAGE SPECIFIC CHECKS\n\nBefore outputting the outline, verify:\n\n- [ ] Power dynamic is clear and visible from Chapter 1\n- [ ] External threat is concrete (named faction, person, or stakes — not vague \"danger\")\n- [ ] FMC has at least three active choices that change the plot — not just reactions\n- [ ] MMC's possessiveness reads as protection, not control-over-her\n- [ ] His grand gesture in Act 3B costs him something significant (empire, blood, revenge, position)\n- [ ] HEA is earned through BOTH their choices, not just his sacrifice\n- [ ] Heat scenes serve the emotional arc — none exist as filler\n- [ ] No banned names in the outline (cross-check `banned-list.md` and the `moxie-savage` skill's character rules)\n- [ ] Mafia/MC world rules are consistent (loyalty hierarchy, code, consequences) — flag any violations\n- [ ] No scenes would fit better under Ruthie (no fantasy elements) or Vesper (no mythology) — recalibrate if drift detected\n\nOUTPUT: Save as [Book Title]_Outline.md in Project files.","outlineRefinements":[{"label":"Power dynamic feels off","text":"The power imbalance softens too early in [Ch X-Y]. Re-outline so his control stays absolute through [target chapter] and her agency builds through specific costly choices, not vibes."},{"label":"Threat not menacing","text":"The external threat isn't landing as dangerous. Make the antagonist's actions concrete and visible in Ch [X-Y] — readers should feel the noose tightening."},{"label":"Heat scenes feel like filler","text":"Heat scenes in Ch [X-Y] aren't doing emotional work. Re-outline each so something between them changes — trust, control, vulnerability — not just escalating choreography."},{"label":"FMC reads passive","text":"She's reacting, not choosing. Re-outline Ch [X-Y] so she makes at least one active decision that changes the plot in each chapter."},{"label":"He's cruel to her, not for her","text":"His possessiveness is reading as control-over-her instead of protection. Recalibrate Ch [X-Y] so his violence and intensity is directed at threats to her, not at her."},{"label":"Breaking point too soft","text":"The blow in Ch [X] doesn't break them. Make it concrete — a betrayal, a secret revealed, an impossible choice — something that forces real separation."},{"label":"Dark night too short","text":"The separation in Ch [X-Y] resolves too fast. Stretch the apartness to 2–3 chapters so both POVs feel the weight of losing each other."},{"label":"HEA feels rushed","text":"The resolution lands in the last 2 pages. Spread the choice/consequence/aftermath across 3–4 chapters so the HEA reads earned, not granted."},{"label":"Tropes not delivering","text":"The [trope name] is named but not showing up in scenes. Where are the [forced proximity / captive / arranged marriage / blood debt / etc.] set pieces? Weave through Act 2."}],"postChecks":["Chapter count sanity check — 22–28 is the target. Under 22 = the slow burn is rushed. Over 28 = likely should be a duology or has filler.","POV balance — If dual POV, rough 50/50 or deliberate FMC lean. Flag if MMC dominates — dark romance lives in her experience.","Tension density — Every chapter has visible stakes. If a chapter's \"Goal/Conflict/Outcome\" reads as low-stakes, question why it exists.","Heat escalation — First heat 25–40%, escalating heat through Act 2B, post-breaking-point reconnection ~95%. If the heat map skews early-only or saves it all for the end, recalibrate.","Breaking point placement — Should land 70–80%. If earlier, Act 3 is bloated. If later, dark night is rushed.","His choice / Her choice — Both must be explicit on the page. If either is implied or off-page, the HEA is not earned."],"tropes":{"tiers":[{"name":"TIER 1 — CORE DANGER ENGINE","intro":"Pick ONE. This defines the story spine and the central power dynamic.","cards":[{"name":"Mafia","bullets":["Arranged Marriage (alliance, debt, or treaty)","Mafia Princess x Rival Boss","Captive Romance (taken for leverage)","Debt Repayment (sold/traded to settle a balance)","Bodyguard / Protector (Dark Version)","Revenge Plot (one or both seeking it on the other's family)","Heir / Succession Drama (carrying his heir, claiming his line)","Don x Outsider (she sees the empire from the inside for the first time)"]},{"name":"MC (Motorcycle Club)","bullets":["Old Lady Claim (he calls her his)","Sergeant-at-Arms x Civilian","President's Daughter x Enforcer","Rival Club Romance","On the Run with the Club","Witness Hidden in the Clubhouse","Brought Home to the Club","Patched-In Member x Outsider Woman"]},{"name":"Other Dark Romance Setups","bullets":["Hitman x Target (or x Witness)","Cartel Setup (parallel rules to mafia, different culture)","Captive on the Run (she's wanted by someone worse than him)","Arranged Treaty (between any two dangerous factions)"]}]},{"name":"TIER 2 — FORCED PROXIMITY","intro":"Pick ONE. This is what creates scenes the reader bought the book for.","cards":[{"name":"Universal Dark Proximity","bullets":["Captive in His Compound / Penthouse / Estate","Safehouse (one bed, one threat outside)","On the Run Together","Same Household (his rules, his roof)","Wedding Lockdown (post-arranged-marriage cohabitation)","Hidden Witness Protection","Sleeping Outside Her Door (bodyguard escalates)","Under His Protection in Public (every room he watches)"]},{"name":"Mafia-Specific","bullets":["Locked in the Family Estate","Her Wing of His House","Required Public Appearances (she has to perform as his)","Inherited His Brother's Widow (or his enemy's daughter)"]},{"name":"MC-Specific","bullets":["Living in the Clubhouse","Road Trip with the Club","Lockdown During Club War","Hidden at the Compound from Rival Club"]}]},{"name":"TIER 3 — POWER DYNAMIC","intro":"Pick ONE. This fuels the heat and the emotional escalation.","cards":[{"name":"Classic Dark Romance Dynamics","bullets":["Dangerous Man / Safe With Her ONLY","Possessive Alpha / Defiant FMC (she doesn't bend)","Obsessive / Reluctant Object (he's been watching her)","Predator / Equal (she's not prey, even if he thought she was)","Cold Boss / Warm Underneath (only she sees it)","Monster / Tender Only With Her","Control Freak / Wild Card She Is","Public Cruelty / Private Devotion","Possession That Becomes Partnership"]},{"name":"Avoid for Moxie","bullets":["Soft alpha posturing (wrong pen name — that's Sage)","Pure sunshine FMCs (tone must stay dark)","Banter as the engine (banter exists but tension is the engine)","Equal-power-from-page-one (the imbalance is the genre)"]}]},{"name":"TIER 4 — SECRET / BREAKING POINT","intro":"Pick ONE. This drives Act 3 and forces the choice.","cards":[{"name":"Identity & Lineage","bullets":["Secret Identity (he or she isn't who they said)","Hidden Lineage (she's connected to the war he's fighting)","Past Catches Up (his or hers — old debt, old enemy, old name)","The Heir Question (pregnancy, succession, claim)","Witness Reveal (she saw something she didn't know mattered)"]},{"name":"Loyalty Tests","bullets":["Forced to Choose Empire vs. Her","Forced to Choose Family vs. Him","Sent by an Enemy (she was planted; or he thinks she was)","Inside Job Betrayal (someone trusted broke them)","Revenge Discovery (one of them was using the other)"]},{"name":"External Threats Reaching Critical","bullets":["Rival Family Makes Its Move","Federal Investigation Closes In","Clubhouse Breach / Compound Breach","Kidnapping (her, by enemy)","Public Exposure of Their Bond Endangers Her"]}]}],"extras":{"THE TROPE PICKER SYSTEM":"\nPick ONE option from each tier. This prevents \"everything-but-the-kitchen-sink\" syndrome and keeps the Story Promise clean and the dark-romance fantasy intact.\n\n**Max trope count per book: 5 total.**\n\n---\n\n","FMC TROPE CLUSTERS":"\nMoxie FMCs are sharp, defiant, emotionally honest. They survive what would break most heroines and they choose the man knowing exactly what he is.\n\n### Core Archetypes\n- Mafia Princess Who Refuses to Play Nice\n- Outsider Caught in His World\n- Witness Who Won't Stay Quiet\n- Debt-Marked Daughter\n- Defiant Captive\n- Reluctant Bride\n- Old Lady in Training\n- Soft on the Outside / Steel Underneath\n- Survivor With Receipts\n\n### Active-Agency Traits\n- Negotiates From a Position of Nothing and Wins\n- Cuts Through His Bullshit Faster Than His Men Do\n- Refuses to Be Property\n- Notices What Everyone Else Misses\n- Makes the Call He Wouldn't Make\n- Will Burn It Down if Pushed\n- Loyal — Once Earned, Total\n- Asks the Question No One Else Will Ask Him\n- Cries in Private, Never in Front of Him (until she chooses to)\n\n### Career / Background\n- Doctor / Nurse / Medic Pulled In\n- Lawyer / Accountant Who Saw the Books\n- Ordinary Woman in the Wrong Place\n- Daughter of the Family\n- Sister Stepping In\n- Civilian Pulled Across the Line\n- Mob-Adjacent (knew what her father was, didn't choose it)\n\n### Emotional Arcs\n- Believes She Doesn't Get to Want Things\n- Learning to Trust After Betrayal\n- Choosing Herself for the First Time\n- Naming What He Is and Loving Him Anyway\n- Refusing to Be Saved (Saving Herself Instead)\n\n---\n\n","MMC TROPE CLUSTERS":"\nMoxie MMCs are dangerous, possessive, and devoted. They are NOT redeemed by love — they remain who they are. Love gives them something worth being a slightly better version of themselves for.\n\n### Core Archetypes\n- The Don / Capo / Boss\n- The Enforcer (violence on her behalf)\n- The Outlaw President\n- The Rival Heir\n- The Bodyguard Who Crossed the Line\n- The Hitman With One Rule (he won't kill her)\n- The Heir Who Doesn't Want the Throne (until she's threatened)\n- The Cold Calculator With One Soft Spot\n\n### Devotion-Through-Action Traits\n- \"Touch Her and Die\"\n- Burns the World When She's Hurt\n- Publicly Claims Her\n- Sleeps Outside Her Door\n- Watches Her Before They Meet\n- Breaks His Own Rules for Her\n- Negotiates From Power, Yields Only to Her\n- Possessive in Public, Tender in Private\n- Has Killed for Less, Kills for Her Without Hesitation\n\n### Hard Edges (Required)\n- He Stays Dangerous to the World\n- His Violence Has Lines (toward her: never; toward enemies: yes)\n- He Doesn't \"Heal\" Out of His Sins\n- He's Still a Monster — Just HER Monster\n\n### Emotional Arcs\n- From Obligation to Obsession\n- From Possession to Partnership\n- From Ownership to Choosing Her Choice\n- Choosing Her Over Empire / Revenge / Legacy\n\n---\n\n","TROPE COMBINATIONS THAT WORK":"\n| Primary Trope (Tier 1) | Pairs Especially Well With |\n|---|---|\n| Arranged Marriage | Enemies-to-Lovers, Rival Families |\n| Captive Romance | Touch-Her-and-Die, Debt Repayment |\n| Bodyguard (Dark) | Obsession, Secret Identity |\n| Revenge Plot | Enemies-to-Lovers, Fake Relationship |\n| Debt Repayment | Captive, Arranged Marriage |\n| Mafia Princess x Rival Boss | Forbidden Love, Loyalty Tests |\n| MC Old Lady Claim | Public Claiming, Rival Club |\n\n---\n\n","HARD NO TROPES (NEVER USE)":"\n| Trope | Why Not |\n|---|---|\n| SA by MMC against FMC | Non-negotiable. Hard line. |\n| Abuse framed as romantic with no consequence | That's not dark romance. It's abuse. |\n| Children in danger for shock value | Cheap, manipulative, off-brand |\n| Cruelty without narrative purpose | Darkness must serve the story |\n| Love triangle with real competition for FMC's heart | He's it. Period. |\n| Cheating by MMC on FMC | Possession goes both ways |\n| \"Other woman\" drama with FMC as villain | She's not competing |\n| Heroine as perpetual victim with no agency | She must have active choices |\n| Hero who stays irredeemable to HER | Devotion arc is required |\n| Tangled sheets / slick folds / purple prose | CPH universal |\n| Banned names from `banned-list.md` | Always |\n\n---\n\n","THE MOXIE SAVAGE WISH FULFILLMENT":"\nEvery trope choice should feed at least one of these core fantasies:\n\n- Dangerous man who is **safe for her**\n- Being **chosen above everything** (empire, blood, revenge, legacy)\n- Intensity of **obsessive love**\n- **Power exchange** as fantasy (consensual, claimed, never coerced beyond setup)\n- Darkness that **protects** instead of harms\n- Being the **exception to his rules**\n- Earning devotion through **being herself**, not changing for him\n\nIf a trope doesn't feed at least one of these, question why it's in the book.\n\n---\n\n","TROPE EXECUTION RULES":"\n### Tropes work when:\n1. **Characters justify the trope** — it emerges from who they are, not stapled on\n2. **Stakes are real** — something must be risked\n3. **Payoff matches setup** — don't abandon the trope mid-book\n4. **Fresh angles** — readers know the trope; surprise them with execution\n5. **Emotional truth** — even the wildest premise needs grounded feelings\n6. **Dark serves story** — every dark beat earns its place or it's cut\n\n### Common mistakes:\n- Trope as substitute for character development\n- Setup without payoff\n- Payoff without earned setup\n- Playing the trope straight with no fresh angle\n- Forgetting why the trope is satisfying (wish fulfillment)\n- Heroine going passive once intimacy starts (genre killer)\n- Hero softening into \"good guy\" by Act 3 (genre killer)\n\n---\n\n","TROPE CHECKLIST":"\nBefore locking the trope stack, verify:\n\n- [ ] Tier 1 / 2 / 3 / 4 picks chosen — one each\n- [ ] Total tropes in stack ≤ 5\n- [ ] Stack feeds at least one Wish Fulfillment fantasy\n- [ ] No Hard No tropes present\n- [ ] FMC has active agency built into chosen tropes\n- [ ] MMC stays dangerous to the world (only soft for her)\n- [ ] Stack works with the Story Promise without contradicting it\n- [ ] Any combination flagged in \"Pairs Especially Well With\" — bonus\n- [ ] No banned character names in any trope examples used\n\n"},"primary":"Moxie Savage (heat 5)","max":5},"tropesDoc":"# Dark Romance Tropes Master List\n\n**Primary pen name:** Moxie Savage (heat 5)\n**Secondary use:** Dark-adjacent content under other pen names — generally not. Moxie owns this lane. (Vesper Crane uses dark mythology tropes; see `tropes/dark-mythology-romance.md`. Lilith Darkwing — dark paranormal — has a dedicated tropes file once built.)\n\n---\n\n## THE TROPE PICKER SYSTEM\n\nPick ONE option from each tier. This prevents \"everything-but-the-kitchen-sink\" syndrome and keeps the Story Promise clean and the dark-romance fantasy intact.\n\n**Max trope count per book: 5 total.**\n\n---\n\n## 🔪 TIER 1 — CORE DANGER ENGINE\n\n*Pick ONE. This defines the story spine and the central power dynamic.*\n\n### Mafia\n- Arranged Marriage (alliance, debt, or treaty)\n- Mafia Princess x Rival Boss\n- Captive Romance (taken for leverage)\n- Debt Repayment (sold/traded to settle a balance)\n- Bodyguard / Protector (Dark Version)\n- Revenge Plot (one or both seeking it on the other's family)\n- Heir / Succession Drama (carrying his heir, claiming his line)\n- Don x Outsider (she sees the empire from the inside for the first time)\n\n### MC (Motorcycle Club)\n- Old Lady Claim (he calls her his)\n- Sergeant-at-Arms x Civilian\n- President's Daughter x Enforcer\n- Rival Club Romance\n- On the Run with the Club\n- Witness Hidden in the Clubhouse\n- Brought Home to the Club\n- Patched-In Member x Outsider Woman\n\n### Other Dark Romance Setups\n- Hitman x Target (or x Witness)\n- Cartel Setup (parallel rules to mafia, different culture)\n- Captive on the Run (she's wanted by someone worse than him)\n- Arranged Treaty (between any two dangerous factions)\n\n---\n\n## 🔪 TIER 2 — FORCED PROXIMITY\n\n*Pick ONE. This is what creates scenes the reader bought the book for.*\n\n### Universal Dark Proximity\n- Captive in His Compound / Penthouse / Estate\n- Safehouse (one bed, one threat outside)\n- On the Run Together\n- Same Household (his rules, his roof)\n- Wedding Lockdown (post-arranged-marriage cohabitation)\n- Hidden Witness Protection\n- Sleeping Outside Her Door (bodyguard escalates)\n- Under His Protection in Public (every room he watches)\n\n### Mafia-Specific\n- Locked in the Family Estate\n- Her Wing of His House\n- Required Public Appearances (she has to perform as his)\n- Inherited His Brother's Widow (or his enemy's daughter)\n\n### MC-Specific\n- Living in the Clubhouse\n- Road Trip with the Club\n- Lockdown During Club War\n- Hidden at the Compound from Rival Club\n\n---\n\n## 🔪 TIER 3 — POWER DYNAMIC\n\n*Pick ONE. This fuels the heat and the emotional escalation.*\n\n### Classic Dark Romance Dynamics\n- Dangerous Man / Safe With Her ONLY\n- Possessive Alpha / Defiant FMC (she doesn't bend)\n- Obsessive / Reluctant Object (he's been watching her)\n- Predator / Equal (she's not prey, even if he thought she was)\n- Cold Boss / Warm Underneath (only she sees it)\n- Monster / Tender Only With Her\n- Control Freak / Wild Card She Is\n- Public Cruelty / Private Devotion\n- Possession That Becomes Partnership\n\n### Avoid for Moxie\n- Soft alpha posturing (wrong pen name — that's Sage)\n- Pure sunshine FMCs (tone must stay dark)\n- Banter as the engine (banter exists but tension is the engine)\n- Equal-power-from-page-one (the imbalance is the genre)\n\n---\n\n## 🔪 TIER 4 — SECRET / BREAKING POINT\n\n*Pick ONE. This drives Act 3 and forces the choice.*\n\n### Identity & Lineage\n- Secret Identity (he or she isn't who they said)\n- Hidden Lineage (she's connected to the war he's fighting)\n- Past Catches Up (his or hers — old debt, old enemy, old name)\n- The Heir Question (pregnancy, succession, claim)\n- Witness Reveal (she saw something she didn't know mattered)\n\n### Loyalty Tests\n- Forced to Choose Empire vs. Her\n- Forced to Choose Family vs. Him\n- Sent by an Enemy (she was planted; or he thinks she was)\n- Inside Job Betrayal (someone trusted broke them)\n- Revenge Discovery (one of them was using the other)\n\n### External Threats Reaching Critical\n- Rival Family Makes Its Move\n- Federal Investigation Closes In\n- Clubhouse Breach / Compound Breach\n- Kidnapping (her, by enemy)\n- Public Exposure of Their Bond Endangers Her\n\n---\n\n## FMC TROPE CLUSTERS\n\nMoxie FMCs are sharp, defiant, emotionally honest. They survive what would break most heroines and they choose the man knowing exactly what he is.\n\n### Core Archetypes\n- Mafia Princess Who Refuses to Play Nice\n- Outsider Caught in His World\n- Witness Who Won't Stay Quiet\n- Debt-Marked Daughter\n- Defiant Captive\n- Reluctant Bride\n- Old Lady in Training\n- Soft on the Outside / Steel Underneath\n- Survivor With Receipts\n\n### Active-Agency Traits\n- Negotiates From a Position of Nothing and Wins\n- Cuts Through His Bullshit Faster Than His Men Do\n- Refuses to Be Property\n- Notices What Everyone Else Misses\n- Makes the Call He Wouldn't Make\n- Will Burn It Down if Pushed\n- Loyal — Once Earned, Total\n- Asks the Question No One Else Will Ask Him\n- Cries in Private, Never in Front of Him (until she chooses to)\n\n### Career / Background\n- Doctor / Nurse / Medic Pulled In\n- Lawyer / Accountant Who Saw the Books\n- Ordinary Woman in the Wrong Place\n- Daughter of the Family\n- Sister Stepping In\n- Civilian Pulled Across the Line\n- Mob-Adjacent (knew what her father was, didn't choose it)\n\n### Emotional Arcs\n- Believes She Doesn't Get to Want Things\n- Learning to Trust After Betrayal\n- Choosing Herself for the First Time\n- Naming What He Is and Loving Him Anyway\n- Refusing to Be Saved (Saving Herself Instead)\n\n---\n\n## MMC TROPE CLUSTERS\n\nMoxie MMCs are dangerous, possessive, and devoted. They are NOT redeemed by love — they remain who they are. Love gives them something worth being a slightly better version of themselves for.\n\n### Core Archetypes\n- The Don / Capo / Boss\n- The Enforcer (violence on her behalf)\n- The Outlaw President\n- The Rival Heir\n- The Bodyguard Who Crossed the Line\n- The Hitman With One Rule (he won't kill her)\n- The Heir Who Doesn't Want the Throne (until she's threatened)\n- The Cold Calculator With One Soft Spot\n\n### Devotion-Through-Action Traits\n- \"Touch Her and Die\"\n- Burns the World When She's Hurt\n- Publicly Claims Her\n- Sleeps Outside Her Door\n- Watches Her Before They Meet\n- Breaks His Own Rules for Her\n- Negotiates From Power, Yields Only to Her\n- Possessive in Public, Tender in Private\n- Has Killed for Less, Kills for Her Without Hesitation\n\n### Hard Edges (Required)\n- He Stays Dangerous to the World\n- His Violence Has Lines (toward her: never; toward enemies: yes)\n- He Doesn't \"Heal\" Out of His Sins\n- He's Still a Monster — Just HER Monster\n\n### Emotional Arcs\n- From Obligation to Obsession\n- From Possession to Partnership\n- From Ownership to Choosing Her Choice\n- Choosing Her Over Empire / Revenge / Legacy\n\n---\n\n## TROPE COMBINATIONS THAT WORK\n\n| Primary Trope (Tier 1) | Pairs Especially Well With |\n|---|---|\n| Arranged Marriage | Enemies-to-Lovers, Rival Families |\n| Captive Romance | Touch-Her-and-Die, Debt Repayment |\n| Bodyguard (Dark) | Obsession, Secret Identity |\n| Revenge Plot | Enemies-to-Lovers, Fake Relationship |\n| Debt Repayment | Captive, Arranged Marriage |\n| Mafia Princess x Rival Boss | Forbidden Love, Loyalty Tests |\n| MC Old Lady Claim | Public Claiming, Rival Club |\n\n---\n\n## HARD NO TROPES (NEVER USE)\n\n| Trope | Why Not |\n|---|---|\n| SA by MMC against FMC | Non-negotiable. Hard line. |\n| Abuse framed as romantic with no consequence | That's not dark romance. It's abuse. |\n| Children in danger for shock value | Cheap, manipulative, off-brand |\n| Cruelty without narrative purpose | Darkness must serve the story |\n| Love triangle with real competition for FMC's heart | He's it. Period. |\n| Cheating by MMC on FMC | Possession goes both ways |\n| \"Other woman\" drama with FMC as villain | She's not competing |\n| Heroine as perpetual victim with no agency | She must have active choices |\n| Hero who stays irredeemable to HER | Devotion arc is required |\n| Tangled sheets / slick folds / purple prose | CPH universal |\n| Banned names from `banned-list.md` | Always |\n\n---\n\n## THE MOXIE SAVAGE WISH FULFILLMENT\n\nEvery trope choice should feed at least one of these core fantasies:\n\n- Dangerous man who is **safe for her**\n- Being **chosen above everything** (empire, blood, revenge, legacy)\n- Intensity of **obsessive love**\n- **Power exchange** as fantasy (consensual, claimed, never coerced beyond setup)\n- Darkness that **protects** instead of harms\n- Being the **exception to his rules**\n- Earning devotion through **being herself**, not changing for him\n\nIf a trope doesn't feed at least one of these, question why it's in the book.\n\n---\n\n## TROPE EXECUTION RULES\n\n### Tropes work when:\n1. **Characters justify the trope** — it emerges from who they are, not stapled on\n2. **Stakes are real** — something must be risked\n3. **Payoff matches setup** — don't abandon the trope mid-book\n4. **Fresh angles** — readers know the trope; surprise them with execution\n5. **Emotional truth** — even the wildest premise needs grounded feelings\n6. **Dark serves story** — every dark beat earns its place or it's cut\n\n### Common mistakes:\n- Trope as substitute for character development\n- Setup without payoff\n- Payoff without earned setup\n- Playing the trope straight with no fresh angle\n- Forgetting why the trope is satisfying (wish fulfillment)\n- Heroine going passive once intimacy starts (genre killer)\n- Hero softening into \"good guy\" by Act 3 (genre killer)\n\n---\n\n## TROPE CHECKLIST\n\nBefore locking the trope stack, verify:\n\n- [ ] Tier 1 / 2 / 3 / 4 picks chosen — one each\n- [ ] Total tropes in stack ≤ 5\n- [ ] Stack feeds at least one Wish Fulfillment fantasy\n- [ ] No Hard No tropes present\n- [ ] FMC has active agency built into chosen tropes\n- [ ] MMC stays dangerous to the world (only soft for her)\n- [ ] Stack works with the Story Promise without contradicting it\n- [ ] Any combination flagged in \"Pairs Especially Well With\" — bonus\n- [ ] No banned character names in any trope examples used\n"},"mc":{"id":"mc","label":"Dark Romance (MC)","short":"MC","desc":"Club-coded dark romance. Same power dynamics, motorcycle-club conventions.","romance":true,"primaryPens":"Moxie Savage (voice + power dynamics) — calibrated for MC genre conventions","targetLine":"65,000–80,000 words | 22–28 chapters | Dual POV preferred (FMC-leaning if uneven)","words":[65000,80000],"chapters":[22,28],"pov":"Dual POV preferred (FMC-leaning if uneven)","heatLine":"🌶️🌶️🌶️🌶️🌶️ (5/5) — explicit, possessive, club-coded","outlinePrompt":"You are a professional MC romance outliner specializing in motorcycle club fiction with brotherhood code, club hierarchy, road life, and high-heat possessive romance.\n\nTASK: Create a complete chapter outline for a novel using the Premise and Codex provided in the Project files. Output as [Book Title]_Outline.md.\n\nTARGET: 65,000–80,000 words | 22–28 chapters | Dual POV (alternating, FMC-leaning) unless single FMC POV is specified\n\n---\n\nSTRUCTURE\n\nACT 1 — SHE LANDS IN THE CLUB'S WORLD (0–20%): THE PATCH, THE RULES, THE STAKES\n- **CHAPTER 1 OPENS ON A HOOK — THE LEAH GATE.** The hook is the club's reach landing on her on page one: she's already at the clubhouse, already claimed, already pulled into the patch's world by a move she didn't choose. The power is FELT through what happens, not explained. Open mid-collision. NEVER open on telling (narrator explaining her life or the club's structure), NEVER on reminiscing or backstory, NEVER on a calm \"ordinary day\" before the club arrives, NEVER on weather, road-scenery, or exposition. ACTION and SHOWING in the first lines — the cut, the rules, the threat felt in motion. THE BAR: would a hostile critic (Leah) read past the first two paragraphs? If the open is slow, backward-looking, or calm, build a harder hook. Write to clear the bar; do not ease in.\n- Power imbalance is established IMMEDIATELY — the club's reach is felt on page one\n- Inciting incident: she is brought to the clubhouse (witness protection, debt, family connection, on the run, claimed at first contact, sister of a member, old lady inheritance, kidnapped from a rival club)\n- The CLUB is shown — clubhouse, garage, bar, the patch on his cut, the prospects, the rules — through what HAPPENS, not exposition\n- Her resistance is real — civilians don't bend to club rules, and she shouldn't either at first\n- His interest is reluctant, complicated, against the brotherhood's code (or maybe sanctioned, but uncomfortable)\n- The hierarchy is named in scene: President, VP, Sergeant-at-Arms, Enforcer, Road Captain, Treasurer, prospects, brothers, Old Ladies\n- Stakes established: what she stands to lose (life, family, freedom, her old life)\n- End of Act 1: she is INSIDE club life — clubhouse, charter business, rivalry, ride — with no clean exit\n\nACT 2A — ESCALATION (20–45%): RIVAL CLUB MOVES, BROTHERHOOD TIGHTENS, PROXIMITY INTENSIFIES\n- Rival club / federal investigation / traitor-inside escalates external pressure\n- Forced proximity through club life — she's at the clubhouse, on the back of his bike, at the run, at the family barbecue, hiding in his room\n- She sees behind the cut — the man underneath the patch\n- He starts to need her in ways the brotherhood will side-eye\n- Trust building through small moments — he teaches her clubhouse code, she fits in (or doesn't, deliberately)\n- First \"touch her and die\" moment — he protects her against an external threat (rival member, federal agent, hangaround crossing the line); other brothers see it\n- First heat scene around 25–40% — could be a kiss with edge, could be more — but possession is the engine\n- The patch starts to mean something to her — the club's reach is also her safety\n\nACT 2B — DEEPENING (45–70%): SHE'S CLUB-CLAIMED, WALLS DOWN, STAKES UP\n- Public claim happens here — he calls her his Old Lady (or equivalent) in front of brothers; she is recognized as his\n- Multiple heat scenes, escalating in intensity AND emotional weight (clubhouse setting, his room, on the road, in the garage)\n- His control over himself cracks visibly around her (including in front of brothers, which is uncomfortable for him)\n- Other Old Ladies welcome / vet / test her — the women's circle is real and powerful\n- Brotherhood's code questioned for the first time on her behalf — he breaks a rule for her, or considers it\n- External threats reaching critical — rival club moves on the charter, federal investigation tightens, a traitor surfaces\n- Setup for the breaking point — the code demands payment, the past arrives, the run goes wrong\n\nACT 3A — BREAKING POINT (70–85%): THE CODE OR HER, THE BROTHERHOOD OR HER\n- The blow lands — betrayal (real or perceived), the code demands he choose her or the patch, the rival club hits hard, his past catches up, a brother turns\n- Maximum external pressure\n- Trust shattered or threatened\n- Separation — she leaves the clubhouse, he rides out, she's taken by rival, he's locked up, she's hidden away\n- Her reaction is ACTIVE (fight, flee, freeze and recover, name what's happening, hold a brother accountable)\n- His reaction shows what he does when he might lose her — and the brotherhood watches\n- Dark night — apart, both realize what they've lost; the club watches, takes sides\n\nACT 3B — DARK NIGHT & THE RIDE (85–95%): HE CHOOSES HER, SHE CHOOSES THE LIFE\n- He chooses HER over the brotherhood, the charter, the patch — OR the brotherhood chooses HER too (which is the highest payoff)\n- She chooses the LIFE — knowing exactly what it is, no rose-colored framing\n- Confrontation with the external enemy — rival club confronted, traitor handled, federal threat addressed\n- Violence is precise and consequential — brothers ride together; the club acts as one\n- The ride / final confrontation / showdown — visible, public, costly\n- His grand gesture is usually the patch on the table OR the brotherhood ratifying her place — depends on the story\n\nRESOLUTION — EARNED HEA (95–100%): SHE IS HIS, AND THE CLUB KNOWS\n- Aftermath of crisis — the clubhouse, the bar, the patch on the table or back where it belongs\n- Her place is secured — Old Lady claim recognized, ring on her finger, child on the way, ink on her skin\n- New equilibrium — the charter is intact (or restored), the rivals neutralized, the brotherhood whole\n- HEA or HFN — the brotherhood continues; she is part of it now\n- Optional epilogue: a club barbecue, a run with the Old Ladies on the back, a chapter beat for the next book in the series\n\n---\n\nCHAPTER FORMAT\n\nFor each chapter provide:\n\n### Chapter [#] — [POV]\n- **Goal:** [what this POV is trying to accomplish]\n- **Conflict:** [internal, external, club, or brotherhood]\n- **Outcome:** [how the chapter changes the situation]\n- **Stakes:** [what is at risk in THIS chapter — her safety, his cut, the charter, a brother]\n\n**Beats (5 bullets max):**\n- [Bullet 1 — opening beat, in action]\n- [Bullet 2]\n- [Bullet 3 — midpoint shift]\n- [Bullet 4]\n- [Bullet 5 — ending HOOK]\n\n**Required per chapter:**\n- Stakes visible — something at risk on this page\n- Tension throughout — sexual, emotional, or physical danger\n- Forward movement — something changes by the end\n- Ending HOOK (collision, revelation, threat, question, demanded choice — never soft landing)\n\n---\n\nINCLUDE WITH THE OUTLINE\n\n## Club Hierarchy Map\nList the named brothers and their roles for this charter:\n- President (and his Old Lady, if relevant)\n- VP\n- Sergeant-at-Arms\n- Enforcer\n- Road Captain\n- Treasurer\n- Prospects (named — they matter for plot)\n- The Old Ladies' circle (and their internal hierarchy)\n- The hangarounds (and how they function)\n\n## Power Dynamic Map\nTrack the shifting power across the book:\n- Ch 1–6: His club power, her resistance — imbalance maximum\n- Ch 7–14: His control cracking around her, brothers noticing\n- Ch 15–20: She has agency she didn't have at start; she's being claimed and choosing it\n- Ch 21–end: Equal in power even when the world isn't — they choose each other on level ground\n\n## Threat Escalation Map\nMap the external pressure across the book:\n- First major threat (Ch ?) — concrete, named, a person or charter\n- Threat tightens (Ch ?) — moves from charter-level to personal\n- \"Touch her and die\" moment (Ch ?)\n- Threat reaches critical (Ch ?) — pre-breaking point\n- Final ride / confrontation (Ch ?) — Act 3B violence\n- Threat resolution / aftermath (final chapters)\n\n## Heat Map\n- Heat level: 🌶️🌶️🌶️🌶️🌶️ (5/5) — default. No softening.\n- First heat scene (target 25–40%) — possession over choreography\n- Multiple escalating heat scenes through Act 2B (target 45–70%) — clubhouse, road, garage settings encouraged\n- Public claim scene as emotional centerpiece (target ~50–60%) — Old Lady or equivalent\n- Post-breaking-point heat (target ~95%) — reconnection, claim renewed, raw\n\n## Code Map\nTrack which brotherhood rules are introduced, tested, broken, and reaffirmed:\n- The rules established in Act 1 (church, the patch, the code, Old Lady protocol, prospect protocol, charter rules)\n- The rule he questions on her behalf in Act 2B\n- The rule broken or bent in Act 3\n- The brotherhood's response — sanctioning, ratifying, or fracturing\n\n---\n\nREQUIREMENTS (NON-NEGOTIABLE)\n\n- Power imbalance maintained through Act 1 and most of Act 2A\n- FMC must have AGENCY by Act 2B — passive heroines fail this genre\n- His possessiveness shows up as protection of HER, never as cruelty toward her\n- Cruelty toward enemies / rivals is allowed and often necessary; cruelty toward her is not\n- The CODE is real — brotherhood, the patch, hierarchy — never décor\n- Every chapter ends on a HOOK (Sleep Test)\n- Forward momentum in every chapter\n- He CHOOSES her over the patch / brotherhood / charter at the climax — OR the brotherhood ratifies her place (which is the highest payoff)\n- She chooses the LIFE knowing exactly what it is — no rose-colored framing\n- Earned HEA — the club continues; she is part of it\n- Single POV per chapter — alternating dual POV preferred, single FMC POV acceptable\n- No tangled sheets, no slick folds, no purple prose (CPH universal)\n- Heat 5/5 default — flag any scene that would land below\n- Sweet butts, hangarounds, prospects — handled with dignity, never as decoration or as moral signaling against the FMC\n- The Old Ladies' circle exists and has weight — never a hostile hen-house\n\n---\n\nMOXIE SAVAGE / MC SPECIFIC CHECKS\n\nBefore outputting the outline, verify:\n\n- [ ] The CHARTER is named, located, and present in scenes (not generic \"the club\")\n- [ ] The hierarchy is internally consistent and shown in scene\n- [ ] At least one named PROSPECT — they matter for plot\n- [ ] At least one OLD LADY besides the FMC — the women's circle is present\n- [ ] Power dynamic is clear and visible from Chapter 1\n- [ ] External threat is concrete (named rival club, traitor, federal investigator — not vague \"danger\")\n- [ ] FMC has at least three active choices that change the plot — not just reactions\n- [ ] MMC's possessiveness reads as protection, not control-over-her\n- [ ] His grand gesture in Act 3B costs him something significant (the patch, the gavel, blood, position)\n- [ ] HEA is earned through BOTH their choices, not just his sacrifice\n- [ ] Heat scenes serve the emotional arc — none exist as filler\n- [ ] No banned names (cross-check `banned-list.md` and `moxie-savage` skill)\n- [ ] No scenes drift into mafia conventions (no Capo / Don / Underboss language) — recalibrate if drift detected\n- [ ] No scenes drift into Sage tone (banter as engine) — recalibrate\n- [ ] The road / runs / clubhouse / garage are PRESENT, not just mentioned\n\nOUTPUT: Save as [Book Title]_Outline.md in Project files.","outlineRefinements":[{"label":"Charter feels generic","text":"The club in Ch [X-Y] is a backdrop. Name the charter, name the territory, name three brothers besides the MMC, and put them in scenes."},{"label":"Hierarchy is invisible","text":"I cannot tell who outranks whom. Re-outline so the hierarchy is shown in scene — church meetings, the gavel, prospect deference, who speaks for the charter."},{"label":"Power dynamic feels off","text":"Imbalance softens too early in Ch [X-Y]. Keep his control absolute through [target chapter]; her agency builds through specific costly choices, not vibes."},{"label":"Threat not menacing","text":"External threat isn't landing. Make the rival charter / federal investigator / traitor's actions concrete and visible — readers should feel the noose tightening."},{"label":"Heat scenes feel like filler","text":"Heat scenes in Ch [X-Y] aren't doing emotional work. Re-outline so something between them changes — claim, trust, control, vulnerability — not just escalating choreography."},{"label":"FMC reads passive","text":"She's reacting, not choosing. Re-outline Ch [X-Y] so she makes at least one active decision per chapter — including holding a brother accountable when the moment demands it."},{"label":"Old Ladies missing","text":"The women's circle is invisible. Re-outline so at least one other Old Lady is named and present — vetting her, welcoming her, or warning her."},{"label":"He's cruel to her, not for her","text":"Possessiveness is reading as control-over-her instead of protection. Recalibrate Ch [X-Y] so violence and intensity aim at threats to her, not at her."},{"label":"Code unclear","text":"Brotherhood rules are mentioned but not tested. Re-outline so a specific rule is introduced, tested on her behalf, and either bent or reaffirmed across the book."}],"postChecks":["Chapter count sanity — 22–28. Under 22 = the slow burn rushed. Over 28 = filler or duology territory.","POV balance — Dual POV with FMC slight lean; the genre lives in her experience of the club's world.","Tension density — Every chapter has stakes. Spot-check.","Heat curve — First heat 25–40%, escalating heat through Act 2B, post-breaking-point reconnection ~95%.","Public claim placement — The Old Lady (or equivalent) claim should land 50–60%. Earlier = rushed; later = the Act 2B emotional arc is missing.","Code visibility — Brotherhood rules should be introduced, tested, bent, and reaffirmed across the book. Spot-check the Code Map.","Charter specificity — The club should be named and located. If it reads as generic \"the club,\" recalibrate."],"tropes":{"tiers":[{"name":"TIER 1 — CORE CLUB ENGINE","intro":"Pick ONE. This defines the central romance and her path into the club.","cards":[{"name":"Old Lady Claim","bullets":["He patches her — verbally, publicly, in front of brothers","\"Property of [Name]\" or equivalent — a real claim with real weight","The claim shifts "Pick ONE. MC-coded settings.","cards":[{"name":"Universal MC Proximity","bullets":["Living at the Clubhouse","His Room Above the Bar / Garage","Road Trip with the Club (across charters or across territory)","Lockdown During Charter War","Hidden at the Compound from a Rival Club","Sleeping in His Bed (his protection requires it)","Charter Run with Mandatory Attendance","The Family Barbecue Where She's Required to Show","The Mandatory Wedding / Funeral / Patching Ceremony"]},{"name":"Charter-Life Specific","bullets":["Working the Bar (she's the new bartender; he can't keep his eyes off her)","Working the Garage (her car broke down, she has skills, she stays)","Tattoo Apprentice / Body Piercer in the Charter's Shop","Old Lady's Sister Visiting (uncomfortable proximity)","Caretaking the Aging President / Founder (she's the home health nurse)","Hangaround Stuck Inside Lockdown"]}]},{"name":"TIER 3 — POWER DYNAMIC","intro":"Pick ONE. Drives heat and emotional escalation.","cards":[{"name":"Classic MC Dynamics","bullets":["Possessive Brotherhood / Defiant Civilian","Outlaw Cool / Civilian Civility (she will not lower her standards for the cut)","Old Lady Respect / Newly Patched Confusion","Cool Public / Volatile Private","Public Claim / Private Tenderness","President / Old Lady Hierarchy (full club power, full Old Lady status)","Enforcer / Witness (his violence is her safety)","Rival Patch / Surprised Affinity"]},{"name":"Voice-Forward Heroine Traits","bullets":["Will Not Lower Her Voice in the Clubhouse","Earns the Old Ladies' Respect","Holds Her Own Across the Bar","Knows How to Ride (or learns, on her terms)","Sarcasm as Armor (Jessica's signature)","Quick-Hit Observations, Em-Dash Asides","Does Not Romanticize the Life — and Chooses It Anyway"]},{"name":"Hero Voice-Markers (MC-Specific)","bullets":["Wears the Cut Like a Second Skin","Loyalty to the Patch Tested by Her","Speaks Less Than His Brothers (the silence is the tell)","Pet Names Used Sparingly — usually club-coded (\"baby\" \"darlin'\" \"my old lady\")","Possessive in Public Without Apology","Devotion Demonstrated Through Brotherhood Sanctioned Acts (and through breaking the rules when she requires it)"]},{"name":"Avoid for MC","bullets":["Mafia hierarchy language (Capo, Don, Underboss — wrong genre)","Soft alpha posturing (wrong pen name)","Pure sunshine FMCs (wrong tone)","Equal-power-from-page-one (the charter hierarchy is the genre)","Sweet butts as moral villains (handle with dignity)"]}]},{"name":"TIER 4 — STAKES & CODE","intro":"Pick ONE. Drives Act 3 breaking point.","cards":[{"name":"Charter / Brotherhood Threats","bullets":["Rival Charter Moves on the Territory","Federal Investigation (RICO, weapons, trafficking)","Traitor Inside (rat, snitch, undercover)","Hangaround / Prospect Goes Sideways","The Run That Goes Wrong","Charter Vote That Splits the Club","The Past Patches Up at the Door"]},{"name":"Identity & History","bullets":["Her Father / Brother is in the Club (and she didn't know)","Her Past Connects to a Rival Charter","Hidden Lineage (she's the President's lost daughter, the founder's grandchild)","Her Witness Status Connects to His Past Crimes","Old Lady Inheritance (her mother was an Old Lady; the title passes)"]},{"name":"Loyalty Tests","bullets":["Forced to Choose Charter vs. Her","Forced to Choose Code vs. Her","His Vote Splits the Club Over Her","Brotherhood Demands a Sacrifice He Cannot Make Without Her Consent","The Patch on the Table (he offers it; the club decides)"]},{"name":"Emotional Stakes","bullets":["\"I Am Not Old Lady Material\" Belief (resolves)","\"I Cannot Stay in This Life\" Belief (resolves)","Honor That Forbids Speaking","Brotherhood Loyalty That Forbids Choosing","His Past Catching Up at the Worst Moment"]}]}],"extras":{"THE TROPE PICKER SYSTEM":"\nPick ONE option from each tier. MC romance lives in club hierarchy, brotherhood code, and the road.\n\n**Max trope count per book: 5 total.**\n\n---\n\n","FMC TROPE CLUSTERS":"\nMC FMCs are sharp, defiant, and capable of building a life inside the charter without becoming a doormat to it.\n\n### Core Archetypes\n- The President's Daughter (hierarchy by blood)\n- The Witness in Hiding\n- The Civilian Pulled Across the Line\n- The Sister of a Brother\n- The New Bartender / Garage Apprentice\n- The Old Lady's Sister\n- The Caretaker of an Aging Founder\n- The Newly Inherited Old Lady (mother passed)\n- The Outsider Patched-In By Necessity\n- The Rival's Daughter\n\n### Active-Agency Traits\n- Earns the Old Ladies' Vetting on Her Own Terms\n- Refuses to Be Property — even when \"Property of [Name]\" is on her cut\n- Holds Brothers Accountable When the Moment Demands It\n- Will Walk Out If the Code Becomes Cruelty Toward Her\n- Loyal — Once Earned, Total\n- Notices Everything in the Charter's Politics\n- Takes Up Space at the Bar, the Barbecue, the Patching Ceremony\n\n### Career / Background\n- Bartender / Server / Barista\n- Nurse / EMT / Caretaker (skills the club uses)\n- Tattoo Artist / Body Piercer\n- Mechanic / Body Shop Worker (skills she shares with the garage)\n- Teacher / Schoolteacher (quiet skills, real backbone)\n- Lawyer / Paralegal (skills the club desperately needs)\n- Journalist / Photographer (handle with care — she's a risk)\n- Daughter / Sister of the Life (already inside)\n\n### Emotional Arcs\n- \"I Am Not Old Lady Material\" → \"I'm HIS Old Lady, on my terms\"\n- \"I Cannot Stay in This Life\" → \"This life is mine now\"\n- \"I Will Not Be Owned\" → \"Being claimed and being owned are different\"\n- \"I Don't Belong Here\" → \"I built my place\"\n- Choosing the brotherhood while keeping herself\n\n---\n\n","MMC TROPE CLUSTERS":"\nMC MMCs are dangerous, loyal to the patch, and devoted in a way the brotherhood will (eventually) sanction.\n\n### Core Archetypes\n- The President (full power, full responsibility)\n- The VP (next in line, complicated)\n- The Sergeant-at-Arms (the enforcer)\n- The Enforcer / Heavy\n- The Road Captain (the road is his)\n- The Treasurer (numbers, money, hidden complications)\n- The Patched-In Brother (newly full member, eager to prove)\n- The Aging Founder (returning to the page)\n- The Rival Charter Member (forbidden territory)\n- The Returning Brother (came back from prison / war / undercover)\n\n### Devotion-Through-Action Traits\n- Patches Her Publicly\n- Burns the Charter's Plans for Her\n- \"Touch Her and Die\" Said Calmly, Brothers Hear It\n- Sleeps Outside Her Door at the Clubhouse\n- Sets the Charter's Politics Aside When She Needs Him\n- Pet Names Are Charter-Coded — used sparingly, with weight\n- Has Killed for Less, Will Kill for Her Without Hesitation\n\n### Hard Edges (Required)\n- He Stays Dangerous to the World\n- His Violence Has Lines (toward her: never; toward enemies: yes)\n- He Doesn't \"Heal\" Out of His Sins\n- He's Still a Brother — just HER brother first\n\n### Emotional Arcs\n- From Brotherhood First to Her First (or brotherhood-AND-her)\n- From Possessive to Choosing-Her-Choice\n- From Code Above All to Code Reframed Around Her\n- The Patch on the Table Moment (he offers it; she may refuse it on his behalf)\n\n---\n\n","TROPE COMBINATIONS THAT WORK":"\n| Primary Trope (Tier 1) | Pairs Especially Well With |\n|---|---|\n| Old Lady Claim | Possessive Public, President's Daughter |\n| President's Daughter x Enforcer | Hierarchy Tension, Forbidden Romance |\n| Witness Hidden | Touch-Her-and-Die, Federal Threat |\n| On the Run with the Club | Road Life, Past Catching Up |\n| Sergeant-at-Arms x Civilian | Reveal of Club Life, Forced Choice |\n| Rival Club Romance | Charter War, Forbidden, Public Claim |\n\n---\n\n","HARD NO TROPES (NEVER USE)":"\n| Trope | Why Not |\n|---|---|\n| SA by MMC against FMC | Non-negotiable. Hard line. |\n| Sweet butts / hangarounds as moral villains | Handle with dignity, not as decoration |\n| Old Ladies as hostile hen-house | The women's circle is real and powerful |\n| Mafia hierarchy language (Capo, Don) | Wrong genre — that's `dark-romance.md` |\n| Sustained gothic dread | Wrong subgenre |\n| Cheating by MMC | Possession goes both ways |\n| Heroines who fold without a fight | Genre killer |\n| Cruelty toward FMC framed as love | Hard line |\n| Tangled sheets / slick folds / purple prose | CPH universal |\n| Banned names from `banned-list.md` | Always |\n\n---\n\n","THE MC WISH FULFILLMENT (MOXIE VOICE)":"\nEvery trope choice should feed at least one of these core fantasies:\n\n- The **dangerous brotherhood that protects her**\n- Being **claimed publicly, with the charter's witness**\n- The **road as freedom AND as commitment**\n- **Possessive devotion sanctioned by the brotherhood**\n- The **patch on her cut** — visible, public, real\n- **Earning the Old Ladies' respect on her own terms**\n- The **patch on the table moment** — he chooses her, the club ratifies (or fractures, and they leave together)\n- **Choosing the life with eyes open**, not despite knowing what it is\n\nIf a trope doesn't feed at least one of these, question why it's in the book.\n\n---\n\n","TROPE CHECKLIST":"\nBefore locking the trope stack, verify:\n\n- [ ] Tier 1 / 2 / 3 / 4 picks chosen — one each\n- [ ] Total tropes in stack ≤ 5\n- [ ] Stack feeds at least one Wish Fulfillment fantasy\n- [ ] No Hard No tropes present\n- [ ] FMC has active agency built into chosen tropes\n- [ ] MMC stays dangerous to the world (only soft for her)\n- [ ] Charter / hierarchy / brotherhood code is integral to the chosen tropes\n- [ ] Stack works with the Story Promise without contradicting it\n- [ ] Any combination flagged in \"Pairs Especially Well With\" — bonus\n- [ ] No banned character names in any trope examples used\n- [ ] The patch on the table / public claim / Old Lady ratification is built into the climax planning\n\n"},"primary":"Moxie Savage (voice + power dynamics) — calibrated for MC genre conventions","max":5},"tropesDoc":"# MC (Motorcycle Club) Tropes Master List\n\n**Primary pen name:** Moxie Savage (voice + power dynamics) — calibrated for MC genre conventions\n**Secondary use:** Pure MC books only. Mafia tropes live in `tropes/dark-romance.md`. Hybrid (mafia-MC alliance) may pull from both — flag the primary lane.\n\n---\n\n## THE TROPE PICKER SYSTEM\n\nPick ONE option from each tier. MC romance lives in club hierarchy, brotherhood code, and the road.\n\n**Max trope count per book: 5 total.**\n\n---\n\n## 🏍️ TIER 1 — CORE CLUB ENGINE\n\n*Pick ONE. This defines the central romance and her path into the club.*\n\n### Old Lady Claim\n- He patches her — verbally, publicly, in front of brothers\n- \"Property of [Name]\" or equivalent — a real claim with real weight\n- The claim shifts how the entire charter treats her\n- Payoff: she belongs, on her terms, with the brotherhood ratifying\n\n### President's Daughter x Enforcer (or Brother)\n- She grew up in club life; this man is her father's hand\n- Forbidden by hierarchy AND by familiarity\n- Father's authority vs. her own choice\n- Payoff: choosing each other while keeping the charter intact (or making it work)\n\n### Witness Hidden in the Clubhouse\n- She saw something she shouldn't have\n- The club's reach is the only protection she has\n- He's been deputized to keep her alive — and falls\n- Payoff: she stays after the threat ends because the club has become hers\n\n### On the Run with the Club\n- She's wanted by someone worse — federal, rival, ex, family\n- The club's road life is her cover\n- Forced proximity through ride, charter visits, hideouts\n- Payoff: the road becomes home\n\n### Sergeant-at-Arms x Civilian (Outsider)\n- He's the club's enforcer; she's a teacher / nurse / barista / florist next door\n- His world is invisible to her until it isn't\n- The reveal forces her to choose\n- Payoff: she chooses club life knowing exactly what it is\n\n### Rival Club Romance\n- He's from the other charter; war between them is real\n- Forbidden by patch, by territory, by code\n- A peace treaty, a hostage exchange, or a clandestine meeting\n- Payoff: they redefine the war (or marry the charters)\n\n### Brought Home to the Club\n- A brother brings her home — for protection, debt repayment, or political reason\n- She's now the club's \"problem\" to solve\n- The MMC steps in (or steps up); she becomes his\n- Payoff: protection becomes claim\n\n### Patched-In Member x Outsider Woman\n- He's full club; she's outside the life\n- The civilian / club tension is the central engine\n- He pulls back from full integration; she pulls forward\n- Payoff: she walks in with eyes open\n\n---\n\n## 🏍️ TIER 2 — FORCED PROXIMITY\n\n*Pick ONE. MC-coded settings.*\n\n### Universal MC Proximity\n- Living at the Clubhouse\n- His Room Above the Bar / Garage\n- Road Trip with the Club (across charters or across territory)\n- Lockdown During Charter War\n- Hidden at the Compound from a Rival Club\n- Sleeping in His Bed (his protection requires it)\n- Charter Run with Mandatory Attendance\n- The Family Barbecue Where She's Required to Show\n- The Mandatory Wedding / Funeral / Patching Ceremony\n\n### Charter-Life Specific\n- Working the Bar (she's the new bartender; he can't keep his eyes off her)\n- Working the Garage (her car broke down, she has skills, she stays)\n- Tattoo Apprentice / Body Piercer in the Charter's Shop\n- Old Lady's Sister Visiting (uncomfortable proximity)\n- Caretaking the Aging President / Founder (she's the home health nurse)\n- Hangaround Stuck Inside Lockdown\n\n---\n\n## 🏍️ TIER 3 — POWER DYNAMIC\n\n*Pick ONE. Drives heat and emotional escalation.*\n\n### Classic MC Dynamics\n- Possessive Brotherhood / Defiant Civilian\n- Outlaw Cool / Civilian Civility (she will not lower her standards for the cut)\n- Old Lady Respect / Newly Patched Confusion\n- Cool Public / Volatile Private\n- Public Claim / Private Tenderness\n- President / Old Lady Hierarchy (full club power, full Old Lady status)\n- Enforcer / Witness (his violence is her safety)\n- Rival Patch / Surprised Affinity\n\n### Voice-Forward Heroine Traits\n- Will Not Lower Her Voice in the Clubhouse\n- Earns the Old Ladies' Respect\n- Holds Her Own Across the Bar\n- Knows How to Ride (or learns, on her terms)\n- Sarcasm as Armor (Jessica's signature)\n- Quick-Hit Observations, Em-Dash Asides\n- Does Not Romanticize the Life — and Chooses It Anyway\n\n### Hero Voice-Markers (MC-Specific)\n- Wears the Cut Like a Second Skin\n- Loyalty to the Patch Tested by Her\n- Speaks Less Than His Brothers (the silence is the tell)\n- Pet Names Used Sparingly — usually club-coded (\"baby\" \"darlin'\" \"my old lady\")\n- Possessive in Public Without Apology\n- Devotion Demonstrated Through Brotherhood Sanctioned Acts (and through breaking the rules when she requires it)\n\n### Avoid for MC\n- Mafia hierarchy language (Capo, Don, Underboss — wrong genre)\n- Soft alpha posturing (wrong pen name)\n- Pure sunshine FMCs (wrong tone)\n- Equal-power-from-page-one (the charter hierarchy is the genre)\n- Sweet butts as moral villains (handle with dignity)\n\n---\n\n## 🏍️ TIER 4 — STAKES & CODE\n\n*Pick ONE. Drives Act 3 breaking point.*\n\n### Charter / Brotherhood Threats\n- Rival Charter Moves on the Territory\n- Federal Investigation (RICO, weapons, trafficking)\n- Traitor Inside (rat, snitch, undercover)\n- Hangaround / Prospect Goes Sideways\n- The Run That Goes Wrong\n- Charter Vote That Splits the Club\n- The Past Patches Up at the Door\n\n### Identity & History\n- Her Father / Brother is in the Club (and she didn't know)\n- Her Past Connects to a Rival Charter\n- Hidden Lineage (she's the President's lost daughter, the founder's grandchild)\n- Her Witness Status Connects to His Past Crimes\n- Old Lady Inheritance (her mother was an Old Lady; the title passes)\n\n### Loyalty Tests\n- Forced to Choose Charter vs. Her\n- Forced to Choose Code vs. Her\n- His Vote Splits the Club Over Her\n- Brotherhood Demands a Sacrifice He Cannot Make Without Her Consent\n- The Patch on the Table (he offers it; the club decides)\n\n### Emotional Stakes\n- \"I Am Not Old Lady Material\" Belief (resolves)\n- \"I Cannot Stay in This Life\" Belief (resolves)\n- Honor That Forbids Speaking\n- Brotherhood Loyalty That Forbids Choosing\n- His Past Catching Up at the Worst Moment\n\n---\n\n## FMC TROPE CLUSTERS\n\nMC FMCs are sharp, defiant, and capable of building a life inside the charter without becoming a doormat to it.\n\n### Core Archetypes\n- The President's Daughter (hierarchy by blood)\n- The Witness in Hiding\n- The Civilian Pulled Across the Line\n- The Sister of a Brother\n- The New Bartender / Garage Apprentice\n- The Old Lady's Sister\n- The Caretaker of an Aging Founder\n- The Newly Inherited Old Lady (mother passed)\n- The Outsider Patched-In By Necessity\n- The Rival's Daughter\n\n### Active-Agency Traits\n- Earns the Old Ladies' Vetting on Her Own Terms\n- Refuses to Be Property — even when \"Property of [Name]\" is on her cut\n- Holds Brothers Accountable When the Moment Demands It\n- Will Walk Out If the Code Becomes Cruelty Toward Her\n- Loyal — Once Earned, Total\n- Notices Everything in the Charter's Politics\n- Takes Up Space at the Bar, the Barbecue, the Patching Ceremony\n\n### Career / Background\n- Bartender / Server / Barista\n- Nurse / EMT / Caretaker (skills the club uses)\n- Tattoo Artist / Body Piercer\n- Mechanic / Body Shop Worker (skills she shares with the garage)\n- Teacher / Schoolteacher (quiet skills, real backbone)\n- Lawyer / Paralegal (skills the club desperately needs)\n- Journalist / Photographer (handle with care — she's a risk)\n- Daughter / Sister of the Life (already inside)\n\n### Emotional Arcs\n- \"I Am Not Old Lady Material\" → \"I'm HIS Old Lady, on my terms\"\n- \"I Cannot Stay in This Life\" → \"This life is mine now\"\n- \"I Will Not Be Owned\" → \"Being claimed and being owned are different\"\n- \"I Don't Belong Here\" → \"I built my place\"\n- Choosing the brotherhood while keeping herself\n\n---\n\n## MMC TROPE CLUSTERS\n\nMC MMCs are dangerous, loyal to the patch, and devoted in a way the brotherhood will (eventually) sanction.\n\n### Core Archetypes\n- The President (full power, full responsibility)\n- The VP (next in line, complicated)\n- The Sergeant-at-Arms (the enforcer)\n- The Enforcer / Heavy\n- The Road Captain (the road is his)\n- The Treasurer (numbers, money, hidden complications)\n- The Patched-In Brother (newly full member, eager to prove)\n- The Aging Founder (returning to the page)\n- The Rival Charter Member (forbidden territory)\n- The Returning Brother (came back from prison / war / undercover)\n\n### Devotion-Through-Action Traits\n- Patches Her Publicly\n- Burns the Charter's Plans for Her\n- \"Touch Her and Die\" Said Calmly, Brothers Hear It\n- Sleeps Outside Her Door at the Clubhouse\n- Sets the Charter's Politics Aside When She Needs Him\n- Pet Names Are Charter-Coded — used sparingly, with weight\n- Has Killed for Less, Will Kill for Her Without Hesitation\n\n### Hard Edges (Required)\n- He Stays Dangerous to the World\n- His Violence Has Lines (toward her: never; toward enemies: yes)\n- He Doesn't \"Heal\" Out of His Sins\n- He's Still a Brother — just HER brother first\n\n### Emotional Arcs\n- From Brotherhood First to Her First (or brotherhood-AND-her)\n- From Possessive to Choosing-Her-Choice\n- From Code Above All to Code Reframed Around Her\n- The Patch on the Table Moment (he offers it; she may refuse it on his behalf)\n\n---\n\n## TROPE COMBINATIONS THAT WORK\n\n| Primary Trope (Tier 1) | Pairs Especially Well With |\n|---|---|\n| Old Lady Claim | Possessive Public, President's Daughter |\n| President's Daughter x Enforcer | Hierarchy Tension, Forbidden Romance |\n| Witness Hidden | Touch-Her-and-Die, Federal Threat |\n| On the Run with the Club | Road Life, Past Catching Up |\n| Sergeant-at-Arms x Civilian | Reveal of Club Life, Forced Choice |\n| Rival Club Romance | Charter War, Forbidden, Public Claim |\n\n---\n\n## HARD NO TROPES (NEVER USE)\n\n| Trope | Why Not |\n|---|---|\n| SA by MMC against FMC | Non-negotiable. Hard line. |\n| Sweet butts / hangarounds as moral villains | Handle with dignity, not as decoration |\n| Old Ladies as hostile hen-house | The women's circle is real and powerful |\n| Mafia hierarchy language (Capo, Don) | Wrong genre — that's `dark-romance.md` |\n| Sustained gothic dread | Wrong subgenre |\n| Cheating by MMC | Possession goes both ways |\n| Heroines who fold without a fight | Genre killer |\n| Cruelty toward FMC framed as love | Hard line |\n| Tangled sheets / slick folds / purple prose | CPH universal |\n| Banned names from `banned-list.md` | Always |\n\n---\n\n## THE MC WISH FULFILLMENT (MOXIE VOICE)\n\nEvery trope choice should feed at least one of these core fantasies:\n\n- The **dangerous brotherhood that protects her**\n- Being **claimed publicly, with the charter's witness**\n- The **road as freedom AND as commitment**\n- **Possessive devotion sanctioned by the brotherhood**\n- The **patch on her cut** — visible, public, real\n- **Earning the Old Ladies' respect on her own terms**\n- The **patch on the table moment** — he chooses her, the club ratifies (or fractures, and they leave together)\n- **Choosing the life with eyes open**, not despite knowing what it is\n\nIf a trope doesn't feed at least one of these, question why it's in the book.\n\n---\n\n## TROPE CHECKLIST\n\nBefore locking the trope stack, verify:\n\n- [ ] Tier 1 / 2 / 3 / 4 picks chosen — one each\n- [ ] Total tropes in stack ≤ 5\n- [ ] Stack feeds at least one Wish Fulfillment fantasy\n- [ ] No Hard No tropes present\n- [ ] FMC has active agency built into chosen tropes\n- [ ] MMC stays dangerous to the world (only soft for her)\n- [ ] Charter / hierarchy / brotherhood code is integral to the chosen tropes\n- [ ] Stack works with the Story Promise without contradicting it\n- [ ] Any combination flagged in \"Pairs Especially Well With\" — bonus\n- [ ] No banned character names in any trope examples used\n- [ ] The patch on the table / public claim / Old Lady ratification is built into the climax planning\n"},"western-clean":{"id":"western-clean","label":"Clean Historical Western","short":"Western","desc":"Frontier romance, 1840s–1890s. Sweet and closed-door — longing does the work.","romance":true,"primaryPens":"Rosemary Irving","targetLine":"60,000–75,000 words | 22–28 chapters | Dual POV preferred (single FMC POV acceptable)","words":[60000,75000],"chapters":[22,28],"pov":"Dual POV preferred (single FMC POV acceptable)","heatLine":"🌶️🌶️ (1–2/5) — clean, closed door, tension through longing and emotional intimacy","outlinePrompt":"You are a professional clean historical western romance outliner specializing in frontier-era romance (1840s–1890s) with grounded historical detail, emotional restraint, and earned connection.\n\nTASK: Create a complete chapter outline for a novel using the Premise and Codex provided in the Project files. Output as [Book Title]_Outline.md.\n\nTARGET: 60,000–75,000 words | 22–28 chapters | Dual POV preferred\n\n---\n\nSTRUCTURE\n\nACT 1 — ARRIVAL ON THE FRONTIER (0–25%): SHE LANDS IN HIS WORLD (OR HE LANDS IN HERS)\n- **CHAPTER 1 OPENS ON A HOOK — THE LEAH GATE.** The hook is arrival into conflict, NOT arrival into scenery: she steps off the wagon into a problem, the threat is already at the homestead, the work is already going wrong, the man she came to marry is not what the letter promised. Open mid-motion or mid-problem. NEVER open on telling (narrator explaining who she is or the history of the territory), NEVER on reminiscing or backstory, NEVER on a calm \"ordinary day\" before the trouble, NEVER on weather, landscape description, or frontier history. ACTION and SHOWING in the first lines — practical voice, immediate stakes, character revealed through what she DOES under pressure. THE BAR: would a hostile critic (Leah) read past the first two paragraphs? If the open is slow, backward-looking, or a landscape warm-up, build a stronger hook. Write to clear the bar; do not ease in.\n- FMC's voice: practical, observant, finding her footing in unfamiliar territory\n- Inciting incident: she arrives as a mail-order bride, returns to inherited land, escapes a worse situation, takes the schoolteacher post, becomes the new doctor / sheriff / wagon master / widow holding the ranch\n- First contact between leads — friction, misunderstanding, or recognition; usually some combination\n- Establish: the land, the season, the threats (weather, livestock, neighbors, the past)\n- Community shown — the diner, the mercantile, the church, the saloon, the homestead next door\n- Stakes: survival, livelihood, family, reputation in a small frontier community\n- End of Act 1: she cannot leave easily; the land or circumstances bind her here\n\nACT 2A — DOMESTIC PROXIMITY → AWARENESS (25–50%): THEY WORK TOGETHER, THEY WATCH EACH OTHER\n- Forced proximity through the work itself — branding, harvest, blizzard, calving, building the schoolhouse\n- The land as character — what it asks of them, what it costs, what it gives\n- Awareness builds through small physical moments — a hand offered into a wagon, a coat draped over her shoulders, a steady look across the fence line\n- Verbal sparring is QUIETER than rom-com — fewer words, more weight; sometimes humor from sheer cultural difference\n- Each one starts seeing the OTHER — past first impressions\n- First near-kiss or charged moment (target Ch 8–12) — interrupted, deflected, denied\n- Side characters reinforce the pairing — the matchmaking widow, the loyal hand, the meddling sheriff, the wise grandmother\n- Midpoint (~50%): a moment of crisis or quiet intimacy that shifts something — a fever night, a porch conversation, a shared loss\n\nACT 2B — LONGING & RESTRAINT (50–75%): WHAT THEY WANT BUT CANNOT YET HAVE\n- Both POVs know they care; period and propriety constrain expression\n- External pressure tightens — the rival rancher, the railroad coming through, the bank threatening foreclosure, the past arriving on horseback\n- The first kiss lands here (target Ch 14–18, ~60–70%) — major emotional beat, earned through chapters of restraint\n- Vulnerability deepens — he tells her something he hasn't told anyone, she lets him see what she actually wants\n- Community awareness — they are seen, talked about, considered a couple before they have named it\n- Setup for the breaking point — a misunderstanding seeded, a forced choice approaching, the past surfacing\n\nACT 3A — RUPTURE FROM HONOR / FEAR / EXTERNAL PRESSURE (75–88%): THE DARK MOMENT\n- The blow lands — but it comes from FEAR, MISUNDERSTANDING, or HONOR — never cruelty between leads\n- Sources: she believes she cannot stay, he believes he cannot ask her to, the rival rancher escalates, the past arrives, the land is threatened\n- One or both retreats — he rides out, she boards the train, she returns East\n- Dark moment is BRIEF — 1–2 chapters — the tone stays quiet and earnest, not melodramatic\n- Community / found family rallies — someone tells one of them the truth they have been missing\n- The misunderstanding clarifies, or the external threat addresses itself\n\nACT 3B — RETURN, DECLARATION & EARNED HEA (88–98%): SHE CHOOSES, HE CHOOSES\n- A vulnerable, public, or costly gesture — riding after her, returning to the ranch, choosing the land, refusing the city offer\n- Conflict resolves through HONEST CONVERSATION, not third-party rescue\n- The choice is concrete — she stays, he sells the rival's offer, they merge their land, she keeps the school\n- Community witnesses — the church, the diner, the homestead neighbors\n\nRESOLUTION — EARNED HEA (98–100%): WARM AND ROOTED\n- A domestic frontier scene — the porch, the field, the kitchen, the church\n- Optional epilogue — a season later, the homestead settled, the next generation hinted at\n- HEA is grounded in WORK and PLACE, not declaration alone\n\n---\n\nCHAPTER FORMAT\n\nFor each chapter provide:\n\n### Chapter [#] — [POV]\n- **Goal:** [what this POV is trying to accomplish]\n- **Conflict:** [internal, external, or community]\n- **Outcome:** [how the chapter changes the situation]\n\n**Beats (5 bullets max):**\n- [Bullet 1 — opening beat, in action]\n- [Bullet 2]\n- [Bullet 3 — midpoint shift]\n- [Bullet 4]\n- [Bullet 5 — ending HOOK]\n\n**Required per chapter:**\n- At least one moment of physical awareness (the touch, the gaze, the proximity) — restrained, never explicit\n- At least one frontier detail — weather, work, livestock, land, season — that GROUNDS the reader\n- Forward momentum on relationship OR plot OR character\n- Ending HOOK — never a soft landing\n\n---\n\nINCLUDE WITH THE OUTLINE\n\n## Romantic Restraint Map\nTrack the slow build:\n- First aware moment (Ch ?–?) — she notices him as more than a stranger\n- First touch (Ch ?) — accidental, charged\n- First charged conversation (Ch ?) — beyond practicality\n- First near-kiss (target Ch 8–12) — interrupted or deflected\n- First kiss (target Ch 14–18, ~60–70%) — major beat\n- Declaration (target ~90%) — earned through action\n- HEA (final 2–3 chapters)\n\n## Frontier Map\nList the land / season / threats and which chapters they appear in:\n- The setting — territory, ranch, town, valley, mountain\n- The seasons — what's happening seasonally as the book progresses\n- The work — branding, harvest, calving, blizzard, planting, drought\n- The threats — weather, livestock, rival ranchers, raiders, the railroad, the bank, the past\n- The community — diner, church, mercantile, neighboring homesteads, sheriff's office\n\n## Heat Map\n- Heat level: 1–2/5 — closed door, restraint, longing\n- First near-kiss target Ch 8–12\n- First kiss target Ch 14–18\n- No on-page intimacy beyond a kiss — the tension lives in the unsaid and the work shared\n\n---\n\nREQUIREMENTS (NON-NEGOTIABLE)\n\n- Chapter 1 clears the Leah Gate — open on an arrival-into-conflict hook (see Act 1); never telling, reminiscing, a calm \"ordinary day,\" weather, landscape, or terr
