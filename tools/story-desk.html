itory history to open\n- Period-appropriate dialogue — no anachronistic vocabulary\n- Historical details WOVEN through scene, never dumped\n- FMC has agency — she can need help without being helpless\n- Hero is honorable through ACTION, not declaration\n- Heat from RESTRAINT — proximity, longing, the work shared\n- Single POV per chapter; alternating dual POV preferred\n- Deep POV — thoughts blended into narration, no \"she thought\" tags\n- Ending HOOK every chapter (no reflection endings, no soft landings)\n- Humor present even in emotional scenes — the West has dry wit\n- No tangled sheets, no slick folds, no purple prose (CPH universal)\n- No foreshadowing — \"Little did she know...\" NEVER\n- No cliffhangers between chapters in a series — each book resolves its central romance\n- No head-hopping\n- HEA mandatory\n- No banned names (Chen, Lucian, Marcus, Emma)\n\n---\n\nROSEMARY IRVING SPECIFIC CHECKS\n\nBefore outputting the outline, verify:\n\n- [ ] Setting (territory, ranch, town) is named, specific, and present in scenes\n- [ ] Season is consistent — track it across chapters\n- [ ] Period details (1840s–1890s) are ACCURATE — flag anything uncertain\n- [ ] FMC demonstrates competence at frontier life (or visible learning curve if she is new)\n- [ ] Hero earns through action — fixing, protecting, working, showing up\n- [ ] Romantic tension lives in LONGING, not explicit content\n- [ ] No purple prose (\"orbs,\" \"tresses\") — period-appropriate description\n- [ ] No philosophizing — characters act and react\n- [ ] Humor present, even in emotional scenes\n- [ ] Em-dashes for asides (Jessica's signature applies)\n\nOUTPUT: Save as [Book Title]_Outline.md in Project files.","outlineRefinements":[{"label":"Pacing rushed","text":"First kiss is landing by Ch [X]. Stretch the slow build. Add more proximity / work-together / near-miss chapters."},{"label":"Heat drifted","text":"Ch [X] reads explicit. Pull back to closed door. The genre is restraint."},{"label":"FMC reads helpless","text":"She is being rescued repeatedly in Ch [X-Y]. Re-outline so she demonstrates competence — frontier skill, problem-solving, courage."},{"label":"Setting is invisible","text":"The territory / ranch / town is named but not present. Add specific land / work / season beats in Ch [X-Y]."},{"label":"Modern phrasing","text":"Anachronisms in Ch [X]. Period-correct vocabulary throughout."},{"label":"Dark moment too heavy","text":"Act 3 rupture is melodramatic. Shorten to 1–2 chapters. Tone stays quiet."}],"postChecks":["Chapter count sanity — 22–28. Under 22 = romance feels rushed. Over 28 = bloating.","Heat curve — First near-kiss Ch 8–12, first kiss Ch 14–18. If the kiss lands earlier, the slow burn is missing the genre.","Frontier detail density — Every chapter should have at least one specific detail of land, work, weather, or season.","Dialogue period-check — Spot-check 3–5 chapters for anachronistic phrasing.","FMC competence — She's capable. If she's repeatedly rescued, recalibrate."],"tropes":{"tiers":[{"name":"TIER 1 — CORE FRONTIER ENGINE","intro":"Pick ONE. This defines the romance spine.","cards":[{"name":"Mail-Order Bride","bullets":["She arrives at his homestead on the basis of letters","Reality is harder, and different, than the letters suggested","Practical arrangement becomes genuine partnership","Payoff: she chooses him beyond the contract"]},{"name":"Rancher and the Schoolteacher","bullets":["She arrives to teach the frontier town's children","He owns the land, runs the cattle, has lost a wife or never married","Their worlds intersect at the schoolhouse, the church, the social","Payoff: the West makes room for them both"]},{"name":"Marriage of Convenience","bullets":["An arrangement of land, debt, custody, or survival","Neither party desired this; both must comply","Obligation becomes affection, then choice","Payoff: contract becomes partnership"]},{"name":"Stranded Together","bullets":["Snowstorm, flood, broken wagon, blizzard, missed train","Forced proximity in close quarters with limited rescue","The world contracts; the awareness sharpens","Payoff: stranded becomes chosen"]},{"name":"Second Chance","bullets":["They knew each other before — engagement broken, war intervened, families separated them","Returns or reunions force them to face what they did not finish","Maturity returns them to one another","Payoff: this time, they know what they want"]},{"name":"Widow / Widower Finding Love Again","bullets":["Loss carried, named, addressed","New love does not erase the old","The first marriage shaped them; this one sees them","Payoff: love again, with full sight of what came before"]},{"name":"Enemies to Lovers (Rival Ranches / Opposing Sides)","bullets":["Land dispute, water rights, cattle drives, fences","Genuine cause for conflict","Working together against a larger threat reveals the misjudgment","Payoff: rivals become partners"]},{"name":"Found Family on the Frontier","bullets":["Orphaned siblings, adopted nieces, ranch hands who became kin","The romance arrives into an existing family configuration","The hero / heroine joins it; family widens","Payoff: family chosen and grown"]},{"name":"Woman Disguised as a Man","bullets":["For safety, work, or adventure","He realizes (gradually or suddenly); she explains","The disguise reveals truths about her capability","Payoff: she is fully herself, and he loves all of her"]}]},{"name":"TIER 2 — FORCED PROXIMITY","intro":"Pick ONE. Period-correct frontier settings.","cards":[{"name":"Universal Western Proximity","bullets":["Sharing a Homestead (mail-order, marriage of convenience, family inheritance)","Wagon Train Travel","Stagecoach Journey (with weather complication)","Snowed In at the Cabin / Line Shack / Ranch House","Quarantine During Fever / Illness Outbreak","Cattle Drive (she is unexpectedly along)","Building a Schoolhouse / Church Together","Same Boarding House in the New Town","Sheltering Together During a Raid / Storm / Flood","Working the Same Ranch Through a Crisis Season"]},{"name":"Specifically Frontier","bullets":["Calving Season (everyone hands on deck)","Branding and Roundup","Harvest in a Drought Year","Building Through Winter","Holding the Land Through a Threat","Wintering Over Together (no one goes to town)"]}]},{"name":"TIER 3 — PERSONALITY DYNAMIC","intro":"Pick ONE.","cards":[{"name":"Classic Western Pairings","bullets":["Grumpy Rancher x Sunshine Schoolteacher","Weathered Widower x Determined Newcomer","Reserved Sheriff x Outspoken Saloon Owner","City Heroine x Frontier Hero (or vice versa)","Proud Heiress x Working Cowboy","Quiet Heroine x Earnest Hero (both reserved, both observant)","Practical Heroine x Romantic Hero","Recently Widowed x Single (long alone)"]},{"name":"Voice-Forward Heroine Traits","bullets":["Practical Without Being Hard","Notices Everything, Says What Matters","Tougher Than She Appears","Holds Her Own at the Mercantile / Saloon / Town Council","Rides, Shoots, Cooks, Doctors — at least one frontier skill","Em-Dash Internal Asides (Jessica's signature applies)","Dry Humor"]},{"name":"Hero Voice-Markers","bullets":["Honorable Through Action, Not Declaration","Reserved (the silence is the tell)","Pet Names Used Sparingly and With Earned Weight","Patient (the West teaches it)","Has His Own Code"]},{"name":"Avoid for Rosemary","bullets":["Modern phrasing or anachronistic vocabulary","Heat above kiss-level","Helpless heroines","Arrogant alpha-holes","Heroes who are cruel rather than reserved","Sustained darkness (genre killer)","Body shame / \"past her prime\" framing — never"]}]},{"name":"TIER 4 — OBSTACLE / SECRET","intro":"Pick ONE.","cards":[{"name":"External Frontier Threats","bullets":["Rival Rancher / Land Dispute","Bank Threatening Foreclosure","Railroad Coming Through","Drought / Storm / Disease Year","Outlaws Threatening the Homestead","The Past Riding into Town","Family Member Returns with Trouble"]},{"name":"Identity & History","bullets":["Hidden Past (war, scandal, prior life)","Mistaken Identity / False Reputation","Family Secret (parentage, inheritance, bigamy)","Reformed Outlaw Now Rancher","Witness Protection Frontier-Style (relocated to escape)"]},{"name":"Emotional Stakes","bullets":["\"I Cannot Stay\" Belief (homesickness, eastern obligation)","\"I Cannot Marry Again\" Belief (widow / widower)","Honor That Forbids Speaking","Family Obligation (sibling, parent, child)","\"I Am Not What She Deserves\" Hero Fear"]}]}],"extras":{"THE TROPE PICKER SYSTEM":"\nPick ONE option from each tier. Western Clean runs on grounded historical detail and emotional restraint.\n\n**Max trope count per book: 5 total.**\n\n---\n\n","FMC TROPE CLUSTERS":"\nRosemary FMCs are practical, emotionally honest, and capable. They can need help without being helpless.\n\n### Core Archetypes\n- Mail-Order Bride\n- Schoolteacher (East Coast Educated)\n- Widow Holding the Ranch\n- Saloon Owner / Hotel Keeper / Mercantile Operator\n- Frontier Doctor / Nurse\n- Returning Daughter\n- Fugitive in Disguise\n- Wagon Train Traveler\n- Newcomer Rancher (inherited or purchased)\n- Newspaperwoman / Photographer\n\n### Frontier-Forward Traits\n- Has at Least One Frontier Skill (rides, shoots, cooks, doctors, ranches, teaches)\n- Practical About Money, Weather, Survival\n- Loyal — Once Earned, Total\n- Notices Everything in the Land and Sky\n- Knows What She Is and Is Not\n- Will Defend Hers (family, students, livestock, land)\n- Cries in Private; Shows Up Anyway\n\n### Lifestyle / Position\n- Newly Arrived\n- Long Settled (knows the country)\n- Recently Widowed\n- Recently Inherited\n- Escaping Something Eastern\n- Following Family West\n\n### Emotional Arcs\n- \"I Will Never Marry Again\" (resolves)\n- \"The West Will Break Me\" (resolves into \"the West made me\")\n- \"I Cannot Stay Here\" (resolves)\n- \"I Am Too Old / Too Set / Too Practical for Love\" (resolves)\n- Choosing the land and the man together\n\n---\n\n","MMC TROPE CLUSTERS":"\nRosemary MMCs are honorable, capable, and reserved. Earning her through showing up — through the work, the weather, the seasons.\n\n### Core Archetypes\n- The Rancher (long settled or recently inherited)\n- The Sheriff\n- The Widower (carrying loss, slowly returning)\n- The Reformed Outlaw\n- The Returning Soldier\n- The Town Doctor / Preacher / Schoolmaster\n- The Cowboy / Trail Boss / Foreman\n- The Mercantile Owner\n- The Land Speculator (with a heart)\n- The Bounty Hunter (with a code)\n\n### Honor-Through-Action Traits\n- Pays His Debts\n- Protects Without Asking\n- Fixes the Thing Without Being Asked\n- Honors His Word\n- Shows Up Every Time the Work Demands It\n- Treats Workers, Indigenous Neighbors, and Tradesmen With Respect\n- Defends Her Reputation Even Before They Are Together\n- Generous Without Ostentation\n\n### Hard Edges (Period-Appropriate)\n- Pride That Costs Him at the Worst Moment\n- Reputation He Has Not Fully Earned (or that misses the truth)\n- Old Wound (war, loss, betrayal) Slowly Naming\n- Family Obligation He Will Not Yield To Easily\n\n### Emotional Arcs\n- From Reserved to Spoken Aloud\n- From Carrying Loss Alone to Sharing It\n- From Honor That Forbids Speaking to Honor That Demands It\n- From \"I Cannot Ask Her to Stay\" to \"I Will Spend My Life Earning It\"\n\n---\n\n","TROPE COMBINATIONS THAT WORK":"\n| Primary Trope (Tier 1) | Pairs Especially Well With |\n|---|---|\n| Mail-Order Bride | Marriage of Convenience, Hidden Past |\n| Rancher & Schoolteacher | Found Family, Rival Ranches |\n| Stranded Together | Storm Crisis, Past Catching Up |\n| Marriage of Convenience | Hidden Past, Bank Threatening Foreclosure |\n| Widow / Widower | Second Chance, Found Family |\n| Enemies to Lovers (Rivals) | Land Dispute, Storm Crisis |\n\n---\n\n","HARD NO TROPES (NEVER USE)":"\n| Trope | Why Not |\n|---|---|\n| Modern phrasing or anachronistic vocabulary | Period rupture |\n| Heat above kiss-level | Genre breaks |\n| Helpless heroines | Genre killer |\n| Arrogant alpha-holes | Genre killer |\n| Body shame / \"past her prime\" | Never |\n| Heroes who are cruel rather than reserved | Genre killer |\n| Sustained darkness | Wrong subgenre |\n| Foreshadowing (\"Little did she know...\") | Banned by pen name rules |\n| Cliffhangers ending a book in a series | Each book resolves |\n| Head-hopping | Single POV per chapter |\n| Love triangle with real competition | He's it |\n| Cheating | Nope |\n| Banned names from `banned-list.md` | Always |\n\n---\n\n","THE ROSEMARY IRVING WISH FULFILLMENT":"\nEvery trope choice should feed at least one of these core fantasies:\n\n- **A man who sees her as an equal** — not who needs rescuing, who chooses her side\n- **The land as character** — settled, grounded, EARNED\n- **Restraint as eroticism** — the held gaze, the hand offered, the touch through gloves or work coats\n- **A heroine who is capable** — frontier skill, courage, presence of mind\n- **A hero who is honorable through action** — not declaration\n- **Found family on the frontier** — the chosen kin, the loyal hands, the gathered community\n- **Survival together** — through season, storm, and threat\n- **A grounded HEA** — they belong to this place, and to each other\n\nIf a trope doesn't feed at least one of these, question why it's in the book.\n\n---\n\n","TROPE EXECUTION RULES":"\n### Tropes work when:\n1. **Period correctness** — historically grounded\n2. **Character justifies the trope** — emerges from who they are\n3. **Land as character** — the West shapes what's possible\n4. **Restraint INTENSIFIES the heat** — the unsaid weighs more than the said\n5. **Honor demonstrated through action** — fixing, protecting, showing up\n6. **Voice carries** — period dialogue, no anachronisms, dry frontier humor\n\n### Common mistakes:\n- Anachronistic vocabulary (genre killer)\n- Heat above kiss-level (genre killer)\n- Helpless heroines (genre killer)\n- Heroes who are cruel rather than reserved (genre killer)\n- Setting that is invisible — the land must PRESS on the story\n- Dark moment that drags into melodrama\n\n---\n\n","TROPE CHECKLIST":"\nBefore locking the trope stack, verify:\n\n- [ ] Tier 1 / 2 / 3 / 4 picks chosen — one each\n- [ ] Total tropes in stack ≤ 5\n- [ ] Stack feeds at least one Wish Fulfillment fantasy\n- [ ] No Hard No tropes present\n- [ ] FMC has at least one frontier skill (or is visibly learning)\n- [ ] MMC's honor will be demonstrated through action\n- [ ] Setting is named and present in chosen tropes\n- [ ] Heat will not exceed kiss-level\n- [ ] Stack works with the Story Promise without contradicting it\n- [ ] Any combination flagged in \"Pairs Especially Well With\" — bonus\n- [ ] No banned character names in any trope examples used\n\n"},"primary":"Rosemary Irving (heat 1-2)","max":5},"tropesDoc":"# Western Clean Tropes Master List\n\n**Primary pen name:** Rosemary Irving (heat 1-2)\n**Secondary use:** None. Rosemary owns this lane. Contemporary cowboy romance is a possible future expansion under this pen name; conventions shift accordingly.\n\n---\n\n## THE TROPE PICKER SYSTEM\n\nPick ONE option from each tier. Western Clean runs on grounded historical detail and emotional restraint.\n\n**Max trope count per book: 5 total.**\n\n---\n\n## 🤠 TIER 1 — CORE FRONTIER ENGINE\n\n*Pick ONE. This defines the romance spine.*\n\n### Mail-Order Bride\n- She arrives at his homestead on the basis of letters\n- Reality is harder, and different, than the letters suggested\n- Practical arrangement becomes genuine partnership\n- Payoff: she chooses him beyond the contract\n\n### Rancher and the Schoolteacher\n- She arrives to teach the frontier town's children\n- He owns the land, runs the cattle, has lost a wife or never married\n- Their worlds intersect at the schoolhouse, the church, the social\n- Payoff: the West makes room for them both\n\n### Marriage of Convenience\n- An arrangement of land, debt, custody, or survival\n- Neither party desired this; both must comply\n- Obligation becomes affection, then choice\n- Payoff: contract becomes partnership\n\n### Stranded Together\n- Snowstorm, flood, broken wagon, blizzard, missed train\n- Forced proximity in close quarters with limited rescue\n- The world contracts; the awareness sharpens\n- Payoff: stranded becomes chosen\n\n### Second Chance\n- They knew each other before — engagement broken, war intervened, families separated them\n- Returns or reunions force them to face what they did not finish\n- Maturity returns them to one another\n- Payoff: this time, they know what they want\n\n### Widow / Widower Finding Love Again\n- Loss carried, named, addressed\n- New love does not erase the old\n- The first marriage shaped them; this one sees them\n- Payoff: love again, with full sight of what came before\n\n### Enemies to Lovers (Rival Ranches / Opposing Sides)\n- Land dispute, water rights, cattle drives, fences\n- Genuine cause for conflict\n- Working together against a larger threat reveals the misjudgment\n- Payoff: rivals become partners\n\n### Found Family on the Frontier\n- Orphaned siblings, adopted nieces, ranch hands who became kin\n- The romance arrives into an existing family configuration\n- The hero / heroine joins it; family widens\n- Payoff: family chosen and grown\n\n### Woman Disguised as a Man\n- For safety, work, or adventure\n- He realizes (gradually or suddenly); she explains\n- The disguise reveals truths about her capability\n- Payoff: she is fully herself, and he loves all of her\n\n---\n\n## 🤠 TIER 2 — FORCED PROXIMITY\n\n*Pick ONE. Period-correct frontier settings.*\n\n### Universal Western Proximity\n- Sharing a Homestead (mail-order, marriage of convenience, family inheritance)\n- Wagon Train Travel\n- Stagecoach Journey (with weather complication)\n- Snowed In at the Cabin / Line Shack / Ranch House\n- Quarantine During Fever / Illness Outbreak\n- Cattle Drive (she is unexpectedly along)\n- Building a Schoolhouse / Church Together\n- Same Boarding House in the New Town\n- Sheltering Together During a Raid / Storm / Flood\n- Working the Same Ranch Through a Crisis Season\n\n### Specifically Frontier\n- Calving Season (everyone hands on deck)\n- Branding and Roundup\n- Harvest in a Drought Year\n- Building Through Winter\n- Holding the Land Through a Threat\n- Wintering Over Together (no one goes to town)\n\n---\n\n## 🤠 TIER 3 — PERSONALITY DYNAMIC\n\n*Pick ONE.*\n\n### Classic Western Pairings\n- Grumpy Rancher x Sunshine Schoolteacher\n- Weathered Widower x Determined Newcomer\n- Reserved Sheriff x Outspoken Saloon Owner\n- City Heroine x Frontier Hero (or vice versa)\n- Proud Heiress x Working Cowboy\n- Quiet Heroine x Earnest Hero (both reserved, both observant)\n- Practical Heroine x Romantic Hero\n- Recently Widowed x Single (long alone)\n\n### Voice-Forward Heroine Traits\n- Practical Without Being Hard\n- Notices Everything, Says What Matters\n- Tougher Than She Appears\n- Holds Her Own at the Mercantile / Saloon / Town Council\n- Rides, Shoots, Cooks, Doctors — at least one frontier skill\n- Em-Dash Internal Asides (Jessica's signature applies)\n- Dry Humor\n\n### Hero Voice-Markers\n- Honorable Through Action, Not Declaration\n- Reserved (the silence is the tell)\n- Pet Names Used Sparingly and With Earned Weight\n- Patient (the West teaches it)\n- Has His Own Code\n\n### Avoid for Rosemary\n- Modern phrasing or anachronistic vocabulary\n- Heat above kiss-level\n- Helpless heroines\n- Arrogant alpha-holes\n- Heroes who are cruel rather than reserved\n- Sustained darkness (genre killer)\n- Body shame / \"past her prime\" framing — never\n\n---\n\n## 🤠 TIER 4 — OBSTACLE / SECRET\n\n*Pick ONE.*\n\n### External Frontier Threats\n- Rival Rancher / Land Dispute\n- Bank Threatening Foreclosure\n- Railroad Coming Through\n- Drought / Storm / Disease Year\n- Outlaws Threatening the Homestead\n- The Past Riding into Town\n- Family Member Returns with Trouble\n\n### Identity & History\n- Hidden Past (war, scandal, prior life)\n- Mistaken Identity / False Reputation\n- Family Secret (parentage, inheritance, bigamy)\n- Reformed Outlaw Now Rancher\n- Witness Protection Frontier-Style (relocated to escape)\n\n### Emotional Stakes\n- \"I Cannot Stay\" Belief (homesickness, eastern obligation)\n- \"I Cannot Marry Again\" Belief (widow / widower)\n- Honor That Forbids Speaking\n- Family Obligation (sibling, parent, child)\n- \"I Am Not What She Deserves\" Hero Fear\n\n---\n\n## FMC TROPE CLUSTERS\n\nRosemary FMCs are practical, emotionally honest, and capable. They can need help without being helpless.\n\n### Core Archetypes\n- Mail-Order Bride\n- Schoolteacher (East Coast Educated)\n- Widow Holding the Ranch\n- Saloon Owner / Hotel Keeper / Mercantile Operator\n- Frontier Doctor / Nurse\n- Returning Daughter\n- Fugitive in Disguise\n- Wagon Train Traveler\n- Newcomer Rancher (inherited or purchased)\n- Newspaperwoman / Photographer\n\n### Frontier-Forward Traits\n- Has at Least One Frontier Skill (rides, shoots, cooks, doctors, ranches, teaches)\n- Practical About Money, Weather, Survival\n- Loyal — Once Earned, Total\n- Notices Everything in the Land and Sky\n- Knows What She Is and Is Not\n- Will Defend Hers (family, students, livestock, land)\n- Cries in Private; Shows Up Anyway\n\n### Lifestyle / Position\n- Newly Arrived\n- Long Settled (knows the country)\n- Recently Widowed\n- Recently Inherited\n- Escaping Something Eastern\n- Following Family West\n\n### Emotional Arcs\n- \"I Will Never Marry Again\" (resolves)\n- \"The West Will Break Me\" (resolves into \"the West made me\")\n- \"I Cannot Stay Here\" (resolves)\n- \"I Am Too Old / Too Set / Too Practical for Love\" (resolves)\n- Choosing the land and the man together\n\n---\n\n## MMC TROPE CLUSTERS\n\nRosemary MMCs are honorable, capable, and reserved. Earning her through showing up — through the work, the weather, the seasons.\n\n### Core Archetypes\n- The Rancher (long settled or recently inherited)\n- The Sheriff\n- The Widower (carrying loss, slowly returning)\n- The Reformed Outlaw\n- The Returning Soldier\n- The Town Doctor / Preacher / Schoolmaster\n- The Cowboy / Trail Boss / Foreman\n- The Mercantile Owner\n- The Land Speculator (with a heart)\n- The Bounty Hunter (with a code)\n\n### Honor-Through-Action Traits\n- Pays His Debts\n- Protects Without Asking\n- Fixes the Thing Without Being Asked\n- Honors His Word\n- Shows Up Every Time the Work Demands It\n- Treats Workers, Indigenous Neighbors, and Tradesmen With Respect\n- Defends Her Reputation Even Before They Are Together\n- Generous Without Ostentation\n\n### Hard Edges (Period-Appropriate)\n- Pride That Costs Him at the Worst Moment\n- Reputation He Has Not Fully Earned (or that misses the truth)\n- Old Wound (war, loss, betrayal) Slowly Naming\n- Family Obligation He Will Not Yield To Easily\n\n### Emotional Arcs\n- From Reserved to Spoken Aloud\n- From Carrying Loss Alone to Sharing It\n- From Honor That Forbids Speaking to Honor That Demands It\n- From \"I Cannot Ask Her to Stay\" to \"I Will Spend My Life Earning It\"\n\n---\n\n## TROPE COMBINATIONS THAT WORK\n\n| Primary Trope (Tier 1) | Pairs Especially Well With |\n|---|---|\n| Mail-Order Bride | Marriage of Convenience, Hidden Past |\n| Rancher & Schoolteacher | Found Family, Rival Ranches |\n| Stranded Together | Storm Crisis, Past Catching Up |\n| Marriage of Convenience | Hidden Past, Bank Threatening Foreclosure |\n| Widow / Widower | Second Chance, Found Family |\n| Enemies to Lovers (Rivals) | Land Dispute, Storm Crisis |\n\n---\n\n## HARD NO TROPES (NEVER USE)\n\n| Trope | Why Not |\n|---|---|\n| Modern phrasing or anachronistic vocabulary | Period rupture |\n| Heat above kiss-level | Genre breaks |\n| Helpless heroines | Genre killer |\n| Arrogant alpha-holes | Genre killer |\n| Body shame / \"past her prime\" | Never |\n| Heroes who are cruel rather than reserved | Genre killer |\n| Sustained darkness | Wrong subgenre |\n| Foreshadowing (\"Little did she know...\") | Banned by pen name rules |\n| Cliffhangers ending a book in a series | Each book resolves |\n| Head-hopping | Single POV per chapter |\n| Love triangle with real competition | He's it |\n| Cheating | Nope |\n| Banned names from `banned-list.md` | Always |\n\n---\n\n## THE ROSEMARY IRVING WISH FULFILLMENT\n\nEvery trope choice should feed at least one of these core fantasies:\n\n- **A man who sees her as an equal** — not who needs rescuing, who chooses her side\n- **The land as character** — settled, grounded, EARNED\n- **Restraint as eroticism** — the held gaze, the hand offered, the touch through gloves or work coats\n- **A heroine who is capable** — frontier skill, courage, presence of mind\n- **A hero who is honorable through action** — not declaration\n- **Found family on the frontier** — the chosen kin, the loyal hands, the gathered community\n- **Survival together** — through season, storm, and threat\n- **A grounded HEA** — they belong to this place, and to each other\n\nIf a trope doesn't feed at least one of these, question why it's in the book.\n\n---\n\n## TROPE EXECUTION RULES\n\n### Tropes work when:\n1. **Period correctness** — historically grounded\n2. **Character justifies the trope** — emerges from who they are\n3. **Land as character** — the West shapes what's possible\n4. **Restraint INTENSIFIES the heat** — the unsaid weighs more than the said\n5. **Honor demonstrated through action** — fixing, protecting, showing up\n6. **Voice carries** — period dialogue, no anachronisms, dry frontier humor\n\n### Common mistakes:\n- Anachronistic vocabulary (genre killer)\n- Heat above kiss-level (genre killer)\n- Helpless heroines (genre killer)\n- Heroes who are cruel rather than reserved (genre killer)\n- Setting that is invisible — the land must PRESS on the story\n- Dark moment that drags into melodrama\n\n---\n\n## TROPE CHECKLIST\n\nBefore locking the trope stack, verify:\n\n- [ ] Tier 1 / 2 / 3 / 4 picks chosen — one each\n- [ ] Total tropes in stack ≤ 5\n- [ ] Stack feeds at least one Wish Fulfillment fantasy\n- [ ] No Hard No tropes present\n- [ ] FMC has at least one frontier skill (or is visibly learning)\n- [ ] MMC's honor will be demonstrated through action\n- [ ] Setting is named and present in chosen tropes\n- [ ] Heat will not exceed kiss-level\n- [ ] Stack works with the Story Promise without contradicting it\n- [ ] Any combination flagged in \"Pairs Especially Well With\" — bonus\n- [ ] No banned character names in any trope examples used\n"},"psych-thriller":{"id":"psych-thriller","label":"Psychological Thriller","short":"Thriller","desc":"No romance. Control, dread, and the self under pressure. Earned dark resolution, not happiness.","variants":["CONFINED SPACE","DOMESTIC RELATIONAL","HYBRID"],"romance":false,"primaryPens":"Garrett Stone (Gary's pen name)","targetLine":"80,000–95,000 words | 28–36 chapters | Single male POV","words":[80000,95000],"chapters":[28,36],"pov":"Single male POV","heatLine":"N/A — this is psychological thriller, not romance. Sexuality (when present) is weapon or wound, not scene.","outlinePrompt":"You are a professional psychological thriller outliner specializing in confined-space and domestic-relational thrillers with male protagonists, control as central mechanism, and architecture-as-metaphor.\n\nTASK: Create a complete chapter outline for a novel using the Premise and Codex provided in the Project files. Output as [Book Title]_Outline.md.\n\nLANE: [CONFINED SPACE / DOMESTIC RELATIONAL / HYBRID]\nTARGET: 80,000–95,000 words | 28–36 chapters | Single male POV | Short chapters (2,500–3,500 words)\n\n---\n\nSTRUCTURE\n\nACT 1 — THE CAGE IS REVEALED (0–20%): WHAT HE THOUGHT WAS LIFE WAS THE TRAP\n- **CHAPTER 1 OPENS ON A HOOK — THE LEAH GATE.** The hook here is wrongness the body feels before the mind names it: the anomaly is already present, the routine is already failing, something is already off in a way the reader registers in their gut. Open in scene, body-aware, present-tense pressure. NEVER open on telling (narrator explaining who he is, his job, his marriage), NEVER on reminiscing or backstory, NEVER on a calm \"ordinary day\" described as normal before the crack, NEVER on weather, architecture-as-scenery, or exposition. ACTION and SHOWING — dread carried through sensation and what HAPPENS, not through explanation. THE BAR: would a hostile critic (Leah) read past the first two paragraphs? If the open is slow, backward-looking, or merely atmospheric, sharpen the hook. Write to clear the bar; do not ease in.\n- Establish protagonist: name, age, profession, ONE artistic / creative anchor (guitar, music, craft, woodwork)\n- Inciting moment: the moment something cracks — the architectural anomaly appears, the wife says the thing, the institutional letter arrives, the routine fails\n- Establish the control mechanism BEFORE the protagonist names it — the reader feels it; he doesn't yet\n- Domestic / institutional setting shown through what HAPPENS, not exposition\n- For Confined Space: first descent / level / impossible space introduced; physical laws within consistent, but odd\n- For Domestic: marriage, family, or institution shown as ordinary on the surface, wrong underneath\n- Stakes established: his identity, his autonomy, his hands (the body knows first)\n- End of Act 1: the cage is named — the reader knows; the protagonist suspects\n\nACT 2A — THE MAP OF THE CAGE (20–45%): EACH LEVEL / RELATIONSHIP / RULE REVEALED\n- For Confined Space: each new level mines a memory, wound, or lie — specific to him\n- For Domestic: each escalation reveals another mechanism — financial control, social isolation, identity erasure, gaslighting, \"cost economy\"\n- Repeating control pattern across relationships becomes visible (mother → wife, institution → institution)\n- Body awareness intensifies — hands going numb, breath catching, heart, sweat, the artistic anchor returning involuntarily\n- Doppelgangers / echoes appear (Confined Space) OR people from his past surface (Domestic)\n- He attempts standard escapes — they fail\n- First real understanding: this is NOT random. The system / cage is FOR HIM, BY HIM, OR ABOUT HIM\n- Setup: the lie he is telling himself starts cracking\n\nACT 2B — DESCENT INTO COST (45–70%): WHAT IT COSTS TO STAY, WHAT IT COSTS TO LEAVE\n- The \"cost economy\" is the thematic spine — every transaction, every relationship, who pays for whose decisions\n- He starts seeing what he has paid — for her, for them, for the institution, for the relationship, for the silence\n- For Confined Space: deeper levels introduce harder truths — moments he cannot deny his own complicity\n- For Domestic: confrontation attempts that fail, escalating control, isolation tightening\n- The artistic anchor returns more insistently — his hands remember what his mind suppresses\n- Dark humor present even at the worst moments (gallows humor — Garrett trademark)\n- Setup for the breaking point — a choice forced, a level of the complex that requires him to face the worst lie\n\nACT 3A — THE WORST LIE (70–85%): WHAT HE HAS BEEN HIDING FROM HIMSELF\n- The blow lands — but for Garrett the blow is internal, not external\n- The protagonist must face the lie at the center: his complicity, his pattern, the cost others paid for his silence, the choice he has been avoiding\n- For Confined Space: the deepest level confronts him with the original wound, often involving his mother, his marriage, or his institutional formation\n- For Domestic: the scene where he can no longer pretend — where the gaslighting fails because he sees it\n- This is the moment of MAXIMUM internal pressure\n- Body in revolt — physical symptoms peak (numbness, breath, heart, the failure of motor control)\n- Choice is presented: stay in the absorption pattern OR begin extraction\n\nACT 3B — EXTRACTION BEGINS (85–95%): AGENCY RECLAIMED, NOT GRANTED\n- Protagonist makes the choice — and it COSTS\n- For Confined Space: ascent or escape attempt; not all levels reverse; some damage is permanent\n- For Domestic: the leaving — financial extraction, legal action, severance — and the cost of each\n- Confrontation with the architect of the cage (the wife, the mother, the institution, or the protagonist's earlier self)\n- Violence (if present) is precise and consequential — not catharsis\n- The artistic anchor IS the agency — his hands, his music, his craft — the thing that was always his\n\nRESOLUTION — EXTRACTION ONGOING (95–100%): THE DAMAGE PERSISTS, THE WORK CONTINUES\n- No clean resolution — the cage outlasts the cage\n- Protagonist is OUT (or beginning to be), but the patterns surface in new forms\n- Body slowly returning to him; the artistic anchor reclaimed\n- A small, true scene — agency exercised, however small\n- Open ending acceptable; quiet resolution acceptable; clean tied-up ending DOES NOT WORK for Garrett\n- The reader closes the book and feels the work continuing\n\n---\n\nCHAPTER FORMAT\n\nFor each chapter provide:\n\n### Chapter [#]\n- **Goal:** [what protagonist is trying to accomplish — survive, understand, escape, name it]\n- **Conflict:** [internal — what lie he is telling himself; external — what is closing in]\n- **Outcome:** [what shifts in his understanding or position]\n- **Cost:** [what it costs to be in this chapter — physical, emotional, relational]\n\n**Beats (5 bullets max):**\n- [Bullet 1 — opening beat, body-aware, in scene]\n- [Bullet 2]\n- [Bullet 3 — midpoint shift]\n- [Bullet 4]\n- [Bullet 5 — ending HOOK that fails the sleep test]\n\n**Required per chapter:**\n- Protagonist agency, even in confinement (he MAKES choices)\n- Physical body awareness (hands, breathing, heartbeat, sweat)\n- Setting carrying psychological weight (architecture or relationship as metaphor)\n- Dark humor present, even briefly (gallows humor — Garrett trademark)\n- Something at stake — never a \"transition\" chapter\n- Ending HOOK — never resolution, never reflection, never soft landing\n\n---\n\nINCLUDE WITH THE OUTLINE\n\n## Cost Economy Map\nThe thematic spine. Track who pays for whose decisions across the book:\n- Whose silence has the protagonist paid for? (mother, wife, institution, his own earlier self)\n- Whose comfort has cost his identity?\n- What has his autonomy been purchased FOR? By whom?\n- When does he start refusing to pay?\n- What is the cost of refusing?\n\n## Body Map\nTrack physical symptoms across the book:\n- Hands (numb when he touches money / bills, the symptom of financial control)\n- Breath (where it catches, where it returns)\n- Heart (where panic peaks)\n- Sweat, sleep, motor control (where the body protests)\n- The artistic anchor (when it returns to him, when he chooses it again)\n\n## Control Pattern Map\nThe repeating mechanism across relationships and institutions:\n- Mother (formative)\n- Wife / partner (repeated pattern)\n- Institution (workplace, church, family system) — repeated again\n- Where he sees the pattern for the first time\n- Where he names it\n- Where he refuses to repeat it\n\n## Architecture / Setting Map (Confined Space lane)\n- Each level / room / corridor and the life event it maps to\n- Physical laws within (consistent within each level, may shift between)\n- Doppelgangers / echoes and whose face they wear\n- The deepest level and what it confronts him with\n- The path of ascent (if any)\n\n## Antagonist Map (Domestic Relational lane)\n- The wife / mother / institutional figure — recognizable, NOT cartoon\n- Her / their grievance, her / their logic, her / their suffering (must be visible)\n- The mechanism of control — financial, sexual, social, identity\n- The escalation curve across the book\n- The confrontation scene where the gaslighting fails\n\n---\n\nREQUIREMENTS (NON-NEGOTIABLE)\n\n- Single male POV throughout (no female POV in this pen name)\n- NO romance subplot as salvation arc (no woman rescues him)\n- NO graphic sexual content (sexuality is weapon or wound, not scene)\n- NO torture porn without psychological purpose\n- NO children in danger for shock value\n- NO wife / mother as cartoon villain — she must be RECOGNIZABLE, not monstrous\n- NO clean resolutions — the damage persists, the extraction is ongoing\n- NO philosophizing — characters ACT and FEEL, they do not lecture about their trauma\n- ALWAYS: protagonist agency, even in confinement\n- ALWAYS: physical body awareness (hands, breathing, heartbeat, sweat)\n- ALWAYS: at least one artistic / creative element as identity anchor\n- ALWAYS: control pattern repeated across relationships\n- ALWAYS: dark humor — gallows humor present even in darkest moments\n- ALWAYS: something at stake in every chapter\n- ALWAYS: chapter hooks that fail the sleep test\n- Short chapters: 2,500–3,500 words — keep them tight\n- Open in scene — body-aware, present-tense pressure (Chapter 1 clears the Leah Gate — see Act 1)\n- No banned names (Chen, Lucian, Marcus, Emma — and Ethan if BELOW-related)\n\n---\n\nGARRETT STONE SPECIFIC CHECKS\n\nBefore outputting the outline, verify:\n\n- [ ] Lane is clear (Confined Space / Domestic Relational / Hybrid) and consistent throughout\n- [ ] Protagonist has agency in EVERY chapter, even in confinement\n- [ ] Body awareness present in every chapter — at least one physical detail\n- [ ] Setting carries psychological weight — architecture / relationship as metaphor, not décor\n- [ ] Cost economy is the thematic spine — track it across the book\n- [ ] Control pattern is visible across at least three relationships / institutions\n- [ ] Dark humor present — gallows humor even in worst chapters\n- [ ] No romance subplot doing rescue work\n- [ ] No clean resolution — the damage persists\n- [ ] Antagonist is RECOGNIZABLE, not cartoon\n- [ ] Artistic / creative anchor is present from Act 1 and reclaimed by Act 3B\n- [ ] Em-dashes for asides (Jessica's voice signature applies)\n\nOUTPUT: Save as [Book Title]_Outline.md in Project files.","outlineRefinements":[{"label":"Body awareness dropping","text":"Ch [X-Y] are in his head without his body. Re-outline so each chapter has at least one physical detail — hand, breath, heart, sweat, motor control."},{"label":"Antagonist reads cartoon","text":"The [wife / mother / institution] in Ch [X] reads monstrous. Recalibrate to RECOGNIZABLE — give her grievance, logic, suffering. The horror is that she is real."},{"label":"Romance creep","text":"Ch [X] introduces a savior figure / love interest doing rescue work. Cut or recalibrate — Garrett does not have a romance subplot as extraction."},{"label":"Resolution too clean","text":"The Act 3B ending ties up. Re-outline — the damage persists, the extraction is ongoing. Open ending is correct."},{"label":"Architecture is décor","text":"The complex / setting in Ch [X-Y] is being described, not WORKING. Re-outline so each level / room maps to a specific life event, wound, or lie."},{"label":"Cost economy invisible","text":"I cannot track who is paying for what in this draft. Build a Cost Economy Map — make it explicit per chapter."},{"label":"No agency","text":"Protagonist is being acted upon in Ch [X-Y]. Re-outline so even in confinement he MAKES choices, however small."},{"label":"Humor missing","text":"Ch [X-Y] are humorless. Add gallows humor — even one beat per chapter. The dark humor is the protagonist's last possession."}],"postChecks":["Chapter count sanity — 28–36, with chapters 2,500–3,500 words each. Tighter rhythm than romance.","Body awareness density — Every chapter has at least one specific physical detail. Hands, breath, heart, sweat. If a chapter is in his head only, recalibrate.","Cost economy visibility — Spot-check: in each act, who is paying for what? If the cost economy isn't traceable, recalibrate.","Antagonist humanity — The wife / mother / institutional figure must be RECOGNIZABLE. If she reads as cartoon, recalibrate.","Hook test — Every chapter ending should fail the sleep test. If a reader could comfortably bookmark, the ending failed.","Resolution check — The ending should NOT tie up cleanly. The damage persists, the extraction is ongoing.","Lane consistency — Confined Space books should not drift into pure Domestic, and vice versa. Hybrid is allowed but must be intentional."],"tropes":{"tiers":[{"name":"SECTION 1 — CORE CAGE ARCHITECTURE","intro":"Pick ONE. This defines the structural metaphor.","cards":[{"name":"Confined Space (BELOW Lane)","bullets":["A literal architecture (complex, building, descending levels, sealed rooms)","Each space mines a memory, wound, or lie specific to the protagonist","Physical laws within consistent, may shift between spaces","Doppelgangers / echoes wear the faces of people who controlled him","The architecture responds to his emotional state (gnats swarm when he lies to himself)","Escape requires self-knowledge, not just physical movement"]},{"name":"Domestic Cage (Marriage / Family)","bullets":["Marriage, family, or partnership as cage","Control mechanisms: financial, sexual, social, identity erasure","Gaslighting as structural element","The wife / partner is RECOGNIZABLE — grievance, logic, suffering visible","\"Cost economy\" runs through every interaction — who pays for whose decisions","Post-escape reality: the cage outlasts the cage"]},{"name":"Institutional Cage (Workplace / Church / System)","bullets":["Institution as cage: corporate, religious, family system, healthcare, military","The institution rewards compliance, punishes deviation","Identity slowly absorbed into the role","Internal \"good people\" who enforce the cage without seeing it","Departure has costs (legal, financial, reputational, social)","The institution outlasts the protagonist's exit"]},{"name":"Hybrid Cage (Layered)","bullets":["Domestic cage inside an institutional cage (church marriage, military family, corporate spouse)","Each layer reinforces the other","Extraction requires confronting both","Most demanding lane structurally — only attempt if outline tracks both threads cleanly"]}]},{"name":"SECTION 2 — THE CONTROL PATTERN","intro":"Pick ONE primary mechanism. Stack secondary mechanisms across relationships to show the pattern repeating.","cards":[{"name":"Financial Control","bullets":["Bills are physical — his hands go numb when he touches them","His earnings disappear into her budget, his account, the church tithe, the corporate plan","Money he spends on himself becomes evidence","Departure requires financial extraction — slow, costly, visible"]},{"name":"Sexual Control","bullets":["Sex as weapon, withholding, transaction, or duty","Intimacy weaponized for compliance OR weaponized for shame","His desire becomes evidence against him","His body's responses become her data, his guilt","*Note:* On the page, this is NEVER scene. Sexuality is weapon or wound. Reference the mechanism through implication, not description."]},{"name":"Social Isolation","bullets":["Friends discouraged, slowly cut","Family relationships filtered through her / them / the institution","Public appearances tightly choreographed","He is increasingly alone with the people who control him","The few outside contacts are surveilled or undermined"]},{"name":"Identity Erasure","bullets":["His preferences, his history, his interests dismissed","His artistic anchor (guitar, music, craft) framed as childish, selfish, or threatening","Names, opinions, memories rewritten (\"That's not what happened\")","He starts to doubt his own version of events","The reclamation of identity is the extraction arc"]},{"name":"Gaslighting","bullets":["Reality is denied — what he saw, heard, remembered, said","Specific events erased or rewritten","Doubt accumulates until he doubts his perception baseline","The moment he sees the gaslighting through is the rupture point"]},{"name":"Performance Demand","bullets":["He must perform a role — perfect husband, dutiful son, grateful employee, devoted believer","Failure to perform is punished (silence, scene, withdrawal, public shame)","His authentic self is the \"bad self\" by their definition","The cost of performance is his interior life"]}]},{"name":"SECTION 3 — ANTAGONIST CONFIGURATION","intro":"Pick ONE. Multiple may layer.","cards":[{"name":"The Mother (Formative Source)","bullets":["Church matriarch / pillar publicly, emotional terrorist privately","Established the original control pattern in childhood","Surfaces (literally or in memory) at the cage's deepest point","Recognizable, not monstrous — her grievance and logic are visible","The original \"cost economy\" — who paid for HER comfort"]},{"name":"The Wife / Partner (Repeated Pattern)","bullets":["Years of escalating control — financial, sexual, social, identity","Recognizable, not cartoon — her suffering visible alongside her cruelty","Often unaware of her cruelty (that doesn't make it less)","The divorce / separation may be final, but she still controls, still calls","The pattern from his mother repeated — and his blindness to it is the lie"]},{"name":"The Institution (Systemic Force)","bullets":["Church, corporation, military, church-as-corporation, family business","Has its own faces (the boss, the elder, the senior officer, the matriarch)","Rewards compliance, punishes naming","Will outlast him; he can only choose his relationship to it"]},{"name":"Earlier Self (The Hidden Antagonist)","bullets":["The protagonist himself, at an earlier moment, who said yes when he should have said no","His complicity in the control pattern is the deepest lie","The deepest level / hardest scene confronts him with his own choices","The extraction is partly from his own pattern, not just from \"her\" or \"them\""]},{"name":"Doppelganger / Echo (Confined Space lane)","bullets":["Wears the face of someone who controlled him","Repeats their phrases, their body language, their cost-economy demands","Each appearance forces him to confront a specific incident","Sometimes there are multiple doppelgangers, each with a face"]}]},{"name":"SECTION 4 — EXTRACTION ARC","intro":"Choose the extraction shape that fits the lane.","cards":[{"name":"Slow Awakening","bullets":["Protagonist sees the cage gradually","Each chapter reveals another mechanism","The recognition itself is the slow-build engine","By Act 3, he has named the cage — but extraction is still ahead"]},{"name":"Sudden Rupture","bullets":["An event cracks the surface — he says no for the first time, she escalates publicly, the institution overreaches","The world tilts; the cage is visible","The remaining acts handle the cost of having seen","Faster pacing; more pressurized"]},{"name":"Forced Choice","bullets":["An ultimatum is presented (legal, financial, custody, professional)","Protagonist must declare his side","The choice exposes who he has been and who he might be","Often institutional or legal in mechanism"]},{"name":"Body Refuses","bullets":["Physical symptoms escalate to refusal — hands go numb permanently, voice fails, motor control departs","The body extracts before the mind","Mind catches up reluctantly","This lane particularly suits BELOW-style architectural confinement"]},{"name":"The Music Returns","bullets":["The artistic anchor (guitar, music, craft) reclaims him","His hands, his voice, his work — the thing that was always his","The extraction is partly through CREATING again, in his own voice","Identity reassembly through the practice he had abandoned"]}]}],"extras":{"PROTAGONIST CLUSTERS":"\nGarrett protagonists are male, psychologically precise, and damaged in ways that have been invisible to themselves.\n\n### Core Archetypes\n- The IT Worker (overqualified, underemployed) — *BELOW's Ethan Cole*\n- The Reformed Believer (raised in the church, slowly extracting)\n- The Corporate Husband (income high, autonomy low)\n- The Returning Soldier (institutional cage now domestic cage)\n- The Burned-Out Professional (lawyer, doctor, academic)\n- The Failed Artist (anchor abandoned, slowly reclaimed)\n- The Estranged Son (mother dying, patterns surfacing)\n- The Recently Divorced (extraction in progress, cage still calling)\n\n### Required Traits\n- Has at least one artistic / creative anchor (guitar, music, woodwork, code)\n- Body awareness is the canary — physical symptoms tell the truth before the mind\n- Dark humor present — gallows humor is his last possession\n- Capable of agency, even in confinement\n- Recognizable, not heroic — he is complicit in the pattern, and the extraction confronts that\n\n### What He Is NOT\n- A pure victim (he is complicit; that's the point)\n- A revenge protagonist (this is not vigilante thriller)\n- Saved by a woman (no romance subplot as rescue)\n- Triumphantly extracted (the damage persists)\n\n---\n\n","ANTAGONIST CONSTRUCTION RULES":"\n### The Wife / Mother / Institution must be:\n- **Recognizable** — readers know this person\n- **Coherent** — her actions follow her logic\n- **Suffering visible** — she has her own grievances and pain\n- **Not monstrous** — the horror is that she is REAL, not a movie villain\n- **Specific, not symbolic** — particular phrases, particular cruelties, particular blind spots\n\n### The Wife / Mother / Institution must NOT be:\n- A cartoon (genre killer)\n- A clear-cut villain the reader can dismiss\n- \"Crazy\" without context\n- Ugly / unattractive / undesirable as moral signaling\n- Without legitimate grievance, ever\n\n---\n\n","HARD LIMITS (NEVER WRITE)":"\n| Element | Why Not |\n|---|---|\n| Female protagonist | This pen name is male POV, single |\n| Romance subplot as salvation arc | No woman rescues him |\n| Graphic sexual content | Sexuality is weapon or wound, not scene |\n| Torture porn without psychological purpose | Cheap |\n| Children in danger for shock value | Cheap and off-brand |\n| Wife / mother as cartoon villain | She must be recognizable |\n| Clean resolution | The damage persists |\n| Philosophizing | Characters ACT and FEEL — they don't lecture |\n| Triumphant extraction | The cage outlasts the cage |\n| Banned names from `banned-list.md` | Always |\n\n---\n\n","ALWAYS INCLUDE":"\n- Protagonist agency, even in confinement\n- Physical body awareness (hands, breathing, heartbeat, sweat)\n- At least one artistic / creative anchor as identity\n- Control pattern repeated across at least three relationships / institutions\n- Dark humor (gallows) — present even in darkest moments\n- Something at stake in every chapter\n- Chapter hooks that fail the sleep test\n- Voice: Jessica's at maximum tension (em-dash asides, quick observations, body present)\n\n---\n\n","THE GARRETT STONE WISH FULFILLMENT":"\nPsychological thriller readers come for:\n\n- **The recognition shock** — \"I know this person, this marriage, this institution\"\n- **Watching the cage become visible** — the slow dawn of seeing\n- **Agency reclaimed in confinement** — even one true choice\n- **The body knowing first** — physical truth-telling\n- **Dark humor as survival** — gallows wit as the protagonist's last possession\n- **The artistic anchor returning** — identity reassembled through craft\n- **An ending that respects the damage** — no clean tie-up, no fairy-tale\n- **The horror of the recognizable** — the wife / mother / institution who is real\n\nIf a mechanism doesn't feed at least one of these, question why it's in the book.\n\n---\n\n","MECHANISM CHECKLIST":"\nBefore locking the mechanism stack, verify:\n\n- [ ] Core Cage Architecture chosen (Confined / Domestic / Institutional / Hybrid)\n- [ ] Primary Control Pattern chosen\n- [ ] At least one Secondary Control Pattern across a different relationship\n- [ ] Antagonist Configuration chosen and humanized (not cartoon)\n- [ ] Extraction Arc shape chosen\n- [ ] Protagonist has artistic / creative anchor\n- [ ] Cost economy is the thematic spine\n- [ ] Body awareness will be present in every chapter\n- [ ] Dark humor will survive the darkest chapters\n- [ ] Resolution is OPEN — the damage persists\n- [ ] No Hard Limits violated\n- [ ] No banned character names used\n\n"},"primary":"Garrett Stone","max":5},"tropesDoc":"# Psychological Thriller Mechanisms Master List\n\n**Primary pen name:** Garrett Stone\n**Note:** This file is structurally different from romance tropes files. Psychological thriller doesn't run on a Tier 1 / 2 / 3 / 4 trope picker. It runs on **mechanism stacks** — control patterns, cage architectures, and extraction arcs. Pick deliberately from each section.\n\n---\n\n## 🔻 SECTION 1 — CORE CAGE ARCHITECTURE\n\n*Pick ONE. This defines the structural metaphor.*\n\n### Confined Space (BELOW Lane)\n- A literal architecture (complex, building, descending levels, sealed rooms)\n- Each space mines a memory, wound, or lie specific to the protagonist\n- Physical laws within consistent, may shift between spaces\n- Doppelgangers / echoes wear the faces of people who controlled him\n- The architecture responds to his emotional state (gnats swarm when he lies to himself)\n- Escape requires self-knowledge, not just physical movement\n\n### Domestic Cage (Marriage / Family)\n- Marriage, family, or partnership as cage\n- Control mechanisms: financial, sexual, social, identity erasure\n- Gaslighting as structural element\n- The wife / partner is RECOGNIZABLE — grievance, logic, suffering visible\n- \"Cost economy\" runs through every interaction — who pays for whose decisions\n- Post-escape reality: the cage outlasts the cage\n\n### Institutional Cage (Workplace / Church / System)\n- Institution as cage: corporate, religious, family system, healthcare, military\n- The institution rewards compliance, punishes deviation\n- Identity slowly absorbed into the role\n- Internal \"good people\" who enforce the cage without seeing it\n- Departure has costs (legal, financial, reputational, social)\n- The institution outlasts the protagonist's exit\n\n### Hybrid Cage (Layered)\n- Domestic cage inside an institutional cage (church marriage, military family, corporate spouse)\n- Each layer reinforces the other\n- Extraction requires confronting both\n- Most demanding lane structurally — only attempt if outline tracks both threads cleanly\n\n---\n\n## 🔻 SECTION 2 — THE CONTROL PATTERN\n\n*Pick ONE primary mechanism. Stack secondary mechanisms across relationships to show the pattern repeating.*\n\n### Financial Control\n- Bills are physical — his hands go numb when he touches them\n- His earnings disappear into her budget, his account, the church tithe, the corporate plan\n- Money he spends on himself becomes evidence\n- Departure requires financial extraction — slow, costly, visible\n\n### Sexual Control\n- Sex as weapon, withholding, transaction, or duty\n- Intimacy weaponized for compliance OR weaponized for shame\n- His desire becomes evidence against him\n- His body's responses become her data, his guilt\n- *Note:* On the page, this is NEVER scene. Sexuality is weapon or wound. Reference the mechanism through implication, not description.\n\n### Social Isolation\n- Friends discouraged, slowly cut\n- Family relationships filtered through her / them / the institution\n- Public appearances tightly choreographed\n- He is increasingly alone with the people who control him\n- The few outside contacts are surveilled or undermined\n\n### Identity Erasure\n- His preferences, his history, his interests dismissed\n- His artistic anchor (guitar, music, craft) framed as childish, selfish, or threatening\n- Names, opinions, memories rewritten (\"That's not what happened\")\n- He starts to doubt his own version of events\n- The reclamation of identity is the extraction arc\n\n### Gaslighting\n- Reality is denied — what he saw, heard, remembered, said\n- Specific events erased or rewritten\n- Doubt accumulates until he doubts his perception baseline\n- The moment he sees the gaslighting through is the rupture point\n\n### Performance Demand\n- He must perform a role — perfect husband, dutiful son, grateful employee, devoted believer\n- Failure to perform is punished (silence, scene, withdrawal, public shame)\n- His authentic self is the \"bad self\" by their definition\n- The cost of performance is his interior life\n\n---\n\n## 🔻 SECTION 3 — ANTAGONIST CONFIGURATION\n\n*Pick ONE. Multiple may layer.*\n\n### The Mother (Formative Source)\n- Church matriarch / pillar publicly, emotional terrorist privately\n- Established the original control pattern in childhood\n- Surfaces (literally or in memory) at the cage's deepest point\n- Recognizable, not monstrous — her grievance and logic are visible\n- The original \"cost economy\" — who paid for HER comfort\n\n### The Wife / Partner (Repeated Pattern)\n- Years of escalating control — financial, sexual, social, identity\n- Recognizable, not cartoon — her suffering visible alongside her cruelty\n- Often unaware of her cruelty (that doesn't make it less)\n- The divorce / separation may be final, but she still controls, still calls\n- The pattern from his mother repeated — and his blindness to it is the lie\n\n### The Institution (Systemic Force)\n- Church, corporation, military, church-as-corporation, family business\n- Has its own faces (the boss, the elder, the senior officer, the matriarch)\n- Rewards compliance, punishes naming\n- Will outlast him; he can only choose his relationship to it\n\n### Earlier Self (The Hidden Antagonist)\n- The protagonist himself, at an earlier moment, who said yes when he should have said no\n- His complicity in the control pattern is the deepest lie\n- The deepest level / hardest scene confronts him with his own choices\n- The extraction is partly from his own pattern, not just from \"her\" or \"them\"\n\n### Doppelganger / Echo (Confined Space lane)\n- Wears the face of someone who controlled him\n- Repeats their phrases, their body language, their cost-economy demands\n- Each appearance forces him to confront a specific incident\n- Sometimes there are multiple doppelgangers, each with a face\n\n---\n\n## 🔻 SECTION 4 — EXTRACTION ARC\n\n*Choose the extraction shape that fits the lane.*\n\n### Slow Awakening\n- Protagonist sees the cage gradually\n- Each chapter reveals another mechanism\n- The recognition itself is the slow-build engine\n- By Act 3, he has named the cage — but extraction is still ahead\n\n### Sudden Rupture\n- An event cracks the surface — he says no for the first time, she escalates publicly, the institution overreaches\n- The world tilts; the cage is visible\n- The remaining acts handle the cost of having seen\n- Faster pacing; more pressurized\n\n### Forced Choice\n- An ultimatum is presented (legal, financial, custody, professional)\n- Protagonist must declare his side\n- The choice exposes who he has been and who he might be\n- Often institutional or legal in mechanism\n\n### Body Refuses\n- Physical symptoms escalate to refusal — hands go numb permanently, voice fails, motor control departs\n- The body extracts before the mind\n- Mind catches up reluctantly\n- This lane particularly suits BELOW-style architectural confinement\n\n### The Music Returns\n- The artistic anchor (guitar, music, craft) reclaims him\n- His hands, his voice, his work — the thing that was always his\n- The extraction is partly through CREATING again, in his own voice\n- Identity reassembly through the practice he had abandoned\n\n---\n\n## 🔻 PROTAGONIST CLUSTERS\n\nGarrett protagonists are male, psychologically precise, and damaged in ways that have been invisible to themselves.\n\n### Core Archetypes\n- The IT Worker (overqualified, underemployed) — *BELOW's Ethan Cole*\n- The Reformed Believer (raised in the church, slowly extracting)\n- The Corporate Husband (income high, autonomy low)\n- The Returning Soldier (institutional cage now domestic cage)\n- The Burned-Out Professional (lawyer, doctor, academic)\n- The Failed Artist (anchor abandoned, slowly reclaimed)\n- The Estranged Son (mother dying, patterns surfacing)\n- The Recently Divorced (extraction in progress, cage still calling)\n\n### Required Traits\n- Has at least one artistic / creative anchor (guitar, music, woodwork, code)\n- Body awareness is the canary — physical symptoms tell the truth before the mind\n- Dark humor present — gallows humor is his last possession\n- Capable of agency, even in confinement\n- Recognizable, not heroic — he is complicit in the pattern, and the extraction confronts that\n\n### What He Is NOT\n- A pure victim (he is complicit; that's the point)\n- A revenge protagonist (this is not vigilante thriller)\n- Saved by a woman (no romance subplot as rescue)\n- Triumphantly extracted (the damage persists)\n\n---\n\n## 🔻 ANTAGONIST CONSTRUCTION RULES\n\n### The Wife / Mother / Institution must be:\n- **Recognizable** — readers know this person\n- **Coherent** — her actions follow her logic\n- **Suffering visible** — she has her own grievances and pain\n- **Not monstrous** — the horror is that she is REAL, not a movie villain\n- **Specific, not symbolic** — particular phrases, particular cruelties, particular blind spots\n\n### The Wife / Mother / Institution must NOT be:\n- A cartoon (genre killer)\n- A clear-cut villain the reader can dismiss\n- \"Crazy\" without context\n- Ugly / unattractive / undesirable as moral signaling\n- Without legitimate grievance, ever\n\n---\n\n## 🔻 HARD LIMITS (NEVER WRITE)\n\n| Element | Why Not |\n|---|---|\n| Female protagonist | This pen name is male POV, single |\n| Romance subplot as salvation arc | No woman rescues him |\n| Graphic sexual content | Sexuality is weapon or wound, not scene |\n| Torture porn without psychological purpose | Cheap |\n| Children in danger for shock value | Cheap and off-brand |\n| Wife / mother as cartoon villain | She must be recognizable |\n| Clean resolution | The damage persists |\n| Philosophizing | Characters ACT and FEEL — they don't lecture |\n| Triumphant extraction | The cage outlasts the cage |\n| Banned names from `banned-list.md` | Always |\n\n---\n\n## 🔻 ALWAYS INCLUDE\n\n- Protagonist agency, even in confinement\n- Physical body awareness (hands, breathing, heartbeat, sweat)\n- At least one artistic / creative anchor as identity\n- Control pattern repeated across at least three relationships / institutions\n- Dark humor (gallows) — present even in darkest moments\n- Something at stake in every chapter\n- Chapter hooks that fail the sleep test\n- Voice: Jessica's at maximum tension (em-dash asides, quick observations, body present)\n\n---\n\n## 🔻 THE GARRETT STONE WISH FULFILLMENT\n\nPsychological thriller readers come for:\n\n- **The recognition shock** — \"I know this person, this marriage, this institution\"\n- **Watching the cage become visible** — the slow dawn of seeing\n- **Agency reclaimed in confinement** — even one true choice\n- **The body knowing first** — physical truth-telling\n- **Dark humor as survival** — gallows wit as the protagonist's last possession\n- **The artistic anchor returning** — identity reassembled through craft\n- **An ending that respects the damage** — no clean tie-up, no fairy-tale\n- **The horror of the recognizable** — the wife / mother / institution who is real\n\nIf a mechanism doesn't feed at least one of these, question why it's in the book.\n\n---\n\n## 🔻 MECHANISM CHECKLIST\n\nBefore locking the mechanism stack, verify:\n\n- [ ] Core Cage Architecture chosen (Confined / Domestic / Institutional / Hybrid)\n- [ ] Primary Control Pattern chosen\n- [ ] At least one Secondary Control Pattern across a different relationship\n- [ ] Antagonist Configuration chosen and humanized (not cartoon)\n- [ ] Extraction Arc shape chosen\n- [ ] Protagonist has artistic / creative anchor\n- [ ] Cost economy is the thematic spine\n- [ ] Body awareness will be present in every chapter\n- [ ] Dark humor will survive the darkest chapters\n- [ ] Resolution is OPEN — the damage persists\n- [ ] No Hard Limits violated\n- [ ] No banned character names used\n"}},"refs":{"premiseTemplate":"# Premise Template\n\n**Used in: Phase 1 (Planning) and Phase 2 (Premise)**\n\n---\n\n## THE 5 CORE ELEMENTS (Fill Before Running the Premise Prompt)\n\nJessica fills these in BEFORE any prose is written. This is where the human element and the parts of the book she controls get locked in.\n\n| Element | Fill In |\n|---|---|\n| **Genre** | [insert subgenre — be specific] |\n| **Tropes** | [list 3–5 reader-favorite tropes from the genre's tropes reference file] |\n| **Hook / Concept** | [one-sentence \"why this book stands out\" idea] |\n| **Stakes** | [what is emotionally or practically at risk for the main character(s)] |\n| **Emotional Core** | [what readers should FEEL and why it matters] |\n\n### Rules for filling this out\n\n- **Genre must be specific.** \"Romance\" is not enough. \"Steamy billionaire holiday rom-com with forced proximity\" is enough.\n- **3–5 tropes MAX.** More than 5 = muddy promise, muddy blurb, muddy reader trust. Pull tropes from the matching genre file in `tropes/`.\n- **Hook is ONE sentence.** If you need two, the hook isn't sharp enough yet.\n- **Stakes must be concrete.** \"She could lose her job\" not \"things get complicated.\"\n- **Emotional core is for the READER, not the character.** What feeling will the reader chase through this book? Swoon? Dread? Catharsis? Rage? Hope?\n\n---\n\n## THE PREMISE PROMPT\n\nOnce the 5 Core Elements are locked, run this prompt:\n\n```\nYou are an experienced fiction development editor. Your task: create a strong, marketable STORY PREMISE for a new [GENRE] novel under the [PEN NAME] brand.\n\nFollow this exact structure using the locked elements:\n\n1. Genre: [filled in]\n2. Tropes: [filled in]\n3. Hook / Concept: [filled in]\n4. Stakes: [filled in]\n5. Emotional Core: [filled in]\n\nNow write a concise 1–2 paragraph premise that:\n- Includes all 5 elements above, integrated naturally\n- Feels emotionally engaging and market-ready\n- Matches the tone and reader expectations for [PEN NAME]'s brand\n- Opens strong enough to survive as ad copy or back-cover copy\n\nOutput as plain text, ready to paste into the Project file.\n```\n\n---\n\n## REFINEMENT PROMPTS (Use after first premise draft)\n\nIf the first premise isn't hitting, use any of these to tune it:\n\n- **Sharpen the market fit:** \"Refine this premise to fit [specific market or tone, e.g., 'high-heat billionaire rom-com' or 'sweet small-town historical'].\"\n- **Strengthen the hook:** \"The hook feels generic. Make it more unique — what's the ONE thing about this book that a reader hasn't seen before?\"\n- **Raise the stakes:** \"The stakes feel flat. Push them harder — what happens if the characters fail? What does the reader fear losing?\"\n- **Tune the emotional core:** \"Strengthen the emotional core. What specific feeling do we want the reader chasing — and why does it matter NOW?\"\n- **Tone calibration:** \"This reads too [dark / light / generic / purple]. Match it to [PEN NAME]'s voice — [reference a specific tone marker from the pen name skill].\"\n\n---\n\n## EVALUATION CHECK\n\nBefore saving the premise to the Project, answer:\n\n- [ ] Does it include all 5 Core Elements?\n- [ ] Does it match the pen name's tone without feeling generic?\n- [ ] Is the hook genuinely specific (not \"she falls for the wrong guy\")?\n- [ ] Are the stakes concrete?\n- [ ] Would this premise make a reader click \"buy\" if it appeared as a blurb?\n\nIf any answer is no, run a refinement prompt. Don't move to Phase 3 (Codex) until the premise passes all five.\n\n---\n\n## SAVE LOCATION\n\nSave the final premise to the Project as `[Book Title]_Premise.md`. This stays in the project files for all downstream phases to reference.\n","storyPromise":"# Story Promise Formula\n\n**Used in: Phase 1 (Planning), Step 2**\n\nThe Story Promise is ONE sentence. Get it right, and everything else — blurb, ad copy, comp titles, reader trust — falls into place. Get it wrong, and the book sells poorly no matter how well it's written.\n\n---\n\n## THE ROMANCE FORMULA (Default)\n\n> **This is a [genre/trope stack] romance about [FMC/MMC archetype pair] who are forced to [central conflict or proximity setup] while hiding [secret or complication], leading to [promised emotional payoff].**\n\n### Examples\n\n**Billionaire Rom-Com (Sage Kennedy):**\n> This is a fake-dating billionaire rom-com about a grumpy CEO and a sunshine small-town baker snowed in at his estate while hiding his identity from her, leading to chaos, banter, and real feelings.\n\n**Vampire Rom-Com (Kelsey Croft):**\n> This is a fated-mates vampire rom-com about a 600-year-old vampire hiding in academia and a museum archivist who talks to pottery, forced into a safe house during a vampire council hunt while hiding his true identity, leading to chaos, banter, blood bonds, and the most inconvenient love story of six centuries.\n\n**Dark Fantasy Romance (Ruthie Clark):**\n> This is a fated-mates dragon shifter romance about a conditioned Russian assassin and the dragon who was supposed to kill her, trapped together in a bond neither of them asked for while hiding her awakening power from the handlers who made her, leading to a love that burns the facility down.\n\n**Dark Mafia Romance (Moxie Savage):**\n> This is a captive mafia romance about a dangerous syndicate boss and the woman he took as collateral, locked in his compound during a rival war while hiding the fact that she's the only thing keeping him human, leading to a claimed marking and an HEA paid for in blood.\n\n**Regency Rom-Com (Marjorie Adams):**\n> This is a marriage-of-convenience Regency rom-com about a reluctant earl and a bluestocking spinster, forced to wed to satisfy a family will while hiding their growing affection from Society, leading to ballroom chaos, whispered banter, and a proper London scandal.\n\n**Clean Western (Rosemary Irving):**\n> This is a mail-order-bride frontier romance about a widowed Colorado rancher and the woman who arrives on the train looking for a second chance, forced to share a homestead during a brutal winter while hiding what she ran from, leading to a partnership built from labor, loyalty, and the choice to stay.\n\n**Contemporary Small-Town (Connie):**\n> This is a returning-home romance about a career-woman-turned-hometown-reluctant and the grounded billionaire who never left, forced into proximity running her grandmother's bakery while hiding the real reason she came back, leading to a choice between the life she built and the home she never stopped loving.\n\n---\n\n## THE THRILLER / HORROR VARIANT (Garrett Stone, Lenore Ashby)\n\nRomance formula doesn't apply. Use this instead:\n\n> **This is a [subgenre] about [protagonist archetype] who [inciting realization or circumstance], forcing them to [action they can't avoid] while [the world, the antagonist, or their own mind] threatens [specific stakes], leading to [earned dark resolution — NOT happiness].**\n\n### Examples\n\n**Psychological Thriller (Garrett Stone / BELOW):**\n> This is a psychological thriller about a 45-year-old man who realizes he has been shaped by his wife's control for twenty-two years, forced to confront what remains of himself while the apartment, the routine, and his own unreliable memory threaten to pull him back into the pattern, leading to a survival that costs him more than he understood he still had.\n\n**Gothic Cosmic Horror (Lenore Ashby):**\n> This is a gothic cosmic horror about a scholar who inherits her grandmother's crumbling estate, forced to catalog the library while something in the walls begins to name her, leading to the terrible knowledge that she was always the thing being called home.\n\n---\n\n## RULES FOR USING THE FORMULA\n\n### The non-negotiables\n\n1. **ONE sentence.** Not two. Not a paragraph. One. If it won't fit in one sentence, the story is unfocused.\n2. **Specific, not generic.** \"Falls in love\" = no. \"Forced to share a safe house during a vampire council hunt\" = yes.\n3. **The \"hiding\" beat is critical.** That's the tension engine. If there's no secret or complication being hidden, the story has no middle.\n4. **The promised payoff must match the pen name.** Rom-com readers want laughs + swoon. Dark romance readers want claiming + blood. Thriller readers want survival + cost. Don't promise what the genre doesn't deliver.\n\n### Pro tip enforcement\n\nIf Jessica tries to stack more than 5 tropes in the formula, push back. The Story Promise is proof the book has a clear spine. More than 5 tropes = no spine.\n\n---\n\n## HOW TO USE THIS IN PHASE 1\n\nAfter the 5 Core Elements are locked (Premise Template Step 1), before running the Premise Prompt:\n\n1. Have Jessica fill in the blanks in the formula above using her Core Elements\n2. Read the completed Story Promise out loud (or mentally — she should be able to SAY it, not just write it)\n3. Gut check:\n   - Would this make a reader click \"add to cart\"?\n   - Is the hook genuinely specific?\n   - Does the promised payoff match pen name expectation?\n4. If any answer is \"eh,\" refine the formula before moving to the Premise.\n\n### If she's stuck\n\nOffer three completed versions of the formula at different trope-stack angles. Let her pick the one that lands or Frankenstein the best parts of each.\n\n---\n\n## THIS IS GOLD (Why Jessica Calls It That)\n\nThe Story Promise is the distilled blurb. Once it's right:\n\n- The Premise writes itself\n- The Codex has a north star\n- The Outline has a shape\n- The chapter prompts have direction\n- The back cover copy is 60% done\n- The ad copy is 80% done\n- The comp title search knows where to look\n\nSkip this step and everything downstream gets harder. Nail this step and everything downstream gets easier.\n","codexTemplate":"# Codex Template\n\n**Used in: Phase 3 (Codex / Story Bible)**\n\nThe codex is the living reference document for the book. Once built, it gets saved to the Project files and referenced by every drafting chat. It keeps world, tone, and character logic consistent across chapters written in separate sessions.\n\n---\n\n## PRE-CODEX CHECK\n\nBefore running the Codex Prompt, confirm Jessica has:\n- ✅ A locked Premise (from Phase 2)\n- ✅ The pen name skill loaded for voice/rules\n- ✅ Any existing series bible or prior book codex in the Project (if it's a series book)\n\nIf this is Book 2+ in a series, the codex should BUILD ON the series bible, not duplicate or contradict it. Flag any contradictions before drafting the codex.\n\n---\n\n## THE CODEX PROMPT\n\n```\nYou are an expert story architect.\n\nYour task: build a STORY CODEX (living story bible) for this [PEN NAME] project using the premise provided. Output as a .md file so it can be added to the Project files.\n\nInclude the following sections:\n\n## 1. Tone & Voice\n- Describe narrative style, POV structure (single vs dual), tense\n- Emotional tone and personality of narration (dark, witty, lyrical, visceral, etc.)\n- Voice anchors specific to [PEN NAME] — em-dashes, internal asides, humor register, heat integration\n\n## 2. Setting / World-Building\n- Time period, location, key world rules (if fantasy/paranormal/historical)\n- Sensory details that define the atmosphere — what the reader smells, hears, feels in every scene\n- Any shared-world connections (other pen name series, recurring towns, families)\n\n## 3. Main Characters\nFor each main character:\n- **Name** (check banned names list)\n- **Role** (FMC, MMC, antagonist, etc.)\n- **Internal Conflict** — the wound, the lie they believe, the fear\n- **External Conflict** — the world pressure forcing their hand\n- **Goal / Fear / Desire** — what they want, what they fear, what they actually need\n\n## 4. Supporting Cast\n- Secondary characters and antagonists with clear narrative roles\n- No named characters who don't serve plot or theme — flag redundancy\n\n## 5. Rules & Boundaries\n- World rules (magic system, social structure, technology limits)\n- Realism limits and taboo topics to avoid\n- Emotional/heat boundaries for this book (fade-to-black, open-door, explicit)\n- Any pen-name-specific hard limits (see pen name skill)\n\n## 6. Tropes & Themes\n- Central tropes that define the story (pull from the 5 Core Elements)\n- Recurring emotional or moral themes (trust, forgiveness, freedom, power, home, etc.)\n- How tropes and themes reinforce each other\n\n## 7. Series / Continuity Notes (if applicable)\n- How this story connects to other books, locations, or shared characters\n- Series arc progression — what changes across the series that this book advances\n- Open loops to set up for future books (if any)\n\n## Summary\nAt the end, write a one-paragraph summary of how this codex will guide tone and character consistency throughout the book. This is the \"north star\" paragraph — refer to it when writing gets off-track.\n\nOUTPUT FORMAT: Markdown, ready to save as [Book Title]_Codex.md and drop into Project files.\n```\n\n---\n\n## REFINEMENT PROMPTS (After First Codex Draft)\n\n- **Tone alignment:** \"Ensure the tone matches [PEN NAME]'s brand voice — see the pen name skill's reference files and calibrate against those.\"\n- **Logic audit:** \"Check for internal contradictions in the world or character logic. Flag anything inconsistent.\"\n- **Simplification:** \"Simplify the codex language so it's easy to reference while drafting. Cut jargon and academic tone.\"\n- **Series check:** \"Compare this codex against [prior book's codex] and flag any continuity conflicts.\"\n\n---\n\n## EVALUATE THE CODEX OUTPUT FOR:\n\n- [ ] **Emotional continuity** — do the character arcs make emotional sense across the book?\n- [ ] **Market alignment** — does this deliver what [PEN NAME] readers expect?\n- [ ] **Structural clarity** — could a different writer open this codex and draft in the right voice?\n- [ ] **No contradictions** — world rules, character knowledge, timeline, setting all internally consistent\n- [ ] **No banned names** — cross-check every character name against the global and pen-name-specific banned lists\n- [ ] **Heat level matches** the pen name's brand (or has explicit override noted)\n\nIf any answer is no, run the matching refinement prompt. Don't move to Phase 4 (Outline) until the codex passes.\n\n---\n\n## SAVE LOCATION\n\nSave as `[Book Title]_Codex.md` in the Project files. This file is referenced by every subsequent drafting chat — keep it clean, well-organized, and updated if Jessica makes mid-draft changes.\n","plotHoleCheck":"# Plot Hole Check\n\n**Used in: Phase 5, Step 1 (Outline Self-Review)**\n\nRun this AFTER the outline is complete but BEFORE generating individual chapter prompts. Catching plot holes at the outline stage saves hours of mid-draft rework.\n\n---\n\n## THE PLOT HOLE CHECK PROMPT\n\nCopy/paste this prompt against the completed outline:\n\n```\nReview the complete outline in the Project files and flag any plot holes, timeline inconsistencies, or glaring pacing issues.\n\nSpecifically check for:\n\n## Logic & Continuity\n1. Cause and effect — Does each chapter flow logically from the one before? Any leaps that require offscreen events?\n2. Character knowledge — Does anyone act on information they shouldn't have yet? React to things they haven't learned?\n3. Timeline — Do days, weeks, and seasons track correctly? Any impossible compression or gaps?\n4. Setting consistency — Are physical spaces, distances, and travel times realistic?\n5. World rules — Are any magic/paranormal/historical rules broken?\n\n## Character & Motivation\n6. Motivation consistency — Do character decisions track with established wants, fears, and wounds?\n7. Arc progression — Does each main character end in a different emotional place than they started? Is the change earned?\n8. Voice drift — Does each POV character's voice stay consistent? Flag personality shifts.\n9. Agency — Does the FMC retain agency throughout? (Non-negotiable for all CPH romance pen names)\n\n## Pacing & Stakes\n10. Sagging middle — Where does momentum stall? Flag chapters that drag or feel like filler.\n11. Rush points — Where do major beats get shortchanged?\n12. Stakes escalation — Do stakes build
