e threat too","Community knows everyone, including the danger","Payoff: home is safe again; love is named where the past was buried"]},{"name":"Co-Workers / Partners on the Case","bullets":["She and he are both professionals on the same investigation","Their skills complement; their attraction complicates","Workplace boundary breaks under pressure of the case","Payoff: case closes, partnership becomes personal"]},{"name":"Investigator x Suspect's Loved One","bullets":["He's investigating someone she loves (brother, friend, mentor)","She's certain they're innocent; he's not so sure","The investigation forces honest reckoning","Payoff: the truth is faced, the love is real, the loved one is innocent OR she chooses honestly anyway"]}]},{"name":"TIER 2 — FORCED PROXIMITY (THREAT-DRIVEN)","intro":"Pick ONE. RS proximity should serve both arcs.","cards":[{"name":"Universal RS Proximity","bullets":["Safe House (his presence required for her safety)","Same Vehicle During Pursuit / Travel","Joint Undercover Operation","Stakeout Partnership","Hidden in His Property (ranch, cabin, apartment)","Returning Home Together (her family property, his secured space)","Hospital Vigil Together","Witness Protection Co-Habitation","Crisis Response Together (search and rescue, evacuation, manhunt)"]},{"name":"Specifically Connie-Tone (RS Lane)","bullets":["Same Small-Town Diner During the Investigation","Adjacent Ranches with Shared Threat","Modeling Studio / Photo Shoot Where the Threat Has Penetrated","Family Property Under Surveillance","Community Event (festival, charity, town council) Where the Suspect Is"]}]},{"name":"TIER 3 — PERSONALITY DYNAMIC","intro":"Pick ONE.","cards":[{"name":"Classic RS Pairings","bullets":["Practical Heroine x Protective Hero","Independent Heroine Who Resists Help x Determined Protector","Civilian x Professional (cop, agent, soldier)","Returning Local x Hometown Sheriff / Rancher","Sharp Heroine x Gruff Hero","Together-They-Solve-It (peer dynamic, partner energy)","Burned-Out Investigator x Hopeful Civilian","Recently Widowed / Divorced x Returning to Public Life","Stoic Protector x Heroine With Reasons She Won't Lower Her Guard"]},{"name":"Voice-Forward Heroine Traits (Connie RS lane)","bullets":["Competent — even under threat","Notices Details (which becomes investigation gold)","Loyal to Her People","Will Defend Hers (children, friends, family, livelihood)","Sarcasm as Armor (Jessica's signature)","Quick-Hit Observations, Em-Dash Asides","Recovery-Forward — she does not romanticize her trauma"]},{"name":"Hero Voice-Markers (Connie RS lane)","bullets":["Honor Demonstrated, Not Declared","Pet Names Used Sparingly and With Earned Weight","Dry Humor Even Under Pressure","Patient (the work teaches it)","Has His Own Code","Devoted to His People (partner, sister, child, dog)"]},{"name":"Avoid for Connie RS Lane","bullets":["Pure rom-com banter as the engine (Sage's lane)","Dark alpha posturing (Moxie's lane)","Insta-attraction without emotional foundation","Heroines who need rescuing from their own lives as the central engine","Heroes who solve everything for her (peer dynamic over rescue dynamic)"]}]},{"name":"TIER 4 — THE THREAT ARCHITECTURE","intro":"Pick ONE. This defines who is doing it and why.","cards":[{"name":"Stalker / Obsessive Threat","bullets":["A specific antagonist whose obsession is HER","Notes, photographs, escalating presence","The reveal is identity (often someone she has overlooked)","Suspect pool includes ex, ex's friend, fan, old colleague"]},{"name":"Conspiracy / Cover-Up","bullets":["Multiple people protecting a secret she has stumbled into","Institutional or community-level cover-up","The reveal is scope — bigger than she thought","Suspect pool includes pillars of community, professionals, family"]},{"name":"Past Catches Up","bullets":["Something from her or his past surfaces — old case, witness statement, missing person, unsolved murder","The threat is connected to history they thought was buried","Reveal recasts what they knew about the past","Suspect pool includes people she trusted"]},{"name":"Serial Threat (Pattern)","bullets":["A pattern of crimes — she's the next, or already on the list","Investigation becomes profile; profile narrows the suspect pool","The reveal often involves recognizing a pattern earlier than the antagonist expects","Higher tension, often gnarlier; tone stays Connie-warm only with care"]},{"name":"Witness Threat (She Saw Something)","bullets":["She witnessed a crime; the perpetrator wants her gone before trial","Protection is about staying alive AND staying able to testify","The reveal is often about WHO is behind the perpetrator (institutional, organized)","Strong fit with Bodyguard / Witness Protection romance pairings"]},{"name":"Family / Domestic Threat","bullets":["The threat comes from inside (ex, in-law, estranged family member, family friend)","Trust is the central issue — she has been gaslit about the threat","Reveal is who she should not have trusted","Tone stays Connie-warm; the threat is real but not gothic"]},{"name":"Industry / Workplace Threat","bullets":["The threat is connected to her professional world (ranch, modeling, business, art, real estate)","Sabotage, blackmail, escalating professional and personal damage","Reveal often involves a competitor, partner, or insider","Excellent fit for Connie's small-town and Model Behavior lanes"]},{"name":"Community-Level Threat","bullets":["A small town secret that has been buried for years","Discovery threatens her AND community pillars","Reveal often forces a reckoning the town has avoided","Fit for Connie's small-town RS"]}]}],"extras":{"THE TROPE PICKER SYSTEM":"\nPick ONE option from each tier. Romantic suspense runs on dual-arc discipline — every trope choice should feed both the romance AND the threat.\n\n**Max trope count per book: 5 total.**\n\n---\n\n","FMC TROPE CLUSTERS":"\nCRC RS FMCs are competent, observant, and capable of running their own lives. Threat finds them; they meet it without becoming damsels.\n\n### Core Archetypes\n- The Returning Daughter\n- The Small-Town Professional (vet, doctor, lawyer, business owner)\n- The Reluctant Witness\n- The Recently Widowed / Divorced Returning to Life\n- The Family-Business Heir Under Threat\n- The Investigator on the Other Side (ex-cop, journalist, paralegal)\n- The Survivor With Receipts\n- The Model / Performer / Public-Facing Professional Targeted\n- The Rancher / Land-Owner Under Pressure\n- The Caretaker Carrying Weight Already\n\n### Active-Agency Traits\n- Notices What Others Miss (investigation skill in disguise)\n- Will Lie to Protect People She Loves\n- Refuses to Be Sidelined\n- Negotiates From Position of Knowledge\n- Takes the Hit Sometimes (and gets up)\n- Loyal — Once Earned, Total\n- Has at Least One Skill That Matters in the Crisis (medical, mechanical, financial, language, terrain knowledge)\n\n### Career / Background\n- Small Business Owner\n- Healthcare Professional\n- Family Business Heir\n- Public-Facing Professional (model, performer, broadcaster)\n- Land / Ranch / Property Owner\n- Returning Native (came back, brought a story)\n- Investigator-Adjacent (paralegal, journalist, retired ATF / FBI / cop's daughter)\n\n### Emotional Arcs\n- \"I Cannot Trust Anyone\" → Choosing the right people\n- \"I Can Handle This Alone\" → Accepting help without dissolving\n- \"The Past Is Past\" → Facing what was buried\n- \"I Don't Get to Be Safe\" → She does, and chooses it\n- Carrying grief / trauma without becoming defined by it\n\n---\n\n","MMC TROPE CLUSTERS":"\nCRC RS MMCs are protective without being controlling. They EARN her — through skill, presence, and the slow respect of her competence.\n\n### Core Archetypes\n- The Sheriff / Local Cop\n- The Federal Agent (FBI, ATF, US Marshal)\n- The Private Investigator\n- The Bodyguard / Security Specialist\n- The Reformed Military / Special Operations\n- The Returning Local Hero\n- The Rancher Who Sees Everything\n- The Brother / Brother-in-Law / Family Friend Pulled In\n- The Reformed Bad Boy With Useful Skills\n\n### Earning-Through-Action Traits\n- Saves Her When She Genuinely Needs It; Stands Back When She Doesn't\n- Listens (actually listens — not waiting to talk)\n- Notices What She Notices, and Trusts Her on It\n- Generous Without Ostentation\n- Holds the Line on What Matters Even When It Costs Him\n- Has His Own People (partner, K9, sibling, mentor) — and they vouch for him\n- Devoted to His Work AND to Her — neither erases the other\n\n### Hard Edges (Earn-Side, Not Dark)\n- He has his own stuff he hasn't dealt with\n- His past relationship taught him something — or it didn't, and that's part of his arc\n- His professional code complicates the romance\n- His violence (if necessary) is precise and consequential, never gratuitous\n\n### Emotional Arcs\n- From Closed Off to Vulnerable (with HER specifically)\n- From \"I Don't Need Anyone\" to \"I Need Her\"\n- From Rule-Bound to Rule-Bent for Her (and the cost of that)\n- From Solo Operator to Partner\n\n---\n\n","TROPE COMBINATIONS THAT WORK":"\n| Primary Trope (Tier 1) | Pairs Especially Well With |\n|---|---|\n| Cop / Investigator x Civilian | Stalker Threat, Witness Threat |\n| Bodyguard x Reluctant Protectee | Past Catches Up, Industry Threat |\n| Reformed Bad Boy x Endangered Woman | Conspiracy, Witness Threat |\n| Witness Protection / On the Run | Past Catches Up, Family Threat |\n| Returning Local | Community Threat, Past Catches Up |\n| Co-Workers on the Case | Conspiracy, Serial Threat |\n\n---\n\n","HARD NO TROPES (NEVER USE)":"\n| Trope | Why Not |\n|---|---|\n| Heroine repeatedly rescued as central engine | She's not helpless |\n| Hero gaslighting heroine for \"her own good\" | Genre killer |\n| Threat resolves without her contribution | She must matter to the resolution |\n| Romantic rupture from cruelty between leads | Connie universal — never |\n| Hero is the threat / antagonist | Wrong genre — that's dark romance |\n| Children in danger for shock value | Cheap |\n| Insta-trust between leads in a high-threat situation | Genre killer |\n| Tangled sheets / slick folds / purple prose | CPH universal |\n| Body shame / \"past her prime\" framing | Connie universal |\n| Banned names from `banned-list.md` | Always |\n\n---\n\n","THE CRC RS WISH FULFILLMENT":"\nEvery trope choice should feed at least one of these core fantasies:\n\n- **Being seen as competent** — she's not rescued, she's partnered with\n- **A protector who respects her capability** — earns through skill, not dominance\n- **The threat that brings them together AND threatens to tear them apart**\n- **Dual arcs climaxing together** — case closed, love named\n- **Community that holds when threat surfaces** — found family, neighbors, professionals\n- **Recovery-forward heroines** — trauma without being defined by it\n- **Honor demonstrated through action** — both leads\n- **A grounded HEA** — the threat is gone, the bond is solid, the world is okay again\n\nIf a trope doesn't feed at least one of these, question why it's in the book.\n\n---\n\n","TROPE EXECUTION RULES":"\n### Tropes work when:\n1. **Both arcs are served** — every chosen trope feeds romance AND threat\n2. **Characters justify the trope** — emerges from who they are\n3. **Threat is real and named** — not vague menace\n4. **Stakes are real** — physical, emotional, professional\n5. **Voice carries** — Connie's grounded warmth survives even under threat\n6. **Recovery-forward** — trauma is honest but not defining\n\n### Common mistakes:\n- Threat treated as backdrop for romance (genre killer — must be live arc)\n- Romance treated as filler between investigation chapters (genre killer — must be live arc)\n- Heroine repeatedly rescued (genre killer)\n- Hero solves everything for her (genre killer)\n- Both arcs don't climax together (structural failure)\n- Threat resolves too early or too late (pacing collapse)\n\n---\n\n","TROPE CHECKLIST":"\nBefore locking the trope stack, verify:\n\n- [ ] Tier 1 / 2 / 3 / 4 picks chosen — one each\n- [ ] Total tropes in stack ≤ 5\n- [ ] Stack feeds at least one Wish Fulfillment fantasy\n- [ ] No Hard No tropes present\n- [ ] FMC has agency — contributes to investigation AND/OR rescue AND/OR confrontation\n- [ ] MMC EARNS her — through skill, not dominance\n- [ ] Both arcs are buildable from this trope stack\n- [ ] Stack works with the Story Promise without contradicting it\n- [ ] Any combination flagged in \"Pairs Especially Well With\" — bonus\n- [ ] No banned character names in any trope examples used\n\n"},"primary":"Constance Ruth Clark (RS lane)","max":5},"tropesDoc":"# Romantic Suspense Tropes Master List\n\n**Primary pen name:** Constance Ruth Clark (RS lane)\n**Secondary use:** None currently. RS is a Connie lane; if other pen names expand into RS, calibrate accordingly.\n\n> **CALIBRATION NOTE:** Trope conventions here are genre-standard RS overlaid with Connie's grounded community / character / heat sensibility. On first use, gut-check against *Wild Country Hearts*, *Model Behavior*, and other CRC RS titles; flag any tropes that don't match how the lane actually plays in your existing books and refine this file accordingly.\n\n---\n\n## THE TROPE PICKER SYSTEM\n\nPick ONE option from each tier. Romantic suspense runs on dual-arc discipline — every trope choice should feed both the romance AND the threat.\n\n**Max trope count per book: 5 total.**\n\n---\n\n## 🔍 TIER 1 — CORE THREAT + ROMANCE PAIRING\n\n*Pick ONE. This defines the central engine — both who she is and what threatens her.*\n\n### Cop / Sheriff / Investigator x Civilian Victim or Witness\n- He's the badge; she's the victim, witness, or person the case has pulled in\n- Professional ethics complicate the attraction\n- His investigation IS her safety; her story IS his case\n- Payoff: case closes, he chooses her, the boundary becomes a bridge\n\n### Bodyguard / Protector x Reluctant Protectee\n- He's been hired (or has assigned himself) to keep her alive\n- She doesn't think she needs protection (until she does)\n- Forced proximity through threat is the engine\n- Payoff: he's not her bodyguard anymore; he's hers\n\n### Reformed Bad Boy x Endangered Woman\n- He has a past — military, intelligence, ex-criminal, ex-anything-rough\n- She is in danger from a world he understands and she does not\n- His skills are exactly what she needs\n- Payoff: his past becomes her safety; he chooses the new life\n\n### Investigator (Private) x Client Becomes More\n- She hires him (or he's been brought in by family / employer / authorities)\n- Professional engagement deepens as the case does\n- Lines between client and lover blur dangerously\n- Payoff: he closes her case AND opens his life\n\n### Witness Protection / On the Run\n- She has seen something; he is responsible for keeping her alive\n- A new identity, a new town, a new pretense\n- Forced proximity, fake relationship as cover, deepening reality\n- Payoff: when the threat resolves, she chooses him AND her real life\n\n### Returning Local x The Threat From the Past\n- She comes home (small town, ranch country, family business) and the past surfaces\n- Local hero / sheriff / rancher / EMT is in the path of the threat too\n- Community knows everyone, including the danger\n- Payoff: home is safe again; love is named where the past was buried\n\n### Co-Workers / Partners on the Case\n- She and he are both professionals on the same investigation\n- Their skills complement; their attraction complicates\n- Workplace boundary breaks under pressure of the case\n- Payoff: case closes, partnership becomes personal\n\n### Investigator x Suspect's Loved One\n- He's investigating someone she loves (brother, friend, mentor)\n- She's certain they're innocent; he's not so sure\n- The investigation forces honest reckoning\n- Payoff: the truth is faced, the love is real, the loved one is innocent OR she chooses honestly anyway\n\n---\n\n## 🔍 TIER 2 — FORCED PROXIMITY (THREAT-DRIVEN)\n\n*Pick ONE. RS proximity should serve both arcs.*\n\n### Universal RS Proximity\n- Safe House (his presence required for her safety)\n- Same Vehicle During Pursuit / Travel\n- Joint Undercover Operation\n- Stakeout Partnership\n- Hidden in His Property (ranch, cabin, apartment)\n- Returning Home Together (her family property, his secured space)\n- Hospital Vigil Together\n- Witness Protection Co-Habitation\n- Crisis Response Together (search and rescue, evacuation, manhunt)\n\n### Specifically Connie-Tone (RS Lane)\n- Same Small-Town Diner During the Investigation\n- Adjacent Ranches with Shared Threat\n- Modeling Studio / Photo Shoot Where the Threat Has Penetrated\n- Family Property Under Surveillance\n- Community Event (festival, charity, town council) Where the Suspect Is\n\n---\n\n## 🔍 TIER 3 — PERSONALITY DYNAMIC\n\n*Pick ONE.*\n\n### Classic RS Pairings\n- Practical Heroine x Protective Hero\n- Independent Heroine Who Resists Help x Determined Protector\n- Civilian x Professional (cop, agent, soldier)\n- Returning Local x Hometown Sheriff / Rancher\n- Sharp Heroine x Gruff Hero\n- Together-They-Solve-It (peer dynamic, partner energy)\n- Burned-Out Investigator x Hopeful Civilian\n- Recently Widowed / Divorced x Returning to Public Life\n- Stoic Protector x Heroine With Reasons She Won't Lower Her Guard\n\n### Voice-Forward Heroine Traits (Connie RS lane)\n- Competent — even under threat\n- Notices Details (which becomes investigation gold)\n- Loyal to Her People\n- Will Defend Hers (children, friends, family, livelihood)\n- Sarcasm as Armor (Jessica's signature)\n- Quick-Hit Observations, Em-Dash Asides\n- Recovery-Forward — she does not romanticize her trauma\n\n### Hero Voice-Markers (Connie RS lane)\n- Honor Demonstrated, Not Declared\n- Pet Names Used Sparingly and With Earned Weight\n- Dry Humor Even Under Pressure\n- Patient (the work teaches it)\n- Has His Own Code\n- Devoted to His People (partner, sister, child, dog)\n\n### Avoid for Connie RS Lane\n- Pure rom-com banter as the engine (Sage's lane)\n- Dark alpha posturing (Moxie's lane)\n- Insta-attraction without emotional foundation\n- Heroines who need rescuing from their own lives as the central engine\n- Heroes who solve everything for her (peer dynamic over rescue dynamic)\n\n---\n\n## 🔍 TIER 4 — THE THREAT ARCHITECTURE\n\n*Pick ONE. This defines who is doing it and why.*\n\n### Stalker / Obsessive Threat\n- A specific antagonist whose obsession is HER\n- Notes, photographs, escalating presence\n- The reveal is identity (often someone she has overlooked)\n- Suspect pool includes ex, ex's friend, fan, old colleague\n\n### Conspiracy / Cover-Up\n- Multiple people protecting a secret she has stumbled into\n- Institutional or community-level cover-up\n- The reveal is scope — bigger than she thought\n- Suspect pool includes pillars of community, professionals, family\n\n### Past Catches Up\n- Something from her or his past surfaces — old case, witness statement, missing person, unsolved murder\n- The threat is connected to history they thought was buried\n- Reveal recasts what they knew about the past\n- Suspect pool includes people she trusted\n\n### Serial Threat (Pattern)\n- A pattern of crimes — she's the next, or already on the list\n- Investigation becomes profile; profile narrows the suspect pool\n- The reveal often involves recognizing a pattern earlier than the antagonist expects\n- Higher tension, often gnarlier; tone stays Connie-warm only with care\n\n### Witness Threat (She Saw Something)\n- She witnessed a crime; the perpetrator wants her gone before trial\n- Protection is about staying alive AND staying able to testify\n- The reveal is often about WHO is behind the perpetrator (institutional, organized)\n- Strong fit with Bodyguard / Witness Protection romance pairings\n\n### Family / Domestic Threat\n- The threat comes from inside (ex, in-law, estranged family member, family friend)\n- Trust is the central issue — she has been gaslit about the threat\n- Reveal is who she should not have trusted\n- Tone stays Connie-warm; the threat is real but not gothic\n\n### Industry / Workplace Threat\n- The threat is connected to her professional world (ranch, modeling, business, art, real estate)\n- Sabotage, blackmail, escalating professional and personal damage\n- Reveal often involves a competitor, partner, or insider\n- Excellent fit for Connie's small-town and Model Behavior lanes\n\n### Community-Level Threat\n- A small town secret that has been buried for years\n- Discovery threatens her AND community pillars\n- Reveal often forces a reckoning the town has avoided\n- Fit for Connie's small-town RS\n\n---\n\n## FMC TROPE CLUSTERS\n\nCRC RS FMCs are competent, observant, and capable of running their own lives. Threat finds them; they meet it without becoming damsels.\n\n### Core Archetypes\n- The Returning Daughter\n- The Small-Town Professional (vet, doctor, lawyer, business owner)\n- The Reluctant Witness\n- The Recently Widowed / Divorced Returning to Life\n- The Family-Business Heir Under Threat\n- The Investigator on the Other Side (ex-cop, journalist, paralegal)\n- The Survivor With Receipts\n- The Model / Performer / Public-Facing Professional Targeted\n- The Rancher / Land-Owner Under Pressure\n- The Caretaker Carrying Weight Already\n\n### Active-Agency Traits\n- Notices What Others Miss (investigation skill in disguise)\n- Will Lie to Protect People She Loves\n- Refuses to Be Sidelined\n- Negotiates From Position of Knowledge\n- Takes the Hit Sometimes (and gets up)\n- Loyal — Once Earned, Total\n- Has at Least One Skill That Matters in the Crisis (medical, mechanical, financial, language, terrain knowledge)\n\n### Career / Background\n- Small Business Owner\n- Healthcare Professional\n- Family Business Heir\n- Public-Facing Professional (model, performer, broadcaster)\n- Land / Ranch / Property Owner\n- Returning Native (came back, brought a story)\n- Investigator-Adjacent (paralegal, journalist, retired ATF / FBI / cop's daughter)\n\n### Emotional Arcs\n- \"I Cannot Trust Anyone\" → Choosing the right people\n- \"I Can Handle This Alone\" → Accepting help without dissolving\n- \"The Past Is Past\" → Facing what was buried\n- \"I Don't Get to Be Safe\" → She does, and chooses it\n- Carrying grief / trauma without becoming defined by it\n\n---\n\n## MMC TROPE CLUSTERS\n\nCRC RS MMCs are protective without being controlling. They EARN her — through skill, presence, and the slow respect of her competence.\n\n### Core Archetypes\n- The Sheriff / Local Cop\n- The Federal Agent (FBI, ATF, US Marshal)\n- The Private Investigator\n- The Bodyguard / Security Specialist\n- The Reformed Military / Special Operations\n- The Returning Local Hero\n- The Rancher Who Sees Everything\n- The Brother / Brother-in-Law / Family Friend Pulled In\n- The Reformed Bad Boy With Useful Skills\n\n### Earning-Through-Action Traits\n- Saves Her When She Genuinely Needs It; Stands Back When She Doesn't\n- Listens (actually listens — not waiting to talk)\n- Notices What She Notices, and Trusts Her on It\n- Generous Without Ostentation\n- Holds the Line on What Matters Even When It Costs Him\n- Has His Own People (partner, K9, sibling, mentor) — and they vouch for him\n- Devoted to His Work AND to Her — neither erases the other\n\n### Hard Edges (Earn-Side, Not Dark)\n- He has his own stuff he hasn't dealt with\n- His past relationship taught him something — or it didn't, and that's part of his arc\n- His professional code complicates the romance\n- His violence (if necessary) is precise and consequential, never gratuitous\n\n### Emotional Arcs\n- From Closed Off to Vulnerable (with HER specifically)\n- From \"I Don't Need Anyone\" to \"I Need Her\"\n- From Rule-Bound to Rule-Bent for Her (and the cost of that)\n- From Solo Operator to Partner\n\n---\n\n## TROPE COMBINATIONS THAT WORK\n\n| Primary Trope (Tier 1) | Pairs Especially Well With |\n|---|---|\n| Cop / Investigator x Civilian | Stalker Threat, Witness Threat |\n| Bodyguard x Reluctant Protectee | Past Catches Up, Industry Threat |\n| Reformed Bad Boy x Endangered Woman | Conspiracy, Witness Threat |\n| Witness Protection / On the Run | Past Catches Up, Family Threat |\n| Returning Local | Community Threat, Past Catches Up |\n| Co-Workers on the Case | Conspiracy, Serial Threat |\n\n---\n\n## HARD NO TROPES (NEVER USE)\n\n| Trope | Why Not |\n|---|---|\n| Heroine repeatedly rescued as central engine | She's not helpless |\n| Hero gaslighting heroine for \"her own good\" | Genre killer |\n| Threat resolves without her contribution | She must matter to the resolution |\n| Romantic rupture from cruelty between leads | Connie universal — never |\n| Hero is the threat / antagonist | Wrong genre — that's dark romance |\n| Children in danger for shock value | Cheap |\n| Insta-trust between leads in a high-threat situation | Genre killer |\n| Tangled sheets / slick folds / purple prose | CPH universal |\n| Body shame / \"past her prime\" framing | Connie universal |\n| Banned names from `banned-list.md` | Always |\n\n---\n\n## THE CRC RS WISH FULFILLMENT\n\nEvery trope choice should feed at least one of these core fantasies:\n\n- **Being seen as competent** — she's not rescued, she's partnered with\n- **A protector who respects her capability** — earns through skill, not dominance\n- **The threat that brings them together AND threatens to tear them apart**\n- **Dual arcs climaxing together** — case closed, love named\n- **Community that holds when threat surfaces** — found family, neighbors, professionals\n- **Recovery-forward heroines** — trauma without being defined by it\n- **Honor demonstrated through action** — both leads\n- **A grounded HEA** — the threat is gone, the bond is solid, the world is okay again\n\nIf a trope doesn't feed at least one of these, question why it's in the book.\n\n---\n\n## TROPE EXECUTION RULES\n\n### Tropes work when:\n1. **Both arcs are served** — every chosen trope feeds romance AND threat\n2. **Characters justify the trope** — emerges from who they are\n3. **Threat is real and named** — not vague menace\n4. **Stakes are real** — physical, emotional, professional\n5. **Voice carries** — Connie's grounded warmth survives even under threat\n6. **Recovery-forward** — trauma is honest but not defining\n\n### Common mistakes:\n- Threat treated as backdrop for romance (genre killer — must be live arc)\n- Romance treated as filler between investigation chapters (genre killer — must be live arc)\n- Heroine repeatedly rescued (genre killer)\n- Hero solves everything for her (genre killer)\n- Both arcs don't climax together (structural failure)\n- Threat resolves too early or too late (pacing collapse)\n\n---\n\n## TROPE CHECKLIST\n\nBefore locking the trope stack, verify:\n\n- [ ] Tier 1 / 2 / 3 / 4 picks chosen — one each\n- [ ] Total tropes in stack ≤ 5\n- [ ] Stack feeds at least one Wish Fulfillment fantasy\n- [ ] No Hard No tropes present\n- [ ] FMC has agency — contributes to investigation AND/OR rescue AND/OR confrontation\n- [ ] MMC EARNS her — through skill, not dominance\n- [ ] Both arcs are buildable from this trope stack\n- [ ] Stack works with the Story Promise without contradicting it\n- [ ] Any combination flagged in \"Pairs Especially Well With\" — bonus\n- [ ] No banned character names in any trope examples used\n"},"romantasy":{"id":"romantasy","label":"Romantasy / Dark Fantasy","short":"Romantasy","desc":"Fated mates, shifters, fae, monsters. Explicit, supernatural-integrated, emotionally driven.","romance":true,"primaryPens":"Ruthie Clark","targetLine":"85,000–105,000 words | 28–36 chapters | Dual POV preferred (single FMC POV acceptable for tighter books)","words":[85000,105000],"chapters":[28,36],"pov":"Dual POV preferred (single FMC POV acceptable for tighter books)","heatLine":"🌶️🌶️🌶️🌶️🌶️ (4–5/5) — explicit, supernatural-integrated, emotionally driven","outlinePrompt":"You are a professional romantasy outliner specializing in dark fantasy romance, fated mates, and supernatural worldbuilding.\n\nTASK: Create a complete chapter outline for a novel using the Premise and Codex provided in the Project files. Output as [Book Title]_Outline.md.\n\nTARGET: 85,000–105,000 words | 28–36 chapters | Dual POV (alternating, with FMC carrying slightly more chapters during transformation arcs)\n\n---\n\nSTRUCTURE\n\nACT 1 — THE WORLD CRACKS OPEN (0–20%): SHE LEARNS WHAT SHE IS / HE FINDS WHAT HE LOST\n- **CHAPTER 1 OPENS ON A HOOK — THE LEAH GATE.** The hook is the world cracking open in motion: the power surfacing, the bond snapping awake, the moment she's taken, summoned, or called. The supernatural is SHOWN through what happens, not explained. Open mid-motion or mid-collision. NEVER open on telling (narrator explaining who she is or how the magic system works), NEVER on reminiscing or backstory, NEVER on a calm \"ordinary day\" before the world breaks, NEVER on weather, scenery, or worldbuilding lore dump. ACTION and SHOWING in the first lines — reveal her through what she DOES under pressure. THE BAR: would a hostile critic (Leah) read past the first two paragraphs? If the open is slow, backward-looking, or a lore warm-up, build a stronger hook. Write to clear the bar; do not ease in.\n- The supernatural is shown through what HAPPENS, not through explanation\n- Inciting incident pulls her into his world (or his into hers): bond awakens, she discovers her power, he recognizes her, she is taken / summoned / called\n- First contact between FMC and MMC carries supernatural weight — recognition, denial, or both\n- Stakes established: what she stands to lose if she stays, what she stands to lose if she runs\n- Worldbuilding earned through her bewilderment, his impatience, or both — never through narrator dump\n- End of Act 1: the bond / power / fate is named on the page; she cannot pretend it isn't real\n\nACT 2A — REFUSAL AND PURSUIT (20–40%): SHE FIGHTS THE BOND, HE FIGHTS HIS NATURE\n- She RESISTS — fated mates is a beginning, not an ending; she does not fold on first contact\n- He resists too (he should not want a mate; he's chosen something else; she is forbidden / dangerous / mortal)\n- External worldbuilding deepens — court politics, magical hierarchy, species rules, the antagonist's reach\n- Forced proximity through magic, court structure, quest, or imprisonment\n- Bond manifestations begin — physical pull, sensed emotion, dreams, awareness across distance\n- First charged moment — a kiss, a bite, a claiming gesture, a magical exchange — but not full intimacy yet\n- Touch-her-and-die moment lands here: he protects her against a threat she can't yet handle alone\n\nACT 2B — TRANSFORMATION (40–65%): POWER RISES, BOND DEEPENS, HE SHOWS HER WHAT HE IS\n- She begins to wield power she didn't know she had — small, then larger\n- His monster nature shown fully (fangs, scales, wings, beast form, full magic) — and she does not flinch\n- First full intimacy scene anchored here — the bond responds, magic surges, claiming begins on either side\n- Subsequent intimacy scenes weave bond-deepening with power escalation\n- Court / faction / pack notices the change in him — he's softer / harder / dangerous in new ways\n- Found family begins to coalesce around her — coven, court, pack, bonded creatures\n- Setup: the antagonist's plan crystallizes, an ancient enemy moves, a prophecy half-reveals itself\n\nACT 3A — BREAKING POINT (65–80%): FATE TESTS THEM\n- The blow lands — betrayal real or perceived, loss of someone in the inner circle, prophecy revealed in full, ancient enemy strikes\n- Bond is tested or severed — physical or magical separation\n- She must claim her power on her own (not granted by him, not channeled through him)\n- He must face the cost of what he has chosen — his crown, his coven, his immortality, his old life\n- Dark night — she is alone, he is alone, but the bond pulses underneath\n- She makes a sacrifice or commitment that changes her irrevocably (transformation, oath, magical cost)\n\nACT 3B — CLAIMING THE BOND (80–95%): POWER MEETS POWER\n- She returns to him as an equal — not a mate to be claimed but a partner who chooses\n- Final confrontation with the antagonist / threat / fate\n- Magic and romance climax simultaneously — the bond completes, her transformation completes, the world tilts\n- Cost is paid — someone is lost, something is sacrificed, the world is changed\n- He chooses HER over throne / power / immortality / old vow if the choice is forced\n\nRESOLUTION — EARNED HEA (95–100%): THE BOND IS CHOSEN\n- The HEA is supernatural — bonded, claimed, transformed, marked\n- New equilibrium — she has her place in his world, on her terms\n- Magical aftermath — the bond settles, the power stabilizes, the court / coven recognizes her\n- HEA or HFN, but the bond is permanent on the page\n- Optional epilogue — a glimpse of the next book if part of a series, or the bonded life if standalone\n\n---\n\nCHAPTER FORMAT\n\nFor each chapter provide:\n\n### Chapter [#] — [POV]\n- **Goal:** [what this POV is trying to accomplish]\n- **Conflict:** [what stands in the way — internal, external, or magical]\n- **Outcome:** [how the chapter changes the situation]\n- **Bond state:** [where the bond / supernatural connection sits in this chapter]\n\n**Beats (5 bullets max):**\n- [Bullet 1 — opening beat, in action]\n- [Bullet 2]\n- [Bullet 3 — midpoint shift]\n- [Bullet 4]\n- [Bullet 5 — ending HOOK]\n\n**Required per chapter:**\n- At least one supernatural beat (magic, bond, monster nature visible)\n- At least one character beat (vulnerability, growth, choice)\n- Forward momentum on plot OR bond OR power arc\n- Ending HOOK (no soft landings; end mid-motion)\n\n---\n\nINCLUDE WITH THE OUTLINE\n\n## Bond Escalation Map\nTrack the bond from first awareness to full claim:\n- First awareness (Ch ?) — recognition, pull, denial\n- First magical exchange (Ch ?) — touch, taste, blood, magic, dream\n- First charged intimacy (Ch ?) — kiss, bite, claiming gesture\n- First full intimacy (target Ch 12–18, 40–55%)\n- Bond deepens through repeated intimacy and crisis (Ch ?–?)\n- Severance / test (~75%)\n- Full claim (~90%)\n- Settled bond (resolution)\n\n## Power Awakening Map\nMap the FMC's power arc:\n- First glimpse / accident (Ch ?)\n- First conscious use (Ch ?)\n- First mastery (Ch ?)\n- First sacrifice / cost paid for power (Ch ?)\n- Full claim of power, on her own (Act 3, before Act 3B)\n\n## Heat Map\n- Heat level: 🌶️🌶️🌶️🌶️🌶️ (4–5/5) default\n- First charged moment (target 25–35%)\n- First full intimacy (target 40–55%)\n- Multiple intimacy scenes through Act 2B (each one bond-deepening)\n- Post-breaking-point reconnection (target ~90%)\n- Note where his monstrous nature is present in heat scenes (fangs, claws, wings, magic)\n\n## Worldbuilding Earn Map\nList the major worldbuilding reveals and which chapter earns them:\n- The system (magic / species / court rules) — earned through whose problem?\n- The antagonist's nature — earned through what scene?\n- The prophecy / fate / curse — earned through what cost?\n- The cost of power — earned through what loss?\n\n---\n\nREQUIREMENTS (NON-NEGOTIABLE)\n\n- FMC has agency from page one — fated mates is a beginning, not a coronation\n- She RESISTS the bond meaningfully before accepting it\n- He stays a monster — love does not make him human, soft, or harmless to the world\n- His monstrous nature is present in intimacy, not hidden during it\n- Her power is HERS — granted by birthright, not by him; claimed, not gifted\n- Worldbuilding earned through scene, never through info-dump\n- The bond costs both of them something concrete\n- Single POV per chapter; dual POV across the book required\n- Ending HOOK every chapter (apply the Sleep Test)\n- No tangled sheets, no slick folds, no purple prose (CPH universal)\n- Chapter 1 clears the Leah Gate — open on an action/showing hook (see Act 1); never telling, reminiscing, a calm \"ordinary day,\" weather, recap, or worldbuilding info-dump\n- Heat 4-5/5 default — flag any scene that would land below or above\n\n---\n\nRUTHIE CLARK SPECIFIC CHECKS\n\nBefore outputting the outline, verify:\n\n- [ ] Worldbuilding is integrated, not decorative — the world IS the conflict\n- [ ] FMC's power arc is clear and earns its payoff\n- [ ] The bond escalates across the book (not \"instant mate, instant happy\")\n- [ ] His monster nature stays visible — he doesn't soften into \"just a guy\"\n- [ ] At least one moment where the FMC chooses the monster knowing exactly what he is\n- [ ] No scenes drift into Connie-tone (warm, small-town) or Sage-tone (banter-forward) — recalibrate if drift detected\n- [ ] No banned names in the outline (cross-check `banned-list.md` and `ruthie-clark` skill character rules)\n- [ ] Court / coven / pack hierarchy is consistent — flag any rule violations\n- [ ] The ending pays off the supernatural setup (bond completed, power claimed, world changed)\n\nOUTPUT: Save as [Book Title]_Outline.md in Project files.","outlineRefinements":[{"label":"Bond locks in too fast","text":"She accepts the bond by Ch [X]. Push the resistance through to at least Ch [Y]. Add 1–2 chapters of denial, fighting the pull, choosing to fight even though the bond is real."},{"label":"Worldbuilding feels exposition-heavy","text":"Ch [X-Y] explains too much through narration. Re-outline so the worldbuilding arrives as her problem — she encounters the rule, she breaks it, she pays the cost, then she understands."},{"label":"FMC reads passive","text":"She's reacting to the bond, the prophecy, the antagonist — but not driving the plot. Re-outline Ch [X-Y] so she makes at least one active choice per chapter that changes the trajectory."},{"label":"Hero softens too early","text":"By Ch [X] he's reading like a regular guy with a magical accent. Recalibrate — keep his monstrous nature visible: fangs, claws, wings, magic, court politics, the threat he is to the world."},{"label":"Heat scenes don't deepen the bond","text":"Ch [X-Y] heat scenes feel like generic explicit content. Re-outline so each intimacy beat advances the bond — magic surges, claiming progresses, vulnerability deepens."},{"label":"Power arc is flat","text":"Her power doesn't escalate visibly across the book. Map three concrete escalation points and place them at Ch [X], Ch [Y], Ch [Z]."},{"label":"Climax doesn't pay off setup","text":"The Act 3B confrontation resolves through external event rather than the bond / power arc. Re-outline so the magic AND the romance climax simultaneously."},{"label":"Ending feels rushed","text":"The HEA lands in the last 1-2 chapters with no aftermath. Spread the resolution across 3–4 chapters so the bond / claim / world settling all earn their landing."}],"postChecks":["Chapter count sanity check — 28–36 is the target. Under 28 = romantasy needs longer for transformation arcs. Over 36 = should likely be a duology or has filler.","POV balance — Roughly 50/50 or deliberate FMC lean during transformation arc. Flag if MMC dominates — romantasy lives in the FMC's awakening.","Bond escalation pacing — First charged moment around 25–35%, first full intimacy 40–55%, full claim ~90%. If the bond locks in too fast, the slow burn reader is lost. If it locks in too slow, the romance reader is lost.","Worldbuilding density — Information must be EARNED through scene. Spot-check: does the reader learn the magic system because a character has a problem with it, or because the narrator stopped to explain?","FMC power arc — Three or more clear escalation points. If she's still passive in Act 3, she's failing the genre.","Monster presence in heat scenes — His supernatural nature should be PRESENT during intimacy, not hidden. Flag any scene that reads as fully human."],"tropes":{"tiers":[{"name":"TIER 1 — CORE BOND ENGINE","intro":"Pick ONE. This defines the supernatural spine of the romance.","cards":[{"name":"Fated Mates / Soul Bonds","bullets":["Supernatural recognition, the bond pulling them together","The bond is real, but acceptance is EARNED — she can fight it","Choosing the bond rather than being forced by it is the payoff"]},{"name":"Monster Romance","bullets":["He is literally inhuman — dragon, fae, demon, beast, vampire, eldritch","His otherness is dangerous, attractive, impossible","She accepts ALL of him, including the monster — not despite it"]},{"name":"Fairytale Retelling (Dark)","bullets":["Familiar story with a dark twist","Reader expectations are subverted with intent","The \"villain\" becomes the love interest, the \"hero\" becomes the threat","A better ending earned for THIS pair than the source story granted"]},{"name":"Captive Romance (Supernatural)","bullets":["He takes her — leverage, protection, obsession, fate, magical contract","She is trapped but not helpless","Captivity becomes choice; she stays when the door opens"]},{"name":"Marriage of Convenience (Magical/Political)","bullets":["Political alliance, peace treaty, magical requirement, fae bargain","The contract is real and binding (often magically)","Feelings follow obligation; the bargain becomes choice"]},{"name":"Forbidden Romance (Species / Court / Side)","bullets":["Species divide, class divide, enemy court, opposing magic","It is forbidden for a reason, and the reason is real","Choosing each other rewrites the rules — or breaks the world"]}]},{"name":"TIER 2 — POWER & TRANSFORMATION","intro":"Pick ONE. This drives the FMC's arc.","cards":[{"name":"Hidden Power","bullets":["She doesn't know what she is until crisis reveals it","The discovery costs her — innocence, family, identity","Her power escalates across the book, claimed by HER not granted by him"]},{"name":"Chosen One (Reluctant)","bullets":["She didn't want to be special — but she is","Prophecy or destiny names her, and she has to deal with it","The \"how\" matters more than the \"what\" — agency throughout"]},{"name":"Transformation (Literal)","bullets":["She becomes something other — vampire, fae, immortal, magical hybrid","Choice to transform is HERS, made knowing the cost","The transformation is bond-related but not bond-dependent"]},{"name":"Awakening Magic","bullets":["Her power has always been latent; the bond / threat / world activates it","Magic responds to emotion — and she's been suppressing both","Mastery is earned through trial, mentor, or near-loss"]},{"name":"Sacrifice Arc","bullets":["She gives up something irreplaceable for him, the world, or her power","The sacrifice is real, on the page, and not undone","This is the cost the genre demands"]}]},{"name":"TIER 3 — DYNAMIC","intro":"Pick ONE. This fuels the romance and the heat.","cards":[{"name":"Morally Gray Hero / Defiant FMC","bullets":["He's done terrible things, will do more, doesn't apologize","She sees what he is and wants him anyway — eyes open","His darkness serves her instead of threatening her by Act 2"]},{"name":"Enemies to Lovers (Court / Faction)","bullets":["Genuine opposing sides, real reasons to hate","Attraction despite hatred — betraying their own side","They redefine the war, together"]},{"name":"Touch-Her-and-Die / Defiant Equal","bullets":["His possessive / protective instincts are lethal","She does NOT need rescuing as her core mode","His violence on her behalf is welcomed, but she fights too"]},{"name":"Beast / The One Who Sees Him","bullets":["He's been a monster long enough to forget he was ever a person","She sees the man underneath without trying to \"fix\" the monster","Recognition without rescue"]},{"name":"Slow-Burn Court Politics","bullets":["They circle each other through court intrigue, ceremony, public ritual","Heat is constrained by social rule — until it isn't","The first private moment lands like an explosion"]},{"name":"Avoid for Ruthie","bullets":["Sunshine FMCs played straight (wrong tone — Sage / Connie territory)","Banter as the engine (banter exists, but tension and bond are the engine)","Rescue-fantasy passive heroines (genre killer)","Hero who fully redeems into a \"good guy\" by Act 3 (genre killer)"]}]},{"name":"TIER 4 — STAKES & SECRET","intro":"Pick ONE. This drives Act 3 breaking point.","cards":[{"name":"Prophecy Reveal","bullets":["A piece of the prophecy clicks into place at the worst possible moment","It reframes everything — her role, his choice, the cost","Don't make it convenient — characters must still have agency"]},{"name":"Ancient Enemy Returns","bullets":["A force from his / her / the world's past surfaces","It threatens not just them but the world's balance","Defeating it requires the bond / her power / both"]},{"name":"Court / Coven / Pack Betrayal","bullets":["Someone trusted breaks the inner circle","The betrayal cuts deeper than an external enemy could","His response shows what he'll burn for her"]},{"name":"Hidden Lineage","bullets":["She is connected to something she didn't know — heir, descendant, key","Her lineage changes the political map","Antagonist already knew; she didn't"]},{"name":"Magical Cost / Bargain Comes Due","bullets":["An old bargain (his or hers) demands payment","Payment is impossible without breaking the bond","The choice is binary and costs them both"]},{"name":"Forced Choice (Power vs. Bond / Throne vs. Her)","bullets":["He must choose his crown / his old vow / his immortal duty vs. her","The choice is on the page, not implied","Her choice mirrors his — she chooses him knowing what it costs"]}]}],"extras":{"THE TROPE PICKER SYSTEM":"\nPick ONE option from each tier. Romantasy can carry MORE worldbuilding weight than rom-com or contemporary romance, but the trope stack still needs discipline.\n\n**Max trope count per book: 5 total.**\n\n---\n\n","FMC TROPE CLUSTERS":"\nRuthie FMCs are sharp, magic-touched, and refuse to be passive. They are not chosen — they CHOOSE.\n\n### Core Archetypes\n- The Reluctant Heir / Heiress\n- The Witch Out of Time\n- The Half-Breed (between two worlds, accepted by neither)\n- The Sleeper (latent power, awakening across the book)\n- The Banished Princess\n- The Mortal Who Should Not Be Here\n- The Dragon Daughter\n- The Last of Her Line\n\n### Active-Agency Traits\n- Negotiates with monsters from a position of nothing\n- Refuses to be a prize, a pawn, or a prophecy fulfillment\n- Notices the rule, breaks it, then changes it\n- Will die before being passive\n- Cries in private, fights in public\n- Loyalty earned, never granted\n\n### Power Markers\n- Magic responds to emotion she's been suppressing\n- Power scares her — and others — and she chooses to wield it anyway\n- Mastery costs her something each time\n- Final power claim is unmistakable, public, and irreversible\n\n### Emotional Arcs\n- Believes she doesn't deserve power / love / a place at the table\n- Learning to take up space in his world without shrinking\n- Choosing the bond knowing the cost\n- Naming what he is and loving him anyway\n- Saving herself before she can save anyone else\n\n---\n\n","MMC TROPE CLUSTERS":"\nRuthie MMCs are dangerous, possessive, and ancient. Love does not domesticate them.\n\n### Core Archetypes\n- The Dragon King / Lord / Heir\n- The Fae Court Lord (Spring / Summer / Autumn / Winter / Shadow)\n- The Cursed Beast\n- The Vampire Sovereign\n- The Demon General\n- The Last of His Bloodline\n- The Banished Prince\n- The Reluctant Crown\n\n### Devotion-Through-Action Traits\n- Burns the world for her without apology\n- \"Touch her and die\" is law, not threat\n- Breaks his own rules / vows / oaths for her\n- Recognizes her instantly and refuses to act on it for centuries / decades / years\n- His stillness is more dangerous than another man's rage\n- Pet names used sparingly — when they arrive, they MEAN\n\n### Hard Edges (Required)\n- He stays dangerous to the world after she chooses him\n- His monstrous nature is visible during intimacy, never hidden\n- He does not \"heal\" out of his sins\n- He's still a monster — just HER monster\n\n### Emotional Arcs\n- From recognition denied to bond claimed\n- From throne / crown / vow to her\n- From immortality alone to bond shared\n- From the monster the world fears to the monster who chose\n\n---\n\n","TROPE COMBINATIONS THAT WORK":"\n| Primary Trope (Tier 1) | Pairs Especially Well With |\n|---|---|\n| Fated Mates | Enemies to Lovers, Monster Romance |\n| Captive Romance | Touch-Her-and-Die, Morally Gray Hero |\n| Fairytale Retelling | Hidden Power, Chosen One |\n| Monster Romance | Fated Mates, Forbidden Romance |\n| Marriage of Convenience (Magical) | Forced Proximity, Forbidden Romance |\n| Forbidden Romance | Court Betrayal, Forced Choice |\n\n---\n\n","HARD NO TROPES (NEVER USE)":"\n| Trope | Why Not |\n|---|---|\n| Passive Prize FMC | She has agency throughout — non-negotiable |\n| Instant Acceptance of the Bond | The bond must be EARNED, never granted |\n| \"Fixed by Love\" | He stays what he is |\n| Wallpaper Fantasy | The world must be integral, not decorative |\n| Info-Dump Opening | Worldbuilding is earned in scene |\n| One-Dimensional Villain | Even enemies have depth |\n| Prophecy as Shortcut | Destiny does not replace character work |\n| Erased Otherness | His monster nature remains |\n| Tangled sheets / slick folds / purple prose | CPH universal |\n| Banned names from `banned-list.md` | Always |\n\n---\n\n","THE RUTHIE CLARK WISH FULFILLMENT":"\nEvery trope choice should feed at least one of these core fantasies:\n\n- Being **chosen by something powerful and dangerous**\n- **Transformation into something more** (power, immortality, queenship)\n- A **bond that transcends normal love**\n- Acceptance of **ALL** of someone, including the dark parts\n- Epic love in **epic settings**\n- The **monster who is gentle only for her**\n- Power **discovered and claimed**\n- Enemies who **can't stop wanting each other**\n- Fate that feels **earned, not forced**\n\nIf a trope doesn't feed at least one of these, question why it's in the book.\n\n---\n\n","TROPE EXECUTION RULES":"\n### Tropes work when:\n1. **Characters justify the trope** — bond emerges from who they are, not stapled on\n2. **Stakes are real** — the world tilts when the bond progresses\n3. **Payoff matches setup** — every magic / power / bond promise is kept\n4. **Fresh angles** — readers know fated mates; surprise them with execution\n5. **Emotional truth** — even the wildest premise needs grounded feelings\n6. **Worldbuilding integrated** — magic is the conflict, not the décor\n7. **Voice carries** — Jessica's patterns survive even in supernatural intensity\n\n### Common mistakes:\n- Trope as substitute for character development\n- Setup without payoff (prophecy never explained, power never claimed)\n- Bond locks in by Ch 5 with no resistance (genre killer)\n- Hero softens into \"good guy with magic\" by Act 3 (genre killer)\n- FMC stays passive after bond accepted (genre killer)\n- Worldbuilding info-dumped instead of earned\n\n---\n\n","TROPE CHECKLIST":"\nBefore locking the trope stack, verify:\n\n- [ ] Tier 1 / 2 / 3 / 4 picks chosen — one each\n- [ ] Total tropes in stack ≤ 5\n- [ ] Stack feeds at least one Wish Fulfillment fantasy\n- [ ] No Hard No tropes present\n- [ ] FMC has active agency built into chosen tropes (especially Tier 2)\n- [ ] MMC stays a monster — softness is for HER, not the world\n- [ ] Worldbuilding is integral to the trope choices\n- [ ] Stack works with the Story Promise without contradicting it\n- [ ] Any combination flagged in \"Pairs Especially Well With\" — bonus\n- [ ] No banned character names in any trope examples used\n\n"},"primary":"Ruthie Clark (heat 4-5)","max":5},"tropesDoc":"# Romantasy Tropes Master List\n\n**Primary pen name:** Ruthie Clark (heat 4-5)\n**Secondary use:** Vesper Crane (dark mythology) and Lilith Darkwing (dark paranormal) overlap with these tropes — but each has a dedicated tropes file once built. Ruthie owns dark fantasy / dragon shifters / fae court / monster romance.\n\n---\n\n## THE TROPE PICKER SYSTEM\n\nPick ONE option from each tier. Romantasy can carry MORE worldbuilding weight than rom-com or contemporary romance, but the trope stack still needs discipline.\n\n**Max trope count per book: 5 total.**\n\n---\n\n## ⚔️ TIER 1 — CORE BOND ENGINE\n\n*Pick ONE. This defines the supernatural spine of the romance.*\n\n### Fated Mates / Soul Bonds\n- Supernatural recognition, the bond pulling them together\n- The bond is real, but acceptance is EARNED — she can fight it\n- Choosing the bond rather than being forced by it is the payoff\n\n### Monster Romance\n- He is literally inhuman — dragon, fae, demon, beast, vampire, eldritch\n- His otherness is dangerous, attractive, impossible\n- She accepts ALL of him, including the monster — not despite it\n\n### Fairytale Retelling (Dark)\n- Familiar story with a dark twist\n- Reader expectations are subverted with intent\n- The \"villain\" becomes the love interest, the \"hero\" becomes the threat\n- A better ending earned for THIS pair than the source story granted\n\n### Captive Romance (Supernatural)\n- He takes her — leverage, protection, obsession, fate, magical contract\n- She is trapped but not helpless\n- Captivity becomes choice; she stays when the door opens\n\n### Marriage of Convenience (Magical/Political)\n- Political alliance, peace treaty, magical requirement, fae bargain\n- The contract is real and binding (often magically)\n- Feelings follow obligation; the bargain becomes choice\n\n### Forbidden Romance (Species / Court / Side)\n- Species divide, class divide, enemy court, opposing magic\n- It is forbidden for a reason, and the reason is real\n- Choosing each other rewrites the rules — or breaks the world\n\n---\n\n## ⚔️ TIER 2 — POWER & TRANSFORMATION\n\n*Pick ONE. This drives the FMC's arc.*\n\n### Hidden Power\n- She doesn't know what she is until crisis reveals it\n- The discovery costs her — innocence, family, identity\n- Her power escalates across the book, claimed by HER not granted by him\n\n### Chosen One (Reluctant)\n- She didn't want to be special — but she is\n- Prophecy or destiny names her, and she has to deal with it\n- The \"how\" matters more than the \"what\" — agency throughout\n\n### Transformation (Literal)\n- She becomes something other — vampire, fae, immortal, magical hybrid\n- Choice to transform is HERS, made knowing the cost\n- The transformation is bond-related but not bond-dependent\n\n### Awakening Magic\n- Her power has always been latent; the bond / threat / world activates it\n- Magic responds to emotion — and she's been suppressing both\n- Mastery is earned through trial, mentor, or near-loss\n\n### Sacrifice Arc\n- She gives up something irreplaceable for him, the world, or her power\n- The sacrifice is real, on the page, and not undone\n- This is the cost the genre demands\n\n---\n\n## ⚔️ TIER 3 — DYNAMIC\n\n*Pick ONE. This fuels the romance and the heat.*\n\n### Morally Gray Hero / Defiant FMC\n- He's done terrible things, will do more, doesn't apologize\n- She sees what he is and wants him anyway — eyes open\n- His darkness serves her instead of threatening her by Act 2\n\n### Enemies to Lovers (Court / Faction)\n- Genuine opposing sides, real reasons to hate\n- Attraction despite hatred — betraying their own side\n- They redefine the war, together\n\n### Touch-Her-and-Die / Defiant Equal\n- His possessive / protective instincts are lethal\n- She does NOT need rescuing as her core mode\n- His violence on her behalf is welcomed, but she fights too\n\n### Beast / The One Who Sees Him\n- He's been a monster long enough to forget he was ever a person\n- She sees the man underneath without trying to \"fix\" the monster\n- Recognition without rescue\n\n### Slow-Burn Court Politics\n- They circle each other through court intrigue, ceremony, public ritual\n- Heat is constrained by social rule — until it isn't\n- The first private moment lands like an explosion\n\n### Avoid for Ruthie\n- Sunshine FMCs played straight (wrong tone — Sage / Connie territory)\n- Banter as the engine (banter exists, but tension and bond are the engine)\n- Rescue-fantasy passive heroines (genre killer)\n- Hero who fully redeems into a \"good guy\" by Act 3 (genre killer)\n\n---\n\n## ⚔️ TIER 4 — STAKES & SECRET\n\n*Pick ONE. This drives Act 3 breaking point.*\n\n### Prophecy Reveal\n- A piece of the prophecy clicks into place at the worst possible moment\n- It reframes everything — her role, his choice, the cost\n- Don't make it convenient — characters must still have agency\n\n### Ancient Enemy Returns\n- A force from his / her / the world's past surfaces\n- It threatens not just them but the world's balance\n- Defeating it requires the bond / her power / both\n\n### Court / Coven / Pack Betrayal\n- Someone trusted breaks the inner circle\n- The betrayal cuts deeper than an external enemy could\n- His response shows what he'll burn for her\n\n### Hidden Lineage\n- She is connected to something she didn't know — heir, descendant, key\n- Her lineage changes the political map\n- Antagonist already knew; she didn't\n\n### Magical Cost / Bargain Comes Due\n- An old bargain (his or hers) demands payment\n- Payment is impossible without breaking the bond\n- The choice is binary and costs them both\n\n### Forced Choice (Power vs. Bond / Throne vs. Her)\n- He must choose his crown / his old vow / his immortal duty vs. her\n- The choice is on the page, not implied\n- Her choice mirrors his — she chooses him knowing what it costs\n\n---\n\n## FMC TROPE CLUSTERS\n\nRuthie FMCs are sharp, magic-touched, and refuse to be passive. They are not chosen — they CHOOSE.\n\n### Core Archetypes\n- The Reluctant Heir / Heiress\n- The Witch Out of Time\n- The Half-Breed (between two worlds, accepted by neither)\n- The Sleeper (latent power, awakening across the book)\n- The Banished Princess\n- The Mortal Who Should Not Be Here\n- The Dragon Daughter\n- The Last of Her Line\n\n### Active-Agency Traits\n- Negotiates with monsters from a position of nothing\n- Refuses to be a prize, a pawn, or a prophecy fulfillment\n- Notices the rule, breaks it, then changes it\n- Will die before being passive\n- Cries in private, fights in public\n- Loyalty earned, never granted\n\n### Power Markers\n- Magic responds to emotion she's been suppressing\n- Power scares her — and others — and she chooses to wield it anyway\n- Mastery costs her something each time\n- Final power claim is unmistakable, public, and irreversible\n\n### Emotional Arcs\n- Believes she doesn't deserve power / love / a place at the table\n- Learning to take up space in his world without shrinking\n- Choosing the bond knowing the cost\n- Naming what he is and loving him anyway\n- Saving herself before she can save anyone else\n\n---\n\n## MMC TROPE CLUSTERS\n\nRuthie MMCs are dangerous, possessive, and ancient. Love does not domesticate them.\n\n### Core Archetypes\n- The Dragon King / Lord / Heir\n- The Fae Court Lord (Spring / Summer / Autumn / Winter / Shadow)\n- The Cursed Beast\n- The Vampire Sovereign\n- The Demon General\n- The Last of His Bloodline\n- The Banished Prince\n- The Reluctant Crown\n\n### Devotion-Through-Action Traits\n- Burns the world for her without apology\n- \"Touch her and die\" is law, not threat\n- Breaks his own rules / vows / oaths for her\n- Recognizes her instantly and refuses to act on it for centuries / decades / years\n- His stillness is more dangerous than another man's rage\n- Pet names used sparingly — when they arrive, they MEAN\n\n### Hard Edges (Required)\n- He stays dangerous to the world after she chooses him\n- His monstrous nature is visible during intimacy, never hidden\n- He does not \"heal\" out of his sins\n- He's still a monster — just HER monster\n\n### Emotional Arcs\n- From recognition denied to bond claimed\n- From throne / crown / vow to her\n- From immortality alone to bond shared\n- From the monster the world fears to the monster who chose\n\n---\n\n## TROPE COMBINATIONS THAT WORK\n\n| Primary Trope (Tier 1) | Pairs Especially Well With |\n|---|---|\n| Fated Mates | Enemies to Lovers, Monster Romance |\n| Captive Romance | Touch-Her-and-Die, Morally Gray Hero |\n| Fairytale Retelling | Hidden Power, Chosen One |\n| Monster Romance | Fated Mates, Forbidden Romance |\n| Marriage of Convenience (Magical) | Forced Proximity, Forbidden Romance |\n| Forbidden Romance | Court Betrayal, Forced Choice |\n\n---\n\n## HARD NO TROPES (NEVER USE)\n\n| Trope | Why Not |\n|---|---|\n| Passive Prize FMC | She has agency throughout — non-negotiable |\n| Instant Acceptance of the Bond | The bond must be EARNED, never granted |\n| \"Fixed by Love\" | He stays what he is |\n| Wallpaper Fantasy | The world must be integral, not decorative |\n| Info-Dump Opening | Worldbuilding is earned in scene |\n| One-Dimensional Villain | Even enemies have depth |\n| Prophecy as Shortcut | Destiny does not replace character work |\n| Erased Otherness | His monster nature remains |\n| Tangled sheets / slick folds / purple prose | CPH universal |\n| Banned names from `banned-list.md` | Always |\n\n---\n\n## THE RUTHIE CLARK WISH FULFILLMENT\n\nEvery trope choice should feed at least one of these core fantasies:\n\n- Being **chosen by something powerful and dangerous**\n- **Transformation into something more** (power, immortality, queenship)\n- A **bond that transcends normal love**\n- Acceptance of **ALL** of someone, including the dark parts\n- Epic love in **epic settings**\n- The **monster who is gentle only for her**\n- Power **discovered and claimed**\n- Enemies who **can't stop wanting each other**\n- Fate that feels **earned, not forced**\n\nIf a trope doesn't feed at least one of these, question why it's in the book.\n\n---\n\n## TROPE EXECUTION RULES\n\n### Tropes work when:\n1. **Characters justify the trope** — bond emerges from who they are, not stapled on\n2. **Stakes are real** — the world tilts when the bond progresses\n3. **Payoff matches setup** — every magic / power / bond promise is kept\n4. **Fresh angles** — readers know fated mates; surprise them with execution\n5. **Emotional truth** — even the wildest premise needs grounded feelings\n6. **Worldbuilding integrated** — magic is the conflict, not the décor\n7. **Voice carries** — Jessica's patterns survive even in supernatural intensity\n\n### Common mistakes:\n- Trope as substitute for character development\n- Setup without payoff (prophecy never explained, power never claimed)\n- Bond locks in by Ch 5 with no resistance (genre killer)\n- Hero softens into \"good guy with magic\" by Act 3 (genre killer)\n- FMC stays passive after bond accepted (genre killer)\n- Worldbuilding info-dumped instead of earned\n\n---\n\n## TROPE CHECKLIST\n\nBefore locking the trope stack, verify:\n\n- [ ] Tier 1 / 2 / 3 / 4 picks chosen — one each\n- [ ] Total tropes in stack ≤ 5\n- [ ] Stack feeds at least one Wish Fulfillment fantasy\n- [ ] No Hard No tropes present\n- [ ] FMC has active agency built into chosen tropes (especially Tier 2)\n- [ ] MMC stays a monster — softness is for HER, not the world\n- [ ] Worldbuilding is integral to the trope choices\n- [ ] Stack works with the Story Promise without contradicting it\n- [ ] Any combination flagged in \"Pairs Especially Well With\" — bonus\n- [ ] No banned character names in any trope examples used\n"},"regency":{"id":"regency","label":"Regency Rom-Com","short":"Regency","desc":"Wit, restraint, scandal in motion. Closed door — dialogue is the foreplay.","romance":true,"primaryPens":"Marjorie Adams","targetLine":"70,000–85,000 words | 24–30 chapters | Dual POV preferred (single FMC POV acceptable)","words":[70000,85000],"chapters":[24,30],"pov":"Dual POV preferred (single FMC POV acceptable)","heatLine":"🌶️🌶️ (1–2/5) — closed door, restraint as the erotic engine, dialogue as foreplay","outlinePrompt":"You are a professional Regency rom-com outliner specializing in Austen-style social comedy with romantic tension built from restraint, witty dialogue, and historically grounded conflict.\n\nTASK: Create a complete chapter outline for a novel using the Premise and Codex provided in the Project files. Output as [Book Title]_Outline.md.\n\nTARGET: 70,000–85,000 words | 24–30 chapters | Dual POV preferred\n\n---\n\nSTRUCTURE\n\nACT 1 — INTRODUCTION TO SOCIETY (0–25%): SHE ENTERS HIS ORBIT (OR HE ENTERS HERS)\n- **CHAPTER 1 OPENS ON A HOOK — THE LEAH GATE.** In Regency the hook is a charged social collision already in motion, carried by ironic voice from the first line: the scandal already breaking, the wager already laid, the disastrous introduction already underway, the overheard remark that changes everything. \"Action\" here means social action and a voice that pops — NOT a chase and NOT a quiet drawing room being described. Open in scene, mid-encounter. NEVER open on telling (narrator explaining her rank, family, or marriage prospects), NEVER on reminiscing or backstory, NEVER on a calm \"ordinary day\" of the household before the plot starts, NEVER on weather, an estate tour, or genealogy. SHOWING through wit, friction, and what is said and done. THE BAR: would a hostile critic (Leah) read past the first two paragraphs? If the open is slow, backward-looking, or merely scene-setting, sharpen the hook. Write to clear the bar; do not ease in.\n- FMC's voice: sharp internal observation, ironic narration, witty even when distressed\n- Inciting incident: an introduction, an inheritance, a scandal, a forced proximity, a guardian's decision, a wager\n- First contact — first impression usually wrong on at least one side; misunderstanding seeded\n- Establish: rank, fortune, family situation, reputation\n- Society as both stage and threat — the watchers, the gossips, the meddlers\n- Stakes: reputation, fortune, family, marriage prospects\n- End of Act 1: she cannot avoid him; he cannot avoid her — circumstances bind them\n\nACT 2A — VERBAL SPARRING & GLANCES (25–50%): WIT BUILDS, RESTRAINT INTENSIFIES\n- The slow burn formula activated: glances → accidental touch → proximity → conversation → longing → near-misses\n- Forced proximity through social custom — dancing, shared carriage, country house party, mourning visit, charity bazaar\n- Verbal sparring as foreplay — wit reveals compatibility; understanding subtext signals connection\n- He misjudges her; she misjudges him — both are correcting their views\n- First near-miss (almost-kiss, interrupted moment) — target Ch 8–12\n- Side characters reveal information that complicates assumptions — letters, overheard conversation, family revelation\n- Midpoint (~50%): a private moment that cannot be spoken of in public — they understand each other for the first time\n\nACT 2B — LONGING (50–75%): WHAT THEY WANT BUT CANNOT HAVE\n- Both POVs know they care; neither has spoken\n- External obstacle tightens — the entail, the prior betrothal, the family disapproval, the fortune hunter, the scandal looming\n- Dance scene as emotional centerpiece — the touch through gloves, the held gaze, the conversation across the floor\n- A letter exchanged — written confession of what cannot be said aloud\n- Crisis of propriety — they are seen, gossiped about, or nearly compromised\n- Setup for the breaking point: a misunderstanding seeded, a marriage proposal forced, a separation imposed\n\nACT 3A — RUPTURE BY MISUNDERSTANDING (75–88%): SOCIETY DOES ITS WORST\n- The blow lands — but in Marjorie's lane it is FROM SOCIETY'S RULES, MISUNDERSTANDING, or FAMILY OBLIGATION — never cruelty between leads\n- Sources: she believes he is engaged to another, he believes she has refused him, the scandal is misread, the betrothal contract surfaces\n- Both retreat to their own circles — separate balls, separate country estates, separate London seasons\n- Pain experienced; pride at war with longing\n- A trusted friend or relative tells one of them the truth — or evidence arrives in a letter\n- The misunderstanding clarifies — but the public situation is still impossible\n\nACT 3B — DECLARATION & EARNED HEA (88–98%): SHE CHOOSES, HE CHOOSES\n- A vulnerable, public, or socially costly gesture — proposing in front of society, choosing love over fortune, breaking a prior betrothal honorably\n- The declaration is finally SPOKEN — ideally in scene, not letter (though a letter setup is genre-allowed)\n- Society either recognizes or does not — but they choose each other regardless\n- Resolution of external obstacle — the entail addressed, the fortune secured or relinquished, the family reconciled or refused\n\nRESOLUTION — EARNED HEA (98–100%): WARM AND PROPER\n- A domestic scene — the morning room, the country garden, the engagement called\n- Society's reaction (positive or scandalous-but-survived)\n- Optional epilogue — months or a year later, the marriage settled, the next generation hinted at\n- HEA must feel inevitable yet surprising\n\n---\n\nCHAPTER FORMAT\n\nFor each chapter provide:\n\n### Chapter [#] — [POV]\n- **Goal:** [what this POV is trying to accomplish]\n- **Conflict:** [internal, social, or familial]\n- **Outcome:** [how the chapter changes the situation]\n\n**Beats (5 bullets max):**\n- [Bullet 1 — opening beat, in scene]\n- [Bullet 2]\n- [Bullet 3 — midpoint shift]\n- [Bullet 4]\n- [Bullet 5 — ending HOOK]\n\n**Required per chapter:**\n- At least one witty exchange (banter, irony, social observation)\n- At least one moment of restraint or longing (the unspoken, the held gaze, the touch through gloves)\n- Forward momentum on courtship OR plot OR character understanding\n- Ending HOOK — never resolve a scene at chapter end\n\n---\n\nINCLUDE WITH THE OUTLINE\n\n## Slow Burn Map\nTrack the eight stages across the book:\n- Glances (Ch ?–?) — catching each other looking\n- Accidental Touch (Ch ?) — handing items, assisting into carriages\n- Proximity (Ch ?–?) — dancing, crowded rooms, shared carriages\n- Conversation (Ch ?–?) — verbal sparring, meaningful subtext\n- Longing (Ch ?–?) — what they want but cannot have\n- Near-Misses (Ch ?–?) — almost-kiss, interrupted moment\n- Letters (Ch ?) — written confession unspoken\n- Declaration (Ch ?) — finally aloud\n\n## Social Map\nList the watchers and their function:\n- The Mama (matchmaking interest)\n- The Rival (another suitor or another lady)\n- The Friend (the truth-teller)\n- The Gossip (the threat to reputation)\n- The Guardian (the gatekeeper)\n- The Family (obligation embodied)\n\n## Heat Map\n- Heat level: 1–2/5 — closed door, restraint as engine\n- First near-miss (target Ch 8–12)\n- First kiss (target Ch 16–22, ~70%) — major emotional beat, often interrupted\n- Restraint INTENSIFIES rather than resolves through Act 2B\n- No on-page intimacy beyond a kiss — the tension lives in the unsaid\n\n---\n\nREQUIREMENTS (NON-NEGOTIABLE)\n\n- Chapter 1 clears the Leah Gate — open on a social-collision hook with ironic voice (see Act 1); never telling, reminiscing, a calm \"ordinary day,\" weather, or family history to open\n- No contractions in dialogue or narrative (\"do not\" not \"don't\")\n- Period-appropriate vocabulary throughout — \"shall\" not \"will\" for first person future, \"ought\" not \"should,\" \"whilst\" not \"while\"\n- Forms of address correct for rank — Lord, Lady, Miss, Mrs., Your Grace, etc.\n- Heat from RESTRAINT — the impropriety of proximity, the weight of his gaze, the warmth of her hand through gloves\n- Wit as compatibility signal — verbal sparring shows connection\n- FMC has agency within period constraints — she may be limited, but she chooses\n- Hero earns her — through honor, action, and changed understanding, not just declaration\n- Third-act conflict from FEAR / MISUNDERSTANDING / SOCIAL OBLIGATION — never cruelty between leads\n- Single POV per chapter; alternating dual POV preferred\n- Ending HOOK every chapter\n- HEA mandatory — happy ending that feels inevitable yet surprising\n- No tangled sheets, no slick folds, no purple prose (CPH universal)\n\n---\n\nMARJORIE ADAMS SPECIFIC CHECKS\n\nBefore outputting the outline, verify:\n\n- [ ] Inversion / longer sentence structure used for emphasis where appropriate\n- [ ] Heat comes from restraint, not action\n- [ ] Wit and verbal sparring present in every Act 1 and Act 2A chapter\n- [ ] Social rules either observed OR deliberately broken for plot — never ignored\n- [ ] Chaperone rules observed or scandalously broken (with consequences)\n- [ ] No anachronistic words, modern phrasing, or contractions\n- [ ] FMC's intelligence shows in dialogue and observation, not narration\n- [ ] Hero's honor is demonstrated, not declared\n- [ ] Comic register present even in serious scenes — Austen-style irony\n- [ ] No banned names (Chen, Lucian, Marcus, Emma)\n- [ ] Em-dashes for asides (Jessica's signature applies)\n\nOUTPUT: Save as [Book Title]_Outline.md in Project files.","outlineRefinements":[{"label":"Pacing rushed","text":"Slow burn is locking in by Ch [X]. Stretch the glances/touch/proximity stages. Add 2–3 chapters before the first near-miss."},{"label":"Heat drifted","text":"Ch [X-Y] reads more open-door than Marjorie should. Pull back — the heat is in restraint. Cut explicit physical detail; replace with the unsaid."},{"label":"Voice modernized","text":"Contractions or modern phrasing in Ch [X]. Re-outline / line-edit to period vocabulary throughout."},{"label":"Wit dropping out","text":"Ch [X-Y] is plot-forward without irony. Re-outline so the narrative voice carries Austen-style observation in every scene."},{"label":"FMC reads passive","text":"She is reacting to society / family / the hero. Re-outline so within period constraints she makes choices that change her circumstances."},{"label":"Hero declares without earning","text":"By Ch [X] he says he loves her but hasn't shown it through action. Re-outline so honor / sacrifice / changed behavior precede the declaration."},{"label":"Misunderstanding too shallow","text":"The Act 3 rupture is melodramatic. Recalibrate so the misunderstanding has period-grounded substance — entail, betrothal, scandal, its","bullets":["Wit Sharper Than Her Embroidery","Reads More Than Society Approves","Observes Everything, Says Half of What She Notices","Refuses to Accept the First Offer","Defends the Wallflowers","Has an Unsuitable Friend (the truth-teller)","Em-Dash Internal Asides (Jessica's signature applies in narration)"]},{"name":"Hero Voice-Markers (Marjorie-Specific)","bullets":["Formal Phrasing When Flustered (the formality is the tell)","Declarations Rather Than Questions When It Matters","His Silence Carries More Than Most Speeches","Honor Demonstrated, Never Declared","Pet Names Used Sparingly and With Earned Weight (a name reduction — \"my dear\" — is a moment)"]},{"name":"Avoid for Marjorie","bullets":["Modern emotional vocabulary (\"I'm processing this\")","Contemporary feminism dialogue (acknowledge limited choices, don't preach)","Heat above kiss-level","Heroes who are cruel rather than reserved","Heroines who are passive prizes","Sustained gothic dread (wrong subgenre)"]}]},{"name":"TIER 4 — OBSTACLE / SECRET","intro":"Pick ONE. Drives Act 3 breaking point.","cards":[{"name":"Historically Plausible Obstacles","bullets":["Entail (property must pass to a male heir)","Marriage Settlements Not Yet Agreed","Family Opposition (rank, fortune, history)","Prior Betrothal Contract","Guardianship Issue","Fortune Hunter (his rival or her false suitor)","Mourning Period Preventing Marriage","Scandal Threatening Reputation"]},{"name":"Identity & Status","bullets":["Hidden Inheritance / Disguised Rank","Estranged Family Member Returns","Misjudged Reputation (rake who is not, virtuous lady who is misread)","Secret Past (illegitimate birth, ruinous mother, unsuitable connection)","The Letter That Reveals Everything"]},{"name":"Emotional Stakes","bullets":["\"I Am Not Suitable\" Belief (resolves)","\"I Cannot Trust Him\" Belief (resolves through evidence)","Family Obligation vs. Personal Happiness","Duty to Sister / Younger Daughters / Aging Parent","Pride That Refuses to Acknowledge Love (until it cannot any longer)"]}]}],"extras":{"THE TROPE PICKER SYSTEM":"\nPick ONE option from each tier. Regency runs on tightly observed historical convention. Trope discipline keeps the period intact.\n\n**Max trope count per book: 5 total.**\n\n---\n\n","FMC TROPE CLUSTERS":"\nMarjorie FMCs are intelligent, observant, and constrained by period — but they CHOOSE within those constraints with full agency.\n\n### Core Archetypes\n- The Bluestocking\n- The Reluctant Debutante\n- The Spinster Past Her First Bloom\n- The Country Cousin Brought to Town\n- The American Heiress\n- The Vicar's Daughter\n- The Eldest Sister Carrying the Family\n- The Widowed Lady (young, childless, returning to society)\n- The Wallflower With Sharp Eyes\n- The Country Squire's Daughter\n\n### Wit-Forward Traits\n- Reads Books She Should Not (in society's view)\n- Refuses the First Offer\n- Has Opinions and Voices Them (in private at minimum)\n- Notices What Others Miss\n- Defends Friends Society Has Discarded\n- Cannot Suffer a Fool Politely (and yet must try)\n\n### Lifestyle / Position\n- Limited Fortune (genteel poverty)\n- Comfortable Fortune Without Title\n- Significant Fortune Attracting Fortune Hunters\n- Country-Raised, London-Adjusted\n- London-Raised, Country-Curious\n- Reduced Circumstances After Family Loss\n\n### Emotional Arcs\n- \"I Cannot Marry For Less Than Love\" (resolves)\n- \"I Have Been Misjudged\" (resolves through honor demonstrated)\n- \"I Will Not Be A Burden\" (resolves)\n- \"He Cannot Be What He Seems\" (resolves through evidence)\n- Choosing love over advantageous match\n\n---\n\n","MMC TROPE CLUSTERS":"\nMarjorie MMCs are honorable underneath, even when their reputation suggests otherwise. Reformed by recognition, not by rescue.\n\n### Core Archetypes\n- The Duke (with a reputation he didn't entirely earn)\n- The Earl (responsible for siblings / estate / aging mother)\n- The Viscount (younger son who unexpectedly inherited)\n- The Reformed Rake\n- The Scholar Aristocrat\n- The Soldier Returned\n- The Reserved Younger Brother\n- The Clergyman's Honorable Friend\n- The American Gentleman in London\n\n### Honor-Through-Action Traits\n- Pays His Debts (financial AND social)\n- Defends Her Reputation Even When She Has Refused Him\n- Acknowledges When He Has Been Wrong\n- Treats Servants and Tradesmen With Respect\n- His Word Is His Bond\n- Generous Without Ostentation\n- Carries Family Obligation Without Complaint\n\n### Hard Edges (Period-Appropriate)\n- Pride That Costs Him at the Worst Moment\n- Reputation He Has Not Fully Earned (or has, and is reforming)\n- Family Pressure He Will Not Yield To\n- Old Wound from a Prior Engagement / Betrayal\n\n### Emotional Arcs\n- From Reputation to Honor Demonstrated\n- From Pride to Vulnerability\n- From Family Obligation to Personal Choice\n- From \"I Cannot Marry For Less Than Fortune\" to \"I Cannot Marry For Less Than Her\"\n- From Reserved to Spoken Aloud\n\n---\n\n","TROPE COMBINATIONS THAT WORK":"\n| Primary Trope (Tier 1) | Pairs Especially Well With |\n|---|---|\n| Marriage of Convenience | Family Obligation, Entail |\n| Rake Reformation | Mistaken Identity, Wallflower |\n| Wallflower Transformation | Country House Party, Misjudged Reputation |\n| Second Chance | Returned from War, Family Reconciliation |\n| Scandal Forces Marriage | Compromised at the Country House, Misread Gossip |\n| Mistaken Engagement | Letters Miscarried, Family Interference |\n\n---\n\n","HARD NO TROPES (NEVER USE)":"\n| Trope | Why Not |\n|---|---|\n| Modern emotional vocabulary | Period rupture |\n| Contemporary feminism dialogue (preachy) | Tone rupture |\n| Heat above kiss-level | Wrong heat tier — Marjorie is 1-2/5 closed door |\n| Hero who is cruel rather than reserved | Genre killer |\n| Heroines who are passive prizes | She must choose within period constraints |\n| Anachronistic phrasing or vocabulary | Genre killer |\n| Sustained gothic dread | Wrong subgenre |\n| Love triangle wit
