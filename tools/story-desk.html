toward climax, or plateau/drop early?\n13. Tension throughline — Is there internal, external, or romantic tension in every chapter?\n\n## Genre & Reader Expectation\n14. Genre beats — Does the outline hit expected beats for this genre? (Meet-cute, midpoint shift, black moment, resolution)\n15. Heat calibration — Is the heat consistent with the pen name's brand throughout? Any sudden spikes or drops?\n16. Trope delivery — Are the selected tropes actually being delivered in-scene, or just named?\n17. Black moment effectiveness — Is the \"all is lost\" beat earned and devastating enough?\n\n## AI Tells (Mandatory Scan)\n18. **Timestamps and date references** — Scan the entire outline for clock times, specific dates, calendar markers, and \"[X] days/weeks/months later\" transitions. Flag EVERY instance. Jessica does not write this way; it is a major AI tell. Replace with scene-level / sensory / contextual markers. (See `banned-list.md` — NO TIMESTAMPS section.)\n19. **Banned-list words** — Spot-check the outline for any banned words, phrases, or AI-isms. Flag for revision before chapter prompts get generated.\n\n## Ending\n20. Dangling threads — Any subplots, secondary characters, or reader promises that don't pay off?\n21. Resolution — Does the ending feel earned? Any loose ends that will frustrate readers?\n22. Hook for next book — If this is a series, is there forward momentum without a cheap cliff-hanger?\n\nDeliver as a prioritized list:\n- CRITICAL (breaks the book) — fix before moving to chapter prompts\n- RECOMMENDED (weakens the book) — fix if time allows\n- OPTIONAL (polish) — note for later\n```\n\n---\n\n## HOW TO HANDLE THE RESULTS\n\nWhen Claude returns the flagged issues:\n\n1. **Jessica reviews each flagged issue** — she decides which are real problems vs. intentional choices Claude misread.\n2. **For real problems, Jessica picks how to resolve each one.** Options:\n   - Tell Claude exactly how to fix it\n   - Ask Claude to propose 2-3 fix options and pick one\n   - Restructure the whole act if the problem is structural\n3. **Make Claude fix its own issues.** Once Jessica has decided on fixes, tell Claude:\n   > \"Implement the following fixes in the outline: [list]. Re-output the full corrected outline as a new .md file.\"\n\n4. **Do not move to chapter prompts until:**\n   - All CRITICAL issues are resolved\n   - RECOMMENDED issues are resolved or consciously deferred\n   - The corrected outline is saved to the Project files\n\n---\n\n## COMMON PLOT HOLE PATTERNS IN CPH FICTION\n\nWatch for these specifically — they show up often enough to warrant a dedicated check:\n\n### Romance-Specific\n- **\"Why don't they just talk?\"** — Third-act misunderstanding that would be resolved in one conversation = weak. Must be rooted in fear, wound, or legitimate obstacle.\n- **Premature intimacy that doesn't change the arc** — If the midpoint consummation doesn't shift the power dynamic or raise emotional stakes, it's mechanical.\n- **Side character who disappears** — Best friend introduced in Ch. 2 and never heard from again = cut or use.\n\n### Dark Romance (Moxie / Vesper)\n- **MMC danger that isn't actually dangerous** — If the \"threat\" never materializes, the stakes are fake.\n- **FMC passivity once claimed** — She must retain agency throughout. If she stops making choices after the midpoint, fix.\n- **Darkness without emotional cost** — Violence, captivity, or power exchange that doesn't change anyone internally = aesthetic, not story.\n\n### Romantasy (Ruthie)\n- **Magic system violations** — If the rules bend mid-book to serve plot, readers will notice.\n- **Bond mechanics inconsistency** — Fated mates / blood bonds / shifter biology must work the same way every time.\n- **Power awakening without setup** — FMC's magic can't suddenly appear in Act III if it wasn't seeded in Act I.\n\n### Thriller / Horror (Garrett / Lenore)\n- **Procedural drift** — Psych thriller ≠ detective story. If the outline starts involving police investigations, flag immediately.\n- **Too-convenient escapes** — Protagonist gets out of danger via luck instead of choice = weak.\n- **Monster revealed too soon** — Dread requires ambiguity. If the threat is fully named before Act III, tension collapses.\n\n### Regency (Marjorie)\n- **Modern speech patterns** — Characters speaking like 2025 friends break the historical dream.\n- **Social rule violations** — Unchaperoned intimate scenes, casual propriety breaks that don't have consequences.\n\n### Clean Historical (Rosemary)\n- **Anachronistic attitudes** — Modern feminist speeches in 1870s mouths break the era.\n- **Wallpaper historical** — Setting as decoration instead of lived constraint.\n\n---\n\n## WHEN TO SKIP THIS PHASE\n\nNever. Always run the plot hole check, even on simple books. The whole point of this workflow is to catch issues at the outline stage, not at chapter 14.\n\nIf Jessica wants to skip to save time, remind her: *\"The planning time is the draft time you save later.\"*\n","chapterPromptGenerator":"# Chapter Prompt Generator\n\n**Used in: Phase 5, Step 2 (Per-Chapter Prompts)**\n\nAfter the plot hole check and outline corrections, generate ONE artifact per chapter. Each artifact becomes the prompt Jessica pastes into a fresh drafting chat.\n\n---\n\n## THE CHAPTER PROMPT GENERATOR\n\nRun this against the corrected outline:\n\n```\nUsing the complete corrected outline in the Project files, create [N] individual artifacts — one for each chapter.\n\nEach chapter prompt artifact must contain:\n\n## Chapter [#] — [Working Title if any]\n\n**POV:** [Character name + perspective (1st/3rd)]\n**Heat Level:** [Pen name's brand default, or scene-specific override]\n**Word Count Target:** [Per-chapter target based on book total / chapter count]\n\n### Scene Goal\n[One sentence — what this chapter accomplishes in the story arc]\n\n### Beat-by-Beat Outline\n[5 bullets MAX, pulled directly from the outline — Goal / Conflict / Outcome]\n\n### Required Beats\n- [Genre-specific required beat — comedic beat, romantic beat, dread beat, power dynamic beat, etc.]\n- [Emotional beat — what the POV character feels by end]\n- [Plot beat — what changes by end of chapter]\n\n### Chapter Ending\nEnd on: [hook, forward momentum, immediate problem, unfinished business — NOT resolution, NOT cliff-hanger, NOT philosophical wrap-up]\n\n### Chapter 1 ONLY — Opening Hook (the Leah Gate)\n**Include this block in the Chapter 1 prompt only:**\n> **Open on a HOOK.** The first lines are action, a problem already in motion, or a charged collision. NO telling (narrator explaining who she is or how the world works), NO reminiscing or backstory, NO calm \"ordinary day\" described as nice/normal before anything happens, NO weather, scenery, or lore to open. Show character through what she DOES under pressure. The bar: would a hostile critic read past the first two paragraphs? Write to clear it. (See the lane-true hook in the genre outline prompt and the Leah Gate in the planner's Universal Rules.)\n\n### Continuity Notes\n- **Previous chapter left us at:** [one sentence]\n- **Next chapter picks up:** [one sentence]\n- **Character knowledge check:** [what the POV knows and doesn't know as of this chapter]\n\n### Voice Reminders\n- [Pen name] voice calibration: [2-3 specific markers from pen name skill]\n- Heat level: [X/5]\n- Banned names and phrases apply (see banned-list.md)\n- **NO timestamps, clock times, or specific dates anywhere in the prose** (see banned-list.md — \"NO TIMESTAMPS\" section). Ground time through scene, sensation, weather, and context only.\n\n### DO NOT\n- Foreshadow events that happen after this chapter\n- Write toward resolution\n- Include banned names, phrases, or AI-isms\n- Philosophize or wrap up meaningfully\n- **Use ANY specific times, clock readings, calendar dates, or \"[X] days/weeks/months later\" markers** — Jessica does not write this way; it is a major AI tell\n\nREQUIREMENTS FOR THE GENERATOR:\n- Keep each prompt SHORT — this is a guide for the drafting chat, not a re-outline\n- For the Chapter 1 prompt, ALWAYS include the \"Opening Hook (the Leah Gate)\" block above — every Chapter 1 must open on an action/showing hook\n- One prompt = one chapter = one drafting chat\n- Output each as a separate artifact (do not combine)\n- Title each artifact: \"[Book Title] — Chapter [#]\"\n```\n\n---\n\n## WHY EACH CHAPTER GETS ITS OWN ARTIFACT\n\n1. **One chat per chapter** keeps the drafting focused. Context doesn't bloat, voice stays sharp, heat stays calibrated.\n2. **Jessica renames the chat** with the book name + chapter number after drafting the first pass. Easy to find later.\n3. **If a chapter needs rework**, she can pull up the exact prompt used, apply the fix, and re-run without losing the outline intent.\n4. **The artifacts become the Project's chapter roadmap** — each one a clear, executable instruction that any voice-matched drafting skill can follow.\n\n---\n\n## WHAT THE CHAPTER PROMPT IS NOT\n\n- **It is not the full chapter outline.** The outline lives in `[Book Title]_Outline.md`. The chapter prompt is a POINTER to the outline, not a duplicate.\n- **It is not the drafting prompt itself.** When Jessica starts the drafting chat, she'll paste this chapter prompt AFTER the pen name's \"First Draft\" prompt template (which lives in the pen name skill).\n- **It is not a place for prose direction.** No \"write this beautifully.\" The pen name skill handles voice. The chapter prompt handles scaffolding.\n\n---\n\n## HAND-OFF CHECKLIST (END OF PHASE 5)\n\nBefore Jessica moves to drafting, confirm the Project file contains:\n\n- [ ] Locked Premise (`[Book]_Premise.md`)\n- [ ] Completed Codex (`[Book]_Codex.md`)\n- [ ] Corrected Outline with plot holes fixed (`[Book]_Outline.md`)\n- [ ] N chapter prompt artifacts, one per chapter\n- [ ] The pen name skill is installed and active\n- [ ] The pen name's \"First Draft\" prompt is saved and ready to use\n\nThen tell Jessica:\n\n> \"Planning complete. Open a new chat, load the [pen name] skill, paste the First Draft prompt + Chapter 1 artifact, and start drafting. Rename the chat '[Book Title] Ch 1' when you're done. Quality-check after the chapter using the pen name's per-chapter QC prompt. Move to Chapter 2 in a fresh chat.\"\n\n---\n\n## EDGE CASE: REVISION CHAPTER PROMPTS\n\nIf Jessica returns to this skill mid-book because the plot shifted during drafting, she may need new chapter prompts for remaining chapters. In that case:\n\n1. Load the updated Codex and updated Outline\n2. Identify which chapters are affected by the change\n3. Regenerate prompts ONLY for affected chapters\n4. Flag clearly: \"These replace the original Chapter [#] prompts. Use these going forward.\"\n\nDon't regenerate prompts she's already used unless she specifically asks. Past chapters stay past.\n","engagementPlanner":"# CPH Planner — The Engagement Loop (designing it into the book)\n\n**Use during Phases 1, 4, and 5.** This is the *design* layer for reader addiction. Drafting renders the loop sentence by sentence (that's the ghostwriter's job); planning is where you *build the loop into the architecture* — the stakes, the outline's question/reversal map, and the per-chapter prompts — so the draft has something to render. A book engineered for the loop at the outline stage is far easier to draft and far harder to put down.\n\n**The mechanism in one line:** a reader stays hooked as long as there is an open, *specific* prediction running in their head that hasn't been answered yet. Engagement is unresolved prediction. The job of planning is to guarantee a steady supply of them across the whole book.\n\nThe loop: **Stakes** (make the brain care) → **Big Question** (force a prediction) → **Head Fake** (break the prediction) → **Re-Hook** (open the next loop before this one closes) → repeat. The same loop behind binge-watching and a hand of cards, built into the outline on purpose.\n\n---\n\n## ⚠️ How this fits the rules CPH already enforces (read first)\n\nThis is a design tool, not license to plan the things CPH bans:\n\n- **The Big Question is the engine of the Leah Gate and the open-loop chapter ending.** Its failure mode — vague teasing (\"everything was about to change,\" \"she had no idea\") — is *already* banned ominous narration. Plan specific questions, never teases.\n- **Head Fake = surprising-yet-inevitable, planted in the outline so its setup is on the page before the turn.** That is the OPPOSITE of a gotcha twist or an ominous one-line chapter button (both banned). A planned reversal that only works because a character suddenly knows something they couldn't is a plot hole — it must survive the Phase 5 plot-hole check (cause→effect, motivation, knowledge-access).\n- **Re-Hook is *why* chapters end mid-scene on forward momentum.** Designing the chapter-seam re-hook into the outline is the same rule, planned ahead.\n- **Urgency is built through story pressure, never a narrated clock.** No counted-time beats (\"three days later\"), no narrator-stamped deadlines. (See banned-list: NO TIMESTAMPS.)\n\nIf a planned beat needs a gotcha, a vague tease, or a counted-time deadline, it's mis-designed. Rebuild it.\n\n---\n\n## Table of contents\n1. Stakes — design into Phase 1 + the codex\n2. Big Question — design into the premise + outline\n3. Head Fake — plot into the outline (with setup)\n4. Re-Hook — design the chapter seams\n5. Where each piece lives, phase by phase\n6. Don't over-design\n7. Planning checklist\n\n---\n\n## 1. STAKES — design into Phase 1 (Core Element #4) + the codex\n\nStakes are Core Element #4 already. The loop sharpens what \"good stakes\" means: three ingredients, all three required.\n\n1. **A character to root for.** The codex's wound/fear/desire work exists for this — a reader predicts only for a character they care about. Make sure each POV character's *want* and one vivid, telling detail are nailed in the codex, not just their backstory.\n2. **Something at risk — nameable.** State the concrete failure: the second chance lost, the home gone, the secret out, the family ruptured, the mate claimed by someone else. *The reader has to be able to picture losing* before they'll predict whether the character wins. Write the failure state into the premise and codex, not just the goal.\n3. **Urgency — the multiplier.** A reason it matters *now*. \"Before the wedding\" beats \"someday.\" A closing window, a thing that worsens with delay, a decision that can't be un-made. Doesn't need to be life-or-death — it needs to be *personally relevant to this pen name's reader*. Build the urgency into the premise's central conflict.\n\n**Series note:** each book needs its own nameable risk + urgency that resolves in that book, even as the series-long stakes carry forward. (See `series-architect` for the carry-forward map.)\n\n---\n\n## 2. BIG QUESTION — design into the premise + outline\n\nThe Big Question is the specific dramatic question the reader is predicting against. Plan it at two scales:\n\n- **Book-level:** the central dramatic question the whole book answers (will they get together / survive / choose right / get caught). The premise should make it specific and pressing — not \"will love win\" but the concrete, this-book version.\n- **Chapter-level:** each chapter should open or sustain at least one *specific* question the reader carries to the next chapter. This is what the outline's per-chapter \"Goal / Conflict / Outcome\" should generate — but make the *open question* explicit in the beat, not just the events.\n\n**The biggest planning mistake is vagueness.** An outline beat like \"something goes wrong at the gala\" gives the draft nothing specific to make the reader predict. \"She spots her ex across the gala — holding the contract she needs signed by midnight\" plants a question the reader runs. Plan the *specific shape* of the question into the beat.\n\n**Plant early, let it stretch.** The earlier a question goes live in the outline, the longer the tension runs. Seed the book's central question in the first chapters; don't hold all the cards to the midpoint.\n\n---\n\n## 3. HEAD FAKE — plot into the outline (with its setup)\n\nA Head Fake is a reversal that contrasts what the reader predicted but reads as instantly logical *because the setup was already on the page.* Plan both halves:\n\n1. **Map what the reader will predict** at that point in the outline, based on what earlier chapters established.\n2. **Plot the contrasting reveal — AND the earlier beats that set it up.** The magician shows the rabbit and the hat before the trick. If you plot a reversal, plot the fair clues that make it land as \"I should have seen that,\" not \"where did that come from?\"\n\n**Outline discipline:**\n- Mark planned reversals in the outline and note *which earlier chapter plants the setup.* A reversal with no upstream setup beat is a gotcha — flag it in the Phase 5 plot-hole check and either plant the setup or cut the reversal.\n- Head Fakes live **inside** chapters (a midpoint flip, a recontextualization, a betrayal that re-reads earlier loyalty), not slammed onto chapter-ending lines as shock buttons.\n- Every planned reversal must survive the plot-hole check: cause→effect, motivation, knowledge-access. Surprising is cheap; surprising-yet-inevitable is the standard.\n\n---\n\n## 4. RE-HOOK — design the chapter seams\n\nThe chapter break is where a reader's loop wants to close and they reach for a clean stopping point. **Design the seam so the loop never closes there.** Each chapter's outlined ending should *open the next loop in the same beat* — a fresh complication arriving on the heels of the chapter's resolution, the won thing creating the next problem, a door closing as another opens.\n\n**Outline discipline:**\n- For every chapter, the outlined \"Outcome\" should double as the *next* chapter's open question. If a chapter resolves clean with nothing pulling forward, that seam is a **danger zone** — add a re-hook beat.\n- This produces exactly the CPH ending the pen-name skills require: mid-scene, forward momentum, an open loop — *not* a manufactured cliffhanger button. Plan the open loop, not the gasp.\n\n---\n\n## 5. Where each piece lives, phase by phase\n\n- **Phase 1 (Planning):** Core Element #4 (Stakes) gets all three ingredients — root-for character, nameable risk, urgency. The Story Promise already encodes the book-level Big Question; make it specific.\n- **Phase 3 (Codex):** per-character wound/fear/desire = the root-for engine; write each character's nameable failure state into the codex.\n- **Phase 4 (Outline):** add a light **engagement pass** after the beats are drafted — confirm a specific question is live in every chapter, mark each planned reversal with its setup chapter, and make each chapter's Outcome open the next loop. Don't add a whole new map; annotate the outline you already built.\n- **Phase 5 (Chapter prompts + plot-hole check):** each chapter prompt names the *open question this chapter sustains* and any *planned reversal + where its setup lives.* The plot-hole check verifies every reversal has upstream setup and survives knowledge-access (a Head Fake that cheats is a hole).\n\n---\n\n## 6. Don't over-design\n\nThe loop is structural scaffolding, not a quota. Over-engineering reversals produces a twisty, exhausting outline and tempts the draft toward the banned gotcha endings.\n\n- Honor the genre's own beat structure (the outline prompts carry it). The loop rides *on top of* the romance/thriller arc; it doesn't replace it.\n- A quiet or connective chapter doesn't need a reversal — it needs a live question still humming underneath.\n- One well-set-up Head Fake beats three shallow ones. If a reversal isn't earned by an upstream setup beat, cut it.\n- Everything here stays subordinate to the codex, the genre promise, the banned list, and the Story Promise.\n\n---\n\n## 7. Planning checklist\n\n- [ ] **Stakes complete** — every POV character has a root-for want, a *nameable* failure state, and an urgency reason (why now), all in the premise/codex; urgency is story pressure, never a narrated clock.\n- [ ] **Book-level Big Question is specific** — the Story Promise names the concrete this-book question, not a genre platitude; it's planted in the early chapters.\n- [ ] **Every chapter sustains a specific question** — the outline beats name the open question, not just the events; no vague \"something happens\" beats.\n- [ ] **Reversals are plotted with setup** — each planned Head Fake is marked with the earlier chapter that plants its clue; none rely on impossible knowledge; all survive the plot-hole check.\n- [ ] **Seams re-hook** — each chapter's Outcome opens the next loop; no chapter resolves clean into a clean stopping point; the ending is an open loop, never a cliffhanger button.\n","craftLogic":"# CPH Ghostwriter — Craft & Logic Pass\n\n**Read before drafting. Run before delivering every chapter — single or batch.** This file fixes the skill's one structural disease and adds the logic gate that prose review can't replace.\n\nThese notes came from marking up a real draft (*Standing Guard* Ch.1, CRC). The patterns below are *repeatable habits*, confirmed across two independent reviews — not one-off taste calls.\n\n---\n\n## THE CORE DISEASE (fix this and half the rest follows)\n\n**The draft shows something true, then immediately explains the thing it just showed. It writes twice — once in action, once in commentary — and the commentary is what reads synthetic.** The fix is almost entirely SUBTRACTIVE. Most of these are cuts, not rewrites. When in doubt: show, then shut up.\n\n**What \"good\" looks like (the target the skill is already capable of):** one line of dialogue carrying years of subtext — *\"I've always known where you live.\"* That single line did the work of three narrated paragraphs. **That ratio is the goal.** Interiority comes through what a character *says and does*, not what the narrator *analyzes*.\n\n---\n\n## THE 12 CRAFT RULES\n\n**1. Show, then shut up — then answer it.**\nIf a gesture lands the emotion, DELETE the sentence that explains it. Cut anything opening with \"What he saw was…\", \"He could see…\", \"It was the look of someone who…\". The gesture IS the meaning.\n*The upgrade:* in a charged two-person moment, don't just cut the diagnosis — replace it with a reciprocal **action** showing the POV character's own matching want. Don't narrate her feeling; show his through what he does (drops his hand, looks away). One-sided observation → mutual charged moment. That's the slow-burn engine.\n\n**2. No classifying feelings in the abstract.**\nCut openers that name the *category* of an emotional event (\"the quieter kind,\" \"the kind where everything lined up…\"). No tautologies (\"the reorganization it made\"). Replace with ONE concrete image or fact. A feeling described in the abstract is a feeling the reader doesn't get to have.\n\n**3. Crutch-word check before output.**\nNo texture word — \"particular,\" \"specific,\" \"certain\" — more than ONCE per scene. Repetition is what makes prose feel machine-generated, the exact thing CPH readers sniff out. (This is in addition to the banned-list scan.)\n\n**4. Strip perception verbs in close third.**\nCut \"he observed/noted/recognized/had learned/noticed that…\". In close third the narrator already knows what the POV character knows — stating the perception verb doubles it. Just state the thing. Let the observation BE the prose.\n\n**5. No biography blocks in live-stakes scenes.**\nNever halt a hot scene for a backstory paragraph. A bleeding woman on the porch means the chapter does NOT cut to a summer barbecue. Meter backstory through single load-bearing lines tied to present action or dialogue: *\"You were fourteen the first summer I figured out you'd be a problem for me,\" he said, not looking up from the wrist.* One line, in motion.\n\n**6. Stage emotional shifts; don't narrate their shape.**\nShow the shift in ONE external tell (a face that closes, a voice that loses its tremor, hands that stop shaking) and stop. Don't lecture on what the shift *is* or what *type of people* do it.\n\n**7. Contact scenes: competence frames, intimacy carries.**\nWhen the POV character touches the love interest (injury checks, steadying, any contact), don't let it slide into EMT-report language. Cap the diagnostic detail — no full injury inventory. For every clinical observation, ground at least one beat in what the contact does to the POV character physically: the heat of her skin, her pulse under his fingers, the discipline it takes to stop touching her. The medical read proves he's good at the job; the held breath proves he's in love. Both on the page.\n\n**8. Pay for every entrance with a specific.**\nSecondary characters and external plot forces get ONE concrete grounding detail so they feel inevitable, not summoned-because-the-plot-needed-them. Feds arriving = one line making it a consequence of who the character is. A backup ally texting = one specific detail so it lands as *this particular person* moving, not a generic unit. Never introduce a plot element purely because the plot requires it — pay for it with a specific.\n\n**9. Keep time consistent — and mostly off the page.**\nMost chapters need few explicit time figures, or none. Ground time through light, weather, season, and action — not a counter (see banned-list: *Narrated time & duration*). When a figure genuinely must appear — a character's age, a span the plot turns on — fix ONE value and never vary it for rhythm. \"Fifteen years\" and \"seventeen years\" cannot both describe the same span. Pick one, use it every time, and check it against the codex on THIS pass. **Do NOT rely on a later review to catch drift — reviews normalize errors as often as they flag them.** The goal is a consistent clock the reader never sees you winding, not a page full of precise spans.\n\n**10. Trust dialogue to carry interiority.**\nSee the target above. If narrated introspection can be replaced by one sharp line of dialogue, replace it. That ratio is the goal.\n\n**11. Run the \"Does It Fit?\" pass before delivering any scene.** (Full procedure below.) Non-optional.\n\n**12. Open every chapter INSIDE a moment — Chapter 1 hardest of all.**\nThe chapter's first job is to make the reader take the next line. Open with the POV character already *doing* or already *in* something: action underway, a line of dialogue mid-air, a problem landing, a decision being made, a sensory jolt, or a voice-forward line that plants a question. **NEVER open with** waking up / getting ready, a \"what a good day\" mood-set, weather or setting as scene-dressing, backstory or reminiscing, introspection, foreshadowing (\"little did she know…\"), or dropping into the pen name's *world* to explain how it works. Reveal context *through* the scene — earn the right to backstory by making the reader care first. Don't repeat the previous chapter's opening shape.\n- **Chapter 1 carries the heaviest load** — a browsing reader judges the whole book on the free sample. The first line has to earn the second.\n- **The Leah Test (apply to every chapter, ruthlessly to Ch.1):** would a hostile, impatient literary critic read past paragraph 2? If the first two paragraphs don't deliver a reason to keep going — tension, a question, a voice, a hook — the opening failed. Cut the throat-clearing and restart in the action. (The flavor of the hook is pen-name-specific: Sage opens funny, Garrett opens wrong/dreadful, Ruthie/Lilith open dangerous, CRC opens warm-but-in-motion — but *all* open in motion.)\n\n---\n\n## THE \"DOES IT FIT?\" PASS — logic, genre & character gate\n\n**Invokable by name:** \"run the Does-It-Fit check,\" \"does this fit,\" \"logic check.\"\n\n**Why it exists:** In the source draft, a woman saw the threat, chose not to stop, drove PAST it — and arrived with a head wound and a sprained wrist. No cause for the injuries. **Every prose review missed it** — two AI beta reads AND the first two passes of the markup notes — because the sentences were clean. Logic holes hide behind good prose. They must be hunted on purpose.\n\n**Why it's the highest-stakes check at CPH:** A reader who hits \"wait, that makes no sense\" stops trusting the book — and reader trust is the product. A broken cause does more damage than any clumsy sentence: clumsy reads as style; broken causality reads as the author not paying attention.\n\n**This pass checks the draft AGAINST THE CODEX AND OUTLINE — not against the prose's own internal vibe.** That is the whole point. A scene can be internally smooth and still contradict the codex (a character acting against established traits) or the outline (an event that can't have caused the state the next chapter assumes). Pull the codex and outline open and check against them literally.\n\n### The questions — run on every scene\n\n**1. Cause → effect.** For every injury, loss, gain, or change of state in the scene, name the on-page event that caused it. If you can't name it, the chain is broken — fix the chain, don't paper over it. *(The catch: injuries with no source.)*\n\n**2. Motivation — does this fit who the character is?** When a character does the pivotal or dangerous thing, the reason must come from their **established self in the codex**, not from the plot needing a body in that room. Check the codex's wound/fear/desire/voice for this character and ask: *would THIS person, with THESE traits, actually do this here?* (\"Everything looked normal so she went inside\" makes her oblivious; \"she'd never leave her horse unchecked overnight\" makes the same action reveal her.)\n\n**3. Convenience.** Flag every prop or circumstance that exists only because the next beat needs it (the car left idling all night so she could \"floor it\"). Either justify it in-world or cut it.\n\n**4. Capability.** Can this character plausibly do what they just did? Any escape, win, or feat must be PAID FOR — terrain knowledge, surprise, interruption, real cost. Competence is credible; magic is not. The reverse also fails: don't make a sharp character suddenly stupid to enable a beat. *(Check against codex skills/background.)*\n\n**5. Genre fit.** Does this scene deliver what a reader of THIS pen name's genre came for, and obey its conventions? A romantic-suspense reader needs the threat to stay credible AND the romance to advance; a cozy can't go grimdark; a closed-door line can't drift open. Check the beat against the pen-name skill's genre and the outline's promise for this chapter.\n\n**6. Knowledge access — could this character actually KNOW this, here, now?** Walk every knowledge claim in the scene — anything a character states as fact, thinks as settled, or reacts to. For each, name where the knowledge came from. It must trace to one of: **(a)** something the character witnessed on-page, **(b)** dialogue they actually heard, **(c)** a document/object/message they demonstrably have (a contract, a text, a brochure), or **(d)** a legitimate inference from data they can observe. If it traces to none of those, the character knows something they have no in-world access to — that's **impossible-knowledge drift**, and it breaks the reader's trust exactly like a broken cause does. *(The catch: a character \"reporting\" things they never witnessed.)*\n\n  - **Inference is safe; reporting is not.** A POV character reading *another* person is allowed — that's the slow-burn engine. \"He'd have bet the farm on it,\" \"like she didn't dare say it,\" \"the flinch he'd have missed if he hadn't spent three days learning her face\" are all interpretation of data the character can directly see, framed as a read. What is NOT allowed is a character stating as fact something that happened off their page — a secondhand quote from a scene they weren't in, a private detail they never observed, town news that hasn't reached them yet.\n  - **Certainty must be earned by on-page evidence.** A POV character's confidence about another's interior can only escalate as the evidence arrives. \"She was almost sure he wanted her\" is honest early; it may upgrade to \"she was sure now\" **only after** the intervening beats that justify it (he made room for her, held her all night, said the thing). Unearned certainty about someone else's mind reads as telepathy. Check that the hedge precedes the proof, never the reverse.\n  - **The mouthpiece risk — flag connector characters by name.** The highest-risk character for this error is the one who *arrives into* scenes carrying information — the town gossip, the connector, the fixer (in *Standing Guard*, Pearl). They are the tempting place to dump plot and town color, which is exactly how they end up \"knowing\" things they never witnessed. Identify these characters in the codex/tracker and scrutinize their scenes hardest — especially any scene built around them *explaining* something. POV characters' reads are inherently safer because they're framed as inference; a connector reporting facts is the trap.\n\n**7. Ripple — does it still fit the outline and codex everywhere else?** After any logic fix, re-walk the rest of the scene, the chapter, and the **outline's later chapters** for anything that now contradicts it — phone calls, dialogue, geography, who knows what and when (see Q6), events the outline schedules later that this fix just broke. A fix in one place isn't done until it's reconciled everywhere it touches. **Cross-check the codex canon and the outline directly — do not trust memory.**\n\n### The master principle: solve holes through CHARACTER, not patches\n\nThe best fixes come straight out of established character traits (the woman who \"notices things\" takes the one car she knows has no tracker — the logic fix and the characterization beat are the same move). Before reaching for a mechanical patch, ask: **\"What would THIS person, with THESE traits from the codex, actually do here?\"** A hole solved through character strengthens the book; a hole solved with a convenient prop weakens it.\n\n### How the pass reports — NEVER silently smooth\n\nFor each flagged item: (1) name the problem, (2) name which question it fails, (3) propose a character-rooted fix checked against the codex.\n\n**Surfacing the contradiction is the entire job. NEVER silently resolve, normalize, or smooth a contradiction to make the draft read clean.** That silent-smoothing is exactly how a second review normalized the timeline error and how the injury hole survived four reads. **A normalized contradiction is more dangerous than a flagged one** — flag it loud, in the Batch Report, even if you also propose the fix. If a logic hole traces back to the chapter PROMPT or the OUTLINE itself (the plan is broken, not just the prose), say so and pause for Jessica — don't invent your way out of a broken plan.\n","showDontTell":"# CPH Ghostwriter — Show Don't Tell (Romance)\n\n**Apply on every draft.** This is the rendering layer. It reinforces the skill's #1 fix (show-then-explain): don't name the feeling, render it. Calibrate to the pen name's heat level.\n\n> **Heat rendering lives elsewhere now.** This file teaches the *principle*; the heat-leveled examples live in the loaded pen name's own `heat-guidelines.md` — and, for the four high-heat names, the gated `references/heat-calibration.md`. Pull those whenever a scene carries heat. Don't render heat from this file alone.\n\n---\n\n## The five ways romance tells (scan for these)\n\n1. **Emotion labels** — \"She was nervous.\" \"He felt jealous.\" Naming the emotion instead of rendering it.\n2. **State-of-being verbs carrying the weight** — was/were/felt/seemed/appeared/looked doing the emotional lifting. \"He was angry.\" \"The room felt charged.\"\n3. **Summary narration** — compressing a scene that should be lived. \"They argued for an hour.\" \"He thought about her all day.\"\n4. **Internal labeling** — the POV character diagnosing their own feelings the way no human thinks. \"He knew he was in love with her.\" \"She realized she'd been waiting her whole life.\" *(This is the same disease as the show-then-explain Autopsy — see craft-and-logic-pass.md Rule 1.)*\n5. **Reaction shortcuts** — one physical cue doing the work of three. \"Her heart raced\" and nothing else. \"She blushed\" and nothing else.\n\n## The rendering rules (drafting)\n\n1. **Name the body, not the feeling.** Not \"she was nervous\" → a swallow, a thumb worried at a hangnail, a breath held half a second too long.\n2. **Specificity is an IMAGE, not a number.** The way to feel concrete is a precise *thing* the POV character notices — the chipped mug, the radio someone left on, the way he won't look up from the sink — NOT a count (\"three seconds,\" \"her second cup,\" \"four minutes,\" \"the third time\"). Reaching for a number to feel specific is the counting tell, and it's the single thing Jessica rewrites most. Pick the detail, not the tally. (See banned-list: *Counting / tally tic* and *Narrated time & duration*.)\n3. **Use the senses unevenly.** Pick the two that matter for this scene. Romance lives in touch + sight; dark romance in touch + smell; historical in sight + sound. Don't do all five — it flattens everything.\n4. **Let dialogue carry subtext.** What's unsaid is the showing. \"I should go\" carries more longing than \"she wanted to stay.\"\n5. **Anchor internal reaction to a specific trigger.** Not \"she felt drawn to him\" → \"her hand moved before her brain caught up.\"\n6. **Stay in real time for emotional beats.** If the scene is doing emotional work, don't compress it.\n\n## Don't over-correct\n\nTelling has a job. Use it for transitions, time compression between scenes, and low-stakes connective tissue. Not every line becomes a sensory paragraph — render the BEATS THAT MATTER (the emotional turns, the charged contact, the ruptures) and let the rest move. Over-shown prose is as exhausting as over-told prose.\n","aiTells":"# CPH Ghostwriter — Avoiding AI Tells (Structural Layer)\n\n**Read this before every draft, alongside `banned-list.md`. Apply it while drafting, not as cleanup.**\n\nThe `banned-list.md` kills AI tells at the **word and phrase** level (\"couldn't help but,\" \"the air between them,\" narrated time, the counting tic). This file kills them at the **sentence, paragraph, and whole-chapter** level — the patterns that make prose feel machine-made even when not a single banned word is present.\n\n**The core idea:** AI prose is almost never caught by one word. It's caught by a *cluster* — even sentence lengths, tidy rhetorical moves, emotion smoothed flat, structure that looks like it's satisfying a checklist instead of living inside a scene. A reader feels \"this is AI\" before they can name why. Our job is to remove the whole cluster so a CPH chapter reads like a person wrote it at a desk, not a model completing a prompt. **The boring true human version always beats the slick synthetic one.**\n\nThese are not banned *words* — they're banned *habits*. Each one below has a fiction-specific tell, a why, and a fix.\n\n---\n\n## THE SEVEN STRUCTURAL TELLS (drafting rules)\n\n### 1. Prestige-word inflation → write concrete, not elevated\nThe model reaches for impressive-but-empty abstractions instead of a specific image. In fiction this shows up as portable profundity that could fit any scene.\n- **Tell:** \"She witnessed the quiet architecture of loss.\" / \"It was a testament to everything they'd survived.\" / \"The room held a profound stillness.\"\n- **Why it's AI:** sounds literary, says nothing a reader can see, hear, or touch. Elevated before it's earned.\n- **Fix:** trade the abstract noun for one sensory fact the POV character would actually register. *Not* \"the quiet architecture of loss\" → \"His razor was still on the sink. She left it there.\" Specificity is an image, not a vocabulary upgrade. (Reinforces `show-dont-tell.md`.)\n\n### 2. Balanced contrast frames → only if both halves are real\nThe \"It's not X, it's Y\" / \"She didn't just A — she B'd\" structure manufactures the *appearance* of nuance without the substance. The model loves it because it's safe and sounds wise.\n- **Tell:** \"It wasn't fear. It was something deeper.\" / \"She didn't want him. She *needed* him.\" / \"This wasn't a kiss. It was a promise.\"\n- **Why it's AI:** the contrast is doing rhythmic work, not meaning work. Stack two or three in a chapter and it reads like a model.\n- **Fix:** keep the frame ONLY when both halves are specific and the reversal genuinely changes the meaning. Otherwise pick the truer half and write it once. When in doubt, cut the negation and just say the real thing.\n\n### 3. Rhetorical question → answer (the explainer voice)\nA question the narrator immediately answers for the reader. It simulates interiority while actually flattening it.\n- **Tell:** \"What was she supposed to say to that? Nothing. There was nothing to say.\" / \"Did she trust him? No. Not yet.\"\n- **Why it's AI:** it's presentation-mode, not a person thinking. Real interiority is messier and doesn't tee up its own answer.\n- **Fix:** render the thought as lived experience or action instead. Cut the question; let the answer stand as a beat, or show her *not* finding the words. Genuine internal questions (no neat answer) are fine and human — it's the Q-then-tidy-A package that's the tell.\n\n### 4. Tidy triads and symmetry → break the pattern\nThree balanced items, parallel clauses, neat rhythmic symmetry. Persuasive, safe, and a dead giveaway when it recurs.\n- **Tell:** \"He was everything she wanted, everything she feared, everything she couldn't have.\" / \"Clear, certain, and absolutely doomed.\"\n- **Why it's AI:** the model defaults to the triad because it's easy to complete and sounds polished. Humans use them too — but rarely three to a page, and rarely this even.\n- **Fix:** vary the count and the weight. Use two. Use four with one that doesn't fit. Let one item be longer and lopsided. Asymmetry reads human.\n\n### 5. Agentless / depersonalized constructions → name the doer\nAction with the actor removed, or feeling parked in an abstract subject. Makes hot, personal scenes feel oddly corporate.\n- **Tell:** \"A decision was made.\" / \"The tension in the room grew.\" / \"There was a sense that everything had changed.\"\n- **Why it's AI:** it polishes the personality out. In romance especially, the depersonalized line drains the heat and the POV.\n- **Fix:** put a body and a want in the sentence. \"She decided.\" \"He couldn't stop looking at her mouth.\" \"Everything had changed and she knew exactly who to blame.\" (Ties to single-POV and show-don't-tell — feeling lives in *her*, not in \"the room.\")\n\n### 6. Sentiment flattening → restore friction and ambivalence\nThe model smooths emotion toward safe, legible, faintly positive. Mixed, ugly, contradictory feeling gets sanded off.\n- **Tell:** a genuinely awful moment that resolves into calm acceptance or a tidy life-lesson. \"It hurt, but she knew she'd grow from it.\" Heroines who are sad-but-graceful instead of furious, petty, ashamed, or turned-on at the wrong time.\n- **Why it's AI:** RLHF rewards safe positivity. Real people feel two contradictory things at once and don't narrate the moral.\n- **Fix:** let her want the wrong thing. Let the feeling stay unresolved at the seam. Keep the ambivalence on the page — the jealousy *under* the congratulations, the want *under* the anger. Heat especially must carry real, specific, sometimes-unflattering human want (see `heat-guidelines.md` / `heat-calibration.md`). Mixed emotion is the most human thing prose can do.\n\n### 7. Professionalized sameness in fiction → break the legible arc\nThe single biggest fiction tell: competent, polished prose with low surprise and a theme that's legible *too early*. The story telegraphs its own meaning and resolves too cleanly.\n- **Tell:** symbolic objects that announce the theme (the wilting garden = her grief), revelations that land exactly on schedule, a final paragraph that states the lesson, atmosphere over-performed with the same kit every time (dust, stillness, light, \"inevitable,\" \"fragile,\" \"radiant\").\n- **Why it's AI:** models trend toward the average, most-expected, most-interpretable version. Studies find AI stories far less likely to pass creativity tests and far more similar to each other.\n- **Fix:** withhold the theme — trust the reader to feel it without being told. Let a character want something the scene doesn't endorse. Add one genuinely surprising-yet-earned beat per chapter (must still pass the Does-It-Fit gate — surprising, never a gotcha). End on an image or unresolved want, never a stated moral. If you can predict the chapter's \"point\" from its first page, it's too tidy — complicate it.\n\n---\n\n## TWO WHOLE-DRAFT TELLS (architecture rules)\n\n### 8. Even sentence architecture → vary length on purpose\nAI prose clusters sentences around the same middle length. Human prose lurches — a three-word jab, then a long unspooling line.\n- **Tell:** paragraph after paragraph where every sentence is roughly 12–20 words and similarly built.\n- **Fix:** in every paragraph of any weight, plant at least one very short sentence (one to four words) and let at least one run long and unbroken. Read it aloud; if the rhythm is a metronome, it's AI. (Extends the existing \"vary sentence openings\" craft rule from *how a sentence starts* to *how long it runs*.)\n\n### 9. Checklist / prompt-shadow prose → write the scene, not the brief\nThe draft visibly works through the chapter prompt beat by beat, in prompt order, sometimes echoing the prompt's own wording. It reads like requirements being satisfied.\n- **Tell:** beats arrive in the exact order the prompt listed them, each getting equal weight; the prose reuses language from the prompt (\"she begins to realize her feelings are changing\"); transitions exist to move *between prompt items* rather than between dramatic moments.\n- **Why it's AI:** the model is optimizing \"cover the prompt\" over \"live the scene.\"\n- **Fix:** the prompt is the *destination*, not the *itinerary*. Re-order beats by dramatic pressure, not by list order. Let one beat dominate and another happen in half a line. Never echo the prompt's vocabulary — rewrite every idea into the character's lived experience and the pen name's voice. A reader should never be able to reverse-engineer your outline from the chapter.\n\n---\n\n## EMPTY-TRANSITION GUARD (paragraph glue)\nTransitions that organize but don't mean: *Additionally, Furthermore, Moreover, In that moment, As if on cue, Little did she know, And just like that, In the end.* A few are fine; leaning on them is a tell, and several (\"little did she know,\" ominous foreshadowing) are already banned narration.\n- **Fix:** cut the connective and let the next beat land on its own, or replace it with a real causal/emotional pivot grounded in the scene. Hard scene-to-scene jumps usually read *more* human than a smoothing transition. (Reinforces the no-ominous-narration rule and the engagement-loop Re-Hook.)\n\n---\n\n## THE CLUSTER TEST (add to the self-check)\nNo single item here fails a draft on its own — a real triad, one earned contrast frame, one literary image is human prose. The failure is the **cluster**: when three or more structural tells stack up in the same chapter, it starts reading synthetic regardless of the word-level scan.\n\nRun this after the banned-list scan, before delivery:\n\n- [ ] **Concrete over prestige** — no portable-profundity abstractions standing in for a sensory image (#1).\n- [ ] **Contrast frames earn their place** — \"not X, it's Y\" used at most once, both halves specific (#2).\n- [ ] **No question-then-tidy-answer** explainer beats (#3).\n- [ ] **Triads/symmetry broken up** — not three balanced sets to a page; some asymmetry present (#4).\n- [ ] **Doers named** — no agentless \"a decision was made\" / feeling parked in \"the room\" (#5).\n- [ ] **Emotion has friction** — mixed/unresolved feeling on the page; no sanded-down life-lesson (#6).\n- [ ] **Theme withheld** — meaning isn't stated or telegraphed; ending is image/open want, not a moral; one earned surprise present (#7).\n- [ ] **Sentence lengths vary** — at least one very short and one long line per weighty paragraph; read-aloud isn't a metronome (#8).\n- [ ] **No prompt-shadow** — beats re-ordered by pressure, prompt wording not echoed, outline not reverse-engineerable (#9).\n- [ ] **Transitions earn their place** — no empty-glue chain (Additionally/just like that/little did she know).\n\n**Honest reporting:** as with the banned list, log defensible uses (one real triad, one earned frame) rather than pretending they're absent. The goal isn't zero — it's no *cluster*. A draft Jessica edits has a stray tell or two flagged; a draft she rewrites has the whole cluster running unflagged.\n","engagementGhost":"# CPH Ghostwriter — The Engagement Loop (Stakes → Big Question → Head Fake → Re-Hook)\n\n**Apply while SHAPING a chapter, not as line cleanup.** This is the *structural* attention layer. Show-don't-tell decides how a sentence renders; this decides why the reader can't put the chapter down. The two run together: render the beats that matter (show-don't-tell) *and* keep an unresolved prediction always live (this file).\n\n**The mechanism in one line:** a reader stays hooked as long as there is an open, *specific* prediction running in their head that hasn't been answered yet. Engagement is unresolved prediction. The loop manufactures a steady supply so the reader never hits a clean place to stop. It's the same loop behind binge-watching and a hand of cards — applied to the page.\n\nThe loop: **Stakes** (make the brain care) → **Big Question** (force a prediction) → **Head Fake** (break the prediction) → **Re-Hook** (open the next loop before this one fully closes) → repeat.\n\n---\n\n## ⚠️ How this fits the rules CPH already enforces (read first)\n\nThis framework can be misread as license to write the exact things CPH bans. It is not. The reconciliation is the whole point:\n\n- **Big Question is the engine of the \"open loop, not cliffhanger\" ending.** It's a *specific question the reader carries forward* — not a shock. The failure mode of a Big Question (vague teasing: \"everything was about to change,\" \"she had no idea what was coming,\" \"little did she know\") is **already banned ominous narration.** Specific, or nothing.\n- **Head Fake = surprising-yet-inevitable, fairly set up.** That is the OPPOSITE of the banned \"gotcha twist\" / \"dramatic one-liner ending.\" A gotcha is dropped from nowhere; a Head Fake recontextualizes what was already on the page. Use Head Fakes **mid-scene**, not slammed onto a chapter's last line as a button.\n- **Re-Hook is *why* CPH ends chapters mid-scene on forward momentum.** Close one loop and open the next in the same beat. This reinforces the existing ending rule — it does not replace it with cliffhangers.\n- **Urgency is rendered through scene pressure, never a narrated clock.** No \"you have 48 hours\" stamped by the narrator, no counted durations. A character may speak a deadline if organic. (See banned-list: *Narrated time & duration*; craft rule: Time.)\n\nIf a beat from this file would require a gotcha button, a vague teaser, or a narrated countdown — you've mis-applied it. Back up.\n\n---\n\n## Table of contents\n1. Stakes — make the brain care\n2. Big Question — force a prediction\n3. Head Fake — break the prediction (cleanly)\n4. Re-Hook — open the next loop in the same breath\n5. Danger zones (where attention drops)\n6. Don't over-correct\n7. Drafting checklist\n\n---\n\n## 1. STAKES — make the brain care first\n\nBefore a reader will predict *anything*, they have to care. Three ingredients, all three required:\n\n1. **A character to root for.** A real, specific person the reader can picture — built fast through a *want* plus one concrete, telling detail, not a résumé. The brain won't run predictions for a character it doesn't care about.\n2. **Something at risk.** A concrete, nameable consequence of failure the reader can picture losing: the second chance, the home, the secret staying buried, the family not rupturing, the person walking away for good. *The brain needs to know what failure looks like* so it can start predicting whether things will go right or wrong. Name the failure state (in scene — don't announce it).\n3. **Urgency — the multiplier.** A reason it matters *now*, not eventually. \"If she doesn't tell him before the wedding\" hits harder than \"someday she'll have to tell him.\" Urgency compresses the stakes and makes the brain predict faster. It does **not** have to be life-or-death — it has to be *personally relevant to this pen name's reader*. A closing window, a thing that gets worse the longer it waits, a decision that can't be un-made.\n\n**Pre-scene gate.** Before a scene runs, the reader should be able to answer three things:\n- *What is at risk?*\n- *Who is it happening to?*\n- *Why does it matter right now?*\n\nIf any answer is fuzzy or absent, establish it — or build a better stake — before continuing. Don't run a scene whose stakes the reader can't name.\n\n**Fiction caveats.** Render stakes through scene and body, never announce them (\"the stakes had never been higher\" is telling — cut it). Urgency comes from pressure, consequence, and dialogue, **not** from a narrated countdown.\n\n> *Illustration.* Weak: \"Mara needed the bakery to succeed.\" Stronger (root-for + risk + urgency, shown): Mara counts the register twice because the second count might come out different; the bank letter is face-down on the counter where she can't read the date again; if Friday's order falls through, the lease officer already has the next tenant lined up. We know who, what's at risk, and why now — none of it stamped with a clock.\n\n---\n\n## 2. BIG QUESTION — force an early, specific prediction\n\nThis is where a chapter goes from *decent* to *can't-stop-reading*. The Big Question is the specific dramatic question planted early that makes the reader form a prediction and keep reading to find out if they were right.\n\n**The biggest mistake is vagueness.** Empty teasers — \"something was about to happen,\" \"she had no idea what was coming,\" \"everything was about to change\" — give the reader nothing to predict *with*. No prediction means the later turn has nothing to contrast against, so it can't pay off. (And these phrasings are banned ominous narration anyway.)\n\n**The sweet spot:** enough to make a prediction, not enough to overwhelm. Give the reader the *specific shape* of the question.\n\n- *Empty:* \"The call changed everything.\" → nothing to predict.\n- *Loaded:* the POV picks up on the third ring and the voice on the other end is her ex-husband's lawyer, asking if she's sitting down. → now the reader is predicting: *what does he want? is it the house? the kids? money?* The prediction is running.\n\n**Tactics:**\n- **Seed the prediction before the reveal.** Whenever you're about to reveal something important, back up and give the reader enough context to guess *before* you give the answer. The guess is what creates the payoff — confirmed or subverted.\n- **Plant it early and let it stretch.** The earlier the question goes live, the longer the tension runs before the answer lands. Drip it in, then make the reader wait.\n- **One per chapter, minimum — Chapter 1 hardest.** Not every beat needs a Big Question, but every chapter (especially the first) should plant at least one specific question the reader carries forward.\n\n**Fiction caveats.** Plant the question *in scene* — through what a character wants and what's blocking it, or a concrete anomaly the POV notices — **not** through narrator teasing. \"Little did she know\" is the vague-teaser failure mode wearing a costume. Specific, in-scene, or nothing.\n\n---\n\n## 3. HEAD FAKE — break the prediction (cleanly)\n\nThe hardest to land. The Head Fake delivers a reveal that *contrasts* what the reader was predicting — but is immediately, logically acceptable as true.\n\n**A bad head fake comes out of nowhere** with no setup or connection to what came before. When it doesn't click, the reader gets no payoff — just confusion and frustration.\n\n**The magician test.** A magician shows you the rabbit, shows you the empty hat, turns your eye elsewhere — *then* pulls the rabbit from the hat. You know you missed something that was right there. That's a good Head Fake: the surprise was fairly set up, and the reveal makes you re-read what you already saw.\n\n**Framework:**\n1. **Figure out what the reader is naturally predicting** based on what's already on the page.\n2. **Deliver a reveal that contrasts that prediction** but that the reader accepts instantly as logical — because the setup was there.\n\n**The standard:** *surprising YET inevitable.* After the turn, the reader should feel \"I should have seen that,\" never \"where did that come from?\"\n\n**Fiction caveats (this is where CPH rules bite hardest):**\n- A Head Fake is **not** a gotcha twist and **not** a chapter-ending shock button. Those are banned. The difference is *fair setup*: a gotcha has none; a Head Fake recontextualizes earlier, on-page detail.\n- Use Head Fakes **mid-scene** to keep predictions churning. Don't slam one onto the last line as an ominous one-liner — that's the exact ending CPH bans.\n- The reveal must survive the **Does-It-Fit gate**: cause→effect, motivation, knowledge-access. A turn that's \"surprising\" only because a character suddenly knows something they couldn't is a logic hole, not a Head Fake.\n\n> *Illustration.* Setup: across two chapters, Cole keeps quietly covering for his brother — paying the bar tab, taking the blame for the dented truck — and the reader predicts loyal-older-brother. The fair turn: the POV finds the brother's name isn't on a single document; *Cole* signed for all of it, because the brother was never the screw-up — Cole was, and he's been laundering his own guilt through someone safer to forgive. Re-reads as inevitable. It lands mid-scene and opens a new question (what does she do with that?), not as a last-line gasp.\n\n---\n\n## 4. RE-HOOK — open the next loop in the same breath\n\nThis separates good storytellers from great ones. **Decrease the time between dopamine hits.** The moment a reveal lands and the reader is still processing it — *that* is when you open the next loop. Close one loop and open another in the same beat.\n\n**Jessica's spoken-content examples** (these are the *mechanism*, not prose to copy):\n- \"...which would have been great, except—\"\n- \"But here's the problem with that—\"\n- \"And that's when I realized—\"\n- \"Which is exactly why—\"\n\nEach closes a loop and opens a new one in the same breath.\n\n**⚠️ Do not write those phrases into prose.** They're content-creator / spoken-anecdote voice, and several are *telling* — \"and that's when I realized\" is a told-realization the show-don't-tell layer flags on sight. **Translate the mechanism, not the words:**\n\n- **The \"except\" turn** → a new complication arriving on the heels of a resolution, *rendered in scene*. The thing she just won creates the next problem. The door that closes opens another. She gets the contract signed — and recognizes the counter-signature as the man she walked out on. Render the recognition; don't narrate \"and that's when she realized.\"\n- **The transition Re-Hook** → the seam between scenes/chapters is where a loop wants to close. Don't let it. End the chapter **mid-scene on a fresh, specific open loop** — which is the existing CPH ending rule. The Re-Hook is the *reason* that rule exists.\n\n---\n\n## 5. DANGER ZONES — where attention drops\n\nMap the points where a loop *closes* and a section feels \"done\" — a problem solved, a question answered, a scene wrapped, a chapter break. **Those are the danger zones.** Attention leaks there. Right at that seam, put a new hook: a new complication, a new specific question, a fresh reason for the reader's brain to start predicting again — *before* the old loop fully closes.\n\nThe clean place to stop reading is the enemy. Never hand the reader one at a chapter break.\n\n---\n\n## 6. Don't over-correct\n\nThe loop is a *structural* layer, not a mandate to manufacture a reversal in every scene. Over-hooking reads as gimmicky and exhausting — and chasing constant turns is how a model drifts into the banned gotcha endings.\n\n- The book-level question (will they get together / survive / choose right) lives in the outline; honor it. This file works at **chapter and scene** scale, where the ghostwriter actually drafts.\n- A quiet character or connective scene doesn't need a Head Fake — it needs a live Big Question still humming underneath it.\n- One well-set-up turn beats three shallow ones. If a reversal isn't *earned* by setup, cut it; don't ship a gotcha to hit a quota.\n- Everything here is still subordinate to the codex, the outline, the genre promise, and the banned list.\n\n---\n\n## 7. Drafting checklist (run while shaping the chapter)\n\n- [ ] **Stakes are nameable** — the reader can answer *what's at risk / who / why now*, all shown, none announced; urgency carried by pressure, not a narrated clock.\n- [ ] **At least one specific Big Question is live** — planted in-scene, concrete enough to predict against; no vague teaser, no \"little did she know.\"\n- [ ] **Any reversal is set up** — surprising-yet-inevitable, recontextualizes on-page detail, survives the Does-It-Fit gate; lands mid-scene, not as a last-line gotcha.\n- [ ] **The ending Re-Hooks** — closes one loop and opens a fresh, specific one; mid-scene forward momentum, not a cliffhanger button; connective phrases translated into rendered scene, never written as narration.\n- [ ] **Chapter seam isn't a clean stop** — the danger zone has a new loop waiting.\n","guardrails":"# CPH Guardrails — hard reads before drafting\n\nAdopted from the Ideorix Intel build brief (items #2, #9, #10), written clean-room for CPH. In force for\nevery drafting and editing session. On conflict, these + the pen-name voice file win over generic craft\nrules. Complements the StateLedger (continuity memory) and avoiding-ai-tells (structural tells) — this\nfile governs **inventing plot** and **honesty about what's on disk**.\n\n---\n\n## 1. Outline-conformance drift gate (before drafting chapter N)\n\nBefore writing a word, reconcile the working brief for chapter N against (a) the planner's chapter\nprompt for chapter N and (b) the codex + StateLedger. Answer in one line each:\n\n- Does every plot element in the brief already exist in the plan / codex / Ledger?\n- Am I about to introduce anything NOT in the plan — a new subplot, a newly *planted* object/clue, or a\n  new named character?\n\nIf anything is invented, **STOP and flag it as DRIFT for Jessica's call — do not draft.** A planted\ndevice or thread that isn't in the plan silently consumes later planned beats (an invented Chekhov's\ngun in one chapter can eat three chapters of arc while every per-chapter check still passes). Catching\nit here costs a re-brief; catching it later costs a re-write. Improvised phrasing, imagery, and blocking\nare always fine — this gate is only about **plot elements and canon**, never prose.\n\n## 2. Honesty guard (Jessica's no-fabrication rule, made mechanical)\n\n1. **Never invent.** Do not name a book, character, chapter, fact, or note unless you read it from a\n   file *this session*.\n2. **Never assert existence you haven't verified.** If you haven't opened it, don't claim it exists.\n3. **Disk wins.** When memory and the files disagree, the files are authoritative — re-read.\n4. **Counts are real counts.** Every number (chapters, words, open threads) comes from a live listing.\n5. **If you haven't read it, ask.** Don't guess to fill a gap.\n\n\"I don't have anything on that\" is a complete, correct answer — and it should say which files/scopes\nwere checked, so Jessica knows the search was real.\n\n## 3. Snapshot-before-rewrite (any pass that overwrites project files)\n\nBefore overwriting files (applying edit fixes, rebuilding a bible/Ledger, imports): copy the affected\nfiles to `.snapshots/{timestamp}-{label}/`, confirm the copies by reading them back, THEN run the pass.\n\"Undo my last change\" restores the whole pass. Always propose-then-confirm before a non-trivial rewrite.\n**Durability rule:** on sandboxed hosts a file-write can *phantom-succeed* — the tool says done but the\nfile never reaches disk. Writes must go through host file tools and be verified by read-back. Keep\nsnapshots pruned to the newest ~20.\n\n---\n\n*Mechanical companion: the offline `Fiction QC` tool (`_Story Studio/Fiction QC/cph_qc.py`) automates the\nbanned-list / timestamp / placeholder / word-count scan the self-check does by hand — run it after\ndrafting a batch, before editing.*\n","ledgerTemplate":"# STORY STATE LEDGER — [Book Title] ([Pen Name])\n\n> **What this is:** the book's living memory. Not a status tracker (that's `[Book]_progress.md`) and not a planning doc (that's `[Book]_Codex.md`). This file records *what has actually happened on the page so far* — events, what each character knows, details established in prose, threads still open — so any chapter can pull real continuity forward from ANY earlier chapter, the way the author would.\n>\n> **Created on first run, lives in the book's Project, updated after every drafted chapter.** The Ghostwriter reads it before drafting and rewrites it after delivering. You can hand-edit it anytime.\n\n---\n\n## ⚙️ DRAFTING PROTOCOL — do this every chapter, no exceptions\n\n**BEFORE drafting Chapter N:**\n1. Read this entire ledger.\n2. Read the codex, the Chapter N prompt, and the immediately prior chapter.\n3. Note anything from earlier chapters this scene should call back to (check OPEN THREADS + CHARACTER STATE).\n\n**WHILE drafting:**\n- Only let a character know what the CHARACTER KNOWLEDGE section says they know.\n- Keep every detail consistent with CANON FACTS (names, descriptions, places, objects, world rules).\n- Reach back: weave in at least the relevant earlier-scene detail this chapter should remember.\n\n**AFTER drafting Chapter N — update this ledger before delivering:**\n- Add the chapter's row to the EVENT LOG.\n- Update CHARACTER STATE (wants / knows / location / relationships / last seen).\n- Add any new CANON FACTS established in the prose.\n- Update OPEN THREADS (close what paid off, add what was planted).\n- Log anything in CONTINUITY WATCH that future chapters must not contradict.\n\n**Double-check gate before handoff:** re-read the new chapter against CHARACTER KNOWLEDGE + CANON FACTS. Any contradiction gets flagged loudly, never smoothed over. (This is the \"refer back and double-check\" step.)\n\n---\n\n## 1. SNAPSHOT — where the book stands right now\n*One short paragraph. Rewrite each update. The \"if you read nothing else\" summary.*\n\n> [e.g., Through Ch 6: FMC and MMC have gone from open hostility to a forced-proximity truce; she still doesn't know he's the one who bought the bakery's debt. Last left off mid-argument on the bakery porch.]\n\n---\n\n## 2. CHAPTER EVENT LOG — the spine\n*The actual events, in order. One row per drafted chapter. This is what carries forward.*\n\n| Ch | POV | What actually happened (key events + turns) | Where the scene LEFT OFF (exact last beat) | Emotional shift |\n|----|-----|---------------------------------------------|--------------------------------------------|-----------------|\n| 1 | [FMC] | [event → event → turn] | [the precise final image/line/action] | [start state → end state] |\n| 2 | [MMC] | [ ] | [ ] | [ ] |\n| 3 | [ ] | [ ] | [ ] | [ ] |\n\n*(Add a row per chapter. If a single row gets too dense, expand that chapter into its own block below the table.)*\n\n---\n\n## 3. CHARACTER STATE — current as of the last drafted chapter\n*Per character. Update after every chapter. The KNOWS / DOESN'T KNOW split is what prevents impossible-knowledge slips.*\n\n### [FMC Name]\n- **Wants right now:** [scene-level want, which may differ from story goal]\n- **Knows:** [what she has witnessed / been told / figured out — and WHEN]\n- **Does NOT know:** [key secrets being kept from her — the dramatic-irony engine]\n- **Physical / location status:** [where she is, any injury/exhaustion/change carried in]\n- **Relationship status:** [with MMC and key others — the current temperature]\n- **Last seen:** Ch [N]\n\n### [MMC Name]\n- **Wants right now:** [ ]\n- **Knows:** [ ]\n- **Does NOT know:** [ ]\n- **Physical / location status:** [ ]\n- **Relationship status:** [ ]\n- **Last seen:** Ch [N]\n\n### [Supporting character]\n- **Role / current function:** [ ]\n- **Knows / Does NOT know:** [ ]\n- **Last seen:** Ch [N]\n\n---\n\n## 4. CANON FACTS — locked once they hit the page\n*Details established IN THE PROSE that must stay consistent. The codex holds the plan; this holds what actually got written. Note the chapter each was established.*\n\n- **Names & spellings:** [character, place, business names exactly as written] — *Ch [N]*\n- **Physical descriptors:** [eye color, scar, height, the car, the dog's name] — *Ch [N]*\n- **Places:** [town/building layout, who lives/works where] — *Ch [N]*\n- **Objects that matter:** [the locket, the letter, the truck] — *Ch [N]*\n- **World/relationship rules:** [for romantasy/paranormal: the magic/bond rules as stated; for contemporary: family ties, who knows whom] — *Ch [N]*\n\n---\n\n## 5. TIMELINE / SEQUENCE — scene-relative, never clock/calendar\n*CPH rule: no timestamps or counted durations in prose. Track sequence and felt passage of time here instead.*\n\n- **Order of events:** [Ch1 morning arrival → Ch2 same night → Ch3 next morning → …]\n- **Felt elapsed time so far:** [e.g., \"about a week of story time through Ch 6\"]\n- **Season / setting markers in play:** [late summer; harvest festival approaching]\n\n---\n\n## 6. OPEN THREADS & PLANTED CALLBACKS — setups awaiting payoff\n*Chekhov's guns, the live Big Question, and promises made to the reader. Close them as they pay off; flag any that risk being forgotten.*\n\n| Thread / setup | Planted in Ch | Status | Must pay off by |\n|----------------|---------------|--------|-----------------|\n| [The live Big Question driving the reader right now] | Ch [N] | OPEN | [ ] |\n| [Secret being kept: he bought the debt] | Ch [N] | OPEN | [ ] |\n| [Object/line planted for later] | Ch [N] | OPEN / PAID (Ch __) | [ ] |\n| [Promise to reader: the festival kiss] | Ch [N] | OPEN | [ ] |\n\n---\n\n## 7. CONTINUITY WATCH / \"DUDE\" LOG\n*Contradictions caught and how they were resolved, plus anything fragile future chapters must not break.*\n\n- [Ch __: nearly gave her two different sisters — locked as ONE sister, name [X]. Do not contradict.]\n- [Watch: established he can't cook in Ch 2 — don't let him plate a gourmet meal later without a reason.]\n\n---\n\n*Ledger template for the CPH fiction pipeline, used by the `cph-fiction-ghostwriter` skill. Lives in the book's Project alongside `[Book]_Codex.md`, `[Book]_Outline.md`, the chapter prompts, and `[Book]_progress.md`. On first run, copy this file, rename it `[Book]_StateLedger.md`, and populate it from the chapters already drafted before drafting the next one.*\n","progressTemplate":"# [BOOK TITLE] — Drafting Progress Tracker\n\n*Pen name: [Pen Name] | Total chapters: [N] | Target word count: [N]k*\n*This file is the source of truth for where the book stands. The Ghostwriter reads it to find the next chapter and updates it after every draft. You can hand-edit it anytime.*\n\n**Status legend:** `prompt-ready` (planner prompt exists, not drafted) → `drafted` (Ghostwriter first draft done) → `edited` (CPH editing pass done) → `approved` (Jessica signed off)\n\n**STANDING PER-CHAPTER QC (runs every chapter, not just when caught):**\n- **Knowledge-access check** — does any character state, think, or react to information they have no in-world access to at this point? Every knowledge claim must trace to something witnessed, heard, held, or legitimately inferred. POV reads of others are hedged inference, not asserted fact. (Full procedure: `references/craft-and-logic-pass.md`, Does-It-Fit Q6.)\n- **Connector/mouthpiece characters to watch (highest drift risk):** [list this book's characters who arrive into scenes carrying information — gossip, fixer, town connector. Their explaining-scenes get scrutinized hardest.]\n  - High-risk scenes for those characters: [Ch __, Ch __ — name the scenes built around them explaining something]\n\n**NEXT TO DRAFT:** Ch [N]  ← the Ghostwriter updates this line each run\n\n| Ch | Title / POV | Status | Draft file | Flags / questions |\n|----|-------------|--------|------------|-------------------|\n| 1  | [title] / [POV] | prompt-ready | — | — |\n| 2  | [title] / [POV] | prompt-ready | — | — |\n| 3  | [title] / [POV] | prompt-ready | — | — |\n| 4  | [title] / [POV] | prompt-ready | — | — |\n| 5  | [title] / [POV] | prompt-ready | — | — |\n| …  | … | … | … | … |\n\n---\n\n## Batch log\n*Each batch run gets a line here so you can see the cadence and catch drift.*\n\n| Batch | Chapters | Self-check | Flags raised | Date marker (scene, not clock) |\n|-------|----------|------------|--------------|-------------------------------|\n| — | — | — | — | — |\n\n## Open questions for Jessica\n*Anything the Ghostwriter paused on rather than inventing. Clear these before the editing pass.*\n\n- (none yet)\n","bannedList":"# Story Desk — Starter Banned List (student edition)\n\n**This is your list. Edit it in Setup → Voice profile → \"Banned words & names\" and the scanner follows.**\n\nThe list has two tiers because not all bans are equal:\ tes later.\"\n\n---\n\n# TIER 2 — WATCH (whole-word, sense-scoped)\n\n### Crutch / filler words\nsuddenly, slowly, quietly, finally, completely, entirely, incredibly, clearly, somehow, something, maybe, just, really, very, unreadable, expression, tension, steady, navigate, precision, flicker, hum, buzz\n\n### Counting / tally tic (the number reflex)\nReaching for a NUMBER to feel specific — \"her second cup of coffee,\" \"for the third time that morning,\" \"all six of them turned.\" The test: delete the number — does the line lose meaning? If no, cut it. Replace with a concrete image or sensation.\n","heatCalibration":null},"pens":[]};</script>

async function readSSE(resp, onEvent) {
  const reader = resp.body.getReader(); const dec = new TextDecoder(); let buf = '';
  while (true) {

      const line = buf.slice(0, idx).replace(/\r$/, ''); buf = buf.slice(idx + 1);
      if (!line.startsWith('data:')) continue;
      const data = line.slice(5).trim();
      if (!data || data === '[DONE]') continue;
      let obj; try { obj = JSON.parse(data); } catch (e) { continue; }
      onEvent(obj);
    }

}
