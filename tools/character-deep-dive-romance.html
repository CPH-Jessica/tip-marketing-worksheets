<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Character Deep Dive: Romance — Two People, One Reason It Has To Be Them</title>
<style>
/* ============================================================
   CHARACTER DEEP DIVE — ROMANCE EDITION
   Single-file, offline, localStorage.
   A two-hander: both leads excavated, then the thing that only
   these two can give each other, and the journey that proves it.
   ============================================================ */
:root{
  --bg:#180d15; --bg2:#22131d; --panel:#2a1826; --panel2:#361f2f;
  --ink:#fbeef4; --ink-dim:#c3a0b2; --line:#4a2c3f;
  --accent:#e8a0b4; --accent2:#c9789c; --accent3:#f0cf9a; --accent4:#d9a55f;
  --a:#e8a0b4; --b:#8fb8d8;
  --good:#7fd6a8; --warn:#f0c06a; --bad:#f0808f;
  --chip:#3a2231; --radius:14px; --shadow:0 10px 34px rgba(0,0,0,.45);
  --maxw:1200px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  font-family:"Segoe UI",system-ui,-apple-system,Roboto,Helvetica,Arial,sans-serif;
  background:
    radial-gradient(1100px 600px at 80% -10%, rgba(232,160,180,.20), transparent 62%),
    radial-gradient(900px 520px at 6% 6%, rgba(240,207,154,.10), transparent 60%),
    linear-gradient(170deg,var(--bg),#100810 66%);
  background-attachment:fixed;
  color:var(--ink); line-height:1.5; min-height:100vh;
}
a{color:var(--accent)}
button{font-family:inherit}
.wrap{max-width:var(--maxw);margin:0 auto;padding:0 18px 110px}
::-webkit-scrollbar{width:11px;height:11px}
::-webkit-scrollbar-thumb{background:#43273a;border-radius:8px}
::-webkit-scrollbar-track{background:transparent}

header.top{position:sticky;top:0;z-index:60;background:rgba(24,13,21,.94);backdrop-filter:blur(9px);border-bottom:1px solid var(--line)}
.top-inner{max-width:var(--maxw);margin:0 auto;padding:11px 18px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:11px;min-width:0}
.brand .glyph{font-size:24px;filter:drop-shadow(0 2px 8px rgba(232,160,180,.6))}
.brand h1{font-size:18px;margin:0;letter-spacing:.3px;white-space:nowrap}
.brand .sub{font-size:11.5px;color:var(--ink-dim);margin-top:-2px}
.top-actions{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.swap{display:flex;background:var(--panel2);border:1px solid var(--line);border-radius:11px;padding:3px;gap:3px}
.swap button{border:none;background:transparent;color:var(--ink-dim);padding:6px 13px;border-radius:8px;cursor:pointer;font-size:12.5px;font-weight:700;max-width:170px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.swap button.on{color:#20111b}
.swap button.on[data-who="0"]{background:var(--a)}
.swap button.on[data-who="1"]{background:var(--b)}
.btn{border:1px solid var(--line);background:var(--panel2);color:var(--ink);padding:8px 13px;border-radius:10px;cursor:pointer;font-size:13px;font-weight:600;transition:.15s;display:inline-flex;align-items:center;gap:6px}
.btn:hover{border-color:var(--accent);background:var(--panel)}
.btn.primary{background:linear-gradient(120deg,var(--accent2),var(--accent));border:none;color:#20111b}
.btn.primary:hover{filter:brightness(1.08)}
.btn.ghost{background:transparent}
.btn.sm{padding:5px 10px;font-size:12px;border-radius:9px}
.btn.danger:hover{border-color:var(--bad);color:var(--bad)}

nav.tabs{max-width:var(--maxw);margin:0 auto;padding:6px 12px 0;display:flex;gap:3px;flex-wrap:wrap}
.tab{border:1px solid transparent;background:transparent;color:var(--ink-dim);padding:9px 12px;border-radius:10px 10px 0 0;cursor:pointer;font-size:12.5px;font-weight:600;white-space:nowrap;position:relative}
.tab:hover{color:var(--ink);background:var(--panel)}
.tab.active{color:#fff;background:var(--panel);border-color:var(--line);border-bottom-color:var(--panel)}
.tab .num{display:inline-block;min-width:16px;text-align:center;opacity:.55;margin-right:3px;font-size:11px}
.tab .dot{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--line);margin-left:6px;vertical-align:middle}
.tab .dot.on{background:var(--good);box-shadow:0 0 8px rgba(127,214,168,.7)}
.tab .dot.part{background:var(--warn)}
.tab.solo:before{content:"";position:absolute;left:6px;top:7px;width:3px;height:calc(100% - 16px);border-radius:2px;background:var(--who,transparent)}
.tab.solo{padding-left:15px}

/* spine */
.spine{max-width:var(--maxw);margin:0 auto;padding:12px 18px 4px}
.spine-inner{display:flex;align-items:stretch;background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.snode{flex:1;min-width:0;padding:9px 11px;border-right:1px solid var(--line);cursor:pointer;transition:.15s}
.snode:last-child{border-right:none}
.snode:hover{background:var(--panel2)}
.snode .sk{font-size:10px;letter-spacing:.9px;text-transform:uppercase;color:var(--ink-dim);display:flex;align-items:center;gap:5px}
.snode .sk i{width:7px;height:7px;border-radius:50%;background:var(--line);display:inline-block}
.snode.on .sk i{background:var(--accent);box-shadow:0 0 8px rgba(232,160,180,.85)}
.snode .sv{font-size:12px;margin-top:3px;color:var(--ink-dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.snode.on .sv{color:var(--ink)}
@media(max-width:820px){.spine-inner{flex-wrap:wrap}.snode{flex:1 1 33%;border-bottom:1px solid var(--line)}}

.view{display:none;animation:fade .22s}
.view.active{display:block}
@keyframes fade{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:20px 22px;margin:16px 0;box-shadow:var(--shadow)}
.card h2{margin:0 0 4px;font-size:20px;letter-spacing:.2px}
.card h3{margin:24px 0 6px;font-size:14px;color:var(--accent);letter-spacing:.4px;text-transform:uppercase}
.card h3:first-of-type{margin-top:14px}
.lead{color:var(--ink-dim);font-size:13.5px;margin:0 0 8px}
.section-intro{font-size:13px;color:var(--ink-dim);background:var(--bg2);border-left:3px solid var(--accent2);padding:11px 14px;border-radius:0 10px 10px 0;margin:8px 0 16px}
.section-intro b{color:var(--ink)}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:1fr 1fr}
.g3{grid-template-columns:1fr 1fr 1fr}
@media(max-width:800px){.g2,.g3{grid-template-columns:1fr}}

label.f{display:block;margin:12px 0}
label.f .lab{display:flex;align-items:center;gap:7px;font-size:12.5px;font-weight:700;margin-bottom:5px;color:var(--ink);flex-wrap:wrap}
label.f .hint{display:block;font-weight:400;color:var(--ink-dim);font-size:11.5px;margin-bottom:5px;line-height:1.4}
input[type=text],input[type=number],select,textarea{width:100%;background:var(--bg2);border:1px solid var(--line);color:var(--ink);border-radius:10px;padding:9px 11px;font-size:13.5px;font-family:inherit}
textarea{resize:vertical;min-height:62px;line-height:1.5}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px rgba(232,160,180,.13)}
select{cursor:pointer}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end}
.tools{display:inline-flex;gap:5px;margin-left:auto}
.mini{border:1px solid var(--line);background:var(--bg2);color:var(--ink-dim);border-radius:7px;padding:2px 8px;font-size:11px;cursor:pointer;font-weight:600}
.mini:hover{color:var(--ink);border-color:var(--accent)}
.mini.seed:hover{border-color:var(--accent3);color:var(--accent3)}
.probe{background:rgba(201,120,156,.13);border:1px solid rgba(201,120,156,.45);border-radius:10px;padding:10px 12px;margin:7px 0 0;font-size:12.5px;display:none}
.probe.open{display:block;animation:fade .18s}
.probe .pq{color:var(--ink);margin:0 0 6px}
.probe .pq:before{content:"↳ ";color:var(--accent);font-weight:700}
.probe .pnav{display:flex;gap:6px;align-items:center;margin-top:6px}
.probe .pnum{font-size:11px;color:var(--ink-dim);margin-left:auto}
.seedbox{background:var(--bg2);border:1px dashed var(--line);border-radius:10px;padding:9px 11px;margin:7px 0 0;font-size:12.5px;display:none}
.seedbox.open{display:block}
.seedbox .sd{padding:6px 9px;border-radius:8px;cursor:pointer;color:var(--ink-dim);border:1px solid transparent}
.seedbox .sd:hover{background:var(--panel2);color:var(--ink);border-color:var(--line)}
.seedbox .sdh{font-size:11px;text-transform:uppercase;letter-spacing:.7px;color:var(--accent3);margin-bottom:4px}

.chip{display:inline-flex;align-items:center;gap:5px;background:var(--chip);border:1px solid var(--line);color:var(--ink);border-radius:999px;padding:5px 11px;font-size:12.5px;cursor:pointer;transition:.12s;user-select:none}
.chip:hover{border-color:var(--accent)}
.chip.on{background:linear-gradient(120deg,var(--accent2),var(--accent));border-color:transparent;color:#20111b;font-weight:700}
.chips{display:flex;flex-wrap:wrap;gap:7px;margin:6px 0}
.tcat{margin:12px 0}
.tcat h4{margin:8px 0 5px;font-size:12px;color:var(--accent3);text-transform:uppercase;letter-spacing:.7px}

.advisor{border-radius:12px;padding:11px 14px;font-size:13px;margin:10px 0;border:1px solid var(--line);line-height:1.5}
.advisor.good{background:rgba(127,214,168,.10);border-color:rgba(127,214,168,.42)}
.advisor.warn{background:rgba(240,192,106,.10);border-color:rgba(240,192,106,.42)}
.advisor.bad{background:rgba(240,128,143,.10);border-color:rgba(240,128,143,.42)}
.advisor.info{background:rgba(201,120,156,.12);border-color:rgba(201,120,156,.42)}
.advisor b{color:var(--ink)}
.pill{display:inline-block;border-radius:999px;padding:2px 9px;font-size:11px;font-weight:700;margin-left:6px}
.pill.good{background:rgba(127,214,168,.2);color:var(--good)}
.pill.warn{background:rgba(240,192,106,.2);color:var(--warn)}
.pill.bad{background:rgba(240,128,143,.2);color:var(--bad)}
.pill.dim{background:var(--chip);color:var(--ink-dim)}
.pill.a{background:rgba(232,160,180,.22);color:var(--a)}
.pill.b{background:rgba(143,184,216,.22);color:var(--b)}

/* two-column couple fields */
.pair{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin:10px 0}
@media(max-width:800px){.pair{grid-template-columns:1fr}}
.pcol{background:var(--bg2);border:1px solid var(--line);border-radius:12px;padding:13px 15px}
.pcol.a{border-top:3px solid var(--a)}
.pcol.b{border-top:3px solid var(--b)}
.pcol .pn{font-size:13px;font-weight:800;margin-bottom:2px}
.pcol.a .pn{color:var(--a)} .pcol.b .pn{color:var(--b)}

/* ladder */
.rung{display:flex;gap:11px;align-items:flex-start;background:var(--bg2);border:1px solid var(--line);border-radius:11px;padding:11px 13px;margin:8px 0}
.rung .rl{min-width:132px}
.rung .rl b{display:block;font-size:12.5px}
.rung .rl span{font-size:11px;color:var(--ink-dim)}
.rung textarea{min-height:44px}
.rung .rnum{width:26px;height:26px;border-radius:8px;background:var(--panel2);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:var(--accent);flex:none;margin-top:2px}
.rung.off{opacity:.42}
@media(max-width:700px){.rung{flex-wrap:wrap}.rung .rl{min-width:0;flex:1}}

/* beats */
.beat{background:var(--bg2);border:1px solid var(--line);border-radius:12px;padding:13px 15px;margin:10px 0}
.beat.pivot{border-color:rgba(232,160,180,.55);background:linear-gradient(180deg,rgba(232,160,180,.07),var(--bg2))}
.beat .bh{display:flex;align-items:center;gap:9px;flex-wrap:wrap}
.beat .bn{width:27px;height:27px;border-radius:9px;background:var(--panel2);display:flex;align-items:center;justify-content:center;font-size:12.5px;font-weight:700;color:var(--accent);flex:none}
.beat.pivot .bn{background:linear-gradient(120deg,var(--accent2),var(--accent));color:#20111b}
.beat .bt{font-size:14px;font-weight:700}
.beat .bask{font-size:12px;color:var(--ink-dim);margin:6px 0 8px;line-height:1.45}
.sliders{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-top:10px}
@media(max-width:780px){.sliders{grid-template-columns:1fr}}
.sl{display:flex;align-items:center;gap:8px}
.sl .gl{font-size:10.5px;color:var(--ink-dim);white-space:nowrap;min-width:64px}
input[type=range]{-webkit-appearance:none;appearance:none;height:5px;border-radius:4px;background:var(--panel2);flex:1;cursor:pointer;min-width:60px}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:14px;height:14px;border-radius:50%;background:var(--accent);border:2px solid var(--panel);cursor:pointer}
input[type=range].ra::-webkit-slider-thumb{background:var(--a)}
input[type=range].rb::-webkit-slider-thumb{background:var(--b)}
.gripval{font-size:11px;font-weight:700;color:var(--ink-dim);min-width:30px;text-align:right}

.chartbox{background:var(--bg2);border:1px solid var(--line);border-radius:12px;padding:14px;margin:12px 0}
.chartbox svg{width:100%;height:auto;display:block}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:11.5px;color:var(--ink-dim);margin-top:8px}
.legend i{display:inline-block;width:16px;height:3px;border-radius:2px;vertical-align:middle;margin-right:5px}

.score{display:flex;align-items:center;gap:18px;flex-wrap:wrap;background:var(--bg2);border:1px solid var(--line);border-radius:12px;padding:16px 18px}
.score .big{font-size:44px;font-weight:800;line-height:1;letter-spacing:-1px}
.score .lbl{font-size:12px;color:var(--ink-dim);text-transform:uppercase;letter-spacing:.9px}
.meter{flex:1;min-width:180px}
.meter .bar{height:9px;background:var(--panel2);border-radius:6px;overflow:hidden}
.meter .bar i{display:block;height:100%;transition:width .4s}
.check{display:flex;gap:11px;align-items:flex-start;background:var(--bg2);border:1px solid var(--line);border-radius:11px;padding:11px 13px;margin:8px 0}
.check .ci{font-size:16px;line-height:1.2;flex:none;width:22px;text-align:center}
.check.pass{border-color:rgba(127,214,168,.35)}
.check.fail{border-color:rgba(240,128,143,.35)}
.check.soft{border-color:rgba(240,192,106,.35)}
.check .ct{font-size:13.5px;font-weight:700;margin-bottom:2px}
.check .cd{font-size:12.5px;color:var(--ink-dim);line-height:1.5}
.check .cgo{margin-left:auto;flex:none}

.outbox{background:#120a10;border:1px solid var(--line);border-radius:12px;padding:14px 16px;font-family:ui-monospace,"Cascadia Code",Consolas,monospace;font-size:12px;white-space:pre-wrap;max-height:520px;overflow:auto;line-height:1.55;color:#f0dde7}
.exptabs{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0}
.exptab{border:1px solid var(--line);background:var(--bg2);color:var(--ink-dim);border-radius:9px;padding:7px 12px;font-size:12.5px;cursor:pointer;font-weight:600}
.exptab.on{background:var(--panel2);color:var(--ink);border-color:var(--accent)}

.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(80px);background:var(--panel2);border:1px solid var(--accent);color:var(--ink);padding:11px 20px;border-radius:11px;font-size:13px;font-weight:600;z-index:200;opacity:0;transition:.28s;box-shadow:var(--shadow)}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
footer.foot{max-width:var(--maxw);margin:0 auto;padding:14px 18px 40px;color:var(--ink-dim);font-size:11.5px;display:flex;gap:14px;flex-wrap:wrap;align-items:center}
.chk{display:flex;gap:9px;align-items:flex-start;background:var(--bg2);border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin:8px 0;cursor:pointer}
.chk input{margin-top:3px;accent-color:var(--accent);flex:none}
.chk .ck{font-size:13px;font-weight:600}
.chk .cs{font-size:11.5px;color:var(--ink-dim);line-height:1.45;margin-top:2px}
.heatbar{display:flex;gap:6px;margin:8px 0}
.heatbar button{flex:1;border:1px solid var(--line);background:var(--bg2);color:var(--ink-dim);border-radius:10px;padding:9px 6px;cursor:pointer;font-size:12px;font-weight:700;transition:.15s}
.heatbar button:hover{border-color:var(--accent)}
.heatbar button.on{background:linear-gradient(120deg,var(--accent2),var(--accent));color:#20111b;border-color:transparent}
.heatbar button small{display:block;font-weight:400;font-size:10px;opacity:.85;margin-top:2px}
@media print{header.top,nav.tabs,.spine,.top-actions,footer.foot{display:none}body{background:#fff;color:#111}.card{box-shadow:none;border-color:#ccc;background:#fff}}
</style>
</head>

<script>
const CONFIG = { storageKey:"tip-romance-deep-dive-v1", version:1 };

/* ============================================================
   SUBGENRE PLAYBOOKS
   ============================================================ */
const LANES = {
smalltown:{label:"Small Town", heat:[2,4],
  driver:"Coming home to the people who remember who you used to be",
  wounds:["They left in the middle of the night and never explained it to anyone","They were the family everyone gossiped about, and they felt every word of it","They stayed when they wanted to go, and gave up the thing they were good at"],
  lies:["If I need this town, it gets to decide who I am","People here already made up their minds about me — nothing I do changes it","Staying means settling, and I'm not going to be my mother"],

  barriers:["One of them is leaving in six weeks and both of them know it","Their families are on opposite sides of something the town hasn't forgiven","Everyone will know within a day, and one of them can't afford that"],
  tropes:["Return to Hometown","Second Chance","Small Business in Trouble","Grumpy/Sunshine","Forced Proximity"],
  warn:"Small-town trap: <b>the town becomes the plot.</b> Casseroles and quirky neighbours are texture. The book is about two people who cannot be private in a place where nothing is private."},

billionaire:{label:"Billionaire / Boss", heat:[3,5],
  driver:"Power on one side, principle on the other — and what money can't buy",
  wounds:["They were loved for what they could provide, and found out on a specific date","They watched their family lose everything and swore never to be at anyone's mercy again","They were somebody's second choice, publicly"],
  lies:["Everything is a transaction — I just make sure I set the price","If I stop producing, I stop being worth keeping","Wanting to be taken care of is weakness"],
  wants:["Close the deal that finally puts the family company out of reach","Keep the job, the visa, or the custody arrangement","Prove they earned the position everyone assumes they were given"],
  barriers:["He signs her paycheque and she needs it more than she'll admit","A contract, an NDA, or a board that will remove one of them","The gap in what each stands to lose is not equal, and both know it"],
  tropes:["Boss/Employee","Fake Relationship","Marriage of Convenience","Grumpy/Sunshine","Only One Bed"],
  warn:"Billionaire trap: <b>wealth as personality.</b> The jet is not a character trait. The engine is the power imbalance — write what she can't say to him because of what he controls."},

darkmafia:{label:"Dark Romance / Mafia", heat:[4,5],
  driver:"Possession, danger braided into desire, and the question of what she'll survive",
  wounds:["They were traded, promised, or sold as a term in someone else's arrangement","They learned early that the people who protect you are the people who own you","They were taught their softness would be the thing that killed them"],
  lies:["If I am the most dangerous thing in the room, nothing can be done to me","Being wanted this much is the closest thing to being safe","I don't get a choice, so wanting one is just a way to suffer"],

/* ============================================================
   STATE
   ============================================================ */
const NEWPERSON = () => ({ name:"", identity:{}, wound:{}, engine:{}, behavior:{}, pair:{} });
const DEFAULT = () => ({
  book:{ title:"", series:"", penName:"", lane:"smalltown", heat:3, pov:"Dual POV", promise:"", tropes:[], tropeWhy:{} },
  people:[ NEWPERSON(), NEWPERSON() ],
  rel:{ why:{}, barrier:{}, black:{}, ladder:[{},{},{},{},{}],
        beats: BEATS.map(()=>({a:"",b:"",r:"",close:null,gA:null,gB:null})) },
  who:0, meta:{ v:CONFIG.version }
});
let S = DEFAULT();

function P(){ return S.people[S.who]; }
function O(){ return S.people[S.who?0:1]; }
function L(){ return LANES[S.book.lane] || LANES.smalltown; }
function nm(i){ return S.people[i].name || (i? "Partner B":"Partner A"); }
function selfName(){ return nm(S.who); }
function otherName(){ return nm(S.who?0:1); }

const Store = {
  save(){ try{ localStorage.setItem(CONFIG.storageKey, JSON.stringify(S)); }catch(e){} },
  load(){
    try{
      const r=localStorage.getItem(CONFIG.storageKey); if(!r) return;
      const p=JSON.parse(r); S=Object.assign(DEFAULT(), p);
      if(!Array.isArray(S.people)||S.people.length!==2) S.people=[NEWPERSON(),NEWPERSON()];
      S.people=S.people.map(x=>Object.assign(NEWPERSON(), x));
      const d=DEFAULT().rel; S.rel=Object.assign(d, S.rel||{});
      if(!Array.isArray(S.rel.beats)||S.rel.beats.length!==BEATS.length) S.rel.beats=BEATS.map(()=>({a:"",b:"",r:"",close:null,gA:null,gB:null}));
      if(!Array.isArray(S.rel.ladder)||S.rel.ladder.length!==5) S.rel.ladder=[{},{},{},{},{}];
      if(!Array.isArray(S.book.tropes)) S.book.tropes=[];
      if(!S.book.tropeWhy) S.book.tropeWhy={};
      if(S.who!==0 && S.who!==1) S.who=0;
    }catch(e){}
  },
  reset(){ if(!confirm("Clear this couple and start fresh? Save a file first if you want to keep them.")) return;
    S=DEFAULT(); Store.save(); boot(); toast("Cleared — fresh start"); },
  exportJSON(){
    const blob=new Blob([JSON.stringify(S,null,2)],{type:"application/json"});
    const a=document.createElement("a"); a.href=URL.createObjectURL(blob);
    a.download=(S.book.title||"romance-deep-dive").replace(/[^a-z0-9]+/gi,"-").toLowerCase()+"-couple.json"; a.click();
    toast("Saved a backup file");
  },
  importFile(){ document.getElementById("fileInput").click(); }
};
document.getElementById("fileInput").addEventListener("change",function(e){
  const f=e.target.files[0]; if(!f) return; const r=new FileReader();
  r.onload=()=>{ try{ localStorage.setItem(CONFIG.storageKey, r.result); Store.load(); Store.save(); boot(); toast("Loaded"); }
    catch(err){ toast("Couldn't read that file"); } };
  r.readAsText(f); e.target.value="";
});

function getPath(o,p){ return p.split(".").reduce((a,k)=>(a&&a[k]!==undefined&&a[k]!==null)?a[k]:undefined,o); }
function setPath(o,p,v){ const k=p.split("."); let c=o;
  for(let i=0;i<k.length-1;i++){ if(typeof c[k[i]]!=="object"||c[k[i]]===null) c[k[i]]={}; c=c[k[i]]; }
  c[k[k.length-1]]=v; }
function pv(p,i){ const v=getPath(S.people[i===undefined?S.who:i],p); return v===undefined?"":v; }
function rv(p){ const v=getPath(S.rel,p); return v===undefined?"":v; }
function ph(p,i){ const v=pv(p,i); return typeof v==="string"?v.trim().length>2:!!v; }
function rh(p){ const v=rv(p); return typeof v==="string"?v.trim().length>2:!!v; }

let toastT;
function toast(m){ const t=document.getElementById("toast"); t.textContent=m; t.classList.add("show");
  clearTimeout(toastT); toastT=setTimeout(()=>t.classList.remove("show"),2100); }
function esc(s){ return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }
function fid(p){ return "f_"+p.replace(/[^a-z0-9]/gi,"_"); }

/* ============================================================
   TABS
   ============================================================ */
const TABS = [
  ["book","The Book",0],["identity","Who They Are",1],["wound","Wound &amp; Love Lie",1],["engine","Want · Need · Now",1],
  ["why","Why These Two",0],["barrier","The Barrier",0],["tropes","Tropes",0],["journey","The Journey",0],
  ["heat","Heat &amp; Intimacy",0],["black","Black Moment",0],["behavior","On the Page",1],
  ["diagnostics","Pressure Test",0],["export","Export",0]
];
let CURRENT="book";
function buildTabs(){
  document.getElementById("tabs").innerHTML = TABS.map((t,i)=>
    `<button class="tab ${t[2]?"solo":""}" data-tab="${t[0]}" style="--who:${S.who?"var(--b)":"var(--a)"}" onclick="go('${t[0]}')"><span class="num">${i+1}</span>${t[1]}<span class="dot" data-dot="${t[0]}"></span></button>`).join("");
}
function go(v){
  CURRENT=v; renderView(v);
  document.querySelectorAll(".view").forEach(x=>x.classList.toggle("active",x.dataset.view===v));
  document.querySelectorAll(".tab").forEach(x=>x.classList.toggle("active",x.dataset.tab===v));
  window.scrollTo({top:0,behavior:"smooth"});
}
function renderView(v){
  if(PERSON[v]) return Solo.render(v);
  if(COUPLE[v]) return Duo.render(v);
  if(v==="book") return Book.render();
  if(v==="tropes") return Tropes.render();
  if(v==="journey") return Journey.render();
  if(v==="heat") return Heat.render();
  if(v==="diagnostics") return Diag.render();
  if(v==="export") return Exporter.render();
}

/* ============================================================
   COMPLETION
   ============================================================ */
function personPct(key,i){
  const fs=PERSON[key].blocks.flatMap(b=>b.fields);
  return Math.round(fs.filter(f=>ph(f.p,i)).length/fs.length*100);
}
function duoPct(key){
  const s=COUPLE[key]; let n=0,t=0;
  s.blocks.forEach(b=>{
    if(b.pair){ b.fields.forEach(f=>{ [0,1].forEach(i=>{ t++; if(ph("pair."+f.p,i)) n++; }); }); }
    else b.fields.forEach(f=>{ if(f.t==="chk") return; t++; if(rh(f.p)) n++; });
  });
  return t?Math.round(n/t*100):0;
}
function journeyPct(){ const b=S.rel.beats; return Math.round(b.filter(x=>(x.a||"").trim()||(x.b||"").trim()||(x.r||"").trim()).length/b.length*100); }
function heatPct(){ return Math.round(S.rel.ladder.filter(r=>(r.note||"").trim().length>2).length/5*100); }
function tropePct(){ if(!S.book.tropes.length) return 0;
  return Math.round(S.book.tropes.filter(t=>(S.book.tropeWhy[t]||"").trim().length>2).length/S.book.tropes.length*100); }
function bookPct(){ const k=["title","lane","promise"]; return Math.round(k.filter(x=>String(S.book[x]||"").trim().length>1).length/k.length*100); }
function tabPct(k){
  if(PERSON[k]) return Math.round((personPct(k,0)+personPct(k,1))/2);
  if(COUPLE[k]) return duoPct(k);
  if(k==="book") return bookPct();
  if(k==="journey") return journeyPct();
  if(k==="heat") return heatPct();
  if(k==="tropes") return tropePct();
  if(k==="diagnostics") return Diag.score();
  return -1;
}
function paintDots(){
  document.querySelectorAll("[data-dot]").forEach(d=>{ const p=tabPct(d.dataset.dot);
    d.className="dot"+(p>=85?" on":(p>=25?" part":"")); });
}

/* ============================================================
   SPINE
   ============================================================ */
function renderSpine(){
  const nodes=[
    {k:nm(0)+"'s lie", v:pv("wound.lovelie",0), tab:"wound", who:0},
    {k:nm(1)+"'s lie", v:pv("wound.lovelie",1), tab:"wound", who:1},
    {k:"Why these two", v:rv("why.oneline"), tab:"why"},
    {k:"The barrier", v:rv("barrier.external"), tab:"barrier"},
    {k:"Black moment", v:rv("black.moment"), tab:"black"},
    {k:"HEA, proven", v:rv("black.hea"), tab:"black"}
  ];
  document.getElementById("spine").innerHTML="<div class='spine-inner'>"+nodes.map(n=>{
    const v=String(n.v||"").trim(), on=v.length>2;
    const jump = n.who!==undefined ? `Swap.to(${n.who});go('${n.tab}')` : `go('${n.tab}')`;
    return `<div class="snode ${on?"on":""}" onclick="${jump}" title="${esc(v)}">
      <div class="sk"><i></i>${esc(n.k)}</div>
      <div class="sv">${on?esc(v.length>60?v.slice(0,58)+"…":v):"—"}</div></div>`;
  }).join("")+"</div>";
}

/* ============================================================
   PERSON SWAP
   ============================================================ */
const Swap = {
  paint(){
    document.getElementById("swap").innerHTML=[0,1].map(i=>
      `<button data-who="${i}" class="${S.who===i?"on":""}" onclick="Swap.to(${i})">${esc(nm(i))}</button>`).join("");
  },
  to(i){ if(S.who===i){ return; } S.who=i; Store.save(); buildTabs();
    document.querySelectorAll(".tab").forEach(x=>x.classList.toggle("active",x.dataset.tab===CURRENT));
    this.paint(); renderView(CURRENT); paintDots(); }
};

/* ============================================================
   FIELDS
   ============================================================ */
function fieldHTML(f,opts){
  opts=opts||{};
  const root=opts.root||"person";            // person | rel
  const idx = opts.idx===undefined?S.who:opts.idx;
  const path = opts.prefix ? opts.prefix+f.p : f.p;
  const uniq = path + (root==="person"?("_"+idx):"");
  const id=fid(uniq);
  const v = root==="person" ? pv(path,idx) : rv(path);
  const attr = root==="person" ? `data-ppath="${path}" data-idx="${idx}"` : `data-rpath="${path}"`;

  let label=f.l, hint=f.hint||"";
  if(opts.self!==undefined){
    label=label.replace(/\{SELF\}/g,opts.self).replace(/\{OTHER\}/g,opts.other);
    hint=hint.replace(/\{SELF\}/g,opts.self).replace(/\{OTHER\}/g,opts.other);
  }
  const tools=[];
  const probeKey = typeof f.probe==="string" ? f.probe : path;
  if(f.probe && PROBES[probeKey]) tools.push(`<button type="button" class="mini" onclick="Probe.toggle('${probeKey}','${uniq}')">dig deeper</button>`);
  if(f.seed) tools.push(`<button type="button" class="mini seed" onclick="Seeds.toggle('${uniq}','${f.seed}')">seeds</button>`);
  const toolbar=tools.length?`<span class="tools">${tools.join("")}</span>`:"";

  let input="";
  if(f.t==="txt") input=`<input type="text" id="${id}" ${attr} value="${esc(v)}">`;
  else if(f.t==="sel") input=`<select id="${id}" ${attr}>${(f.opts||[]).map(o=>`<option ${o===v?"selected":""}>${esc(o)}</option>`).join("")}</select>`;
  else if(f.t==="chk") return `<label class="chk"><input type="checkbox" ${attr} ${v?"checked":""}>
      <span><span class="ck">${label}</span><span class="cs">${hint}</span></span></label>`;
  else input=`<textarea id="${id}" ${attr} style="min-height:${f.big?100:62}px">${esc(v)}</textarea>`;

  return `<label class="f"><span class="lab">${label}${toolbar}</span>
    ${hint?`<span class="hint">${hint}</span>`:""}${input}
    <div class="probe" id="pb_${id}"></div><div class="seedbox" id="sb_${id}"></div></label>`;
}

const Probe = {
  idx:{},
  toggle(key,uniq){
    const box=document.getElementById("pb_"+fid(uniq));
    if(box.classList.contains("open")){ box.classList.remove("open"); return; }
    this.idx[uniq]=this.idx[uniq]||0; this.paint(key,uniq); box.classList.add("open");
  },
  next(key,uniq){ this.idx[uniq]=((this.idx[uniq]||0)+1)%PROBES[key].length; this.paint(key,uniq); },
  paint(key,uniq){
    const list=PROBES[key], i=this.idx[uniq]||0, id=fid(uniq);
    document.getElementById("pb_"+id).innerHTML=`<div class="pq">${list[i]}</div>
      <div class="pnav"><button type="button" class="mini" onclick="Probe.next('${key}','${uniq}')">another question</button>
      <button type="button" class="mini" onclick="document.getElementById('pb_${id}').classList.remove('open')">close</button>
      <span class="pnum">${i+1} / ${list.length}</span></div>`;
  }
};

const Seeds = {
  toggle(uniq,kind){
    const id=fid(uniq), box=document.getElementById("sb_"+id);
    if(box.classList.contains("open")){ box.classList.remove("open"); return; }
    const items=(L()[kind]||[]).slice();
    box.innerHTML=`<div class="sdh">${esc(L().label)} — click to drop in, then make it yours</div>`+
      items.map((s,i)=>`<div class="sd" onclick="Seeds.use('${uniq}',${i})">${esc(s)}</div>`).join("")+
      `<div style="margin-top:7px"><button type="button" class="mini" onclick="document.getElementById('sb_${id}').classList.remove('open')">close</button></div>`;
    box._items=items; box.classList.add("open");
  },
  use(uniq,i){
    const id=fid(uniq), box=document.getElementById("sb_"+id), el=document.getElementById(id);
    const text=box._items[i], cur=(el.value||"").trim();
    el.value=cur?cur+"\n"+text:text;
    el.dispatchEvent(new Event("input",{bubbles:true}));
    box.classList.remove("open"); toast("Dropped in — now make it theirs");
  }
};

  path(vals,w,h,pad){

    return vals.map((v,i)=>{ const x=pad+i*((w-pad*2)/(n-1)), y=pad+(100-v)/100*(h-pad*2);
      return (i?"L":"M")+x.toFixed(1)+" "+y.toFixed(1); }).join(" ");
  },
  svg(){

/* ============================================================
   DIAGNOSTICS
   ============================================================ */
const Diag = {
  run(){
    const out=[], add=(s,t,d,tab)=>out.push({state:s,title:t,desc:d,tab});
    const A=nm(0), B=nm(1);
    const both=(p)=>[ph(p,0),ph(p,1)];
    const nameMissing=[0,1].filter(i=>!S.people[i].name.trim());

    if(nameMissing.length) add("soft","Leads aren't named yet","Names make every other field easier to write, and they show up all over this tool.","book");
    else add("pass","Both leads named","","book");

    // wants
    const w=both("engine.want");
    if(!w[0]&&!w[1]) add("fail","Neither lead has a goal outside the romance","This is the number one cause of a saggy romance middle. Each of them needs something they're chasing that the other complicates.","engine");
    else if(!w[0]||!w[1]) add("fail",`${w[0]?B:A} has no goal outside the romance`,"Whoever lacks one will read as a prize rather than a person — they'll only ever react to the other lead.","engine");
    else add("pass","Both leads want something outside each other","","engine");

    // want complicated by romance
    const vl=both("engine.wantVsLove");
    if(vl[0]&&vl[1]) add("pass","Falling in love makes both goals harder","That's the engine — every step toward each other costs them something they were chasing.","engine");
    else add("soft","The romance doesn't cost them their goals yet","If loving each other helps them both get what they want, there's nothing to resist.","engine");

    // love lies
    const ll=both("wound.lovelie");
    if(!ll[0]||!ll[1]) add("fail","Missing a love lie",`${!ll[0]?A:""}${(!ll[0]&&!ll[1])?" and ":""}${!ll[1]?B:""} has no stated belief about being loved. The black moment has nothing to be made of.`,"wound");
    else {
      const norm=s=>String(s).toLowerCase().replace(/[^a-z ]/g,"").split(/\s+/).filter(x=>x.length>3);
      const a=new Set(norm(pv("wound.lovelie",0))), bb=norm(pv("wound.lovelie",1));
      const ov=bb.length? bb.filter(x=>a.has(x)).length/Math.max(a.size,bb.length):0;
      if(ov>0.55) add("soft","Both leads believe nearly the same lie","Mirrored wounds can work, but if they're identical there's nobody in the book who can show the other a way out. Angle one of them differently.","wound");
      else add("pass","Two different lies about love","Good — each can be the evidence that disproves the other's.","wound");
    }

    // wounds
    const gh=both("wound.ghost");
    if(gh[0]&&gh[1]) add("pass","Both wounds are on the page","","wound");
    else add("fail",`Missing a wound for ${gh[0]?B:(gh[1]?A:"both leads")}`,"Without it the lie is unearned and the guard is just rudeness.","wound");

    // guard + what breaks it
    const br=both("wound.breaks");
    if(br[0]&&br[1]) add("pass","You know what gets past each guard","That's what the other lead is actually for.","wound");
    else add("soft","One of the guards has no key","Name the specific kindness each can't defend against — it's the other lead's real weapon.","wound");

    // why these two
    const gv=both("pair.gives"), ss=both("pair.sees");
    if(gv[0]&&gv[1]) add("pass","'Why these two' is answered both directions","The question every reader is really asking.","why");
    else if(gv[0]||gv[1]) add("fail","'Why these two' only works one way",`You've written what one gives the other but not the reverse. One-sided need reads as rescue, not romance.`,"why");
    else add("fail","'Why these two' is unanswered","Everything else can be good and the book will still feel interchangeable.","why");
    if(ss[0]&&ss[1]) add("pass","Each sees something in the other that nobody else does","","why");
    else add("soft","Not established what each sees that others miss","This is where readers fall in love with the pairing rather than the people.","why");

    if(rh("why.oneline")) add("pass","You can say why it has to be them in one sentence","Put that line in the blurb.","why");
    else add("soft","No one-line answer for 'why these two'","Write it — it's your blurb, your pitch, and the spine of every scene.","why");

    if(rh("why.compat")) add("pass","There's a reason they'd actually work","Chemistry gets them into bed; this is what makes readers believe the HEA.","why");
    else add("soft","Chemistry without compatibility","Name the unsexy reason they fit: shared humour, matched pace, the same thing they find unbearable.","why");

    // barrier
    if(rh("barrier.external") && rh("barrier.enforcer")) add("pass","The external barrier has an enforcer","A rule nobody polices isn't a rule.","barrier");
    else if(rh("barrier.external")) add("soft","Barrier has no enforcer","Name who can catch them and what they'd do about it.","barrier");
    else add("fail","No external barrier","Internal barriers alone read as two people being difficult for 300 pages.","barrier");

    const ib=both("pair.internal");
    if(ib[0]&&ib[1]) add("pass","Both leads have an internal barrier","","barrier");
    else add("fail","Internal barrier missing for one or both leads","External-only obstacles get solved in a scene. The reason they resist has to live inside them.","barrier");

    if(rv("barrier.convoFail") && !rh("barrier.convoWhy"))
      add("fail","One honest conversation would fix this","You've flagged it yourself and left the reason blank. Romance readers punish this harder than any other flaw.","barrier");
    else if(rv("barrier.convoFail")) add("pass","You've closed the conversation loophole","Keep that reason alive in every near-miss.","barrier");
    else add("pass","The conflict survives an honest conversation","","barrier");

    // black moment
    if(rh("black.moment") && rh("black.trace")) add("pass","The black moment comes from character","The lie wins — that's the only version readers accept.","black");
    else if(rh("black.moment")) add("soft","Black moment isn't traced to a wound","If you can't trace it, it'll read as a misunderstanding or a coincidence.","black");
    else add("fail","No black moment","","black");

    if(rh("black.foreshadow")) add("pass","The break is foreshadowed","Reader reaction should be 'of course' and 'no' at the same time.","black");
    else add("soft","Black moment isn't planted","Name two earlier scenes where the same behaviour shows up smaller.","black");

    const gu=both("pair.gives_up"), pf=both("pair.proof");
    if(gu[0]&&gu[1]&&(pf[0]||pf[1])) add("pass","Both give something up to repair it","Mutual cost is what makes an HEA feel earned rather than granted.","black");
    else if(gu[0]||gu[1]) add("soft","Only one of them pays for the repair","If one grovels and the other just accepts, readers side against the one who didn't move.","black");
    else add("fail","No proof of change","An apology isn't a grovel. Name what each gives up.","black");

    if(rh("black.hea")) add("pass","The HEA is proven by an action","","black");
    else add("soft","HEA is a promise, not a proof","Show them doing something in the last chapter that was impossible in the first.","black");

    // tropes
    if(S.book.tropes.length){
      const j=S.book.tropes.filter(t=>(S.book.tropeWhy[t]||"").trim().length>2).length;
      if(j===S.book.tropes.length) add("pass","Every trope is doing character work","","tropes");
      else add("soft",`${S.book.tropes.length-j} trope${S.book.tropes.length-j===1?"":"s"} not justified`,"Either tie each one to a wound or cut it — unjustified tropes are what make a book feel generic.","tropes");
    } else add("soft","No tropes picked","Romance readers shop by trope. Pick two or three headline ones and tie them to the wounds.","tropes");

    // journey
    const bf=S.rel.beats.filter(x=>(x.a||"").trim()||(x.b||"").trim()||(x.r||"").trim()).length;
    if(bf>=9) add("pass","The journey is mapped",`${bf} of 12 beats.`,"journey");
    else if(bf>=4) add("soft","The journey is partly mapped",`${bf} of 12 beats. The ones that matter most are 6 (the Could-Be), 9 (the break) and 11 (the proof).`,"journey");
    else add("fail","No journey mapped","","journey");

    // guard curve sanity
    const gA=Journey.series("gA","gA"), gB=Journey.series("gB","gB"), cl=Journey.series("close","close");
    if(cl[8] > cl[5]) add("soft","Closeness doesn't dip at the black moment","Beat 9 should be the lowest point of the book. Right now it's higher than your midpoint.","journey");
    else add("pass","The break actually breaks","","journey");
    if(gA[4]<25 && gB[4]<25) add("soft","Both guards are down before the midpoint","If they're this open by beat 5, the back half has nothing left to earn. Hold one of them higher.","journey");

    // heat
    if(heatPct()>=60) add("pass","Intimacy ladder mapped","Each rung earns the next.","heat");
    else add("soft","Intimacy ladder mostly empty",`At heat ${S.book.heat} the ladder is where the relationship actually changes. Fill at least three rungs.`,"heat");

    // behaviour
    const beh=[0,1].map(i=>["behavior.flirt","behavior.fight","behavior.neverSay"].filter(p=>ph(p,i)).length);
    if(beh[0]>=2&&beh[1]>=2) add("pass","Both leads translated into behaviour","This is what you paste into a drafting prompt.","behavior");
    else add("soft","Motivation hasn't reached the page for one lead","How they flirt, how they fight, what they'd never say — without these the prose goes generic.","behavior");

    return out;
  },
  score(){ const c=this.run(); if(!c.length) return 0;
    return Math.round(c.reduce((a,x)=>a+(x.state==="pass"?1:(x.state==="soft"?.5:0)),0)/c.length*100); },
  render(){
    const ch=this.run(), s=this.score();
    const col=s>=80?"var(--good)":(s>=55?"var(--warn)":"var(--bad)");
    const verdict=s>=85?"Draftable. This couple will carry a book."
      :s>=70?"Close. Fix the red flags and it holds."
      :s>=45?"Half-built. The people are there; the reason they need each other isn't yet."
      :"Not ready to draft. Everything red below is load-bearing.";
    const f=ch.filter(c=>c.state==="fail"), so=ch.filter(c=>c.state==="soft"), p=ch.filter(c=>c.state==="pass");
    document.querySelector('.view[data-view="diagnostics"]').innerHTML=`
      <div class="card">
        <h2>Pressure Test — ${esc(nm(0))} &amp; ${esc(nm(1))}</h2>
        <p class="lead">Structural checks built for romance. It tests whether the relationship <i>holds together</i> — not whether the prose is any good. That part's yours.</p>
        <div class="score">
          <div><div class="big" style="color:${col}">${s}</div><div class="lbl">out of 100</div></div>
          <div class="meter"><div class="bar"><i style="width:${s}%;background:${col}"></i></div>
            <div style="margin-top:8px;font-size:13.5px">${verdict}</div>
            <div style="margin-top:4px;font-size:12px;color:var(--ink-dim)">${p.length} solid · ${so.length} to sharpen · ${f.length} load-bearing gap${f.length===1?"":"s"}</div></div>
        </div>
        ${f.length?`<h3>Fix these first</h3>${f.map(this.row).join("")}`:""}
        ${so.length?`<h3>Sharpen these</h3>${so.map(this.row).join("")}`:""}
        ${p.length?`<h3>Holding</h3>${p.map(this.row).join("")}`:""}
      </div>`;
  },
  row(c){ return `<div class="check ${c.state}"><div class="ci">${c.state==="pass"?"✓":(c.state==="fail"?"✕":"!")}</div>
    <div style="flex:1"><div class="ct">${c.title}</div>${c.desc?`<div class="cd">${c.desc}</div>`:""}</div>
    ${c.tab?`<div class="cgo"><button class="mini" onclick="go('${c.tab}')">open</button></div>`:""}</div>`; }
};

/* ============================================================
   EXPORT
   ============================================================ */
const Exporter = {
  mode:"dossier",
  set(m){ this.mode=m; this.render(); },
  render(){
    const modes=[["dossier","Couple dossier"],["cards","Lead cards"],["draft","Drafting prompt"],
      ["interview","Interview prompt"],["audit","Chapter audit"],["stress","Black-moment stress test"],["gaps","Fill-the-gaps prompt"]];
    document.querySelector('.view[data-view="export"]').innerHTML=`
      <div class="card">
        <h2>Export</h2>
        <p class="lead">Take it into the draft, into Claude, or into the story bible.</p>
        <div class="exptabs">${modes.map(m=>`<button class="exptab ${this.mode===m[0]?"on":""}" onclick="Exporter.set('${m[0]}')">${m[1]}</button>`).join("")}</div>
        <div class="row" style="margin:10px 0">
          <button class="btn primary" onclick="Exporter.copy()">Copy to clipboard</button>
          <button class="btn" onclick="Exporter.download()">Download .md</button>
          <button class="btn ghost" onclick="window.print()">Print / PDF</button>
        </div>
        <div class="advisor info">${this.blurb()}</div>
        <div class="outbox">${esc(this.build())}</div>
      </div>`;
  },
  blurb(){ return {
    dossier:"Both leads plus the relationship layer, as markdown. Drop it in the story bible or the top of the manuscript file.",
    cards:"The short version for each lead — print both and keep them beside you while drafting.",
    draft:"Paste into Claude before asking for a scene. Loads both leads so they behave like themselves.",
    interview:"Paste into Claude and ask questions — it answers as one or both leads, in voice.",
    audit:"Paste this plus a chapter you've written. Checks whether both leads are acting from their real motivation.",
    stress:"The one to run before you draft the third act. Attacks your black moment for coincidence, misunderstanding, and cheap grovels.",
    gaps:"Asks Claude for options for exactly the fields you've left blank."
  }[this.mode]; },
  build(){ return this[this.mode](); },

  PL(label,p,i){ const v=pv(p,i); return v&&String(v).trim()?`**${label}:** ${String(v).trim()}\n\n`:""; },
  RL(label,p){ const v=rv(p); return v&&String(v).trim()?`**${label}:** ${String(v).trim()}\n\n`:""; },
  head(){
    let s=`# ${nm(0)} & ${nm(1)}\n\n*`;
    if(S.book.title) s+=`${S.book.title}`; else s+=`Untitled`;
    if(S.book.series) s+=` (${S.book.series})`;
    s+=` · ${L().label} · heat ${S.book.heat} — ${HEAT[S.book.heat].n} · ${S.book.pov}`;
    if(S.book.penName) s+=` · ${S.book.penName}`;
    s+=`*\n\n`;
    if(rv("why.oneline")) s+=`> ${rv("why.oneline")}\n\n`;
    if(S.book.tropes.length) s+=`**Tropes:** ${S.book.tropes.join(" · ")}\n\n`;
    return s;
  },
  person(i){
    let s=`## ${nm(i)}\n\n`;
    s+=this.PL("What they do","identity.role",i)+this.PL("Age / stage","identity.age",i)+this.PL("Good at","identity.competence",i);
    s+=this.PL("What they're like to be with","identity.dateable",i)+this.PL("Said about them","identity.reputation",i);
    s+=this.PL("How they'd describe themselves","identity.selfImage",i)+this.PL("What contradicts that","identity.contradiction",i);
    s+=this.PL("Why the reader forgives them","identity.forgive",i)+this.PL("Needs to be seen as","identity.wantsToBeSeen",i);
    s+=`\n### Wound & love lie\n\n`;
    s+=this.PL("What happened","wound.ghost",i)+this.PL("Who they were before","wound.before",i)+this.PL("What loving someone cost them","wound.lastcost",i);
    s+=this.PL("THE LOVE LIE","wound.lovelie",i)+this.PL("Evidence life keeps handing them","wound.evidence",i)+this.PL("The truth","wound.truth",i);
    s+=this.PL("The guard","wound.guard",i)+this.PL("Guard tell","wound.guardtell",i)+this.PL("Already past the guard","wound.past",i)+this.PL("What gets past it","wound.breaks",i);
    s+=`\n### Want · need · why now\n\n`;
    s+=this.PL("External want","engine.want",i)+this.PL("Why this, why them","engine.wantWhy",i)+this.PL("How love makes it harder","engine.wantVsLove",i);
    s+=this.PL("Need","engine.need",i)+this.PL("Why they'd rather lose the relationship","engine.needResist",i)+this.PL("What they need but won't ask for","engine.ask",i);
    s+=this.PL("Why now","engine.whynow",i)+this.PL("Why not before","engine.whynotbefore",i)+this.PL("What makes them almost ready","engine.ready",i);
    s+=`\n### On the page\n\n`;
    s+=this.PL("Wanting, unadmitted","behavior.flirt",i)+this.PL("About touch","behavior.touch",i)+this.PL("Jealousy","behavior.jealous",i);
    s+=this.PL("How they fight","behavior.fight",i)+this.PL("How they apologise","behavior.apologise",i)+this.PL("Under pressure","behavior.pressure",i);
    s+=this.PL("Uses words to","behavior.speech",i)+this.PL("Would never say","behavior.neverSay",i)+this.PL("Costly kindness","behavior.kindness",i)+this.PL("Happy looks like","behavior.joy",i);
    return s;
  },
  dossier(){
    let s=this.head()+`---\n\n`;
    s+=this.person(0)+`\n---\n\n`+this.person(1)+`\n---\n\n`;
    s+=`## WHY THESE TWO\n\n`;
    [0,1].forEach(i=>{
      s+=`**${nm(i)}** — ${otherOf(i)} gives them: ${pv("pair.gives",i)||"—"}\n`;
      s+=`- Sees in them: ${pv("pair.sees",i)||"—"}\n`;
      s+=`- Is wrong about them: ${pv("pair.wrong",i)||"—"}\n`;
      s+=`- Changes what they want: ${pv("pair.changes",i)||"—"}\n\n`;
    });
    s+=this.RL("Chemistry","why.chemistry")+this.RL("Compatibility","why.compat")+this.RL("What they argue about","why.argue");
    s+=this.RL("What it's really about","why.realargue")+this.RL("How the wounds fit","why.mirror");
    s+=`\n## THE BARRIER\n\n`;
    [0,1].forEach(i=>{ s+=`**${nm(i)}'s internal barrier:** ${pv("pair.internal",i)||"—"}\n**What ${nm(i)} risks:** ${pv("pair.risk",i)||"—"}\n\n`; });
    s+=this.RL("External barrier","barrier.external")+this.RL("Enforced by","barrier.enforcer")+this.RL("Cost of being caught","barrier.cost")+this.RL("How it erodes","barrier.erodes");
    if(rv("barrier.convoFail")) s+=this.RL("Why one conversation can't fix it","barrier.convoWhy");
    s+=this.RL("Where they almost say it","barrier.almost");
    if(S.book.tropes.length){
      s+=`\n## TROPES, AND WHY\n\n`;
      S.book.tropes.forEach(t=>{ s+=`- **${t}** — ${S.book.tropeWhy[t]||"*not yet justified*"}\n`; });
      s+=`\n`;
    }
    s+=`\n## HEAT ${S.book.heat} — ${HEAT[S.book.heat].n.toUpperCase()}\n\n`;
    HEAT[S.book.heat].ladder.forEach((r,i)=>{ if((S.rel.ladder[i].note||"").trim()) s+=`${i+1}. **${r}** — ${S.rel.ladder[i].note.trim()}\n`; });
    s+=`\n`+this.RL("What each needs it to mean","ladderMeaning")+this.RL("What changes afterwards","ladderAfter")+this.RL("Power and consent","ladderPower");
    s+=`\n## THE JOURNEY\n\n`;
    S.rel.beats.forEach((b,i)=>{
      if(!(b.a||"").trim()&&!(b.b||"").trim()&&!(b.r||"").trim()) return;
      s+=`### ${i+1}. ${BEATS[i].t}\n`;
      if((b.a||"").trim()) s+=`- **${nm(0)}:** ${b.a.trim()}\n`;
      if((b.b||"").trim()) s+=`- **${nm(1)}:** ${b.b.trim()}\n`;
      if((b.r||"").trim()) s+=`- **Between them:** ${b.r.trim()}\n`;
      s+=`- *closeness ${b.close==null?IDEAL.close[i]:b.close} · guards ${b.gA==null?IDEAL.gA[i]:b.gA}/${b.gB==null?IDEAL.gB[i]:b.gB}*\n\n`;
    });
    s+=`\n## BLACK MOMENT & REPAIR\n\n`;
    s+=this.RL("What happens","black.moment")+this.RL("Whose lie wins","black.whose")+this.RL("Traced to the wound","black.trace");
    s+=this.RL("Foreshadowed in","black.foreshadow")+this.RL("Last thing said","black.said")+this.RL("What each believes the other thinks","black.believe");
    [0,1].forEach(i=>{
      s+=`**${nm(i)} finally admits:** ${pv("pair.faces",i)||"—"}\n**${nm(i)} gives up:** ${pv("pair.gives_up",i)||"—"}\n**${nm(i)}'s proof:** ${pv("pair.proof",i)||"—"}\n\n`;
    });
    s+=this.RL("Who reaches first","black.first")+this.RL("Witnessed by","black.witness")+this.RL("The HEA, proven","black.hea")+this.RL("Final image","black.epilogue");
    s+=`\n---\n\n*Pressure test: ${Diag.score()}/100 · built in Character Deep Dive: Romance*\n`;
    return s;
  },
  cards(){
    let s=this.head();
    [0,1].forEach(i=>{
      s+=`## ${nm(i)} — at the keyboard\n\n`;
      [["WANTS","engine.want"],["LOVE LIE","wound.lovelie"],["TRUTH","wound.truth"],["NEEDS","engine.need"],
       ["GUARD","wound.guard"],["GUARD TELL","wound.guardtell"],["WHAT GETS PAST IT","wound.breaks"],
       ["WON'T ASK FOR","engine.ask"],["WHEN THEY WANT SOMEONE","behavior.flirt"],["HOW THEY FIGHT","behavior.fight"],
       ["WOULD NEVER SAY","behavior.neverSay"]].forEach(r=>{
        const v=pv(r[1],i); if(v&&String(v).trim()) s+=`**${r[0]}** — ${String(v).trim()}\n\n`;
      });
      s+=`**GETS FROM ${nm(i?0:1).toUpperCase()}** — ${pv("pair.gives",i)||"—"}\n\n---\n\n`;
    });
    if(rv("why.oneline")) s+=`**WHY THESE TWO** — ${rv("why.oneline")}\n\n`;
    if(rv("barrier.external")) s+=`**BARRIER** — ${rv("barrier.external")}\n\n`;
    if(rv("black.moment")) s+=`**BLACK MOMENT** — ${rv("black.moment")}\n`;
    return s;
  },
  draft(){
    let s=`You're drafting a scene for ${S.book.title?`"${S.book.title}"`:"my romance"}${S.book.penName?` (pen name: ${S.book.penName})`:""} — ${L().label}, heat ${S.book.heat} (${HEAT[S.book.heat].n}: ${HEAT[S.book.heat].s}), ${S.book.pov}.\n\n`;
    s+=`Here is the full dossier for both leads. Read it before writing a word.\n\n---\n\n${this.dossier()}\n---\n\n## HOW TO USE THIS\n\n`;
    s+=`1. Both leads are pursuing something that isn't each other. Keep those goals live in the scene.\n`;
    s+=`2. Neither of them knows their own love lie and neither names it. The reader sees it through what they do instead.\n`;
    s+=`3. Use each guard tell when the lie is threatened. Don't explain the tell.\n`;
    s+=`4. They should each be wrong about the other in the specific way listed above — let that misreading shape their dialogue.\n`;
    s+=`5. Every intimate beat must change something. Heat ${S.book.heat} means: ${HEAT[S.book.heat].d}\n`;
    s+=`6. No summarising their psychology. Behaviour, dialogue, choice, and what they notice.\n`;
    s+=`7. Match the beat: tell me which of the 12 beats we're on, and write to the closeness and guard levels for it.\n\n`;
    s+=`Ask me what beat we're on and whose POV, then write the scene.\n`;
    return s;
  },
  interview(){
    let s=`Play these two characters. Stay in character — first person, in their voices. Never break, never analyse, never speak as an assistant.\n\n`;
    s+=this.cards()+`\n`;
    s+=`RULES:\n`;
    s+=`- Neither of them knows they believe a lie. When a question gets near it, they deflect, joke, get sharp, or go quiet — the way they actually would.\n`;
    s+=`- They may lie to me. They may refuse a question.\n`;
    s+=`- If I address one by name, only that one answers. If I ask them both, they can interrupt each other.\n`;
    s+=`- They do not agree about what's happening between them.\n\n`;
    s+=`Start with each of them telling me, separately, what they think the other one wants from them. Then I'll ask my questions.\n`;
    return s;
  },
  audit(){
    let s=`I'll paste a chapter. Audit it against this couple's motivation — don't rewrite unless I ask.\n\n---\n\n${this.cards()}\n---\n\n`;
    s+=`CHECK AND REPORT:\n\n`;
    s+=`1. **Goals** — what is each lead trying to get in this chapter, outside the relationship? Quote the line. If either has no visible goal, say so.\n`;
    s+=`2. **The lies** — is each one's love lie driving their behaviour here, and does that match where we are in the book?\n`;
    s+=`3. **Guards** — are they open earlier than they've earned? Flag any intimacy that outpaces the trust built so far.\n`;
    s+=`4. **The conversation problem** — is there anywhere the conflict would collapse if one of them simply said the true thing? If yes, quote the moment and tell me what's stopping them.\n`;
    s+=`5. **Two-sidedness** — is one lead doing all the wanting, changing, or apologising? Count.\n`;
    s+=`6. **Contradictions** — anything either does that contradicts the dossier. Quote it.\n`;
    s+=`7. **Heat consistency** — does the physical content match heat ${S.book.heat} (${HEAT[S.book.heat].n})?\n\n`;
    s+=`Be blunt, then give the three highest-leverage fixes in order.\n\nHere's the chapter:\n\n[PASTE CHAPTER HERE]\n`;
    return s;
  },
  stress(){
    let s=`Stress-test my third act before I draft it. Be adversarial — your job is to find the reasons a romance reader would throw this book.\n\n---\n\n${this.cards()}\n\n`;
    s+=`**BLACK MOMENT:** ${rv("black.moment")||"[not written yet]"}\n\n`;
    s+=`**Whose lie wins:** ${rv("black.whose")||"—"}\n**Traced to:** ${rv("black.trace")||"—"}\n**Foreshadowed in:** ${rv("black.foreshadow")||"—"}\n\n`;
    [0,1].forEach(i=>{ s+=`**${nm(i)} gives up:** ${pv("pair.gives_up",i)||"—"}\n**${nm(i)}'s proof:** ${pv("pair.proof",i)||"—"}\n\n`; });
    s+=`**HEA proven by:** ${rv("black.hea")||"—"}\n\n---\n\nATTACK IT ON THESE POINTS:\n\n`;
    s+=`1. **Misunderstanding test** — could this break be resolved by one character finishing one sentence? If yes, it's a fake black moment. Say so plainly.\n`;
    s+=`2. **Coincidence test** — does anything here happen TO them rather than BECAUSE of them? Name it.\n`;
    s+=`3. **Proportion test** — is the repair proportional to the harm? Small grovels after big harm are the most common reason readers call a hero unforgivable.\n`;
    s+=`4. **Both-sides test** — does only one of them change? If so, the other reads as a prize.\n`;
    s+=`5. **Foreshadowing test** — given only the first half of this dossier, could a reader have predicted this? If not, it'll read as out of character.\n`;
    s+=`6. **Forgivability** — is there anything here a reader won't forgive? Be specific about which line crosses it.\n\n`;
    s+=`Then give me two alternative black moments that come more directly from these two wounds.\n`;
    return s;
  },
  gaps(){
    const miss=[];
    Object.keys(PERSON).forEach(k=>PERSON[k].blocks.forEach(b=>b.fields.forEach(f=>{
      [0,1].forEach(i=>{ if(!ph(f.p,i)) miss.push(`- **${nm(i)} → ${PERSON[k].title.replace(/&amp;/g,"&")} → ${f.l.replace(/&amp;/g,"&")}** — ${f.hint||""}`); });
    })));
    Object.keys(COUPLE).forEach(k=>COUPLE[k].blocks.forEach(b=>{
      if(b.pair) b.fields.forEach(f=>[0,1].forEach(i=>{
        if(!ph("pair."+f.p,i)) miss.push(`- **${COUPLE[k].title.replace(/&amp;/g,"&")} → ${f.l.replace(/\{SELF\}/g,nm(i)).replace(/\{OTHER\}/g,nm(i?0:1))}**`); }));
      else b.fields.forEach(f=>{ if(f.t==="chk") return;
        if(!rh(f.p)) miss.push(`- **${COUPLE[k].title.replace(/&amp;/g,"&")} → ${f.l.replace(/&amp;/g,"&")}** — ${f.hint||""}`); });
    }));
    const eb=S.rel.beats.map((b,i)=>((b.a||"").trim()||(b.b||"").trim()||(b.r||"").trim())?null:`- **Beat ${i+1}: ${BEATS[i].t}** — ${BEATS[i].ask}`).filter(Boolean);
    let s=`Help me finish building this couple. Here's what I have:\n\n---\n\n${this.dossier()}\n---\n\n`;
    if(!miss.length&&!eb.length) return s+`Nothing's blank — so push back instead. Which three answers are the weakest or most generic, and most likely to produce a forgettable couple? Be specific and unkind.\n`;
    s+=`## STILL BLANK\n\n${miss.slice(0,60).join("\n")}\n${miss.length>60?`\n*(…and ${miss.length-60} more)*\n`:""}${eb.length?"\n"+eb.join("\n")+"\n":""}\n`;
    s+=`For each blank, propose **three** options consistent with everything above — specific to these two people and this ${L().label} setup, not generic romance. Number them so I can pick.\n\n`;
    s+=`Rules: no therapy-speak, no abstractions like "learns to trust". Concrete behaviour, objects, dates, and things people actually say. Keep it at heat ${S.book.heat}.\n\n`;
    s+=`Then tell me which single blank matters most, and why.\n`;
    return s;
  },
  copy(){ const t=this.build();
    if(navigator.clipboard) navigator.clipboard.writeText(t).then(()=>toast("Copied")).catch(()=>toast("Select the text and copy"));
    else toast("Select the text and copy"); },
  download(){ const t=this.build(), blob=new Blob([t],{type:"text/markdown"});
    const a=document.createElement("a"); a.href=URL.createObjectURL(blob);
    a.download=((nm(0)+"-"+nm(1)+"-"+this.mode).replace(/[^a-z0-9]+/gi,"-").toLowerCase())+".md"; a.click(); toast("Downloaded"); }
};
function otherOf(i){ return nm(i?0:1); }

/* ============================================================
   CHANGE HANDLING
   ============================================================ */
function afterChange(){ renderSpine(); paintDots(); Swap.paint(); }

document.addEventListener("input", e=>{
  const el=e.target, d=el.dataset||{};
  if(d.ppath!==undefined){ setPath(S.people[+d.idx], d.ppath, el.value); Store.save(); afterChange();
    if(d.ppath==="name"){ Swap.paint(); buildTabs(); document.querySelectorAll(".tab").forEach(x=>x.classList.toggle("active",x.dataset.tab===CURRENT)); } }
  else if(d.rpath!==undefined){ setPath(S.rel, d.rpath, el.value); Store.save(); afterChange(); }
  else if(d.bpath!==undefined){ S.book[d.bpath]=el.value; Store.save(); afterChange(); }
  else if(d.tpath!==undefined){ S.book.tropeWhy[d.tpath]=el.value; Store.save(); afterChange(); }
  else if(d.lpath!==undefined){ S.rel.ladder[+d.lpath].note=el.value; Store.save(); afterChange(); }
  else if(d.bt!==undefined){ const [i,k]=d.bt.split("."); S.rel.beats[+i][k]=el.value; Store.save(); afterChange(); }
});
document.addEventListener("change", e=>{
  const el=e.target, d=el.dataset||{};
  if(el.type==="checkbox" && d.rpath!==undefined){ setPath(S.rel,d.rpath,el.checked); Store.save(); afterChange(); return; }
  if(el.tagName==="SELECT" && d.rpath!==undefined){ setPath(S.rel,d.rpath,el.value); Store.save(); afterChange(); }
  if(el.tagName==="SELECT" && d.bpath!==undefined){
    S.book[d.bpath]=el.value; Store.save();
    if(d.bpath==="lane"){ Book.render(); toast(LANES[el.value].label+" playbook loaded"); }
    afterChange();
  }
});

/* ============================================================
   BOOT
   ============================================================ */
function boot(){ buildTabs(); Swap.paint(); renderSpine(); paintDots(); go(CURRENT||"book"); }
Store.load();
boot();
</script>
