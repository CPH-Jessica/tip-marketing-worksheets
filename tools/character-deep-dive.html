<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Character Deep Dive — Motivation &amp; Journey Engine for Fantasy &amp; Sci-Fi</title>
<style>
/* ============================================================
   CHARACTER DEEP DIVE
   Single-file, offline, localStorage.
   Who they are · why they're here NOW · the journey the story
   puts them through. Built for speculative fiction.
   ============================================================ */
:root{
  --bg:#0a0e1a; --bg2:#111828; --panel:#151c30; --panel2:#1c2540;
  --ink:#e9edff; --ink-dim:#98a2c4; --line:#2b3557;
  --accent:#5ee0d0; --accent2:#7b6cff; --accent3:#ff8fb1; --accent4:#ffc861;
  --good:#54d6a0; --warn:#ffc861; --bad:#ff7a8a;
  --chip:#232c4b; --radius:14px; --shadow:0 10px 34px rgba(0,0,0,.42);
  --maxw:1200px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  font-family:"Segoe UI",system-ui,-apple-system,Roboto,Helvetica,Arial,sans-serif;
  background:
    radial-gradient(1100px 620px at 78% -12%, rgba(123,108,255,.20), transparent 62%),
    radial-gradient(900px 520px at 8% 4%, rgba(94,224,208,.11), transparent 60%),
    linear-gradient(170deg,var(--bg),#070a14 65%);
  background-attachment:fixed;
  color:var(--ink); line-height:1.5; min-height:100vh;
}
a{color:var(--accent)}
button{font-family:inherit}
.wrap{max-width:var(--maxw);margin:0 auto;padding:0 18px 110px}
::-webkit-scrollbar{width:11px;height:11px}
::-webkit-scrollbar-thumb{background:#28304f;border-radius:8px}
::-webkit-scrollbar-track{background:transparent}

/* ---------- header ---------- */
header.top{position:sticky;top:0;z-index:60;background:rgba(10,14,26,.93);backdrop-filter:blur(9px);border-bottom:1px solid var(--line)}
.top-inner{max-width:var(--maxw);margin:0 auto;padding:11px 18px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:11px;min-width:0}
.brand .glyph{font-size:25px;filter:drop-shadow(0 2px 8px rgba(94,224,208,.55))}
.brand h1{font-size:18px;margin:0;letter-spacing:.3px;white-space:nowrap}
.brand .sub{font-size:11.5px;color:var(--ink-dim);margin-top:-2px}
.top-actions{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.who{display:flex;align-items:center;gap:8px;background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:4px 6px 4px 11px}
.who .lbl{font-size:11px;color:var(--ink-dim);text-transform:uppercase;letter-spacing:.6px}
.who select{background:transparent;border:none;color:var(--ink);font-size:13px;font-weight:700;max-width:190px;padding:4px 2px}
.who select:focus{outline:none}
.btn{border:1px solid var(--line);background:var(--panel2);color:var(--ink);padding:8px 13px;border-radius:10px;cursor:pointer;font-size:13px;font-weight:600;transition:.15s;display:inline-flex;align-items:center;gap:6px}
.btn:hover{border-color:var(--accent);background:var(--panel)}
.btn.primary{background:linear-gradient(120deg,var(--accent2),var(--accent));border:none;color:#0a0e1a}
.btn.primary:hover{filter:brightness(1.09)}
.btn.ghost{background:transparent}
.btn.sm{padding:5px 10px;font-size:12px;border-radius:9px}
.btn.danger:hover{border-color:var(--bad);color:var(--bad)}

/* ---------- tabs ---------- */
nav.tabs{max-width:var(--maxw);margin:0 auto;padding:6px 12px 0;display:flex;gap:3px;flex-wrap:wrap}
.tab{border:1px solid transparent;background:transparent;color:var(--ink-dim);padding:9px 12px;border-radius:10px 10px 0 0;cursor:pointer;font-size:12.5px;font-weight:600;white-space:nowrap}
.tab:hover{color:var(--ink);background:var(--panel)}
.tab.active{color:#fff;background:var(--panel);border-color:var(--line);border-bottom-color:var(--panel)}
.tab .num{display:inline-block;min-width:16px;text-align:center;opacity:.55;margin-right:3px;font-size:11px}
.tab .dot{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--line);margin-left:6px;vertical-align:middle}
.tab .dot.on{background:var(--good);box-shadow:0 0 8px rgba(84,214,160,.7)}
.tab .dot.part{background:var(--warn)}

/* ---------- spine ---------- */
.spine{max-width:var(--maxw);margin:0 auto;padding:12px 18px 4px}
.spine-inner{display:flex;align-items:stretch;gap:0;background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.snode{flex:1;min-width:0;padding:9px 11px;border-right:1px solid var(--line);cursor:pointer;transition:.15s;position:relative}
.snode:last-child{border-right:none}
.snode:hover{background:var(--panel2)}
.snode .sk{font-size:10px;letter-spacing:.9px;text-transform:uppercase;color:var(--ink-dim);display:flex;align-items:center;gap:5px}
.snode .sk i{width:7px;height:7px;border-radius:50%;background:var(--line);display:inline-block;font-style:normal}
.snode.on .sk i{background:var(--accent);box-shadow:0 0 8px rgba(94,224,208,.8)}
.snode .sv{font-size:12px;margin-top:3px;color:var(--ink-dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.snode.on .sv{color:var(--ink)}
@media(max-width:820px){.spine-inner{flex-wrap:wrap}.snode{flex:1 1 33%;border-bottom:1px solid var(--line)}}

/* ---------- panels ---------- */
.view{display:none;animation:fade .22s}
.view.active{display:block}
@keyframes fade{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:20px 22px;margin:16px 0;box-shadow:var(--shadow)}
.card h2{margin:0 0 4px;font-size:20px;letter-spacing:.2px}
.card h3{margin:24px 0 6px;font-size:14px;color:var(--accent);letter-spacing:.4px;text-transform:uppercase}
.card h3:first-of-type{margin-top:14px}
.lead{color:var(--ink-dim);font-size:13.5px;margin:0 0 8px}
.section-intro{font-size:13px;color:var(--ink-dim);background:var(--bg2);border-left:3px solid var(--accent2);padding:11px 14px;border-radius:0 10px 10px 0;margin:8px 0 16px}
.section-intro b{color:var(--ink)}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:1fr 1fr}
.g3{grid-template-columns:1fr 1fr 1fr}
@media(max-width:800px){.g2,.g3{grid-template-columns:1fr}}

/* ---------- fields ---------- */
label.f{display:block;margin:12px 0}
label.f .lab{display:flex;align-items:center;gap:7px;font-size:12.5px;font-weight:700;margin-bottom:5px;color:var(--ink);flex-wrap:wrap}
label.f .hint{display:block;font-weight:400;color:var(--ink-dim);font-size:11.5px;margin-bottom:5px;line-height:1.4}
input[type=text],input[type=number],select,textarea{width:100%;background:var(--bg2);border:1px solid var(--line);color:var(--ink);border-radius:10px;padding:9px 11px;font-size:13.5px;font-family:inherit}
textarea{resize:vertical;min-height:62px;line-height:1.5}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px rgba(94,224,208,.11)}
select{cursor:pointer}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end}
.tools{display:inline-flex;gap:5px;margin-left:auto}
.mini{border:1px solid var(--line);background:var(--bg2);color:var(--ink-dim);border-radius:7px;padding:2px 8px;font-size:11px;cursor:pointer;font-weight:600}
.mini:hover{color:var(--ink);border-color:var(--accent)}
.mini.seed:hover{border-color:var(--accent4);color:var(--accent4)}
.probe{background:rgba(123,108,255,.10);border:1px solid rgba(123,108,255,.42);border-radius:10px;padding:10px 12px;margin:7px 0 0;font-size:12.5px;display:none}
.probe.open{display:block;animation:fade .18s}
.probe .pq{color:var(--ink);margin:0 0 6px}
.probe .pq:before{content:"↳ ";color:var(--accent2);font-weight:700}
.probe .pnav{display:flex;gap:6px;align-items:center;margin-top:6px}
.probe .pnum{font-size:11px;color:var(--ink-dim);margin-left:auto}
.seedbox{background:var(--bg2);border:1px dashed var(--line);border-radius:10px;padding:9px 11px;margin:7px 0 0;font-size:12.5px;display:none}
.seedbox.open{display:block}
.seedbox .sd{padding:6px 9px;border-radius:8px;cursor:pointer;color:var(--ink-dim);border:1px solid transparent}
.seedbox .sd:hover{background:var(--panel2);color:var(--ink);border-color:var(--line)}
.seedbox .sdh{font-size:11px;text-transform:uppercase;letter-spacing:.7px;color:var(--accent4);margin-bottom:4px}

/* ---------- chips ---------- */
.chip{display:inline-flex;align-items:center;gap:5px;background:var(--chip);border:1px solid var(--line);color:var(--ink);border-radius:999px;padding:5px 11px;font-size:12.5px;cursor:pointer;transition:.12s;user-select:none}
.chip:hover{border-color:var(--accent)}
.chip.on{background:linear-gradient(120deg,var(--accent2),var(--accent));border-color:transparent;color:#0a0e1a;font-weight:700}
.chips{display:flex;flex-wrap:wrap;gap:7px;margin:6px 0}

/* ---------- callouts ---------- */
.advisor{border-radius:12px;padding:11px 14px;font-size:13px;margin:10px 0;border:1px solid var(--line);line-height:1.5}
.advisor.good{background:rgba(84,214,160,.10);border-color:rgba(84,214,160,.42)}
.advisor.warn{background:rgba(255,200,97,.10);border-color:rgba(255,200,97,.42)}
.advisor.bad{background:rgba(255,122,138,.10);border-color:rgba(255,122,138,.42)}
.advisor.info{background:rgba(123,108,255,.10);border-color:rgba(123,108,255,.42)}
.advisor b{color:var(--ink)}
.pill{display:inline-block;border-radius:999px;padding:2px 9px;font-size:11px;font-weight:700;margin-left:6px}
.pill.good{background:rgba(84,214,160,.2);color:var(--good)}
.pill.warn{background:rgba(255,200,97,.2);color:var(--warn)}
.pill.bad{background:rgba(255,122,138,.2);color:var(--bad)}
.pill.dim{background:var(--chip);color:var(--ink-dim)}

/* ---------- roster ---------- */
.roster{display:grid;grid-template-columns:repeat(auto-fill,minmax(235px,1fr));gap:12px;margin:12px 0}
.rc{background:var(--bg2);border:1px solid var(--line);border-radius:12px;padding:13px 14px;cursor:pointer;transition:.15s;position:relative}
.rc:hover{border-color:var(--accent);transform:translateY(-2px)}
.rc.active{border-color:var(--accent);box-shadow:0 0 0 2px rgba(94,224,208,.22)}
.rc .rn{font-size:15px;font-weight:700;margin-bottom:2px;padding-right:22px}
.rc .rr{font-size:11px;text-transform:uppercase;letter-spacing:.8px;color:var(--accent2);font-weight:700}
.rc .rw{font-size:12px;color:var(--ink-dim);margin-top:7px;line-height:1.45;min-height:34px}
.rc .rbar{height:5px;border-radius:4px;background:var(--panel2);margin-top:9px;overflow:hidden}
.rc .rbar i{display:block;height:100%;background:linear-gradient(90deg,var(--accent2),var(--accent))}
.rc .rdel{position:absolute;top:9px;right:9px;background:transparent;border:none;color:var(--ink-dim);cursor:pointer;font-size:15px;line-height:1;padding:2px 4px;border-radius:6px}
.rc .rdel:hover{color:var(--bad);background:rgba(255,122,138,.12)}
.rc.add{display:flex;align-items:center;justify-content:center;border-style:dashed;color:var(--ink-dim);font-weight:700;min-height:118px}
.rc.add:hover{color:var(--accent)}

/* ---------- ladder ---------- */
.ladder{margin:10px 0}
.rung{display:flex;gap:11px;align-items:flex-start;background:var(--bg2);border:1px solid var(--line);border-radius:11px;padding:11px 13px;margin:8px 0}
.rung .rl{min-width:112px}
.rung .rl b{display:block;font-size:12.5px}
.rung .rl span{font-size:11px;color:var(--ink-dim)}
.rung textarea{min-height:44px}
.rung .rnum{width:26px;height:26px;border-radius:8px;background:var(--panel2);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:var(--accent);flex:none;margin-top:2px}
@media(max-width:700px){.rung{flex-wrap:wrap}.rung .rl{min-width:0;flex:1}}

/* ---------- beats ---------- */
.beat{background:var(--bg2);border:1px solid var(--line);border-radius:12px;padding:13px 15px;margin:10px 0}
.beat.pivot{border-color:rgba(123,108,255,.55);background:linear-gradient(180deg,rgba(123,108,255,.07),var(--bg2))}
.beat .bh{display:flex;align-items:center;gap:9px;flex-wrap:wrap}
.beat .bn{width:27px;height:27px;border-radius:9px;background:var(--panel2);display:flex;align-items:center;justify-content:center;font-size:12.5px;font-weight:700;color:var(--accent);flex:none}
.beat.pivot .bn{background:linear-gradient(120deg,var(--accent2),var(--accent));color:#0a0e1a}
.beat .bt{font-size:14px;font-weight:700}
.beat .bask{font-size:12px;color:var(--ink-dim);margin:6px 0 8px;line-height:1.45}
.beat .bmode{display:flex;gap:5px;margin-left:auto}
.beat .bmode button{border:1px solid var(--line);background:var(--bg2);color:var(--ink-dim);border-radius:8px;padding:3px 10px;font-size:11px;cursor:pointer;font-weight:700}
.beat .bmode button.on{background:var(--accent2);border-color:transparent;color:#fff}
.beat .bmode button.on.act{background:var(--good);color:#0a0e1a}
.gripwrap{display:flex;align-items:center;gap:10px;margin-top:9px}
.gripwrap .gl{font-size:11px;color:var(--ink-dim);white-space:nowrap}
input[type=range]{-webkit-appearance:none;appearance:none;height:5px;border-radius:4px;background:var(--panel2);flex:1;cursor:pointer}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:15px;height:15px;border-radius:50%;background:var(--accent);border:2px solid var(--panel);cursor:pointer}
.gripval{font-size:11.5px;font-weight:700;color:var(--accent);min-width:34px;text-align:right}

/* ---------- chart ---------- */
.chartbox{background:var(--bg2);border:1px solid var(--line);border-radius:12px;padding:14px;margin:12px 0}
.chartbox svg{width:100%;height:auto;display:block}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:11.5px;color:var(--ink-dim);margin-top:8px}
.legend i{display:inline-block;width:16px;height:3px;border-radius:2px;vertical-align:middle;margin-right:5px}

/* ---------- diagnostics ---------- */
.score{display:flex;align-items:center;gap:18px;flex-wrap:wrap;background:var(--bg2);border:1px solid var(--line);border-radius:12px;padding:16px 18px}
.score .big{font-size:44px;font-weight:800;line-height:1;letter-spacing:-1px}
.score .lbl{font-size:12px;color:var(--ink-dim);text-transform:uppercase;letter-spacing:.9px}
.meter{flex:1;min-width:180px}
.meter .bar{height:9px;background:var(--panel2);border-radius:6px;overflow:hidden}
.meter .bar i{display:block;height:100%;transition:width .4s}
.check{display:flex;gap:11px;align-items:flex-start;background:var(--bg2);border:1px solid var(--line);border-radius:11px;padding:11px 13px;margin:8px 0}
.check .ci{font-size:16px;line-height:1.2;flex:none;width:22px;text-align:center}
.check.pass{border-color:rgba(84,214,160,.35)}
.check.fail{border-color:rgba(255,122,138,.35)}
.check.soft{border-color:rgba(255,200,97,.35)}
.check .ct{font-size:13.5px;font-weight:700;margin-bottom:2px}
.check .cd{font-size:12.5px;color:var(--ink-dim);line-height:1.5}
.check .cgo{margin-left:auto;flex:none}

/* ---------- ensemble ---------- */
.matrix{width:100%;border-collapse:collapse;font-size:12.5px;margin:10px 0}
.matrix th,.matrix td{border:1px solid var(--line);padding:8px 10px;text-align:left;vertical-align:top}
.matrix th{background:var(--panel2);font-size:11px;text-transform:uppercase;letter-spacing:.6px;color:var(--ink-dim)}
.matrix td b{color:var(--ink)}
.tblwrap{overflow-x:auto}

/* ---------- export ---------- */
.outbox{background:#080b14;border:1px solid var(--line);border-radius:12px;padding:14px 16px;font-family:ui-monospace,"Cascadia Code",Consolas,monospace;font-size:12px;white-space:pre-wrap;max-height:520px;overflow:auto;line-height:1.55;color:#d7ddf5}
.exptabs{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0}
.exptab{border:1px solid var(--line);background:var(--bg2);color:var(--ink-dim);border-radius:9px;padding:7px 12px;font-size:12.5px;cursor:pointer;font-weight:600}
.exptab.on{background:var(--panel2);color:var(--ink);border-color:var(--accent)}

/* ---------- misc ---------- */
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(80px);background:var(--panel2);border:1px solid var(--accent);color:var(--ink);padding:11px 20px;border-radius:11px;font-size:13px;font-weight:600;z-index:200;opacity:0;transition:.28s;box-shadow:var(--shadow)}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.empty{color:var(--ink-dim);font-style:italic;font-size:13px;padding:18px;text-align:center}
footer.foot{max-width:var(--maxw);margin:0 auto;padding:14px 18px 40px;color:var(--ink-dim);font-size:11.5px;display:flex;gap:14px;flex-wrap:wrap;align-items:center}
.kbd{background:var(--chip);border:1px solid var(--line);border-radius:5px;padding:1px 6px;font-size:11px}
.chk{display:flex;gap:9px;align-items:flex-start;background:var(--bg2);border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin:8px 0;cursor:pointer}
.chk input{margin-top:3px;accent-color:var(--accent);flex:none}
.chk .ck{font-size:13px;font-weight:600}
.chk .cs{font-size:11.5px;color:var(--ink-dim);line-height:1.45;margin-top:2px}
@media print{header.top,nav.tabs,.spine,.top-actions,footer.foot{display:none}body{background:#fff;color:#111}.card{box-shadow:none;border-color:#ccc;background:#fff}}
</style>
</head>
<body>

<header class="top">
  <div class="top-inner">
    <div class="brand">
      <span class="glyph">🜂</span>
      <div>
        <h1>Character Deep Dive</h1>
        <div class="sub">Motivation &amp; journey engine — fantasy · sci-fi · speculative</div>
      </div>
    </div>
    <div class="top-actions">
      <div class="who">
        <span class="lbl">Working on</span>
        <select id="charSelect" onchange="Roster.select(this.value)"></select>
      </div>
      <button class="btn sm" onclick="Roster.add()">+ Character</button>
      <button class="btn sm ghost" onclick="Store.exportJSON()">Save file</button>
      <button class="btn sm ghost" onclick="Store.importFile()">Load</button>
      <input type="file" id="fileInput" accept=".json" style="display:none">
    </div>
  </div>
  <nav class="tabs" id="tabs"></nav>
</header>

<div class="spine" id="spine"></div>

<div class="wrap">
  <div class="view" data-view="book"></div>
  <div class="view" data-view="identity"></div>
  <div class="view" data-view="world"></div>
  <div class="view" data-view="wound"></div>
  <div class="view" data-view="engine"></div>
  <div class="view" data-view="fear"></div>
  <div class="view" data-view="opposition"></div>
  <div class="view" data-view="journey"></div>
  <div class="view" data-view="behavior"></div>
  <div class="view" data-view="ensemble"></div>
  <div class="view" data-view="diagnostics"></div>
  <div class="view" data-view="export"></div>
</div>

<footer class="foot">
  <span>Everything saves in this browser automatically.</span>
  <span>Use <b>Save file</b> for a backup you can move between computers.</span>
  <span style="margin-left:auto"><button class="btn sm danger ghost" onclick="Store.reset()">Start over</button></span>
</footer>

<div class="toast" id="toast"></div>

<script>
/* ============================================================
   CONFIG
   ============================================================ */
const CONFIG = { storageKey:"tip-character-deep-dive-v1", version:1 };

/* ============================================================
   GENRE PLAYBOOKS
   Each genre knows: what usually drives motivation, what the
   world can do to a person, and the trap writers fall into.
   ============================================================ */
const GENRES = {
epic:{label:"Epic Fantasy", flavor:"magic",
  driver:"A private life crushed under a public fate",
  pressures:[
    "The prophecy names them and they never agreed to it",
    "Their bloodline owes a debt they didn't take on",
    "The realm's survival requires the one thing that would unmake them",
    "Power here is inherited, and theirs skipped a generation"],
  wounds:[
    "They watched their village burn on the orders of the side they were raised to serve",
    "They were trained for a role their whole life, then passed over for someone younger",
    "They survived the rite that killed everyone else in the circle, and no one will say why"],
  lies:[
    "If I am useful enough, they can't cast me out",
    "Wanting things for myself is what got people killed",
    "Only power keeps the people I love alive"],
  wants:[
    "Take back the seat, name, or land that was stolen",
    "Get their sibling out of the capital before the war arrives",
    "Finish what their mentor started, and prove the choice was right"],
  warn:"Epic fantasy hides passive protagonists behind enormous stakes. <b>Saving the world is a setting, not a motivation.</b> What does THIS person gain or lose that nobody else in the army would?",
  arcs:["positive","flat","disillusion"]},

grimdark:{label:"Dark Fantasy / Grimdark", flavor:"empire",
  driver:"Survival, debt, and the cost of staying human",
  pressures:[
    "Mercy is priced here, and they can't afford it",
    "The institution that ruined them is also the only thing feeding them",
    "Everyone above them is protected; everyone below them is disposable",
    "The magic/faith that could save them requires a body that isn't theirs"],
  wounds:[
    "They did the terrible thing themselves, and were praised for it",
    "They were sold, conscripted, or indentured by someone who loved them",
    "They begged for help from a power that answered, and sent the bill"],
  lies:[
    "Nobody is coming. Wanting them to come is how you die",
    "I am already damned, so the next sin is free",
    "Kindness is a debt somebody eventually collects"],
  wants:[
    "Pay off the debt and get out clean",
    "Kill the person who gave the order — not the one who carried it out",

"wound.truth":["Say it plainly. If it sounds like a fortune cookie, it isn't specific enough yet.","Why can't they simply be told it? Who has already tried?","What does accepting it require them to admit they got wrong?"],
"engine.want":["Could a camera film them getting it? If not, it's a need, not a want.","How would the reader know they'd achieved it — what's the image?","Who else wants the same thing, and what happens when they collide?"],
"engine.wantWhy":["Why must THEY be the one? Why not delegate, hire, or ask?","What does getting it fix inside them that they'd never say out loud?","If someone handed it to them tomorrow, would it still count? Why not?"],
"engine.need":["Finish the sentence: 'They will not be free until they accept that...'","Who in the cast already knows this about them?","Why is this the last thing they'd choose voluntarily?"],
"engine.whyNow":["Why is today the first day the old strategy fails?","What deadline, season, or arrival makes waiting impossible?","Who or what forces the first move — and can they refuse it?"],
"engine.doNothing":["Be specific: who suffers, by when, and how would your character learn about it?","Is walking away actually available to them? If yes, why don't they?","What would they lose in their own eyes if they let it go?"],
"fear.deep":["What sentence about themselves would end them if it turned out to be true?","When did they most recently feel it, in a small ordinary moment?","Who has come closest to saying it out loud to them?"],
"fear.avoid":["What place, person, or date do they route around?","What do they say instead of 'no' when it comes up?","What have they given up to keep avoiding it, and was it worth it?"],
"opposition.mirror":["What sentence could both of them sign?","Where is the antagonist objectively right?","What did the antagonist survive that your character hasn't had to yet?"],
"opposition.temptation":["Who offers it, and why do they seem trustworthy?","What's genuinely good about taking the deal?","What exactly would it cost — name the person who pays."],
"behavior.tell":["Make it physical and repeatable, so the reader learns it before they do.","Who in the cast has noticed and uses it?","What do they do to hide the tell?"],
"behavior.neverSay":["Write the exact sentence they'd never say.","Who is the one person they might say it to, and in what circumstances?","Where in the book does the reader nearly hear it?"]
};

const LADDER_RUNGS = [
  {n:"Comfort",  s:"Money, sleep, the quiet life"},
  {n:"Standing", s:"Reputation, rank, how they're seen"},
  {n:"Safety",   s:"Their body, their freedom, their life"},
  {n:"Love",     s:"The person they'd protect first"},
  {n:"Self",     s:"The story they tell about who they are"}
];

const uid = () => "c"+Math.random().toString(36).slice(2,9);

const NEWCHAR = (name,role) => ({
  id:uid(), name:name||"", role:role||"Protagonist",
  identity:{}, world:{}, wound:{}, engine:{}, opposition:{}, behavior:{},
  fear:{ ladder:LADDER_RUNGS.map(()=>({give:""})) },
  arc:{ type:"positive", beats:Array.from({length:9},()=>({believe:"",act:"",mode:"",grip:null})) }
});

const DEFAULT = () => ({
  book:{ title:"", series:"", penName:"", genre:"epic", premise:"", worldRules:"", threat:"", promise:"" },
  chars:[ NEWCHAR("","Protagonist") ],
  activeId:null,
  meta:{ v:CONFIG.version }
});

let S = DEFAULT();
S.activeId = S.chars[0].id;

function C(){ return S.chars.find(c=>c.id===S.activeId) || S.chars[0]; }
function G(){ return GENRES[S.book.genre] || GENRES.epic; }

/* ---------- persistence ---------- */
const Store = {
  save(){ try{ localStorage.setItem(CONFIG.storageKey, JSON.stringify(S)); }catch(e){} },
  load(){
    try{
      const r = localStorage.getItem(CONFIG.storageKey);
      if(!r) return;
      const p = JSON.parse(r);
      S = Object.assign(DEFAULT(), p);
      if(!Array.isArray(S.chars) || !S.chars.length) S.chars=[NEWCHAR("","Protagonist")];
      S.chars = S.chars.map(c=>{
        const base = NEWCHAR(c.name, c.role);
        const m = Object.assign(base, c);
        if(!Array.isArray(m.fear.ladder) || m.fear.ladder.length!==5) m.fear.ladder = LADDER_RUNGS.map(()=>({give:""}));
        if(!m.arc || !Array.isArray(m.arc.beats) || m.arc.beats.length!==9)
          m.arc = {type:(m.arc&&m.arc.type)||"positive", beats:Array.from({length:9},()=>({believe:"",act:"",mode:"",grip:null}))};
        return m;
      });
      if(!S.chars.some(c=>c.id===S.activeId)) S.activeId = S.chars[0].id;
    }catch(e){}
  },
  reset(){
    if(!confirm("Clear everything and start a brand-new story? Save a file first if you want to keep this.")) return;
    S = DEFAULT(); S.activeId = S.chars[0].id; Store.save(); boot(); toast("Cleared — fresh start");
  },
  exportJSON(){
    const blob = new Blob([JSON.stringify(S,null,2)],{type:"application/json"});
    const a = document.createElement("a"); a.href = URL.createObjectURL(blob);
    a.download = (S.book.title||"character-deep-dive").replace(/[^a-z0-9]+/gi,"-").toLowerCase()+"-deep-dive.json";
    a.click(); toast("Saved a backup file");
  },
  importFile(){ document.getElementById("fileInput").click(); }
};

document.getElementById("fileInput").addEventListener("change",function(e){
  const f = e.target.files[0]; if(!f) return;
  const r = new FileReader();
  r.onload = () => {
    try{
      const p = JSON.parse(r.result);
      localStorage.setItem(CONFIG.storageKey, JSON.stringify(p));
      Store.load(); Store.save(); boot(); toast("Loaded");
    }catch(err){ toast("Couldn't read that file"); }
  };
  r.readAsText(f); e.target.value="";
});

/* ---------- path helpers ---------- */
function getPath(o,p){ return p.split(".").reduce((a,k)=> (a&&a[k]!==undefined&&a[k]!==null)?a[k]:undefined, o); }
function setPath(o,p,v){
  const k=p.split("."); let c=o;
  for(let i=0;i<k.length-1;i++){ if(typeof c[k[i]]!=="object"||c[k[i]]===null) c[k[i]]={}; c=c[k[i]]; }
  c[k[k.length-1]]=v;
}
function val(p){ const v=getPath(C(),p); return v===undefined?"":v; }
function has(p){ const v=getPath(C(),p); return typeof v==="string" ? v.trim().length>2 : !!v; }

/* ============================================================
   TOAST
   ============================================================ */
let toastT;
function toast(m){
  const t=document.getElementById("toast"); t.textContent=m; t.classList.add("show");
  clearTimeout(toastT); toastT=setTimeout(()=>t.classList.remove("show"),2100);
}
function esc(s){ return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }

  ["book","Story"],["identity","Who They Are"],["world","World Pressure"],["wound","Wound &amp; Lie"],
  ["engine","Want · Need · Now"],["fear","Fear &amp; Cost"],["opposition","Opposition"],
  ["journey","The Journey"],["behavior","On the Page"],["ensemble","Cast"],
  ["diagnostics","Pressure Test"],["export","Export"]
];
let CURRENT = "book";

function buildTabs(){
  document.getElementById("tabs").innerHTML = TABS.map((t,i)=>
    `<button class="tab" data-tab="${t[0]}" onclick="go('${t[0]}')"><span class="num">${i+1}</span>${t[1]}<span class="dot" data-dot="${t[0]}"></span></button>`
  ).join("");

function go(v){
  CURRENT = v;
  renderView(v);
  document.querySelectorAll(".view").forEach(x=>x.classList.toggle("active", x.dataset.view===v));
  document.querySelectorAll(".tab").forEach(x=>x.classList.toggle("active", x.dataset.tab===v));
  window.scrollTo({top:0,behavior:"smooth"});
}

function renderView(v){
  if(SECTIONS[v]) return Section.render(v);
  if(v==="book") return Book.render();
  if(v==="journey") return Journey.render();
  if(v==="ensemble") return Ensemble.render();
  if(v==="diagnostics") return Diag.render();
  if(v==="export") return Exporter.render();
}

/* ============================================================
   COMPLETION
   ============================================================ */
function sectionFields(key){
  const s = SECTIONS[key]; if(!s) return [];
  return s.blocks.flatMap(b=>b.fields).filter(f=>f.t!=="chk");
}
function sectionPct(key){
  const f = sectionFields(key); if(!f.length) return 0;
  const n = f.filter(x=>has(x.p)).length;
  return Math.round(n/f.length*100);
}
function journeyPct(){
  const b=C().arc.beats, n=b.filter(x=>(x.believe||"").trim()||(x.act||"").trim()).length;
  return Math.round(n/9*100);
}
function bookPct(){
  const ks=["title","genre","premise","worldRules","threat"];
  return Math.round(ks.filter(k=>(S.book[k]||"").trim().length>2).length/ks.length*100);
}
function charPct(c){
  const prev=S.activeId; S.activeId=c.id;
  const keys=Object.keys(SECTIONS);
  const p = Math.round((keys.reduce((a,k)=>a+sectionPct(k),0)+journeyPct())/(keys.length+1));
  S.activeId=prev; return p;
}
function tabPct(k){
  if(k==="book") return bookPct();
  if(k==="journey") return journeyPct();
  if(SECTIONS[k]) return sectionPct(k);
  if(k==="diagnostics") return Diag.score();
  return -1;
}
function paintDots(){
  document.querySelectorAll("[data-dot]").forEach(d=>{
    const p = tabPct(d.dataset.dot);
    d.className = "dot" + (p>=85?" on":(p>=25?" part":""));
  });
}

];
function spineVal(p){
  if(p==="__choice"){ const b=C().arc.beats[7]; return (b.act||b.believe||""); }
  return val(p);
}
function renderSpine(){
  document.getElementById("spine").innerHTML =
   `<div class="spine-inner">`+SPINE.map(s=>{
      const v = String(spineVal(s.p)||"").trim();
      const on = v.length>2;
      return `<div class="snode ${on?"on":""}" onclick="go('${s.tab}')" title="${esc(v)}">
        <div class="sk"><i></i>${s.k}</div>
        <div class="sv">${on?esc(v.length>62?v.slice(0,60)+"…":v):"—"}</div></div>`;
   }).join("")+`</div>`;
}

/* ============================================================
   FIELD RENDERER
   ============================================================ */
function fid(p){ return "f_"+p.replace(/[^a-z0-9]/gi,"_"); }

function fieldHTML(f){
  const id = fid(f.p), v = val(f.p);
  const tools = [];
  if(f.probe && PROBES[f.p]) tools.push(`<button type="button" class="mini" onclick="Probe.toggle('${f.p}')">dig deeper</button>`);
  if(f.seed) tools.push(`<button type="button" class="mini seed" onclick="Seeds.toggle('${f.p}','${f.seed}')">seeds</button>`);
  const toolbar = tools.length?`<span class="tools">${tools.join("")}</span>`:"";

  let input="";
  if(f.t==="txt")  input = `<input type="text" id="${id}" data-cpath="${f.p}" value="${esc(v)}">`;
  else if(f.t==="sel") input = `<select id="${id}" data-cpath="${f.p}">${(f.opts||[]).map(o=>`<option ${o===v?"selected":""}>${esc(o)}</option>`).join("")}</select>`;
  else if(f.t==="chk") return `<label class="chk"><input type="checkbox" data-cpath="${f.p}" ${v?"checked":""}>
      <span><span class="ck">${f.l}</span><span class="cs">${f.hint||""}</span></span></label>`;
  else if(f.t==="woundpick") return woundPickHTML(f);
  else input = `<textarea id="${id}" data-cpath="${f.p}" style="min-height:${f.big?110:62}px">${esc(v)}</textarea>`;

  return `<label class="f">
    <span class="lab">${f.l}${toolbar}</span>
    ${f.hint?`<span class="hint">${f.hint}</span>`:""}
    ${input}
    <div class="probe" id="pb_${fid(f.p)}"></div>
    <div class="seedbox" id="sb_${fid(f.p)}"></div>
  </label>`;
}

function woundPickHTML(f){

    <div class="lab" style="font-size:12.5px;font-weight:700;margin-bottom:5px">${f.l}</div>

    ${cur?`<div class="advisor info" style="margin-top:8px"><b>${WOUNDS.find(w=>w.k===cur).n}</b> — ${WOUNDS.find(w=>w.k===cur).d}<br>
      <span style="color:var(--ink-dim)">In a ${G().label.replace(/&amp;/g,"&")} world this often looks like:</span> ${esc(WOUNDS.find(w=>w.k===cur)[G().flavor])}.</div>`:""}

}

/* ---------- probes ---------- */
const Probe = {
  idx:{},
  toggle(p){
    const box = document.getElementById("pb_"+fid(p));
    if(box.classList.contains("open")){ box.classList.remove("open"); return; }
    this.idx[p] = this.idx[p]||0; this.paint(p); box.classList.add("open");
  },
  next(p){ const list=PROBES[p]; this.idx[p]=((this.idx[p]||0)+1)%list.length; this.paint(p); },
  paint(p){
    const list = PROBES[p], i = this.idx[p]||0;
    document.getElementById("pb_"+fid(p)).innerHTML =
      `<div class="pq">${list[i]}</div>
       <div class="pnav">
         <button type="button" class="mini" onclick="Probe.next('${p}')">another question</button>
         <button type="button" class="mini" onclick="document.getElementById('pb_${fid(p)}').classList.remove('open')">close</button>
         <span class="pnum">${i+1} / ${list.length}</span>
       </div>`;
  }
};

/* ---------- seeds ---------- */
const Seeds = {
  toggle(p,kind){
    const box = document.getElementById("sb_"+fid(p));
    if(box.classList.contains("open")){ box.classList.remove("open"); return; }
    let items = (G()[kind]||[]).slice();
    if(kind==="wounds"){
      const a = val("wound.archetype");
      if(a){ const w=WOUNDS.find(x=>x.k===a); if(w) items = [w[G().flavor]].concat(items); }
    }
    box.innerHTML = `<div class="sdh">${G().label.replace(/&amp;/g,"&")} — click to drop in, then make it yours</div>` +
      items.map((s,i)=>`<div class="sd" onclick="Seeds.use('${p}',${i},'${kind}')">${esc(s)}</div>`).join("") +
      `<div style="margin-top:7px"><button type="button" class="mini" onclick="document.getElementById('sb_${fid(p)}').classList.remove('open')">close</button></div>`;
    box._items = items; box.classList.add("open");
  },
  use(p,i){
    const box = document.getElementById("sb_"+fid(p));
    const text = box._items[i];
    const el = document.getElementById(fid(p));
    const cur = (el.value||"").trim();
    el.value = cur ? cur+"\n"+text : text;
    setPath(C(), p, el.value); Store.save(); afterChange();
    box.classList.remove("open"); toast("Dropped in — now make it specific");
  }
};

const Journey = {
  beats(){
    const a = ARCS[C().arc.type] || ARCS.positive;
    return BEATS_BASE.map((b,i)=> a.o && a.o[i] ? a.o[i] : b);
  },
  render(){
    const c = C(), a = ARCS[c.arc.type]||ARCS.positive, beats = this.beats();
    const reacts = c.arc.beats.filter(b=>b.mode==="react").length;
    const acts = c.arc.beats.filter(b=>b.mode==="act").length;
    document.querySelector('.view[data-view="journey"]').innerHTML = `
      <div class="card">
        <h2>The Journey <span class="pill ${journeyPct()>=85?"good":(journeyPct()>=25?"warn":"dim")}">${journeyPct()}% mapped</span></h2>
        <p class="lead">Nine beats from who they are on page one to who they are at the end — and what it costs to get there.</p>
        <div class="section-intro">Pick the arc shape first: the beat questions rewrite themselves to match. Then set the <b>grip of the lie</b> on each beat — the chart shows whether your book actually bends the way this arc should.</div>
        <h3>Arc shape</h3>
        <div class="chips">${Object.keys(ARCS).map(k=>
          `<span class="chip ${c.arc.type===k?"on":""}" onclick="Journey.setArc('${k}')">${ARCS[k].n}</span>`).join("")}</div>
        <div class="advisor info"><b>${a.n}</b> — ${a.d}
          ${G().arcs.includes(c.arc.type)?`<span class="pill good">common in ${G().label.replace(/&amp;/g,"&")}</span>`:`<span class="pill warn">less usual in ${G().label.replace(/&amp;/g,"&")} — deliberate is fine, just know you're doing it</span>`}
        </div>
        ${this.chart()}
        <div class="advisor ${(acts+reacts===0)?"info":(acts>=4?"good":(acts>=2?"warn":"bad"))}">
          ${(acts+reacts===0)
            ? `<b>Drive check:</b> as you fill each beat, mark whether they <b>act</b> or <b>react</b>. It's the fastest way to catch a passive protagonist — the most common problem in speculative fiction, where the world is big enough to push a character around for 400 pages.`
            : `<b>Drive check:</b> ${acts} beat${acts===1?"":"s"} where they act, ${reacts} where they react${(9-acts-reacts)?`, ${9-acts-reacts} unmarked`:""}.
               ${acts>=4?"Good — this character is driving their own story."
                 :"A protagonist who mostly reacts feels passive no matter how big the world is. Aim for at least four beats where they choose first and the world answers."}`}
        </div>

      ${beats.map((b,i)=>this.beatHTML(b,i)).join("")}
      <div class="card">

  },
  setArc(k){ C().arc.type=k; Store.save(); this.render(); },
  beatHTML(b,i){
    const bt = C().arc.beats[i], pivot=[4,6,7].includes(i);
    return `<div class="card beat ${pivot?"pivot":""}" style="padding:15px 17px">
      <div class="bh">
        <span class="bn">${i+1}</span><span class="bt">${b.t}</span>
        <span class="bmode">
          <button class="${bt.mode==="act"?"on act":""}" onclick="Journey.mode(${i},'act')">they act</button>
          <button class="${bt.mode==="react"?"on":""}" onclick="Journey.mode(${i},'react')">they react</button>
        </span>
      </div>
      <div class="bask">${b.ask}</div>
      <div class="grid g2">
        <label class="f" style="margin:4px 0"><span class="lab" style="font-size:11.5px">What they believe here</span>
          <textarea data-cpath="arc.beats.${i}.believe" style="min-height:58px">${esc(bt.believe||"")}</textarea></label>
        <label class="f" style="margin:4px 0"><span class="lab" style="font-size:11.5px">What they do about it</span>
          <textarea data-cpath="arc.beats.${i}.act" style="min-height:58px">${esc(bt.act||"")}</textarea></label>
      </div>
      <div class="gripwrap">
        <span class="gl">Grip of the lie</span>
        <input type="range" min="0" max="100" step="5" value="${bt.grip==null?(ARCS[C().arc.type]||ARCS.positive).curve[i]:bt.grip}"
          oninput="Journey.grip(${i},this.value)">
        <span class="gripval" id="gv${i}">${bt.grip==null?(ARCS[C().arc.type]||ARCS.positive).curve[i]:bt.grip}%</span>
      </div>
    </div>`;
  },
  mode(i,m){ const b=C().arc.beats[i]; b.mode = b.mode===m?"":m; Store.save(); this.render(); },
  grip(i,v){
    C().arc.beats[i].grip = +v; document.getElementById("gv"+i).textContent = v+"%";
    Store.save(); this.repaintChart();
  },
  points(){ return C().arc.beats.map((b,i)=> b.grip==null ? (ARCS[C().arc.type]||ARCS.positive).curve[i] : b.grip); },
  path(vals,w,h,pad){
    return vals.map((v,i)=>{
      const x = pad + i*((w-pad*2)/8);
      const y = pad + (100-v)/100*(h-pad*2);
      return (i?"L":"M")+x.toFixed(1)+" "+y.toFixed(1);
    }).join(" ");
  },
  chart(){
    return `<div class="chartbox" id="chartbox">${this.svg()}
      <div class="legend">
        <span><i style="background:#5ee0d0"></i>your book</span>
        <span><i style="background:#7b6cff;opacity:.55;height:6px"></i>the shape this arc usually makes</span>
        <span style="margin-left:auto">high = the lie is running them · low = the truth has hold</span>
      </div></div>`;
  },
  svg(){
    const w=680,h=210,pad=22, ideal=(ARCS[C().arc.type]||ARCS.positive).curve, mine=this.points();
    const beats=this.beats();
    const grid = [0,25,50,75,100].map(v=>{
      const y = pad + (100-v)/100*(h-pad*2);
      return `<line x1="${pad}" y1="${y}" x2="${w-pad}" y2="${y}" stroke="#2b3557" stroke-width="1" stroke-dasharray="${v===0||v===100?"0":"3 5"}"/>`;
    }).join("");
    const marks = mine.map((v,i)=>{
      const x = pad + i*((w-pad*2)/8), y = pad + (100-v)/100*(h-pad*2);
      return `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="4.5" fill="#5ee0d0" stroke="#0a0e1a" stroke-width="2"><title>${i+1}. ${esc(beats[i].t)} — ${v}%</title></circle>`;
    }).join("");
    const nums = mine.map((v,i)=>{
      const x = pad + i*((w-pad*2)/8);
      return `<text x="${x.toFixed(1)}" y="${h-5}" fill="#98a2c4" font-size="10" text-anchor="middle">${i+1}</text>`;
    }).join("");
    return `<svg viewBox="0 0 ${w} ${h}" preserveAspectRatio="xMidYMid meet" role="img" aria-label="Grip of the lie across nine beats">
      ${grid}
      <path d="${this.path(ideal,w,h,pad)}" fill="none" stroke="#7b6cff" stroke-width="7" stroke-linejoin="round" opacity=".30"/>
      <path d="${this.path(mine,w,h,pad)}" fill="none" stroke="#5ee0d0" stroke-width="3" stroke-linejoin="round"/>
      ${marks}${nums}
    </svg>`;
  },
  repaintChart(){ const b=document.getElementById("chartbox"); if(b) b.querySelector("svg").outerHTML = this.svg(); }
};

/* ============================================================
   ENSEMBLE / CAST
   ============================================================ */
const Ensemble = {
  read(c,p){ const prev=S.activeId; S.activeId=c.id; const v=val(p); S.activeId=prev; return v; },
  render(){
    const rows = S.chars.map(c=>({
      c, name:c.name||"Unnamed", role:c.role,
      want:this.read(c,"engine.want"), lie:this.read(c,"wound.lie"),
      need:this.read(c,"engine.need"), fear:this.read(c,"fear.deep"),
      wound:this.read(c,"wound.ghost"), arc:(ARCS[c.arc.type]||ARCS.positive).n
    }));
    document.querySelector('.view[data-view="ensemble"]').innerHTML = `
      <div class="card">
        <h2>Cast — Do These Motivations Actually Collide?</h2>
        <p class="lead">A cast where everyone wants something different but nobody wants the same thing produces a lot of walking around.</p>
        <div class="section-intro">Read down the <b>Want</b> column. If two characters could both get what they want without ever inconveniencing each other, you have parallel stories, not a plot.</div>
        <div class="tblwrap">
        <table class="matrix">
          <tr><th>Character</th><th>Wants (external)</th><th>Lie they live by</th><th>Needs (internal)</th><th>Arc</th></tr>
          ${rows.map(r=>`<tr>
            <td><b>${esc(r.name)}</b><br><span style="color:var(--ink-dim);font-size:11px">${esc(r.role)}</span></td>
            <td>${r.want?esc(r.want):'<span style="color:var(--bad)">— not written —</span>'}</td>
            <td>${r.lie?esc(r.lie):'<span style="color:var(--warn)">—</span>'}</td>
            <td>${r.need?esc(r.need):'<span style="color:var(--warn)">—</span>'}</td>
            <td>${esc(r.arc)}</td></tr>`).join("")}
        </table></div>
        ${this.checks(rows)}
      </div>
      <div class="card">
        <h3>Collision notes</h3>
        <p class="lead">For each pair that matters, write the sentence where their wants can't both be satisfied.</p>
        <label class="f"><span class="lab">Where the wants crash</span>
          <span class="hint">e.g. "He needs the bond broken to keep his crown; she needs it intact to keep breathing."</span>
          <textarea data-bpath="collisions" style="min-height:100px">${esc(S.book.collisions||"")}</textarea></label>
      </div>`;
  },
  checks(rows){
    const out=[];
    const norm = s => String(s||"").toLowerCase().replace(/[^a-z ]/g,"").split(/\s+/).filter(w=>w.length>3);
    const overlap=(a,b)=>{ const A=new Set(norm(a)), B=norm(b); if(!A.size||!B.length) return 0; return B.filter(w=>A.has(w)).length/Math.max(A.size,B.length); };

    if(rows.length<2) out.push(["soft","Only one character built","Motivation gets sharper by contrast. Build the antagonist — or whoever wants the same thing — and this page starts doing real work."]);

    const noWant = rows.filter(r=>!r.want);
    if(noWant.length) out.push(["fail","Characters with no external want", noWant.map(r=>r.name).join(", ")+" — a character without a filmable goal will drift in every scene they're in."]);

    for(let i=0;i<rows.length;i++) for(let j=i+1;j<rows.length;j++){
      if(rows[i].lie && rows[j].lie && overlap(rows[i].lie,rows[j].lie)>0.5)
        out.push(["soft",`${rows[i].name} and ${rows[j].name} live by nearly the same lie`,"That can be deliberate (mirrors, siblings, a shared culture) — but if it isn't, one of them should believe something the other finds naive or monstrous."]);
    }
    const hasAntag = rows.some(r=>/antagonist|rival/i.test(r.role));
    if(rows.length>1 && !hasAntag) out.push(["soft","No antagonist or rival in the cast","Even in cozy and literary-leaning speculative fiction, someone needs to want something incompatible."]);

    const arcs = new Set(rows.map(r=>r.arc));
    if(rows.length>2 && arcs.size===1) out.push(["soft","Everyone is on the same arc shape",`All ${rows.length} characters are running a ${rows[0].arc}. Varying one — a flat arc beside a change arc, a fall beside a redemption — is where thematic argument comes from.`]);

    if(!out.length) out.push(["pass","Cast reads as a set of colliding wants","Nothing structural is flagging. Keep the collision notes below current as the draft changes."]);
    return out.map(o=>`<div class="check ${o[0]==="fail"?"fail":(o[0]==="pass"?"pass":"soft")}">
      <div class="ci">${o[0]==="fail"?"✕":(o[0]==="pass"?"✓":"!")}</div>
      <div><div class="ct">${o[1]}</div><div class="cd">${o[2]}</div></div></div>`).join("");
  }
};

/* ============================================================
   DIAGNOSTICS
   ============================================================ */
const Diag = {
  run(){
    const c=C(), b=c.arc.beats, checks=[];
    const t = p => String(val(p)||"").trim();
    const filled = p => t(p).length>2;
    const add=(state,title,desc,tab)=>checks.push({state,title,desc,tab});

    // 1 want exists and is concrete-ish
    if(!filled("engine.want")) add("fail","No external want","Everything else is theory until this exists. A camera has to be able to film them getting it.","engine");
    else if(t("engine.want").split(/\s+/).length<4) add("soft","The want may be too abstract","Short, vague wants (\"freedom\", \"revenge\") behave like themes, not goals. Add the object, the person, and the deadline.","engine");
    else add("pass","External want is on the page","Good — this is what your scenes will be about.","engine");

    // 2 want tied to wound
    if(filled("engine.wantWhy") && filled("wound.ghost")) add("pass","The want is rooted in the wound","This is the join that makes a character feel inevitable rather than assigned.","engine");
    else add("fail","The want isn't connected to the wound yet","Fill in the wound, then 'why this goal, and why them'. Without this link, the goal is a plot assignment.","wound");

    // 3 need distinct from want
    if(!filled("engine.need")) add("fail","No internal need","Without a need, the ending can only be a win or a loss — never a change.","engine");
    else if(t("engine.need").toLowerCase()===t("engine.want").toLowerCase()) add("fail","Want and need are the same thing","If getting the goal also heals them, there's no cost to the climax. Push the need inward.","engine");
    else add("pass","Want and need are pulling different directions","","engine");

    // 4 collision named
    if(filled("engine.collide")) add("pass","You know the scene where want and need collide","That scene is your climax whether you've written it yet or not.","engine");
    else add("soft","The want/need collision isn't named","Name the moment they can't have both. Most saggy third acts are this field left blank.","engine");

    // 5 why now
    if(filled("engine.whyNow") && filled("engine.whyNotBefore")) add("pass","'Why now' is answered","Chapter one will hold — the reader knows why the story starts today.","engine");
    else if(filled("engine.whyNow")) add("soft","Half of 'why now' is answered","You've said what changed. Now say why it couldn't have happened a year ago — that's the half readers feel when it's missing.","engine");
    else add("fail","'Why now' is unanswered","This is the single most common reason a strong premise opens slowly.","engine");

    // 6 cost of walking away
    if(filled("engine.doNothing")) add("pass","Walking away has a real cost","","engine");
    else add("soft","Nothing stops them walking away","If the reader can think of an easier option, the character has to have thought of it too — and it has to be closed.","engine");

    // 7 lie has evidence
    if(filled("wound.lie") && filled("wound.evidence")) add("pass","The lie is earned, not assigned","The world keeps proving them right, which is why they can't simply be told.","wound");
    else if(filled("wound.lie")) add("soft","The lie has no supporting evidence","A lie the world never confirms is a bad habit. Give it a weekly proof.","wound");
    else add("fail","No lie written","Wound → lie → behaviour is the spine. Without the lie there's nothing for the story to break.","wound");

    // 8 truth + carrier
    if(filled("wound.truth") && filled("wound.truthCarrier")) add("pass","The truth has a carrier","Good — they can't reason their way there alone, and now they don't have to.","wound");
    else add("soft","The truth has no way into the story","Decide who or what carries it in: a person, a document, a place, a body.","wound");

    // 9 speculative wound / swap test
    if(getPath(c,"world.swapFail")) add("fail","Swap test failed — the world is wallpaper","You've marked that this character could exist unchanged in a contemporary novel. Fix it at the wound: make the thing that broke them something only this world could do.","world");
    else if(filled("world.rule") && filled("world.cost")) add("pass","The world is doing something to this person","The rule has a name and it has already taken something. That's what makes it fantasy or sci-fi rather than costume.","world");
    else add("soft","The world's pressure isn't specific yet","Name the rule that costs them, and what it has already taken.","world");

    // 10 fear ladder
    const rungs = (c.fear.ladder||[]).filter(r=>(r.give||"").trim().length>2).length;
    if(rungs>=4) add("pass","Escalation ladder is built",`${rungs} of 5 rungs filled — you know what to threaten and in what order.`,"fear");
    else if(rungs>=2) add("soft","Escalation ladder is half-built",`${rungs} of 5 rungs. The top rungs (love, self) are where your third act lives.`,"fear");
    else add("fail","No cost ladder","Without it, act two escalates by adding more events instead of raising the price.","fear");

    // 11 antagonist mirror
    if(filled("opposition.mirror")) add("pass","The opposition mirrors the want","Same object, opposite reasons — the strongest structure there is.","opposition");
    else if(filled("opposition.antagonist")) add("soft","Opposition exists but doesn't mirror","Find the sentence both of them could sign. That's where theme comes from.","opposition");
    else add("fail","Nothing is standing on this motivation","A want with no opposition is a to-do list.","opposition");

    // 12 conversation test
    if(getPath(c,"opposition.convoFail") && !filled("opposition.convoWhy"))
      add("fail","One honest conversation would end this","You've marked it yourself and not closed the door. Give a hard reason — a vow, a risk, a distance, something they physically cannot say.","opposition");
    else if(getPath(c,"opposition.convoFail")) add("pass","Conversation test answered","You've named what makes it impossible. Keep that reason alive in every scene where they nearly talk.","opposition");
    else add("pass","Conflict doesn't collapse under a conversation","","opposition");

    // 13 arc mapped
    const bf = b.filter(x=>(x.believe||"").trim()||(x.act||"").trim()).length;
    const pivots = [4,6,7,8].filter(i=>(b[i].believe||"").trim()||(b[i].act||"").trim()).length;
    if(bf>=7 && pivots>=3) add("pass","The journey is mapped",`${bf} of 9 beats, including ${pivots} of the 4 pivots.`,"journey");
    else if(bf>=3) add("soft","The journey is partly mapped",`${bf} of 9 beats. The four that matter most are the Mirror, the Collapse, the Choice and Who They Are Now.`,"journey");
    else add("fail","No journey mapped","You have a person, not a story, until the beats exist.","journey");

    // 14 agency
    const acts = b.filter(x=>x.mode==="act").length, reacts = b.filter(x=>x.mode==="react").length;
    if(acts>=4) add("pass","The character drives their own story",`${acts} beats where they move first.`,"journey");
    else if(acts+reacts===0) add("soft","Agency not marked yet","On the Journey tab, mark each beat 'they act' or 'they react'.","journey");
    else add("fail","This character mostly reacts",`${acts} act / ${reacts} react. Convert at least two reactive beats into a choice they make before the world forces it.`,"journey");

    // 15 behaviour translation
    const beh = ["behavior.pressure","behavior.tell","behavior.neverSay","behavior.object"].filter(filled).length;
    if(beh>=3) add("pass","Motivation is translated into behaviour","This is what you paste into a drafting prompt.","behavior");
    else add("soft","Motivation hasn't reached the page yet",`${beh} of 4 key behaviour fields. Without these, the dossier stays theory and the prose stays generic.`,"behavior");

    // 16 chapter-five test
    if(filled("engine.ch5")) add("pass","Survives the chapter-five test","You know what would still be wrong if they got the want early — that's your real story.","engine");
    else add("soft","Chapter-five test unanswered","Ask it: if they got the want in chapter five, what would still be broken? The answer is usually the book.","engine");

    return checks;
  },
  score(){
    const ch=this.run(); if(!ch.length) return 0;
    const pts = ch.reduce((a,c)=>a+(c.state==="pass"?1:(c.state==="soft"?.5:0)),0);
    return Math.round(pts/ch.length*100);
  },
  render(){
    const ch=this.run(), s=this.score();
    const col = s>=80?"var(--good)":(s>=55?"var(--warn)":"var(--bad)");
    const verdict = s>=85?"Draftable. This character will carry scenes on their own."
      : s>=70?"Close. Fix the red flags and this holds for a full book."
      : s>=45?"Half-built. The bones are there; the joins aren't."
      : "Not ready to draft. Everything red below is load-bearing.";
    const fails = ch.filter(c=>c.state==="fail"), softs = ch.filter(c=>c.state==="soft"), passes = ch.filter(c=>c.state==="pass");
    document.querySelector('.view[data-view="diagnostics"]').innerHTML = `
      <div class="card">
        <h2>Pressure Test — ${esc(C().name||"this character")}</h2>
        <p class="lead">Sixteen structural checks. This tests whether the motivation <i>holds together</i> — it can't judge whether the prose is good. That part's still yours.</p>
        <div class="score">
          <div><div class="big" style="color:${col}">${s}</div><div class="lbl">out of 100</div></div>
          <div class="meter">
            <div class="bar"><i style="width:${s}%;background:${col}"></i></div>
            <div style="margin-top:8px;font-size:13.5px">${verdict}</div>
            <div style="margin-top:4px;font-size:12px;color:var(--ink-dim)">${passes.length} solid · ${softs.length} to sharpen · ${fails.length} load-bearing gap${fails.length===1?"":"s"}</div>
          </div>
        </div>
        ${fails.length?`<h3>Fix these first</h3>${fails.map(this.row).join("")}`:""}
        ${softs.length?`<h3>Sharpen these</h3>${softs.map(this.row).join("")}`:""}
        ${passes.length?`<h3>Holding</h3>${passes.map(this.row).join("")}`:""}
      </div>`;
  },
  row(c){
    return `<div class="check ${c.state}">
      <div class="ci">${c.state==="pass"?"✓":(c.state==="fail"?"✕":"!")}</div>
      <div style="flex:1"><div class="ct">${c.title}</div>${c.desc?`<div class="cd">${c.desc}</div>`:""}</div>
      ${c.tab?`<div class="cgo"><button class="mini" onclick="go('${c.tab}')">open</button></div>`:""}
    </div>`;
  }
};

/* ============================================================
   EXPORT
   ============================================================ */
const Exporter = {
  mode:"dossier",
  set(m){ this.mode=m; this.render(); },
  render(){
    const modes=[["dossier","Full dossier"],["card","One-page card"],["draft","Drafting prompt"],["interview","Interview prompt"],["audit","Chapter audit prompt"],["gaps","Fill-the-gaps prompt"],["cast","Whole cast"]];
    const text=this.build();
    document.querySelector('.view[data-view="export"]').innerHTML=`
      <div class="card">
        <h2>Export</h2>
        <p class="lead">Take it into your draft, into Claude, or into the story bible.</p>
        <div class="exptabs">${modes.map(m=>`<button class="exptab ${this.mode===m[0]?"on":""}" onclick="Exporter.set('${m[0]}')">${m[1]}</button>`).join("")}</div>
        <div class="row" style="margin:10px 0">
          <button class="btn primary" onclick="Exporter.copy()">Copy to clipboard</button>
          <button class="btn" onclick="Exporter.download()">Download .md</button>
          <button class="btn ghost" onclick="window.print()">Print / PDF</button>
        </div>
        <div class="advisor info">${this.blurb()}</div>
        <div class="outbox" id="outbox">${esc(text)}</div>
      </div>`;
  },
  blurb(){
    return {
      dossier:"Everything you've built, as markdown. Drop it into the story bible, a Claude Project, or the top of your manuscript file.",
      card:"The short version — what you actually need at the keyboard. Print it and keep it beside you while drafting.",
      draft:"Paste into Claude before asking for a scene. It loads the motivation so the character behaves like themselves instead of like a generic protagonist.",
      interview:"Paste into Claude, then ask questions. Claude answers <i>as</i> the character — the fastest way to find out whether you actually know them.",
      audit:"Paste this plus a chapter you've already written. It checks whether the character is acting from their real motivation on that page.",
      gaps:"You have blanks. This asks Claude to propose options for exactly the ones you've left empty — then you pick, edit, and paste back in.",
      cast:"Every character in the story, side by side. Good for the series bible and for handing to a co-writer or editor."
    }[this.mode];
  },
  build(){
    const f = {dossier:"dossier",card:"card",draft:"draft",interview:"interview",audit:"audit",gaps:"gaps",cast:"cast"}[this.mode];
    return this[f]();
  },
  /* ---- helpers ---- */
  L(label,p){ const v=val(p); return v && String(v).trim() ? `**${label}:** ${String(v).trim()}\n\n` : ""; },
  head(){
    const c=C(), b=S.book;
    let s = `# ${c.name||"Unnamed character"} — Character Deep Dive\n\n`;
    s += `*${c.role}`;
    if(b.title) s += ` · ${b.title}`;
    if(b.series) s += ` (${b.series})`;
    s += ` · ${G().label.replace(/&amp;/g,"&")}*\n\n`;
    return s;
  },
  dossier(){
    const c=C();
    let s=this.head();
    if(val("arc.oneLine")) s += `> ${val("arc.oneLine")}\n\n`;
    s += `---\n\n## THE SHORT VERSION\n\n`;
    s += this.L("Wants","engine.want")+this.L("Because","engine.wantWhy")+this.L("Believes the lie","wound.lie");
    s += this.L("Really needs","engine.need")+this.L("Deepest fear","fear.deep")+this.L("Why now","engine.whyNow");

    s += `\n---\n\n## WHO THEY ARE\n\n`;
    s += this.L("Species / origin","identity.kind")+this.L("Place in the world's order","identity.station")+this.L("Age / stage","identity.age");
    s += this.L("Good at","identity.competence")+this.L("Said about them","identity.reputation");
    s += this.L("How they'd describe themselves","identity.selfImage")+this.L("What contradicts that","identity.contradiction");
    s += this.L("Needs to be seen as","identity.wantsToBeSeen")+this.L("Blind spot","identity.blindSpot");

    s += `\n## WORLD PRESSURE\n\n`;
    s += this.L("The rule that costs them","world.rule")+this.L("What it has taken","world.cost")+this.L("Unearned advantage","world.privilege");
    s += this.L("The clock","world.threat")+this.L("Forbidden to them","world.forbidden")+this.L("Leverage against them","world.leverage");
    if(getPath(c,"world.swapFail")) s += `> ⚠ Swap test failed — flagged as could-exist-in-a-contemporary-novel.${val("world.swapFix")?" Fix noted: "+val("world.swapFix"):""}\n\n`;

    s += `\n## WOUND & LIE\n\n`;
    const a = WOUNDS.find(w=>w.k===val("wound.archetype"));
    if(a) s += `**Wound shape:** ${a.n} — ${a.d}\n\n`;
    s += this.L("What happened","wound.ghost")+this.L("Who they were before","wound.before")+this.L("What was taken","wound.lost")+this.L("Blame","wound.blame");
    s += this.L("The lie","wound.lie")+this.L("Evidence the world keeps giving","wound.evidence")+this.L("What the lie protects","wound.serves");
    s += this.L("The truth","wound.truth")+this.L("Who carries the truth in","wound.truthCarrier")+this.L("Cost of accepting it","wound.truthCost");

    s += `\n## WANT · NEED · WHY NOW\n\n`;
    s += this.L("External want","engine.want")+this.L("Why this, why them","engine.wantWhy")+this.L("Visible in chapter one as","engine.wantVisible")+this.L("Why the want won't fix them","engine.wantWrong");
    s += this.L("Internal need","engine.need")+this.L("Want/need collision","engine.collide")+this.L("Chapter-five test","engine.ch5");
    s += this.L("Why now","engine.whyNow")+this.L("Why not a year ago","engine.whyNotBefore")+this.L("Why not later","engine.whyNotLater")+this.L("Cost of walking away","engine.doNothing");

    s += `\n## FEAR & COST LADDER\n\n`;
    s += this.L("Admits to fearing","fear.surface")+this.L("Never says","fear.deep")+this.L("Arranges life to avoid","fear.avoid");
    const lad = (c.fear.ladder||[]).map((r,i)=> (r.give||"").trim()? `${i+1}. **${LADDER_RUNGS[i].n}** — ${r.give.trim()}` : null).filter(Boolean);
    if(lad.length) s += `**What the story can take, in order:**\n\n${lad.join("\n")}\n\n`;
    s += this.L("The line they won't cross","fear.line")+this.L("What would make them cross it","fear.lineCross")+this.L("Who they'd be after","fear.after");

    s += `\n## OPPOSITION\n\n`;
    s += this.L("Opposed by","opposition.antagonist")+this.L("The mirror","opposition.mirror")+this.L("Where the opposition is right","opposition.antagRight")+this.L("How the world blocks them","opposition.worldOpp");
    s += this.L("The ally who pulls wrong","opposition.ally")+this.L("The temptation","opposition.temptation")+this.L("Witness to the change","opposition.witness");
    if(getPath(c,"opposition.convoFail")) s += this.L("Why one honest conversation can't fix it","opposition.convoWhy");

    s += `\n## THE JOURNEY — ${(ARCS[c.arc.type]||ARCS.positive).n}\n\n`;
    s += `*${(ARCS[c.arc.type]||ARCS.positive).d}*\n\n`;
    const beats = Journey.beats();
    c.arc.beats.forEach((b,i)=>{
      if(!(b.believe||"").trim() && !(b.act||"").trim()) return;
      s += `### ${i+1}. ${beats[i].t}${b.mode?` *(they ${b.mode})*`:""}\n`;
      if((b.believe||"").trim()) s += `- **Believes:** ${b.believe.trim()}\n`;
      if((b.act||"").trim()) s += `- **Does:** ${b.act.trim()}\n`;
      s += `- *Grip of the lie: ${b.grip==null?(ARCS[c.arc.type]||ARCS.positive).curve[i]:b.grip}%*\n\n`;
    });

    s += `\n## ON THE PAGE\n\n`;
    s += this.L("Under pressure","behavior.pressure")+this.L("Physical tell","behavior.tell")+this.L("Lies about","behavior.lieAbout");
    s += this.L("Uses words to","behavior.speech")+this.L("Would never say","behavior.neverSay")+this.L("Curses / prays by","behavior.swear");
    s += this.L("Carries","behavior.object")+this.L("Costly kindness","behavior.kindness")+this.L("Would die for / kill for","behavior.dieFor")+this.L("Happy looks like","behavior.joy");

    s += `\n---\n\n*Pressure test: ${Diag.score()}/100 · built in Character Deep Dive*\n`;
    return s;
  },
  card(){
    const c=C();
    let s=`# ${c.name||"Unnamed"} — at the keyboard\n\n`;
    if(val("arc.oneLine")) s+=`> ${val("arc.oneLine")}\n\n`;
    const rows=[
      ["WANTS","engine.want"],["BECAUSE","engine.wantWhy"],["LIE","wound.lie"],["TRUTH","wound.truth"],
      ["NEEDS","engine.need"],["FEARS","fear.deep"],["WHY NOW","engine.whyNow"],
      ["IF THEY WALK AWAY","engine.doNothing"],["UNDER PRESSURE","behavior.pressure"],["TELL","behavior.tell"],
      ["WOULD NEVER SAY","behavior.neverSay"],["OPPOSED BY","opposition.antagonist"]
    ];
    rows.forEach(r=>{ const v=val(r[1]); if(v&&String(v).trim()) s+=`**${r[0]}** — ${String(v).trim()}\n\n`; });
    const lad=(c.fear.ladder||[]).map((r,i)=>(r.give||"").trim()?`${LADDER_RUNGS[i].n}: ${r.give.trim()}`:null).filter(Boolean);
    if(lad.length) s+=`**COST LADDER** — ${lad.join(" → ")}\n\n`;
    s+=`**ARC** — ${(ARCS[c.arc.type]||ARCS.positive).n}\n`;
    return s;
  },
  draft(){
    const c=C();
    let s=`You're drafting a scene for ${S.book.title?`"${S.book.title}"`:"my novel"}${S.book.penName?` (pen name: ${S.book.penName})`:""}, ${G().label.replace(/&amp;/g,"&")}.\n\n`;
    s+=`Here is the full motivation dossier for ${c.name||"the POV character"}. Read it before you write a word.\n\n`;
    s+=`---\n\n${this.dossier()}\n---\n\n`;
    s+=`## HOW TO USE THIS\n\n`;
    s+=`1. Every choice ${c.name||"this character"} makes in the scene must trace back to the want, the lie, or the fear. If a line could be spoken by any character in this genre, cut it.\n`;
    s+=`2. They do NOT know their own lie and never name it. They never say the need out loud. The reader sees both through behaviour.\n`;
    s+=`3. Use the physical tell when the lie is threatened. Don't explain the tell.\n`;
    s+=`4. Keep the world pressure live: the rule that costs them should press on this scene, not just sit in the background.\n`;
    s+=`5. Match the grip of the lie for wherever we are in the arc — early scenes, the lie is running them; late scenes, it's losing.\n`;
    s+=`6. No interior summary of their psychology. Behaviour, dialogue, and choice only.\n\n`;
    s+=`Ask me what beat we're on and what the scene needs to accomplish, then write it.\n`;
    return s;
  },
  interview(){
    const c=C();
    let s=`Play ${c.name||"this character"} in a live interview. Stay in character the whole time — first person, present, in their voice. Never break, never analyse yourself, never speak as an assistant.\n\n`;
    s+=`WHO YOU ARE:\n\n${this.card()}\n`;
    s+=`WORLD: ${val("world.rule")||S.book.worldRules||"(see below)"}\n${S.book.premise?"SITUATION: "+S.book.premise+"\n":""}\n`;
    s+=`RULES OF THE INTERVIEW:\n`;
    s+=`- You do not know you believe a lie. When a question gets near it, you deflect, joke, change the subject, or get sharp — the way you actually would.\n`;
    s+=`- You never say your deepest fear plainly. You'll circle it.\n`;
    s+=`- You're allowed to lie to me. You're allowed to refuse a question.\n`;
    s+=`- Answer in your rhythm: ${val("behavior.speech")||"clipped, guarded, occasionally funnier than you mean to be"}.\n`;
    s+=`- If I ask something you'd have no way of knowing, say so in character.\n\n`;
    s+=`Start by telling me where we are and what you were doing before I interrupted. Then I'll ask my questions.\n`;
    return s;
  },
  audit(){
    const c=C();
    let s=`I'm going to paste a chapter. Audit it against this character's motivation — don't rewrite it unless I ask.\n\n---\n\n${this.card()}\n---\n\n`;
    s+=`ARC: ${(ARCS[c.arc.type]||ARCS.positive).n} — ${(ARCS[c.arc.type]||ARCS.positive).d}\n\n`;
    s+=`CHECK AND REPORT:\n\n`;
    s+=`1. **Driving want** — in this chapter, what is ${c.name||"the character"} trying to get, scene by scene? Quote the line where it's visible. If a scene has no visible want, name the scene.\n`;
    s+=`2. **The lie** — is it running them here, and does that match where we are in the arc? Flag anywhere they behave more healed than they've earned.\n`;
    s+=`3. **Agency** — do they choose first, or only respond to what's done to them? Count both.\n`;
    s+=`4. **Contradictions** — anything they say or do that contradicts the dossier. Quote it.\n`;
    s+=`5. **World pressure** — is the rule that costs them actually pressing on this chapter, or is the setting decorative here?\n`;
    s+=`6. **Interiority leaks** — anywhere the prose explains their psychology instead of showing it.\n\n`;
    s+=`Be blunt. Then give me the three highest-leverage fixes, in order.\n\n`;
    s+=`Here's the chapter:\n\n[PASTE CHAPTER HERE]\n`;
    return s;
  },
  gaps(){
    const c=C(), missing=[];
    Object.keys(SECTIONS).forEach(k=>{
      SECTIONS[k].blocks.forEach(b=>b.fields.forEach(f=>{
        if(f.t==="chk"||f.t==="woundpick") return;
        if(!has(f.p)) missing.push(`- **${SECTIONS[k].title.replace(/&amp;/g,"&")} → ${f.l.replace(/&amp;/g,"&")}** — ${f.hint||""}`);
      }));
    });
    const emptyBeats = Journey.beats().map((b,i)=> ((c.arc.beats[i].believe||"").trim()||(c.arc.beats[i].act||"").trim())?null:`- **Beat ${i+1}: ${b.t}** — ${b.ask}`).filter(Boolean);

    let s=`Help me finish building this character. Here's what I have so far:\n\n---\n\n${this.dossier()}\n---\n\n`;
    if(!missing.length && !emptyBeats.length) return s+`Nothing is blank — instead, push back on what's here. Which three answers are the weakest, most generic, or most likely to produce a flat character? Be specific and unkind.\n`;
    s+=`## STILL BLANK\n\n${missing.join("\n")}\n${emptyBeats.length?"\n"+emptyBeats.join("\n")+"\n":""}\n`;
    s+=`For each blank, propose **three** options that are consistent with everything above — specific to this world, not generic. Number them so I can pick.\n\n`;
    s+=`Rules: no therapy-speak, no abstractions like "learns to trust". Concrete people, objects, dates and prices. Where the ${G().label.replace(/&amp;/g,"&")} setting can do the work, use it.\n\n`;
    s+=`Then tell me which single blank matters most and why.\n`;
    return s;
  },
  cast(){
    let s=`# ${S.book.title||"Untitled"} — Cast Motivation Map\n\n`;
    if(S.book.series) s+=`*${S.book.series} · ${G().label.replace(/&amp;/g,"&")}*\n\n`;
    if(S.book.premise) s+=`${S.book.premise}\n\n`;
    if(S.book.worldRules) s+=`**World rules:** ${S.book.worldRules}\n\n`;
    s+=`---\n\n`;
    const prev=S.activeId;
    S.chars.forEach(c=>{
      S.activeId=c.id;
      s+=`## ${c.name||"Unnamed"} — ${c.role}\n\n`;
      s+=this.L("Wants","engine.want")+this.L("Because","engine.wantWhy")+this.L("Lie","wound.lie")+this.L("Needs","engine.need")+this.L("Fear","fear.deep")+this.L("Opposed by","opposition.antagonist");
      s+=`**Arc:** ${(ARCS[c.arc.type]||ARCS.positive).n}\n\n`;
      if(val("arc.oneLine")) s+=`*${val("arc.oneLine")}*\n\n`;
      s+=`---\n\n`;
    });
    S.activeId=prev;
    if(S.book.collisions) s+=`## Where the wants crash\n\n${S.book.collisions}\n`;
    return s;
  },
  copy(){
    const t=this.build();
    if(navigator.clipboard) navigator.clipboard.writeText(t).then(()=>toast("Copied")).catch(()=>toast("Select the text and copy"));
    else toast("Select the text and copy");
  },
  download(){
    const t=this.build();
    const blob=new Blob([t],{type:"text/markdown"});
    const a=document.createElement("a"); a.href=URL.createObjectURL(blob);
    a.download=((C().name||"character")+"-"+this.mode).replace(/[^a-z0-9]+/gi,"-").toLowerCase()+".md";
    a.click(); toast("Downloaded");
  }
};

/* ============================================================
   LADDER (rendered into the Fear tab after Section.render)
   ============================================================ */
function renderLadder(){
  const view=document.querySelector('.view[data-view="fear"]');
  const card=view.querySelector(".card"); if(!card) return;
  const c=C();
  const html=`<h3>The cost ladder — what the story takes, and in what order</h3>
    <div class="section-intro">Fill from the top down. Rungs 1–2 belong in act one, 3–4 in act two, and rung 5 is the climax. If you can't name what they'd give up at each level, the middle of the book will escalate by adding events instead of raising the price.</div>
    <div class="ladder">${LADDER_RUNGS.map((r,i)=>`
      <div class="rung">
        <span class="rnum">${i+1}</span>
        <div class="rl"><b>${r.n}</b><span>${r.s}</span></div>
        <textarea data-cpath="fear.ladder.${i}.give" placeholder="What would they give up here — and who asks for it?">${esc((c.fear.ladder[i]||{}).give||"")}</textarea>
      </div>`).join("")}</div>`;
  const marker=document.createElement("div");
  marker.innerHTML=html;
  const h3s=card.querySelectorAll("h3");
  const lineHeader=Array.from(h3s).find(h=>h.textContent.trim()==="The line");
  if(lineHeader) card.insertBefore(marker, lineHeader); else card.appendChild(marker);
}

/* ============================================================
   CHANGE HANDLING (delegated — never re-renders while typing)
   ============================================================ */
function afterChange(){ renderSpine(); paintDots(); }

document.addEventListener("input", e=>{
  const el=e.target;
  if(el.dataset && el.dataset.cpath){ setPath(C(), el.dataset.cpath, el.value); Store.save(); afterChange(); if(el.dataset.cpath==="name") Roster.fillSelect(); }
  else if(el.dataset && el.dataset.bpath){ S.book[el.dataset.bpath]=el.value; Store.save(); afterChange(); }
});
document.addEventListener("change", e=>{
  const el=e.target;
  if(el.type==="checkbox" && el.dataset.cpath){ setPath(C(), el.dataset.cpath, el.checked); Store.save(); afterChange(); return; }
  if(el.tagName==="SELECT" && el.dataset.cpath){ setPath(C(), el.dataset.cpath, el.value); Store.save(); Roster.fillSelect(); afterChange(); }
  if(el.tagName==="SELECT" && el.dataset.bpath){
    S.book[el.dataset.bpath]=el.value; Store.save();
    if(el.dataset.bpath==="genre"){ Book.render(); toast(GENRES[el.value].label.replace(/&amp;/g,"&")+" playbook loaded"); }
    afterChange();
  }
});

/* ============================================================
   BOOT
   ============================================================ */
function refreshChrome(){ Roster.fillSelect(); renderSpine(); paintDots(); }

const _sectionRender = Section.render.bind(Section);
Section.render = function(key){ _sectionRender(key); if(key==="fear") renderLadder(); };

function boot(){
  buildTabs();
  refreshChrome();
  go(CURRENT||"book");
}

Store.load();
boot();
if(!S.book.title && !C().name) go("book");
</script>
