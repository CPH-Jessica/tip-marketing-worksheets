<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Plot Your Path — The Invisible Pen</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;0,9..144,700;1,9..144,500&family=Spectral:wght@400;500;600&display=swap" rel="stylesheet">

<script>
/* ============================================================
   JESSICA'S CONTROL PANEL  —  edit only what's below.
   Everything is plain English. You never touch the code.
   ============================================================

   1) LINKS — paste your real web addresses between the quotes.
      Leave a "#" if you don't have one yet (the button just
      won't go anywhere until you paste a real link).            */

const LINKS = {
  oneOnOne:   "https://payhip.com/b/Ry7Ve",   // Discovery Call: Diagnose My AI Tool ($149, unlisted Payhip product)
  hub:        "https://payhip.com/theinvisiblepen",   // Payhip store (still used for the 1:1)
  liveCohort: "https://cph-jessica.github.io/tip-marketing-worksheets/writing-space.html",    // The Writing Space signup (Skool Premium co-working)
  skoolFree:    "https://www.skool.com/the-invisible-pen/classroom/69b78eb3?md=9b0b16dd8ce046b184e0561e7659ff22",   // Free Resources for everyone
  skoolPremium: "https://www.skool.com/the-invisible-pen/classroom/4c98b77c?md=c14c1d155b2e44faaa2c3765eab2f835"    // Premium Resources and Library
};

/* 2) CLASSES — this is the ONLY thing you maintain over time.
      For each class set  status: "live"  or  status: "soon".
      When you finish building a class, change "soon" to "live"
      and paste its link. The tool updates itself. Done.

      - "live"  = shows a real "Start here" button using its link
      - "soon"  = shows on the roadmap as "Coming soon" (no link)  */

const CLASSES = {
  foundations: {
    name: "Foundations of Claude (Part 1)",
    status: "live",                 // <-- live or soon
    link: "https://www.skool.com/the-invisible-pen/classroom/887357f5?md=8c6a66dee1db4bdca593e74bd6b0ffb1",                // <-- paste this class's link
    line: "Set Claude up so it writes like YOU — your voice, your project, your system. This is the bottleneck for almost everyone."
  },
  penName: {
    name: "Pen Name Launcher",
    status: "live",
    link: "https://www.skool.com/the-invisible-pen/classroom/4ba13f4d?md=751a8e5bf3b9454289d8f454c32fc260",
    line: "Build your pen name from the ground up — identity, voice, and genre fit — so every book you publish is working for the same brand."
  },
  tropeSchool: {
    name: "Understanding Tropes",
    status: "live",
    link: "https://www.skool.com/the-invisible-pen/classroom/a5c57600?md=e0f745354c8c4845a7c15f470bfe60e4",
    line: "Write books readers are actually searching for — the difference between Author Intent and Reader Intent, from your very first outline."
  },
  bestseller: {
    name: "Writing a Best Selling Book",
    status: "soon",
    link: "#",
    line: "Build commercial structure in from page one, so the book sells once it's written."
  },
  elab: {
    name: "Edit Like a Boss",
    status: "live",
    link: "https://www.skool.com/the-invisible-pen/classroom/f9b1493b?md=5e4aa6e5f41e4f31b67519635bc7c1c6",
    line: "Turn a messy draft into a polished, ready-to-publish manuscript using Claude as your editing partner."
  },
  blurbs: {
    name: "Mastering Amazon Blurbs",
    status: "soon",
    link: "#",
    line: "Write the hybrid blurb that sells to humans AND gets you found by Amazon's search — this is the flagship for a reason."
  },
  keywords: {
    name: "Keywords & Categories",
    status: "soon",
    link: "#",
    line: "Get your books in front of the right readers using the 7 keyword boxes and the categories that actually convert."
  },
  newsletter: {
    name: "Reader Magnets & Newsletters",
    status: "live",
    link: LINKS.skoolPremium,       // <-- no dedicated Skool classroom yet; sends members to Premium Resources & Library
    line: "Build the one audience asset you actually own — a reader list that pays forever, no ad spend required."
  },
  launch: {
    name: "Launch Strategy",
    status: "soon",
    link: "#",
    line: "Launch with organic momentum — swaps, ARC teams, timing — without burning cash on ads."
  },
  styleSheet: {
    name: "Your AI Style Sheet",
    status: "soon",
    link: "#",
    line: "The deeper-dive document that locks your voice so Claude stops drifting into its own defaults."
  }
};

/* 3) That's it. Everything below this point runs the tool.
      You shouldn't need to change anything past here.          */
/* ============================================================ */
</script>

<style>
  :root{
    --teal-deep:#0c3a3a;
    --teal:#15706b;
    --teal-bright:#1f8e87;
    --teal-soft:#e4efed;
    --gold:#c6a052;
    --gold-deep:#a8843a;
    --cream:#fbf8f1;
    --paper:#fffdf8;
    --ink:#22302e;
    --ink-soft:#516460;
    --line:#d9e3e0;
    --shadow:0 18px 50px -22px rgba(12,58,58,.45);
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    font-family:"Spectral",Georgia,serif;
    color:var(--ink);
    background:
      radial-gradient(1200px 600px at 12% -8%, rgba(31,142,135,.10), transparent 60%),
      radial-gradient(1000px 700px at 108% 4%, rgba(198,160,82,.12), transparent 55%),
      var(--cream);
    font-size:18px;
    line-height:1.55;
    -webkit-font-smoothing:antialiased;
    min-height:100vh;
  }
  .wrap{max-width:760px;margin:0 auto;padding:48px 22px 72px}
  .card{
    background:var(--paper);
    border:1px solid var(--line);
    border-radius:22px;
    box-shadow:var(--shadow);
    padding:46px 44px;
    position:relative;
    overflow:hidden;
  }
  .card::before{
    content:"";position:absolute;inset:0 0 auto 0;height:5px;
    background:linear-gradient(90deg,var(--teal),var(--teal-bright) 55%,var(--gold));
  }
  .eyebrow{
    font-family:"Fraunces",serif;
    font-weight:600;font-style:italic;
    letter-spacing:.02em;
    color:var(--teal);
    font-size:.95rem;
    margin:0 0 14px;
  }
  h1{
    font-family:"Fraunces",serif;
    font-weight:700;
    font-size:clamp(2.1rem,5.4vw,3rem);
    line-height:1.04;
    letter-spacing:-.01em;
    margin:0 0 18px;
    color:var(--teal-deep);
  }
  .lede{font-size:1.18rem;color:var(--ink-soft);margin:0 0 30px;max-width:54ch}
  .meta{
    display:flex;gap:22px;flex-wrap:wrap;
    font-family:"Fraunces",serif;font-size:.92rem;color:var(--ink-soft);
    margin:0 0 34px;padding-top:22px;border-top:1px dashed var(--line);
  }
  .meta b{color:var(--teal);font-weight:600}
  .btn{
    display:inline-flex;align-items:center;gap:10px;
    font-family:"Fraunces",serif;font-weight:600;font-size:1.05rem;
    border:none;cursor:pointer;border-radius:999px;
    padding:16px 30px;
    background:var(--teal);color:#fff;
    transition:transform .15s ease, box-shadow .2s ease, background .2s ease;
    box-shadow:0 10px 26px -12px rgba(21,112,107,.8);
    text-decoration:none;
  }
  .btn:hover{background:var(--teal-deep);transform:translateY(-2px)}
  .btn .arrow{transition:transform .2s ease}
  .btn:hover .arrow{transform:translateX(4px)}
  .btn.gold{background:var(--gold);color:var(--teal-deep);box-shadow:0 10px 26px -12px rgba(168,132,58,.8)}
  .btn.gold:hover{background:var(--gold-deep);color:#fff}
  .btn.ghost{background:transparent;color:var(--teal);box-shadow:none;border:1.5px solid var(--line);padding:13px 24px;font-size:.98rem}
  .btn.ghost:hover{background:var(--teal-soft);transform:none;border-color:var(--teal-bright)}

  /* progress */
  .progress{margin:0 0 30px}
  .progress .track{height:7px;background:var(--teal-soft);border-radius:999px;overflow:hidden}
  .progress .fill{height:100%;width:0;background:linear-gradient(90deg,var(--teal),var(--gold));border-radius:999px;transition:width .4s cubic-bezier(.2,.8,.2,1)}
  .progress .lbl{font-family:"Fraunces",serif;font-size:.85rem;color:var(--ink-soft);margin-top:10px;letter-spacing:.03em}

  .qnum{font-family:"Fraunces",serif;font-style:italic;color:var(--gold-deep);font-size:1rem;margin:0 0 8px}
  .qtext{font-family:"Fraunces",serif;font-weight:600;font-size:clamp(1.4rem,3.6vw,1.9rem);line-height:1.18;color:var(--teal-deep);margin:0 0 26px}

  .opts{display:flex;flex-direction:column;gap:13px}
  .opt{
    text-align:left;width:100%;cursor:pointer;
    font-family:"Spectral",serif;font-size:1.08rem;color:var(--ink);
    background:var(--paper);border:1.5px solid var(--line);border-radius:15px;
    padding:18px 22px;line-height:1.4;
    transition:border-color .15s ease, background .15s ease, transform .12s ease, box-shadow .15s ease;
    display:flex;align-items:center;gap:15px;
  }
  .opt .dot{flex:0 0 auto;width:22px;height:22px;border-radius:50%;border:2px solid var(--line);transition:all .15s ease}
  .opt:hover{border-color:var(--teal-bright);background:#fff;transform:translateY(-1px);box-shadow:0 8px 22px -16px rgba(12,58,58,.6)}
  .opt:hover .dot{border-color:var(--teal-bright);background:var(--teal-soft)}

  .backrow{margin-top:26px;display:flex;justify-content:space-between;align-items:center}
  .back{background:none;border:none;cursor:pointer;color:var(--ink-soft);font-family:"Fraunces",serif;font-size:.95rem;text-decoration:underline;text-underline-offset:3px}
  .back:hover{color:var(--teal)}
  .back[hidden]{visibility:hidden}

  /* results */
  .badge{
    display:inline-block;font-family:"Fraunces",serif;font-style:italic;font-weight:500;
    background:var(--teal-soft);color:var(--teal);border-radius:999px;
    padding:7px 18px;font-size:.95rem;margin:0 0 18px;
  }
  .readout{font-size:1.12rem;color:var(--ink-soft);margin:0 0 12px}
  .pathtitle{font-family:"Fraunces",serif;font-weight:600;color:var(--gold-deep);font-style:italic;font-size:1.15rem;margin:34px 0 16px;display:flex;align-items:center;gap:12px}
  .pathtitle::after{content:"";flex:1;height:1px;background:var(--line)}

  .step{
    display:flex;gap:18px;align-items:flex-start;
    border:1.5px solid var(--line);border-radius:16px;padding:20px 22px;margin-bottom:14px;background:var(--paper);
    position:relative;
  }
  .step.start{border-color:var(--teal-bright);background:linear-gradient(180deg,#fff, #f4faf8);box-shadow:0 12px 30px -20px rgba(21,112,107,.7)}
  .stepnum{
    flex:0 0 auto;width:38px;height:38px;border-radius:50%;
    display:grid;place-items:center;font-family:"Fraunces",serif;font-weight:700;
    background:var(--teal-soft);color:var(--teal);font-size:1.05rem;
  }
  .step.start .stepnum{background:var(--teal);color:#fff}
  .stepbody{flex:1}
  .stepname{font-family:"Fraunces",serif;font-weight:600;font-size:1.16rem;color:var(--teal-deep);margin:0 0 4px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  .tag{font-family:"Fraunces",serif;font-size:.72rem;font-weight:600;letter-spacing:.06em;text-transform:uppercase;padding:3px 10px;border-radius:999px}
  .tag.live{background:var(--teal);color:#fff}
  .tag.soon{background:#efe7d2;color:var(--gold-deep)}
  .tag.here{background:var(--gold);color:var(--teal-deep)}
  .stepline{font-size:1.02rem;color:var(--ink-soft);margin:0 0 14px}
  .step .btn{padding:11px 22px;font-size:.96rem}

  .upsell{
    margin:38px 0 0;padding:30px 30px;border-radius:18px;
    background:linear-gradient(135deg,var(--teal-deep),var(--teal));
    color:#fff;box-shadow:var(--shadow);
  }
  .upsell h3{font-family:"Fraunces",serif;font-weight:600;font-size:1.5rem;margin:0 0 10px;color:#fff}
  .upsell p{color:#d7eae7;margin:0 0 20px;font-size:1.06rem}
  .upsell .btn{background:var(--gold);color:var(--teal-deep)}
  .upsell .btn:hover{background:#fff;color:var(--teal-deep)}

  .footnote{margin:30px 0 0;text-align:center;color:var(--ink-soft);font-size:1rem}
  .footnote a{color:var(--teal);font-weight:600}
  .restart{margin-top:30px;text-align:center}

  .brand{text-align:center;margin:0 0 26px}
  .brand .name{font-family:"Fraunces",serif;font-weight:600;letter-spacing:.04em;color:var(--teal);font-size:1rem}
  .brand .tag2{font-family:"Spectral",serif;font-style:italic;color:var(--ink-soft);font-size:.92rem}

  @media (max-width:560px){
    .card{padding:34px 22px}
    .meta{gap:14px}
    .step{flex-direction:row}
  }
  .fade{animation:fade .45s ease both}
  @keyframes fade{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
</style>
</head>
<body>
<div class="wrap">
  <div class="brand">
    <div class="name">THE INVISIBLE PEN</div>
    <div class="tag2">Writing with AI, Over 40</div>
  </div>
  <div class="card" id="app"></div>
</div>

<script>
/* ---------- Questions & routing ---------- */
const QUESTIONS = [
  { q:"Where are you in your author journey right now?",
    a:[
      {t:"Haven't started yet — I'm planning my first book", s:{A:3,D:1}},
      {t:"Writing my first book now", s:{A:3,B:1}},
      {t:"I have a finished (or nearly finished) manuscript", s:{B:3}},
      {t:"Published, 1–3 books, but not getting traction", s:{C:2,B:1}},
      {t:"Published, 4+ books, and I want more readers & income", s:{C:3}}
    ]},
  { q:"How many books do you have published?",
    a:[
      {t:"None yet", s:{A:2}},
      {t:"1 to 3", s:{B:2,C:1}},
      {t:"4 or more", s:{C:3}}
    ]},
  { q:"Your email newsletter / reader list?",
    a:[
      {t:"I don't have one", s:{A:1,B:1}},
      {t:"I have one, but it's dormant or tiny", s:{B:2,C:2}},
      {t:"Active, but under about 500 subscribers", s:{C:2}},
      {t:"Active and growing nicely", s:{D:1}}
    ]},
  { q:"Your AI setup with Claude — style sheet, project, your voice?",
    a:[
      {t:"What's a style sheet? I haven't set anything up", s:{A:2,D:2}},
      {t:"I use AI, but it never quite sounds like me", s:{D:3,A:1}},
      {t:"I've got some setup, but it's inconsistent", s:{D:2,B:1}},
      {t:"Fully set up and humming along", s:{C:1,B:1}}
    ]},
  { q:"What's the thing actually stopping you right now?",
    a:[
      {t:"I don't know where to begin", s:{A:3}},
      {t:"My book's done but I'm stuck on editing & polishing", s:{B:3}},
      {t:"I'm published but invisible — nobody's finding me", s:{C:3}},
      {t:"I want AI to write in MY voice, not a generic robot's", s:{D:3}}
    ]},
  { q:"Picture success a year from now. It looks like…",
    a:[
      {t:"Finally finishing and publishing my first book", s:{A:2,B:1}},
      {t:"A polished catalog readers actually find and buy", s:{C:2}},
      {t:"A calm system so writing & publishing isn't chaos", s:{D:2,B:1}},
      {t:"Steady, reliable income from my books", s:{C:1,B:1}}
    ]},
  { q:"How are you using AI today?",
    a:[
      {t:"Barely — honestly, it makes me nervous", s:{A:2}},
      {t:"Dabbling with basic prompts", s:{A:1,D:1}},
      {t:"Regularly, but I want it doing much more", s:{D:2,B:1}},
      {t:"It's core to how I work", s:{D:2,C:1}}
    ]}
];

/* ---------- Track definitions ---------- */
const TRACKS = {
  A:{ label:"Foundation Builder",
      read:"You're at the best possible starting point: the beginning, before any bad habits set in. The authors who struggle most aren't the beginners — they're the ones who skipped setup and are now untangling it. You get to do it right the first time.",
      path:["foundations","penName","tropeSchool","bestseller","elab"] },
  B:{ label:"Launch Ready",
      read:"You've already done the hardest part — you have a book, or you're nearly there. Now it's about polish and getting it into readers' hands without burning out or burning cash. Don't let \u201cit's not perfect yet\u201d keep it parked on your hard drive.",
      path:["elab","foundations","blurbs","newsletter"] },
  C:{ label:"Visibility Seeker",
      read:"You've got books out — that already puts you ahead of most people who only ever talk about writing one. Your problem isn't your writing. It's that readers can't find you. That's fixable, and it doesn't require a dime of ad spend.",
      path:["newsletter","blurbs","keywords","launch"] },
  D:{ label:"AI Accelerator",
      read:"You've got the bones in place — now you want Claude working as a real co-pilot that sounds like you, not a generic robot. Here's the secret: it's not about fancier prompts. It's about setup. Lock the foundation and everything downstream gets easier.",
      path:["foundations","styleSheet","elab"] }
};

/* ---------- State ---------- */
let step = -1;                 // -1 = intro
const scores = {A:0,B:0,C:0,D:0};
const answers = [];
const app = document.getElementById('app');

function render(){
  if(step === -1){ intro(); return; }
  if(step >= QUESTIONS.length){ results(); return; }
  question(step);
}

function intro(){
  app.innerHTML = `
    <div class="fade">
      <p class="eyebrow">Welcome to The Invisible Pen &mdash; Plot Your Path</p>
      <h1>Not sure where to start? Let's figure that out together.</h1>
      <p class="lede">Answer 7 quick questions and I'll tell you exactly where you are, what's stopping you, and which classroom to open first — so you can move forward today.</p>
      <div class="meta">
        <span><b>7</b> questions</span>
        <span><b>~2</b> minutes</span>
        <span><b>No</b> email required</span>
      </div>
      <button class="btn" onclick="next()">Build my roadmap <span class="arrow">&rarr;</span></button>
    </div>`;
}

function question(i){
  const Q = QUESTIONS[i];
  const pct = Math.round((i/QUESTIONS.length)*100);
  app.innerHTML = `
    <div class="fade">
      <div class="progress">
        <div class="track"><div class="fill" style="width:${pct}%"></div></div>
        <div class="lbl">Question ${i+1} of ${QUESTIONS.length}</div>
      </div>
      <p class="qnum">Question ${i+1}</p>
      <p class="qtext">${Q.q}</p>
      <div class="opts">
        ${Q.a.map((o,idx)=>`
          <button class="opt" onclick="choose(${idx})">
            <span class="dot"></span><span>${o.t}</span>
          </button>`).join('')}
      </div>
      <div class="backrow">
        <button class="back" onclick="back()" ${i===0?'hidden':''}>&larr; Back</button>
        <span></span>
      </div>
    </div>`;
}

function next(){ step++; render(); }

function choose(idx){
  const Q = QUESTIONS[step];
  // undo previous answer for this step if revisiting
  if(answers[step]!==undefined){
    const prev = Q.a[answers[step]].s;
    for(const k in prev) scores[k]-=prev[k];
  }
  const s = Q.a[idx].s;
  for(const k in s) scores[k]+=s[k];
  answers[step]=idx;
  step++; render();
}

function back(){
  step--;
  // remove the answer we're going back to so it re-applies cleanly on re-choose
  if(answers[step]!==undefined){
    const prev = QUESTIONS[step].a[answers[step]].s;
    for(const k in prev) scores[k]-=prev[k];
    answers[step]=undefined;
  }
  render();
}

function winner(){
  // tie-break order: A > B > C > D (foundation-first when unsure)
  const order=["A","B","C","D"];
  let best=order[0];
  for(const k of order){ if(scores[k]>scores[best]) best=k; }
  return best;
}

function classStep(id, n, isStart){
  const c = CLASSES[id];
  const live = c.status==="live";
  const tag = isStart ? `<span class="tag here">Start here</span>`
            : live    ? `<span class="tag live">Available now</span>`
                      : `<span class="tag soon">Coming soon</span>`;
  const cta = live
      ? `<a class="btn" href="${c.link}" target="_blank" rel="noopener">Start this class <span class="arrow">&rarr;</span></a>`
      : ``;
  return `
    <div class="step ${isStart?'start':''}">
      <div class="stepnum">${n}</div>
      <div class="stepbody">
        <div class="stepname">${c.name} ${tag}</div>
        <p class="stepline">${c.line}</p>
        ${cta}
      </div>
    </div>`;
}

function results(){
  const w = winner();
  const T = TRACKS[w];
  // find the first LIVE class in the path = the "start here"
  const startId = T.path.find(id => CLASSES[id].status==="live");
  const steps = T.path.map((id,i)=>classStep(id, i+1, id===startId)).join('');

  app.innerHTML = `
    <div class="fade">
      <p class="eyebrow">Plot Your Path</p>
      <span class="badge">Based on your answers, you're a&hellip;</span>
      <h1>${T.label}</h1>
      <p class="readout">${T.read}</p>

      <p class="pathtitle">Your path, in order</p>
      ${steps}

      <div class="upsell">
        <h3>Want a human in your corner?</h3>
        <p>Book a 1:1 and we'll map this roadmap to YOUR books, your goals, and your pace — together. It's the fastest way to skip the guesswork.</p>
        <a class="btn" href="${LINKS.oneOnOne}" target="_blank" rel="noopener">Book a 1:1 with Jessica <span class="arrow">&rarr;</span></a>
      </div>

      <p class="footnote">
        Start exploring right now &mdash; the <a href="${LINKS.skoolFree}" target="_blank" rel="noopener">free resources</a> are open to everyone,
        and members get the full <a href="${LINKS.skoolPremium}" target="_blank" rel="noopener">premium resources &amp; library</a>.<br>
        Prefer to learn live with a small group? I run an occasional <a href="${LINKS.liveCohort}" target="_blank" rel="noopener">live cohort</a>.
      </p>

      <div class="restart">
        <button class="btn ghost" onclick="reset()">Start over</button>
      </div>
    </div>`;
  window.scrollTo({top:0,behavior:'smooth'});
}

function reset(){
  step=-1; for(const k in scores) scores[k]=0; answers.length=0; render();
}

render();
</script>
</body>
</html>
